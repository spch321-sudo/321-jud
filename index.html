但這些人毀謗他們所不知道的」（1:10）。"],["p","天使長知道最多，卻不敢；這些人不知道，卻敢。"],["q","「走了該隱的道路，又為利往巴蘭的錯謬裡直奔，並在可拉的背叛中滅亡了。」（1:11）"],["p","三個名字，三條往下的路。"],["p","該隱，對弟兄：心裡的不滿，長成了殺害。"],["p","巴蘭，對錢：「直奔」像水倒出來，一衝而下。"],["p","可拉，對位置：事奉還嫌不夠，要奪祭司的職分。"],["p","鑑戒先照自己：有沒有一個我不能祝福的弟兄？"],["q","「這樣的人在你們的愛席上與你們同吃的時候，正是礁石。」（1:12）"],["p","愛筵是早期教會最溫暖的地方，礁石偏偏藏在這裡。"],["p","海面平靜，船卻在這裡破碎。所以人比事重要。"],["p","「作牧人，只知餵養自己」，原文是：牧養自己。"],["p","這封信沒有叫羊閉嘴。"],["p","它叫牧者先問：我在餵羊，還是餵自己？"],["p","接著四幅畫：沒有雨的雲，秋天沒有果子的樹，海裡的狂浪，"],["q","「是流蕩的星，有墨黑的幽暗為他們永遠存留。」（1:13）"],["p","外表有，內裡空。我的服事，會不會也是沒有雨的雲？"],["p","「存留」，又是「守」。第四次。墨黑的幽暗，替他們守著。"],["p","全卷到這裡，落到最深的谷底。"],["p","可是猶大不是叫我們住在谷底研究黑暗。"],["p","他帶我們走過去，是為了站到山頂上敬拜。"],["p","十四節，以諾的預言出自《以諾一書》。"],["p","保羅也引過希臘詩人。"],["p","受默示的是猶大書；我們不另建天使學，也不因此懷疑它。"],["p","「看哪，主帶著他的千萬聖者降臨」（1:14）。"],["p","主一定會來，但我們不算日子。"],["p","十五節，原文一節裡四次「不敬虔」：審判是全面的。"],["q","「這些人是私下議論，常發怨言的……口中說誇大的話，為得便宜諂媚人。」（1:16）"],["p","「常發怨言」，原文是怪罪自己分到的那一份。又是不守本位。"],["p","「諂媚人」是看人的臉，討好有用的人。"],["p","哥哥雅各也說：「不可按著外貌待人」（雅 2:1）。"],["p","我說話，看人的臉，還是看神的臉？"],["p","照片看完了。猶大抬起頭，對讀信的人說話。"],["q","第三步：被抓住的人去搶救人。"],["q","「你們要記念我們主耶穌基督之使徒從前所說的話。」（1:17）"],["p","猶大沒有說「我們使徒」。他指向使徒的話，不指向自己。"],["p","面對新聲音，最好的錨是舊的話。聖經是我的準則。"],["p","使徒早說過末世必有好譏誚的人（1:18）。"],["p","知道會下雨，雨來就不慌。"],["q","「這就是那些引人結黨、屬乎血氣、沒有聖靈的人。」（1:19）"],["p","「結黨」原文是劃界線、分等級。"],["p","自以為屬靈的上等人，猶大說他們沒有聖靈。"],["p","這是記號，不是帽子。急著把人劃出去的，先看自己。"],["p","「這些人」在信裡敲了六次鐘，這是最後一次。然後："],["q","「你們卻要在至聖的真道上造就自己，在聖靈裡禱告」（1:20）"],["q","你們卻要。"],["p","這是全卷的樞紐。"],["p","猶大用十多節描寫別人，只用兩節告訴我們怎麼辦。"],["p","對付錯謬，最好的辦法不是研究錯謬。"],["p","兩節，四個動作：造就，禱告，保守，仰望。"],["p","造就，原文是「在上面建造」。根基已經有了，我們往上蓋。"],["p","「自己」是複數：彼此建造。"],["p","十九節在劃界拆開，二十節在一起建。"],["p","禱告，「在聖靈裡」。"],["p","有人認為包括說方言，也有人認為指一切靠聖靈引導的禱告。"],["p","經文沒有限定。我們不定成非說方言不可，也不看輕方言。"],["p","落點是靠聖靈禱告的生活。分水嶺不在口才，在依靠誰。"],["p","第三個動作是中心："],["q","「保守自己常在神的愛中」（1:21）"],["p","第五次「守」，也是全卷唯一一次叫我們去守。"],["p","要守的不是你愛神的溫度，那會起落。"],["p","要守的，是神愛你的那個位置。"],["q","「你們要常在我的愛裡。」（約 15:9）"],["p","第六節的天使，不肯守自己的位置。"],["p","我們被叫去守一個位置：神的愛。"],["p","那不是牢籠，是家。"],["p","第四個動作，「仰望我們主耶穌基督的憐憫，直到永生」（1:21）。"],["p","連守住的人，也是靠憐憫走到終點。"],["p","眼睛轉回主，人就站穩了。"],["p","然後，猶大叫這些站穩的人轉身。"],["q","「有些人存疑心，你們要憐憫他們」（1:22）"],["p","第一個動詞是憐憫，不是糾正，更不是趕出去。"],["p","還記得收起來的那個字嗎？「存疑心」和米迦勒「爭辯」，是同一個字。"],["p","一個與魔鬼爭辯的天使長，一個心裡正在爭辯的信徒。"],["p","對魔鬼，交給主。對心裡在爭辯的人，憐憫他。"],["p","教會最常犯的錯，是把這兩種爭辯弄反了。"],["p","存疑心，不等於背道。"],["p","如果你心裡有很多問題，這節經文要你更敢問，不是更不敢。"],["p","寫這句話的人最懂。回到開頭那個家："],["p","「因為連他的弟兄說這話，是因為不信他。」（約 7:5）"],["p","猶大是被憐憫過的人，所以他叫教會去憐憫。"],["q","「有些人你們要從火中搶出來，搭救他們」（1:23）"],["p","第二種人已經靠近火，需要一隻緊急的手。"],["q","「這不是從火中抽出來的一根柴嗎？」（亞 3:2）"],["p","我們每一個人，都曾經是那根柴。"],["p","第三種人陷得更深，「要存懼怕的心憐憫他們」（1:23）：敬畏神，也提防自己。"],["p","搶救人不是逞英雄。"],["p","請同工一起陪，需要專業協助的就轉介。"],["p","恨的是被沾染的衣服，不是穿衣服的人。"],["p","三種人，三種救法，都在同一個動詞裡：憐憫。"],["p","搶救人的人，也會滑。我會不會跌倒？"],["q","「那能保守你們不失腳、叫你們無瑕無疵、歡歡喜喜站在他榮耀之前」（1:24）"],["p","整封信，到這裡天亮了。"],["p","猶大不是說：你們要努力不失腳。他說：有一位能。"],["p","「不失腳」新約只用這一次，古希臘文用來說馬不失蹄。"],["p","「保守」在這裡換了一個字，像衛兵守著。"],["q","「他雖失腳也不致全身仆倒，因為耶和華用手攙扶他。」（詩 37:24）"],["p","得勝者不是從不跌倒的人，是被抓住的人。"],["p","現在，把這個「守」字從頭走一遍。"],["p","第一節，我們被保守。"],["p","第六節，天使不守本位，被拘留。"],["p","第十三節，幽暗為流蕩的星存留。"],["p","第二十一節，保守自己在神的愛中。"],["p","第二十四節，那能保守你們不失腳的。"],["q","不肯守本位的，被鎖鍊守住；在神的愛中的，被神的手守住。"],["p","礁石、被沾染的衣服，到這裡變成「無瑕無疵」。"],["p","這使我們想起：那是羔羊替我們成就的。"],["p","而且是歡歡喜喜，不是戰戰兢兢。"],["q","「願榮耀、威嚴、能力、權柄，因我們的主耶穌基督歸與他，從萬古以前並現今，直到永永遠遠。阿們！」（1:25）"],["p","四節，那些人不認獨一的主宰；二十五節，全教會頌讚獨一的神。"],["p","最後一次，回到那個家。"],["p","那天，弟弟們說：去猶太吧，去顯揚名聲。"],["p","大哥說：我的時候還沒有到。"],["p","後來祂的時候到了。祂沒有去顯揚名聲，祂上了十字架。"],["p","祂從死裡復活。不久，那幾個不信的弟弟，出現在禱告的人中間。"],["q","三十多年後，其中一個弟弟寫下最後一句：願榮耀歸與他。"],["p","猶大沒有變得更會爭辯。他是被抓住了。"],["p","所以請你不要更佩服猶大的嚴厲。"],["p","請你更愛那一位：抓住一個不信的弟弟，也抓住了你。"],["p","這個禮拜，為一個存疑心的人禱告，然後打一通電話。"],["p","守住你的，不是你的手，是祂的手。"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"作者、收信人與正典地位：「雅各的弟兄猶大」是誰？這封信怎樣被接納為正典？","r":"1:1--1；1:17；太 13:55；可 6:3；約 7:5；徒 1:14；路 6:16","ch":[],"why":"一、一位曾經不信哥哥的弟弟，後來稱自己是哥哥的僕人——本講義的全卷立場之一（本卷新立）。猶大書開頭只有一行自我介紹：「耶穌基督的僕人，雅各的弟兄猶大」（1:1）；新約裡叫猶大的人至少有五位，這一位是誰，決定了全卷的口吻。收信人沒有寫明，讀者常常不知道這封信原來是寫給誰的。更少人知道，這封信在早期教會曾經被一些人遲疑，原因正是它引用了次經。這三件事若不在開卷講定，會眾不是被作者考據絆住，就是一聽到「次經」就以為整封信靠不住。","pos":[["【一】經文問的是甚麼","","<p>寫信的人這樣介紹自己：「耶穌基督的僕人，雅各的弟兄猶大」（1:1）。他沒有說自己是使徒，反而在 17 節把自己放在使徒以外：「你們要記念我們主耶穌基督之使徒從前所說的話」（1:17）。他只提一位親人——雅各；而新約裡不必再加說明、讀者一聽就知道是誰的雅各，就是耶路撒冷教會的柱石、「主的兄弟雅各」（加 1:19）。</p><p>收信人只被稱為「那被召、在父神裡蒙愛、為耶穌基督保守的人」（1:1），沒有城名、沒有人名。從信的內容看，他們熟悉以諾、摩西、該隱、巴蘭、可拉，也熟悉當時猶太人流傳的傳統。<strong>經文問的是：這位「雅各的弟兄猶大」是誰？收信的是甚麼樣的群體？一封引用了次經的短信，教會怎樣認出它是神的話？</strong></p>"],["主的兄弟說（耶穌肉身的弟弟猶大）","","<p>教會傳統與多數學者的看法：作者是主耶穌肉身的弟弟。拿撒勒人問：「他弟兄們不是叫雅各、約西、西門、猶大嗎？」（太 13:55）馬可的名單也有他（可 6:3）。這幾個弟弟曾經不信：「是因為不信他」（約 7:5），甚至跟著親屬出來，要把這位「癲狂了」的哥哥拉回家（可 3:21）。主復活以後，經文卻記下：「並耶穌的弟兄，都同心合意地恆切禱告」（徒 1:14）；保羅後來也提到「主的弟兄」帶著妻子出外傳道（林前 9:5）。雅各的書信同樣只稱自己是「作神和主耶穌基督僕人的雅各」（雅 1:1）——兩兄弟都不提血緣。</p><p>第二世紀的赫格西仆（Hegesippus）留下一段記載（優西比烏《教會史》3.19--20）：羅馬皇帝多密田曾傳召「按肉身說是主的兄弟猶大」的兩個孫子，他們拿出滿是厚繭的手，說自己只是種田的人，皇帝看他們不足為懼，就放了他們。<strong>難處：</strong>若作者是主的弟弟，為甚麼不寫「耶穌的弟弟」，那不是更有份量嗎？支持者的回答是：正因為他是弟弟，才更知道自己不配用這個頭銜；但這個問題要誠實擺出來，它是推論，不是經文的明說。</p>"],["使徒猶大說（十二使徒中的那位猶大）","","<p>十二使徒裡有一位不是加略人的猶大：「雅各的兒子猶大」（路 6:16；徒 1:13）。原文只寫 Ἰούδαν Ἰακώβου（雅各的猶大），可以補「兒子」，也可以補「兄弟」；舊時有些譯本補作「兄弟」，於是有人主張猶大書的作者就是這位使徒，信的權威也就直接來自使徒的身分。</p><p><strong>難處：</strong>這種讀法最自然的補字是「兒子」，和合本也這樣譯；而且猶大書作者在 17--18 節把「使徒」說成是向收信人說過話的另一群人，若他自己就是使徒，這樣的寫法不太自然。再者，使徒名單裡那位猶大的父親雅各，在新約裡沒有甚麼名聲，不足以讓作者只寫「雅各的弟兄」就讓讀者明白他是誰。</p>"],["託名說（後人借主兄弟之名寫成）","","<p>部分學者認為這封信是較晚的時候，有人借用「主的兄弟猶大」的名字寫成，用來替一場教會內部的爭論加上權威。理由包括：希臘文相當講究，用詞豐富，像是受過良好教育的人寫的；17 節「使徒從前所說的話」聽起來像是在回顧一個已經過去的時代；而「一次交付聖徒的真道」（1:3）像是後期教會把信仰整理成一套內容之後的說法。</p><p><strong>難處：</strong>若要託名，為甚麼選一位在早期教會幾乎沒有名氣的猶大，而不選彼得、保羅或雅各本人？早期教會一旦發現某卷書是託名之作，通常是拒絕它，不是接納它。加利利一帶也通行希臘文，主的兄弟們出外傳道多年（林前 9:5），也可能有人替他執筆；18 節說「他們曾對你們說過」，收信人親耳聽過使徒，正是第一代信徒的口吻。</p>"],["正典地位：遲疑與接納","","<p>早期教會確實有過遲疑。優西比烏在《教會史》3.25 把猶大書列在「有爭議的」書卷中，同時說明它是大多數人熟知的；他在 2.23 也提到古時的人引用它的不多。耶柔米在《名人傳》第 4 章記下最直接的理由：因為猶大書引用了次經《以諾書》，許多人不接受它；但他接著說，這封信憑著它的古老與教會長期的使用，已經得到權威，被列在聖經之中。敘利亞教會早期通行的別西大譯本也沒有收入它。</p><p>另一方面，接納也很早：穆拉托利殘篇（傳統定在第二世紀末）把「猶大的書信」列在大公教會接納的書卷中；特土良、亞歷山大的革利免都引用它；俄利根稱它是「一封只有幾行字，卻充滿天上恩典的健全話語的書信」。亞他那修在主後 367 年的節期書信列出新約二十七卷，猶大書在其中；主後 397 年迦太基會議也照樣承認。<strong>難處：</strong>接納是漸進的，各地先後不同，不是某一次會議突然決定的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：作者是主耶穌肉身的弟弟猶大、耶路撒冷教會領袖雅各的弟弟（太 13:55；可 6:3；約 7:5；徒 1:14；林前 9:5）；使徒猶大說（路 6:16；徒 1:13）與託名說並陳，各說的難處照實寫出。收信人沒有寫明，本講義只說：一群熟悉猶太傳統的基督徒群體，地點不定。</strong></p><p><strong>猶大書是正典，與新約其他書卷有同等的權威。</strong>早期的遲疑照實陳列——優西比烏列為「有爭議的」書卷、耶柔米記下許多人因它引用《以諾書》而不接受；接納的過程也照實陳列——穆拉托利殘篇、俄利根的稱讚、亞他那修的書目、迦太基會議。遲疑的焦點在它引用了次經，不在它的教導與使徒的信仰有衝突；引用次經這件事，本講義另見〈正典引用次經的原則：猶大引用《摩西升天記》與《以諾一書》，代表甚麼？〉。<strong>教會沒有「製造」正典，是「認出」正典。</strong></p><p>講台可以寫「猶大說」，但不把作者講成英雄。<strong>他明明可以寫「耶穌的弟弟」，卻寫「耶穌基督的僕人」</strong>——焦點不在這位弟弟有多了不起，在那位把不信的弟弟抓回來、又「能保守你們不失腳」的主（1:24）。</p>"],["【四】這件事該不該影響你的信心","","<p>作者是哪一位猶大、這封信怎樣被接納，這些討論不該動搖你的信心。各說都同意：這是一位被早期教會敬重的人，寫給一群正在被攪擾的信徒；而教會花了幾百年認真分辨過，才把它放進聖經——一個被檢驗過的結論，比從來沒有被問過的結論更可靠。</p><p>這一題反而給你一份安慰：<strong>寫這封信的人，曾經和家人一起站在門外，要把被人說成「癲狂了」的哥哥拉回家（可 3:21、31）。</strong>後來他稱哥哥為「獨一的主宰」（1:4）。若你今天還有很多疑問，請記得，22 節「有些人存疑心，你們要憐憫他們」（1:22），是一個被憐憫過的人寫下的。</p>"]],"con":[],"say":"本講義的全卷立場：作者是主耶穌肉身的弟弟猶大（太 13:55；可 6:3；約 7:5；徒 1:14；林前 9:5），並陳使徒猶大說（路 6:16；徒 1:13）與託名說；收信人不明，是熟悉猶太傳統的基督徒群體。猶大書是正典：早期因引用次經而有遲疑（優西比烏列為有爭議的書卷、耶柔米的記載），穆拉托利殘篇已列入，後被普遍接納；教會是認出正典。","care":"席上會有一聽到「作者有爭議」「早期有人不接受」就不安的長輩；有讀過網路文章、以為聖經是後人隨意拼湊的年輕人；也有家人至今不信、自己禱告多年仍看不見改變的弟兄姊妹。牧者對前兩種人要誠實地講歷史，只講確定的史實，不確定的就說不確定；對第三種人，可以讓他看見約 7:5 到徒 1:14 那條路——主的弟弟們也曾經不信。不要把作者考據講成信心的考試，也不要為了讓人安心而把早期的遲疑說成沒有發生過。"},{"id":"ISS00_2","t":"與彼得後書的關係：兩封信約十九處相似，誰用了誰？兩卷怎樣分工？","r":"1:4--18；彼後 2:1--3:3","ch":[],"why":"二、同一群人，兩種寫法——本講義的全卷立場之二（沿用彼得後書講義處理兩卷關係的全卷立場，從猶大這邊補）。猶大書 4--18 節與彼得後書 2:1--3:3 約有十九處平行：天使、所多瑪、巴蘭、毀謗在尊位的、愛席上的人、無水的雲與井、墨黑的幽暗、末世好譏誚的人。讀過彼得後書的人，讀猶大書時常有「又講一次」的感覺，於是把猶大書當成彼得後書的縮寫版。這一題要講清楚兩卷的關係，更要講清楚猶大自己多出來的那幾筆，以免講台把兩卷講成同一篇講章。","pos":[["【一】經文問的是甚麼","","<p>先把平行處排出來：「偷著進來」（1:4）與「私自引進陷害人的異端」（彼後 2:1）；不守本位的天使（1:6）與「天使犯了罪」（彼後 2:4）；所多瑪、蛾摩拉（1:7；彼後 2:6）；「輕慢主治的，毀謗在尊位的」（1:8）與彼後 2:10；米迦勒不敢毀謗（1:9）與「就是天使，雖然力量權能更大，還不用毀謗的話在主面前告他們」（彼後 2:11）；巴蘭（1:11；彼後 2:15）；愛席上同吃（1:12；彼後 2:13）；無雨的雲彩（1:12）與「無水的井」（彼後 2:17）；「有墨黑的幽暗為他們永遠存留」（1:13；彼後 2:17）；「末世必有好譏誚的人」（1:18；彼後 3:3）。</p><p>同時也有不同：彼得後書沒有米迦勒的名字、沒有摩西的屍首、沒有以諾的預言；猶大書沒有挪亞、沒有羅得、沒有巴蘭的驢說話。彼得說「將來在你們中間也必有假師傅」（彼後 2:1），猶大卻說「有些人偷著進來」（1:4）——一個是預警，一個是現場。<strong>經文問的是：兩封信是誰用了誰？還是用了同一份材料？兩卷該怎樣分工？</strong></p>"],["猶大在先說（彼得後書採用並擴寫了猶大書）","","<p>今天多數學者採這個看法：猶大書較短、較直接，彼得後書把它的材料重新整理，又加上挪亞與羅得兩個得救的例子，讓審判的畫面旁邊多了一條出路。這派最有力的理由是次經：猶大明說米迦勒的名字、引了以諾的預言；彼得後書在同一個位置只說「就是天使……還不用毀謗的話」（彼後 2:11），把具體的出處拿掉了——比較容易想像的是後寫的人把它磨平，而不是先寫的人，後來的人故意加上去。</p><p><strong>難處：</strong>「較短的在先」只是一般的傾向，不是定律；而且若彼得是使徒，為甚麼要大量採用一封非使徒寫的短信？支持者回答：真理不因出處的身分而減損，使徒採用弟兄的話並不奇怪；但這仍是推論。</p>"],["彼得在先說（猶大書引用了彼得後書）","","<p>另一派認為彼得後書在先。最常被提出的理由是：彼得用將來式說「必有假師傅」（彼後 2:1），猶大用過去式說「有些人偷著進來」（1:4），像是預言已經應驗了；猶大又說「要記念我們主耶穌基督之使徒從前所說的話」（1:17），接著引的那句「末世必有好譏誚的人」（1:18），幾乎就是彼後 3:3。這派認為猶大是在提醒讀者：彼得早就說過了。</p><p><strong>難處：</strong>猶大說的是「使徒」（複數），又說「他們曾對你們說過」（1:18），比較像是使徒們口頭的教導，不一定指彼得的一封信；而且若猶大手上有彼得後書，很難解釋他為甚麼捨去挪亞與羅得那兩個帶著盼望的例子。</p>"],["共用材料說（兩位都用了同一份教導）","","<p>第三種看法是：兩封信都用了早期教會一份對付假教師的共同材料——也許是一篇講章、一份教導綱要，或是使徒們口頭流傳的警告。兩位作者各自取用，各自剪裁，所以有那麼多相似，又有不少不同。這派的優點是同時解釋了相似與相異，也不必判斷誰依賴誰。</p><p><strong>難處：</strong>那份「共同材料」沒有留下來，是從兩封信反推出來的；一個看不見的來源，很容易被用來解釋一切，也就甚麼都證明不了。而且兩封信在一些細節的次序與用字上相近到一個程度，許多學者認為仍是直接的關係。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：三種關係說（猶大在先／彼得在先／共用材料）並陳，不裁判，沿用彼得後書講義的處理。</strong>兩卷都是受默示的正典，誰先誰後不影響任何一卷的權威。</p><p><strong>兩卷的分工：彼得後書講「長進中的分辨」，猶大書講「為真道竭力爭辯，並且被保守」。</strong>彼得的結尾是「你們卻要在我們主－救主耶穌基督的恩典和知識上有長進」（彼後 3:18）；猶大的結尾是「那能保守你們不失腳」（1:24）。彼得後書教我們在霧裡看清；猶大書教我們在浪裡站穩——而站穩的人，是被抓住的人。</p><p>講台的做法：凡彼得後書詳講過的（假師傅的記號、所多瑪與羅得、巴蘭的驢），本卷只作〔彼後〕互見，不重講；本卷只講猶大自己多出來的那幾筆——<strong>三個「保守」（1、21、24）、米迦勒的「主責備你吧」（1:9）、該隱與可拉（1:11）、以諾的預言（1:14--15）、憐憫三種人（1:22--23）、最後的頌讚（1:24--25）</strong>。</p>"],["【四】這件事該不該影響你的信心","","<p>兩封信誰先誰後，學者沒有定論，這不該動搖你的信心。新約裡兩卷書用了相同的材料並不奇怪——馬太、馬可、路加三卷福音書也大量重疊；神常常用兩個見證人，把同一件事說得更確定。</p><p>真正該問自己的是：<strong>我現在需要的是彼得的「長進」，還是猶大的「站穩」？</strong>有的人需要在知識上長大，學會分辨；有的人已經在浪裡，只需要知道有一隻手抓著他。兩封信都由同一位主賜下，因為羊群裡兩種人都有。</p>"]],"con":[],"say":"本講義的全卷立場：沿用彼得後書講義處理兩卷關係的全卷立場——猶 4--18 與彼後 2:1--3:3 約十九處平行，三種關係說（猶大在先／彼得在先／共用材料）並陳不裁判。兩卷分工：彼得後書講長進中的分辨，猶大書講為真道竭力爭辯並且被保守；彼得後書詳講過的只作互見，本卷只講猶大多出來的那幾筆。","care":"席上會有剛讀完彼得後書、覺得「又是假師傅」而疲倦的人；也有對文獻關係的討論感到陌生、以為「抄來抄去」就表示聖經不可靠的初信者。牧者要讓前者看見猶大多出來的那幾筆，特別是 20--25 節的保守與頌讚；讓後者知道，相同的材料是兩個見證，不是破綻。不要在講台上花太多時間辯論誰先誰後，也不要把兩卷講成同一篇；這一題點到為止，把時間留給 24 節那一位。"},{"id":"ISS00_3","t":"為真道爭辯而不好爭競：「竭力地爭辯」是甚麼樣的爭？","r":"1:3--3；1:9；1:20--23；亞 3:2","ch":[],"why":"三、爭的是真道，不是人；用驕傲的方式捍衛真理，就已經輸了——本講義的全卷立場之三（本卷新立，也是全卷最要緊的一條）。3 節「竭力地爭辯」是猶大書最常被引用的一句，也是最常被誤用的一句：有人拿它合理化網路論戰、在教會裡為每一個看法爭到撕破臉、羞辱持不同意見的人；也有人因為怕被看成好鬥，乾脆甚麼都不爭，連福音的核心被改掉了也不出聲。猶大在同一封信裡，已經示範了怎樣爭：9 節不毀謗、20--21 節先保守自己、22--23 節憐憫與搶救。這一題要在開卷講定爭的對象與方式。","pos":[["【一】經文問的是甚麼","","<p>猶大本來要寫的是一封溫暖的信：「我想盡心寫信給你們，論我們同得救恩的時候，就不得不寫信勸你們，要為從前一次交付聖徒的真道竭力地爭辯」（1:3）。「竭力地爭辯」原文 ἐπαγωνίζεσθαι，字根 ἀγών 是競技場、摔角場；這是運動員為獎賞全力拼搏的字，不是吵架、辯贏的字。這使我們想起保羅說的「為所信的福音齊心努力」（腓 1:27）。</p><p>爭的對象也寫得很清楚：「從前一次交付聖徒的真道」。這裡的「真道」是 πίστις，指所信的內容；「一次」ἅπαξ 是一次就完全、不必再補的意思。爭的不是個人的意見、宗派的特色、自己的面子。而爭的方式，猶大在同一封信裡示範：天使長米迦勒與魔鬼爭辯，「尚且不敢用毀謗的話罪責他，只說：『主責備你吧！』」（1:9）；「你們卻要在至聖的真道上造就自己，在聖靈裡禱告」（1:20）；「有些人存疑心，你們要憐憫他們」（1:22）。<strong>經文問的是：為真道爭辯，該爭甚麼？該怎樣爭？甚麼時候已經變成好爭競？</strong></p>"],["公開論戰說（真理至上，必須點名駁斥）","","<p>有一種讀法把 3 節當成公開論戰的授權：真理受威脅，就要正面迎戰，指出錯誤、說出名字，語氣強硬也在所不惜；他們會指出猶大自己用詞很重——「礁石」「沒有雨的雲彩」「流蕩的星」（1:12--13）。這派的優點是嚴肅：它知道錯誤的教導真的會傷人，不肯為了氣氛和諧而沉默。</p><p><strong>難處：</strong>猶大用重話描寫的是一群人的行為與結局，他沒有在信裡點出任何一個名字；他緊接著舉出的爭辯榜樣，是連魔鬼都不敢用毀謗的話罪責的米迦勒（1:9）。而且猶大說，毀謗正是「這些人」的記號：「但這些人毀謗他們所不知道的」（1:10）。用毀謗去捍衛真道，就是用「這些人」的方式反對「這些人」。保羅也說「然而主的僕人不可爭競，只要溫溫和和地待眾人」（提後 2:24）。</p>"],["和平避戰說（教義會分裂教會，最好不爭）","","<p>另一種反應走向另一端：看過太多教會為教義吵到分裂、太多人在網路上互相攻擊，就認為爭辯本身就是問題，基督徒最好只講愛、不談對錯。這派的優點是溫柔：它記得「若是能行，總要盡力與眾人和睦」（羅 12:18），也記得許多所謂的「護教」，其實是在護自己的面子。</p><p><strong>難處：</strong>猶大說他是「不得不寫」——有些時候不爭就是失職。4 節的人把「神的恩變作放縱情慾的機會」，又「不認獨一的主宰」，這不是次要的看法不同，是福音的核心被改掉了。羊圈的門開著不關，最先受害的是羊。只講愛而不分辨，正好讓「偷著進來」的人在愛席上坐得最安穩（1:12）。</p>"],["分層說（核心真道要守，次要分歧要讓）","","<p>第三種看法是把真理分層：福音的核心——三一的神、基督的神性與人性、十字架與復活、因信稱義、聖經的權威、聖潔生活的呼召——是「一次交付」的真道，必須守；洗禮方式、教會體制、末世的細節、敬拜的風格等等，是信徒可以彼此尊重、慢慢討論的次要分歧。這派的優點是給了分辨的工具：不是甚麼都爭，也不是甚麼都不爭。</p><p><strong>難處：</strong>分層的界線本身就會引起爭論，哪一項屬核心、哪一項屬次要，各傳統未必一致；而且分層只回答了「爭甚麼」，沒有回答「怎樣爭」——一個人可以守對了核心，卻用驕傲的方式守，把人一起打倒。分層說需要猶大書的另外半句：9 節與 22--23 節。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：為真道爭，不為自己爭；對錯謬嚴肅，對人憐憫。</strong>爭的對象是「從前一次交付聖徒的真道」（1:3），也就是使徒所傳、福音的核心；次要的分歧彼此尊重，不拿 3 節來替它們開戰。爭的方式照猶大自己的示範：①不毀謗，把審判交給主——米迦勒只說「主責備你吧」（1:9），這使我們想起「耶和華責備你」（亞 3:2）；②先保守自己——20--21 節的四個動作（造就、禱告、保守、仰望）排在搶救別人之前；③憐憫與搶救——「有些人你們要從火中搶出來」（1:23），爭辯的終點是救人，不是贏人。</p><p>321 在這裡給了一句很準的話：<strong>謙卑戰勝驕傲，驕傲激起驕傲。用驕傲的方式捍衛真理，本身就已經輸了。</strong>你可以在每一個論點上都對，卻把對方推得離基督更遠。「因為人的怒氣並不成就神的義」（雅 1:20）；「用溫柔勸戒那抵擋的人；或者神給他們悔改的心」（提後 2:25）。</p><p><strong>牧養底線：</strong>網路上的討論，先問「我是在守真道，還是在守面子？」，不轉發羞辱人的內容，不在公開場合點名；教會內的教義分歧，先分辨是核心還是次要，核心的事由長執同工按次序處理，次要的事彼此接納；任何時候都不以「為真道」為理由毀謗、嘲笑、羞辱人。</p>"],["【四】這件事該不該影響你的信心","","<p>若你曾經在教會的爭吵裡受傷，或被人用「為真道」的名義羞辱過，請不要因此以為真理本身是冷的。傷你的是驕傲的方式，不是那位召了你、使你「在父神裡蒙愛」的主（1:1）。</p><p>若你是一個容易為信仰爭到臉紅的人，這一題要問你：<strong>我爭完之後，對方離基督更近了，還是更遠了？</strong>猶大寫這封信時，自己就是一個曾經被哥哥的真理「贏回來」的人——不是被辯倒的，是被復活的主遇見的。真道值得爭，因為它救過我們；所以爭的方式，也要像救我們的那一位。</p>"]],"con":[],"say":"本講義的全卷立場：3 節「竭力地爭辯」ἐπαγωνίζεσθαι 是競技場用語，爭的是一次交付的真道，不是人、不是面子；方式照猶大自己的示範——9 節不毀謗、把審判交給主（亞 3:2），20--21 節先保守自己，22--23 節憐憫與搶救。核心真道要守，次要分歧要讓；謙卑戰勝驕傲，驕傲激起驕傲，用驕傲的方式捍衛真理就已經輸了。","care":"席上會有被教會的教義爭吵傷過、從此不敢再談信仰的人；有在網路上為信仰論戰、一次比一次更憤怒的弟兄；也有因為家人或同事信仰不同而緊張、不知道該不該「爭」的人。牧者要讓第一種人知道，傷他的是驕傲的方式，不是真道本身；陪第二種人看 9 節與提後 2:24--25，問他爭完以後對方離基督近了還是遠了；幫第三種人分辨核心與次要。不要在講台上用 3 節鼓動會眾去「打」任何人，也不要用「不要爭」叫有真實疑慮的人閉嘴。"},{"id":"ISS00_4","t":"分辨假教訓：猶大給的是記號，還是名單？","r":"1:4--19；1:8；1:12；1:16；1:19","ch":[],"why":"四、講台教記號，不給名單；記號先照自己——本講義的全卷立場之四（沿用彼得後書講義的全卷立場「分辨假教訓：記號而不是名單；聖經的解釋與讀經的自由」）。猶大書 4--19 節用了十幾節描寫「這些人」，原文 οὗτοι 出現六次，用詞極重。這些經文最容易被拿來在教會裡獵巫：把某位傳道人、某個教會、某個網路講員直接對號入座成「偷著進來的人」；也有人反過來，認為那只是第一世紀的事，與今天無關。這一題要講清楚猶大給的是甚麼，以及我們該怎樣用。","pos":[["【一】經文問的是甚麼","","<p>猶大沒有寫出任何一個名字，他寫的是一串記號：「將我們神的恩變作放縱情慾的機會，並且不認獨一的主宰－我們主耶穌基督」（1:4）；「污穢身體，輕慢主治的，毀謗在尊位的」（1:8）；「毀謗他們所不知道的」（1:10）；走該隱的道路、「為利往巴蘭的錯謬裡直奔」、在可拉的背叛中滅亡（1:11）；「在你們的愛席上與你們同吃的時候，正是礁石。他們作牧人，只知餵養自己」（1:12）；「私下議論，常發怨言的，隨從自己的情慾而行，口中說誇大的話，為得便宜諂媚人」（1:16）；「這就是那些引人結黨、屬乎血氣、沒有聖靈的人」（1:19）。</p><p>這些記號有三層：教導上把恩典講成放縱、不認基督是主；生活上放縱情慾、為利；群體裡輕慢權柄、抱怨、諂媚、劃界結黨。而在這一串描寫的中間，猶大放了一句：「這些做夢的人也像他們」（1:8）——前面三個鑑戒是給讀者照的鏡子。<strong>經文問的是：這些記號該怎樣用？用來指認別人，還是先檢查自己？今天還適用嗎？</strong></p>"],["名單說（把記號直接套到今天的人身上）","","<p>有一種用法是把猶大的描寫當成通緝令：看哪一位傳道人講恩典講得太寬、哪一個教會重視異夢異象、哪一位網路講員收奉獻收得多，就直接宣布他就是猶大說的人。這派的優點是警覺：它相信錯謬真的會進入教會，不肯對危險視而不見；主耶穌也說「憑著他們的果子，就可以認出他們來」（太 7:16）。</p><p><strong>難處：</strong>猶大自己沒有點任何人的名；他給的是記號，記號是讓每一個人自己拿來分辨的。名單一開，就停不下來：今天點名別人的人，明天可能被別人點名；而「私下議論」「引人結黨」（1:16、19）正是猶大列出的記號——在教會裡帶頭獵巫、劃清界線，本身就可能落入這兩個記號。名單也讓人以為危險只在別人身上，忘了 8 節的那面鏡子。</p>"],["純歷史說（那是第一世紀的事，與今天無關）","","<p>另一種讀法是把這些描寫完全放回歷史：猶大在對付一群特定的人，他們已經不在了，今天的教會不必再拿這些經文說甚麼。這派的優點是謹慎，避免把古代的爭論硬搬到今天，也避免傷害無辜的人。</p><p><strong>難處：</strong>猶大自己把這些人放在一條很長的線上：從出埃及的世代、天使、所多瑪，到該隱、巴蘭、可拉，再到使徒預言的「末世必有好譏誚的人」（1:18）。他寫的是一種會一再出現的形狀，不只是一次歷史事件。使徒保羅也預言「就是你們中間，也必有人起來說悖謬的話」（徒 20:30）。完全不用這些記號，教會就失去了分辨的工具。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用彼得後書講義的全卷立場「分辨假教訓：記號而不是名單；聖經的解釋與讀經的自由」——講台教記號，不給名單；記號先照自己。</strong>本講義不點名今天任何牧者、教會、宗派、網路傳道人為「偷著進來的人」。</p><p>猶大的記號可以整理成三個問題，讓會眾帶回家：①<strong>恩典被講成甚麼？</strong>是叫人離開罪的恩典，還是叫人安心犯罪的「恩典」（1:4）？②<strong>耶穌是不是主？</strong>是只要祂當救主，還是也讓祂作「獨一的主宰」（1:4）？③<strong>這個人、這群人，是在建造還是在拆？</strong>是「在至聖的真道上造就自己」（1:20），還是「引人結黨」（1:19）、「只知餵養自己」（1:12）？</p><p>這三個問題，<strong>先問自己，再問講台，最後才問別人</strong>。8 節「這些做夢的人也像他們」提醒我們，鑑戒是鏡子，不是望遠鏡。8 節「輕慢主治的」也不可拿來堵住對教會領袖的正當質疑——12 節被定罪的，正是「作牧人，只知餵養自己」的人，這使我們想起「以色列的牧人只知牧養自己」（結 34:2）。當教會真的面對錯謬的教導，照長執同工的次序處理，查考經文、當面勸戒，而不是在公開場合貼標籤。</p>"],["【四】這件事該不該影響你的信心","","<p>知道教會裡可能有「偷著進來」的人，不該讓你從此懷疑每一個人。猶大寫這封信，不是要讀者活在疑神疑鬼裡，是要他們在神的愛中站穩：他用十幾節描寫「這些人」，再用一句「你們卻要」（1:20）把鏡頭轉回來。</p><p>若你曾被人貼過標籤、被說成「假的」，請知道猶大沒有給任何人這樣的權柄。<strong>對付錯謬最好的辦法，不是研究錯謬，是常在神的愛中。</strong>能分辨真假的人，是熟悉真的那一位的人。</p>"]],"con":[],"say":"本講義的全卷立場：沿用彼得後書講義的全卷立場「分辨假教訓：記號而不是名單；聖經的解釋與讀經的自由」——猶大給的是記號（1:4、8、11、12、16、19），講台教記號、不給名單；記號先照自己（1:8「這些做夢的人也像他們」）；不點名今天任何人，也不用 8 節堵住對領袖的正當質疑（1:12；結 34:2）。","care":"席上會有曾被人在教會裡貼上「假的」「異端」標籤的人；有被錯誤教導帶走過一段時間、回來後一直怕被人看不起的人；也有對某位講員或某個教會已經心存定見、等著講台替他點名的人。牧者要讓第一、二種人知道，猶大沒有給任何人點名的權柄，他們被接納回到愛席上；對第三種人，溫和地把 8 節的鏡子轉回來。不要在講台上影射任何人，不要把「偷著進來」用在教會內部的人事爭議上；若真有錯誤教導需要處理，按次序私下進行。"},{"id":"ISS00_5","t":"被保守與保守自己：神保守我，為甚麼還要我保守自己？","r":"1:1--24；1:21；1:4","ch":[],"why":"五、被神的手守住，在神的愛中住下——本講義的全卷立場之五（沿用希伯來書講義關於確據的全卷立場，與約翰一書講義的議題「罪與確據」；本卷補 1、21、24 節）。猶大書全卷的珍珠是「保守」τηρέω（24 節換成 φυλάσσω）：神保守我們（1:1），我們要保守自己在神的愛中（1:21），神能保守我們不失腳（1:24）。同一封信裡又有出埃及以後被滅絕的人（1:5）、不守本位的天使（1:6），以及 4 節「自古被定受刑罰的」。良心敏感的信徒讀到這裡，最常問的是：我會不會也掉下去？我是不是被定了？這一題要把確據與責任放回正確的位置。","pos":[["【一】經文問的是甚麼","","<p>猶大把「保守」放在信的頭、腰、尾。開頭：「為耶穌基督保守的人」（1:1），原文 τετηρημένοις 是完成式被動——被保守是一件已經發生、而且持續有效的事，是別人替我們做的。中間：「保守自己常在神的愛中」（1:21），τηρήσατε 是命令式，全卷唯一叫我們去守的命令；要守的不是自己的表現，是「在神的愛中」這個位置。結尾：「那能保守你們不失腳、叫你們無瑕無疵、歡歡喜喜站在他榮耀之前的我們的救主－獨一的神」（1:24--25），φυλάξαι 是看守、護衛，ἀπταίστους 是不絆跌。</p><p>可是同一封信也寫：主「後來就把那些不信的滅絕了」（1:5），天使「不守本位」（1:6）。4 節又說有些人是「自古被定受刑罰的」，原文 προγεγραμμένοι 是「早已寫下的」。<strong>經文問的是：既然神保守我們，為甚麼還要我們保守自己？那些鑑戒是在說信徒會失去救恩嗎？「自古被定」是在說有些人生來就注定沉淪嗎？</strong></p>"],["聖徒恆忍說（加爾文傳統：真信徒必蒙保守到底）","","<p>改革宗傳統強調：真正蒙召的人，神必保守到底。主說「誰也不能從我手裡把他們奪去」（約 10:28）；保羅說「我深信那在你們心裡動了善工的，必成全這工」（腓 1:6）。猶大書的開頭與結尾正好是這個框架：已經被保守（1:1），必被保守不失腳（1:24）。21 節的命令是蒙保守的人必然會有的回應，不是另外加上去的條件；5--6 節的鑑戒，指的是外表在群體中、裡面從來沒有真信的人。</p><p><strong>難處：</strong>若讀得不小心，警告會變得好像不是對信徒說的，人就容易把確據變成放心犯罪的理由——而那正是 4 節「將神的恩變作放縱情慾的機會」的危險。另一方面，敏感的人也可能反過來不斷追問：「我是不是那種從來沒有真信的人？」</p>"],["可能離棄說（阿米念傳統：信徒有可能離開）","","<p>阿米念與衛斯理傳統強調：神的保守是真實的，但不是不顧人的回應；一個人若持續不信、刻意離開，就可能失去所蒙的恩。他們指出 21 節是一個真實的命令，5 節的百姓是確實「被救」出埃及的人，後來卻因不信被滅絕；希伯來書也說「我們若將起初確實的信心堅持到底，就在基督裡有分了」（來 3:14）。這派的優點是認真看待警告與責任。</p><p><strong>難處：</strong>24 節把結局交在「那能保守你們」的神手上，不是交在我們的堅持上；若確據要看自己守得夠不夠，敏感的良心永遠找不到安息。而且這派也同意，失去恩典不是因為一次跌倒或一段疑惑，而是持續、刻意的離棄——這點常常在講台上被講丟了。</p>"],["警告是保守的工具說（神用警告保守人）","","<p>近年不少學者提出第三種讀法：警告不是在預告誰會掉下去，而是神保守祂子民的方法之一。就像路邊寫著「懸崖，危險」的牌子，牌子本身就是讓人不掉下去的護欄。神保守我們（1:1、24），所用的方法包括鑑戒（1:5--7）、命令（1:21）、群體彼此的搶救（1:22--23），還有提醒：「我卻仍要提醒你們」（1:5）。主對彼得說「但我已經為你祈求，叫你不至於失了信心」（路 22:32），保守與提醒是同一件事的兩面。</p><p><strong>難處：</strong>這種讀法有時被批評為迴避了「真信徒能不能失去救恩」的問題；而對一顆極度敏感的良心，「警告是護欄」仍可能被聽成威脅。它需要配上清楚的福音與溫柔的牧養。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：確據建立在神的手上，責任是住在祂的愛裡。</strong>沿用希伯來書講義關於確據的全卷立場與約翰一書講義的議題「罪與確據」；三種傳統並陳，不在講台上裁判宗派之爭。猶大書自己的次序是：神先保守（1:1）→ 我們回應、在祂的愛中住下（1:21）→ 神保守到底（1:24）。21 節不是「保守自己，好讓神愛你」，是「保守自己常在神的愛中」——愛已經在那裡，我們要做的是不離開。本講義採「警告是保守的工具」的讀法：5--7 節的鑑戒是護欄，不是判決書。</p><p><strong>4 節「自古被定受刑罰的」不對任何人宣判。</strong>προγεγραμμένοι 是「早已寫下的」——舊約與以諾的預言（1:14--15）早已寫下這類人的結局；猶大說的是這種行為的結局早有記載，不是說有一張名單、某些人生來就注定沉淪。本講義不用這一節製造「我是不是被定了」的恐懼；凡講到 4 節，同時講 1 節「為耶穌基督保守的人」與 24 節「那能保守你們不失腳」。</p><p>這使我們想起：<strong>不肯守本位的，被鎖鍊守住；肯在神的愛中守住的，被神的手守住。</strong>得勝者不是從不跌倒的人，是被抓住的人。</p>"],["【四】這件事該不該影響你的信心","","<p>神學傳統之間對「信徒能不能失去救恩」有長久的分歧，這不該動搖你的信心；不論站在哪一個傳統，各派都同意：神的保守是真實的，人的回應是重要的，一次跌倒或一段疑惑不等於離棄。</p><p>若你常常害怕自己是不是「被定了」，請聽這一句：<strong>會害怕自己離開神的人，正是還在乎神的人。</strong>猶大不是寫信叫你數算自己守得夠不夠，是叫你抬頭看那位「能保守你們不失腳」的主（1:24）。「我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生」（約壹 5:13）。</p>"]],"con":[],"say":"本講義的全卷立場：沿用希伯來書講義關於確據的全卷立場與約翰一書講義的議題「罪與確據」；本卷補 1、21、24 節——神保守我們（1:1、24），我們保守自己常在神的愛中（1:21）；確據建立在神的手上，責任是住在祂的愛裡。聖徒恆忍、可能離棄、警告是保守的工具三說並陳，採後者讀法；4 節「自古被定」是「早已寫下的」，不對任何人宣判。","care":"席上會有良心特別敏感、常常懷疑自己是不是被定了的人；有跌倒過、覺得自己就是 5 節那些「不信的」的人；也有把確據當成放心犯罪理由的人。牧者對前兩種人，要先讀 1 節與 24 節，陪他讀約壹 5:13，讓他知道會害怕正表示還在乎；對第三種人，溫和地指出 4 節「將神的恩變作放縱情慾的機會」。不要用 4 節或 5 節嚇人留在教會，不要對任何人說「你可能是被定的」；若焦慮已影響睡眠與生活，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS00_6","t":"正典引用次經的原則：猶大引用《摩西升天記》與《以諾一書》，代表甚麼？","r":"1:9--15；徒 17:28；多 1:12","ch":[],"why":"六、受默示的是猶大書，不是被引用的書——全卷通用題。猶大書是新約裡最明顯引用次經的一卷：9 節米迦勒為摩西的屍首與魔鬼爭辯，早期教父指出出自《摩西升天記》；14--15 節以諾的預言，與《以諾一書》1:9 非常接近。這件事引起兩種相反的誤用：有人因此把次經抬到聖經的地位，從裡面建構一整套天使學；也有人因此貶低猶大書，說它不夠格當聖經。早期教會也曾為此遲疑。這一題要講清楚引用的原則。","pos":[["【一】經文問的是甚麼","","<p>第一處：「天使長米迦勒為摩西的屍首與魔鬼爭辯的時候，尚且不敢用毀謗的話罪責他，只說：『主責備你吧！』」（1:9）舊約只說摩西死在摩押地，「只是到今日沒有人知道他的墳墓」（申 34:6），沒有提到這場爭辯。亞歷山大的革利免、俄利根等早期教父指出，這個故事出自一部稱為《摩西升天記》的作品；今天留下來的拉丁文抄本結尾殘缺，正好缺了這一段，所以細節無法完全核對。</p><p>第二處：「亞當的七世孫以諾曾預言這些人說：『看哪，主帶著他的千萬聖者降臨，要在眾人身上行審判……』」（1:14--15）這段話與《以諾一書》1:9 非常接近；這部書在第二聖殿時期的猶太人中廣為流傳，死海古卷裡也找到它的亞蘭文殘片。創世記對以諾只說「以諾與神同行，神將他取去，他就不在世了」（創 5:24）。<strong>經文問的是：猶大引用這些書，代表他把它們當成聖經嗎？我們該怎樣看這些書，又該怎樣看猶大書？</strong></p>"],["認可次經說（猶大把這些書當成聖經）","","<p>有人認為猶大用「預言」一詞（1:14）引以諾，表示他把《以諾一書》當成有權威的經典。早期教父特土良就曾以猶大書為理由，主張接納《以諾書》的權威；直到今天，衣索比亞正教會的聖經仍收有《以諾一書》與《禧年書》。這派的優點是認真面對「預言」這個字，不把它輕輕帶過。</p><p><strong>難處：</strong>猶大引用時沒有用新約引舊約常見的「經上記著說」；「預言」一詞也可以只表示這句話是真的。保羅引克里特人自己的詩人時，也稱那人是「本地先知」，接著說「這個見證是真的」（多 1:13）——保羅顯然不是在把那位詩人的作品列為聖經。而且絕大多數教會傳統（包括猶太人自己）從來沒有把《以諾一書》列入正典。</p>"],["例證說（引用讀者熟悉的傳統作說明）","","<p>另一派認為：猶大的讀者熟悉這些傳統，對方也可能正在使用這些書；猶大就用他們熟悉的故事作例證，好像傳道人引一句大家都知道的話來說明道理。保羅在雅典也引希臘詩人的話：「我們也是他所生的」（徒 17:28），他不是在替整首詩背書，而是借聽眾熟悉的一句話，指向真神。</p><p><strong>難處：</strong>若只是「例證」，猶大為甚麼特別說以諾「預言」？9 節米迦勒的榜樣也是他整段論證的關鍵，不只是點綴。把引用說成只是修辭，會讓人覺得猶大並不真的相信他所引的內容，這也不符合經文的語氣。</p>"],["真話說（引用的那一句是真的，書本身不是正典）","","<p>第三種看法是：猶大在聖靈的默示下，從這些書裡取了一句真話——米迦勒把審判交給主、主必帶著聖者降臨審判不敬虔的人——他肯定的是這一句的內容，不是整本書的每一個字。這正是保羅在徒 17:28 與多 1:12 的做法；新約也引過舊約沒有記載的傳統，例如保羅提到抵擋摩西的「雅尼和佯庇」（提後 3:8）。</p><p><strong>難處：</strong>這派要回答：我們怎麼知道哪一句是真的、哪一句不是？答案是：只有猶大書（受默示的正典）肯定的那一句，我們才確知是真的；書中其他部分，不能因為被引用過一句就一起得到保證。這也意味著我們不能從那些書裡再挖出更多「真理」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：受默示的是猶大書，不是被引用的書；猶大引用一句真話，不等於替整本書背書</strong>（這使我們想起保羅引希臘詩人，徒 17:28；多 1:12）。本講義採「真話說」，「例證說」可以並用；認可次經說並陳，並說明它的難處。衣索比亞教會的正典另有傳統，本講義照實介紹，不嘲笑，也不採用。</p><p>由此而來的講台原則有三：①<strong>不從次經建構額外的天使學</strong>——米迦勒在猶大書裡只教我們一件事：不毀謗，把審判交給主；不從《以諾一書》補出天使的名字、階級與故事。②<strong>不以此貶低猶大書</strong>——早期的遲疑照實講（見〈作者、收信人與正典地位：「雅各的弟兄猶大」是誰？這封信怎樣被接納為正典？〉），但教會最後認出它是神的話。③<strong>講台照和合本讀經文，原文注釋交代出處</strong>，用「早期教父指出」「學者認為」，不把出處講成定論，也不鼓勵會眾去次經裡找新的啟示。</p>"],["【四】這件事該不該影響你的信心","","<p>知道聖經引用了聖經以外的書，不該動搖你的信心；反而讓你看見：神的默示不是把作者從他的時代裡拔出來，而是使用他所熟悉的語言、故事與傳統，說出神要說的話。</p><p>但這一題也保護你：若有人說「猶大引過的書也是聖經，裡面還有更多祕密」，你可以溫和地說：<strong>受默示的是猶大書。</strong>我們手上的聖經已經足夠——「從前一次交付聖徒的真道」（1:3），一次就夠，不必再補。</p>"]],"con":[],"say":"本講義的全卷立場：9 節出自《摩西升天記》（早期教父所指，今存本缺此段），14--15 節引《以諾一書》1:9；受默示的是猶大書，不是被引用的書，引用一句真話不等於替整本書背書（徒 17:28；多 1:12）。認可次經說、例證說、真話說並陳，採真話說；照實介紹衣索比亞教會的正典；不從次經建構天使學，也不以此貶低猶大書。","care":"席上會有一聽到「聖經引用次經」就嚇一跳、以為聖經有問題的長輩；有在網路上接觸到「被隱藏的聖經」「以諾書的祕密」一類說法、正在著迷的年輕人；也有來自不同教會傳統、對正典範圍有不同認識的弟兄姊妹。牧者對第一種人要安撫，讓他看見保羅也這樣引用；對第二種人不要嘲笑，陪他回到 1:3「一次交付」的真道；對第三種人尊重地說明本講義的立場。不要把次經講成禁書來製造神祕感，也不要從次經講出新的天使故事。"},{"id":"ISS00_7","t":"天使、魔鬼與屬靈爭戰：猶大書要我們怎樣看那看不見的世界？","r":"1:6--9；亞 3:2；弗 6:12","ch":[],"why":"七、看不見的世界是真實的，但焦點不在那裡——全卷通用題（沿用以弗所書講義關於屬靈爭戰的全卷立場；本卷補 6、9 節）。猶大書短短二十五節，卻有不守本位的天使（1:6）、天使長米迦勒與魔鬼的爭辯（1:9）、以及「毀謗在尊位的」（1:8）。這些經文常被拿來兩種極端使用：一種把它們當成建構天使學、魔鬼學的材料，甚至把「斥責魔鬼」變成聚會裡的表演；另一種乾脆當成古人的神話，不敢碰。這一題要講清楚猶大寫這些，究竟要讀者學到甚麼。","pos":[["【一】經文問的是甚麼","","<p>6 節：「又有不守本位、離開自己住處的天使，主用鎖鍊把他們永遠拘留在黑暗裡，等候大日的審判」（1:6）。「本位」ἀρχή 是所分派的位置、管轄的範圍；「住處」οἰκητήριον 是分給的居所。這群天使是誰、何時犯罪，猶大沒有細說，他只說審判是確定的。9 節：天使長米迦勒與魔鬼為摩西的屍首爭辯，「尚且不敢用毀謗的話罪責他，只說：『主責備你吧！』」（1:9）米迦勒在聖經別處是保護神百姓的天使（但 10:13；但 12:1），在啟示錄裡「米迦勒同他的使者與龍爭戰」（啟 12:7）。</p><p><strong>經文問的是：6 節的天使是誰？9 節的米迦勒教我們甚麼？信徒該怎樣看待魔鬼與屬靈爭戰——可以「斥責魔鬼」嗎？要怎樣做？</strong></p>"],["6 節三讀（創 6 的神的兒子們／起初的墮落／兩者分開）","","<p><strong>①創 6 的「神的兒子們」。</strong>「神的兒子們看見人的女子美貌，就隨意挑選，娶來為妻」（創 6:2）；第二聖殿時期的猶太人（包括《以諾一書》）普遍把這些「神的兒子們」讀成天使。支持者指出 7 節說所多瑪「也照他們」隨從「別的肉體」，與 6 節形成對照。難處：主說復活的人「也不娶也不嫁，乃像天上的使者一樣」（太 22:30），天使是否能與人婚配，令許多人遲疑；而且這種讀法很依賴次經的背景。</p><p><strong>②起初的墮落。</strong>指撒但與跟從牠的天使在起初背叛神。難處：聖經對這次墮落的直接描述其實很少，而且 6 節說他們已經被「拘留在黑暗裡」，與新約其他地方魔鬼仍在「遍地遊行」（彼前 5:8）需要調和。</p><p><strong>③創 6 的「神的兒子們」是塞特的後裔，6 節另指天使的墮落。</strong>這是奧古斯丁以後許多教會的讀法。難處：這樣讀，6 節與 7 節「也照他們」的對照就弱了。三讀各有根據，也各有難處。</p>"],["權能對決說（信徒應當主動斥責、捆綁邪靈）","","<p>有些教會強調屬靈爭戰的主動面：信徒奉主的名有權柄，應當在禱告中斥責魔鬼、捆綁邪靈，甚至辨認各地區的邪靈、點出它們的名字。他們會引主耶穌趕鬼的事蹟，也引「務要抵擋魔鬼，魔鬼就必離開你們逃跑了」（雅 4:7）。這派的優點是認真看待屬靈世界的真實，不把信仰縮成一套道德。</p><p><strong>難處：</strong>9 節正是反面教材：連天使長面對魔鬼，都不擅自宣判，只說「主責備你吧」。若連米迦勒都不越位，信徒在聚會中大聲辱罵魔鬼、對牠下各種宣告，就很難說是照著這個榜樣。彼得後書也說「就是天使，雖然力量權能更大，還不用毀謗的話在主面前告他們」（彼後 2:11）。雅各說的「抵擋」，前一句是「你們要順服神」（雅 4:7）——抵擋的力量來自順服，不來自音量。</p>"],["去神話說（天使魔鬼只是古人的象徵）","","<p>另一種讀法認為：天使、魔鬼是古人用來表達善惡的象徵語言，現代人應當把它們讀成心理、社會或結構性的惡。這派的優點是提醒我們，惡確實也以制度、文化、群體壓力的形式存在，不能把所有問題都推給鬼。</p><p><strong>難處：</strong>猶大與新約其他作者顯然把屬靈的存在當成真實的：「因我們並不是與屬血氣的爭戰，乃是與那些執政的、掌權的、管轄這幽暗世界的，以及天空屬靈氣的惡魔爭戰」（弗 6:12）。把它們全部去神話，就失去了經文本身的視野，也失去了「主責備你吧」背後那位真實掌權的主。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用以弗所書講義關於屬靈爭戰的全卷立場——屬靈世界是真實的，但焦點在基督的得勝，不在魔鬼的細節；爭戰的方式是站立得穩、真理、公義、信心、神的道與禱告。</strong></p><p>本卷補兩點：<strong>6 節三讀並陳，不裁判</strong>；6 節的重點是：連天使不守本位都逃不過審判——審判是確定的。這使我們想起 321 說的「驕傲是離開本位抓住權力」；但這是經文講完之後的聯想，不是說這節證明了 321。<strong>9 節米迦勒不敢毀謗</strong>：面對真實的惡，信徒的姿勢是把審判交還給主，這使我們想起「耶和華責備你」（亞 3:2）。</p><p>由此而來的講台原則：①不從次經建構額外的天使學（另見〈正典引用次經的原則：猶大引用《摩西升天記》與《以諾一書》，代表甚麼？〉）；②<strong>不把「斥責魔鬼」當成表演</strong>——禱告可以奉主的名求主責備，但不用叫囂、辱罵與表演式的宣告；③不把所有的病痛、情緒與困境都歸給鬼，也不否認屬靈的真實；④焦點在那位「能保守你們不失腳」的主（1:24），不在黑暗。</p>"],["【四】這件事該不該影響你的信心","","<p>6 節的天使是誰、9 節的故事出自哪裡，學者有不同的看法，這不該動搖你的信心。各說都同意：神的審判是確定的，屬靈的惡是真實的，而基督已經得勝。</p><p>若你曾經被屬靈爭戰的說法嚇到——晚上不敢關燈、覺得每件壞事背後都有鬼——請聽這一句：<strong>猶大書寫天使與魔鬼，不是要你害怕黑暗，是要你看清楚誰掌權。</strong>連天使長都只說「主責備你吧」；你也不必自己扛起這場爭戰。你的位置是在神的愛中（1:21），那裡是安全的。</p>"]],"con":[],"say":"本講義的全卷立場：沿用以弗所書講義關於屬靈爭戰的全卷立場——屬靈世界真實，焦點在基督的得勝。本卷補：6 節不守本位的天使三讀（創 6 的神的兒子們／起初的墮落／兩者分開）並陳不裁判，重點在審判的確定；9 節米迦勒不敢毀謗，把審判交給主（亞 3:2；彼後 2:11）。不從次經建構天使學，不把「斥責魔鬼」當成表演。","care":"席上會有曾在聚會中被當眾「趕鬼」、留下羞辱與恐懼的人；有正受憂鬱、焦慮或其他身心疾病之苦、被人說成「被鬼附」的人；也有對屬靈世界極度好奇、到處找特殊經驗的年輕人。牧者要讓第一種人知道，9 節的米迦勒正是不越位、不羞辱人的榜樣；對第二種人，明確地說病痛不等於鬼附，陪他禱告，也協助他尋求醫療與專業協助；對第三種人，把焦點帶回 1:21 與 1:24。不要在講台上描述魔鬼的細節來製造氣氛，也不要嘲笑任何人對屬靈世界的認真。"},{"id":"ISS00_8","t":"寫作年代與處境：猶大書寫於何時？偷著進來的是些甚麼人？","r":"1:1--25；1:12；1:17--18","ch":[],"why":"八、猶大書寫於何時？「偷著進來」的是些甚麼人？——全卷通用題。這封信沒有地名、沒有可以定年的事件，年代與處境只能從內容推斷。這一題不影響信息本身，卻影響讀者怎樣想像那張愛席：是一群外面的逼迫者，還是已經坐在桌邊、一起吃飯的人？是一套成形的異端體系，還是一種把恩典講成放縱的風氣？講清楚哪些是經文說的、哪些是學者的推論，正是在示範誠實讀經，也防止講台把第一世紀的描寫隨意貼到今天的人身上。","pos":[["【一】經文問的是甚麼","","<p>經文給的線索不多，但很具體。這些人是「偷著進來」的（1:4），原文 παρεισέδυσαν 是從旁邊溜進來，不是從外面攻擊；他們參加教會的愛筵——「這樣的人在你們的愛席上與你們同吃的時候，正是礁石」（1:12）。他們被稱為「做夢的人」（1:8），也許自稱有異夢異象作為權柄；他們把「神的恩變作放縱情慾的機會」（1:4），輕慢權柄（1:8），為利諂媚（1:11、16），「引人結黨」（1:19）。</p><p>關於年代，17--18 節是重要的線索：「你們要記念我們主耶穌基督之使徒從前所說的話。他們曾對你們說過，末世必有好譏誚的人」（1:17--18）。收信人親耳聽過使徒的教導，而使徒的時代似乎已經在過去。<strong>經文問的是：這封信大約寫於何時？這些人是誰——早期的諾斯底主義者，還是一群把恩典講成放縱的巡迴教師？</strong></p>"],["中期說（主後 60 年代中期至 80 年代）","","<p>多數學者把猶大書定在主後 60 年代中期至 80 年代之間。理由是：使徒的教導已經被當成「從前所說的話」（1:17），但收信人還親耳聽過（1:18），是第一代與第二代信徒交接的時候；若彼得後書採用了猶大書，猶大書就要在彼得後書之前；赫格西仆記載多密田（主後 81--96 年在位）傳召猶大的孫子時，猶大本人似乎已經不在，與這個範圍相合。</p><p><strong>難處：</strong>這些線索都是間接的；「使徒從前所說的」也可以指使徒還在世、只是不在收信人身邊的時候，所以也有學者主張更早，放在主後 50 年代。年代的範圍因此相當寬。</p>"],["晚期說（第一世紀末至第二世紀初）","","<p>部分學者把猶大書放得更晚，與託名說相連：「一次交付聖徒的真道」（1:3）像是信仰已經整理成固定的內容；「使徒從前所說的話」（1:17）像是回顧一個已經結束的使徒時代；而對手的樣子，也被拿來與第二世紀的諾斯底派比較。</p><p><strong>難處：</strong>「一次交付」的觀念在保羅書信裡已經有了——他說「我當日所領受又傳給你們的」（林前 15:3），可見「傳下來的福音內容」是很早就有的想法；18 節「他們曾對你們說過」表示收信人親身聽過使徒，這很難放到第二世紀。而且猶大書裡看不到第二世紀諾斯底體系那些複雜的宇宙論與神話。</p>"],["處境兩說（早期諾斯底傾向／放縱主義的巡迴教師）","","<p><strong>①早期諾斯底傾向。</strong>有人指出 19 節「屬乎血氣」ψυχικοί 是後來諾斯底派愛用的字：他們自稱「屬靈的人」，把一般信徒貶為「屬魂的人」；猶大把這個標籤反轉回去，說他們才是「屬乎血氣、沒有聖靈的人」。若此，對手可能已有自認屬靈精英、輕看身體與道德的傾向。</p><p><strong>②放縱主義的巡迴教師。</strong>另一種看法比較保守：這是一群在各地家庭教會之間來往的教師，他們誤解了恩典與自由，以為得救以後身體做甚麼都無妨，又用異夢異象抬高自己的權柄，靠教會的供應生活。這使我們想起保羅也曾面對「我們可以仍在罪中、叫恩典顯多嗎？」（羅 6:1）的誤解。<strong>難處：</strong>第一說容易把第二世紀的成熟體系讀回第一世紀；第二說的描繪也是從經文反推，細節難以確定。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：年代採多數學者的看法——主後 60 年代中期至 80 年代之間；較早說與晚期說並陳，不據此建立解經結論。處境多半是：一群巡迴的教師進入家庭教會的愛筵，把恩典講成放縱。</strong>他們可能帶有某些早期諾斯底的傾向，但本講義不過度斷定，不把第二世紀的體系讀回猶大書。講台說「學者認為」，不說「經文說」。</p><p>這幅畫面最要緊的一筆是：<strong>他們不是外面的逼迫者，是已經坐在桌邊的人。</strong>愛筵是教會最親密的時刻，礁石就藏在那裡（1:12）。這不是要我們在每一次聚餐時懷疑身邊的人，而是提醒我們：恩典被扭曲，常常不是從外面打進來，而是在最溫暖的地方慢慢走樣。</p><p>處境照「書信」三問讀：①受信人遇到甚麼？有人在愛席上，把恩典講成放縱。②猶大從福音推出甚麼原則？為一次交付的真道爭、看清不守本位的結局、在神的愛中保守自己、憐憫與搶救。③今天這原則落在哪裡？小組、團契、線上聚會、每一個把人聚在桌邊的地方。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。新約許多書卷的年代都有討論，這是歷史研究的正常狀態，不是聖經的破洞；猶大書的信息不靠一個確定的年份成立。</p><p>但這一題可以讓你更珍惜你所在的那張桌子：<strong>愛席是神給教會的禮物，所以值得守。</strong>猶大沒有叫讀者解散愛筵，他叫他們「在至聖的真道上造就自己」（1:20），彼此建造。守護一張桌子最好的方法，不是把門關緊，是讓桌邊的每一個人都更認識那位主。</p>"]],"con":[],"say":"本講義的全卷立場：年代採多數學者的看法——主後 60 年代中期至 80 年代之間，較早說與晚期說並陳；處境多半是一群巡迴的教師進入家庭教會的愛筵（1:12），把恩典講成放縱（1:4）。早期諾斯底傾向與放縱主義兩說並陳，不過度斷定；他們不是外面的逼迫者，是已經坐在桌邊的人。","care":"席上會有一聽到「學者對年代有爭論」就以為聖經靠不住的初信者；有在小組或團契裡被人傷過、從此不敢再參加聚餐的人；也有負責接待、預備愛筵的同工，聽完這一題開始懷疑來參加的人。牧者要讓第一種人知道，年代未定不等於內容不可信；讓第二種人知道，猶大書正是為了保護那張桌子而寫的；提醒第三種人，愛席要守，但不是用懷疑守。不要把第一世紀的描寫直接套到教會裡任何人身上，也不要把考據講成這封信的重點。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"1:1--25","ch":[],"why":"九、在根基上站穩，在枝節上並陳——全卷通用題。猶大書只有二十五節，卻碰到一連串爭議：作者是哪一位猶大、早期教會為何遲疑、與彼得後書誰用了誰、3 節的爭辯該怎樣爭、4 節「自古被定」、5 節是「主」還是「耶穌」、6 節的天使是誰、7 節所多瑪的罪、9 節與 14 節的次經、20 節在聖靈裡禱告、22--23 節是兩種人還是三種人。對許多信徒來說，這麼短的一封信有這麼多「學者認為」，本身就令人不安；也有人反過來，把每一個爭議都當成戰場。這一題要說明哪些可以並陳、哪些不能退讓，以及為甚麼誠實面對爭議，本身就是在學習這封信的功課。","pos":[["【一】經文問的是甚麼","","<p>這封信本身就在示範怎樣面對爭議。猶大分得很清楚：有一些事不能退讓——「從前一次交付聖徒的真道」（1:3）、「獨一的主宰－我們主耶穌基督」（1:4）；他為這些「竭力地爭辯」。可是他也寫下「有些人存疑心，你們要憐憫他們」（1:22）——心裡有爭辯、有疑問的人，不是敵人，是要被憐憫的人。9 節的「爭辯」與 22 節的「存疑心」，原文是同一個字 διακρίνω：一個與魔鬼爭辯的天使長，和一個心裡正在爭辯的信徒，猶大用同一個字；對前者，交給主，對後者，憐憫他。</p><p><strong>經文問的是：面對這麼多爭議，信徒該怎樣自處？哪些分歧可以彼此尊重、慢慢討論？研究與提問，會不會讓人越讀越不信？有疑問的人，在教會裡有沒有位置？</strong></p>"],["迴避說（這些事不必知道，單純信就好）","","<p>教會裡常見的反應是：這些爭議會絆倒人，最好不要在講台上提，信徒只要單純地信就好。這派的優點是保護軟弱的信徒不被過多的資訊淹沒，也提醒我們信心不是靠學問得來的；保羅也勸「信心軟弱的，你們要接納，但不要辯論所疑惑的事」（羅 14:1）。</p><p><strong>難處：</strong>正因為教會沒有講清楚，3 節才會被拿來合理化論戰，4 節才會被拿來嚇人，7 節才會被拿來羞辱人，9 節與 14 節才會被拿來建構奇特的天使學。沒有講過的經文，最容易被誤用的人搶先解釋；而且把提問的人看成不屬靈，正是 22 節要擋下的誤讀——存疑心不等於背道。</p>"],["全盤懷疑說（爭議這麼多，聖經就不可靠）","","<p>另一種反應走向另一端：連作者是誰、有沒有引用次經、哪一個異文是原文都有爭議，那麼整本聖經都只是人的意見。這派的優點是誠實地面對了問題，不肯用信仰的口號掩蓋困難。</p><p><strong>難處：</strong>這派把「不確定的枝節」與「不確定的根基」混為一談。猶大書的異文（1:1、4、5、15、22--23、24、25）沒有一處改變信息的核心；作者的討論在幾位真實的早期人物之間；引用次經的問題，保羅也有類似的做法；正典的歷史顯示的是教會認真的分辨，不是隨意的拼湊。把每一個討論都當成整體崩塌的證據，本身也是一種沒有經過分辨的結論。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。</strong>全卷的爭議，本講義已在各題交代：〈作者、收信人與正典地位：「雅各的弟兄猶大」是誰？這封信怎樣被接納為正典？〉、〈與彼得後書的關係：兩封信約十九處相似，誰用了誰？兩卷怎樣分工？〉、〈為真道爭辯而不好爭競：「竭力地爭辯」是甚麼樣的爭？〉、〈分辨假教訓：猶大給的是記號，還是名單？〉、〈被保守與保守自己：神保守我，為甚麼還要我保守自己？〉、〈正典引用次經的原則：猶大引用《摩西升天記》與《以諾一書》，代表甚麼？〉、〈天使、魔鬼與屬靈爭戰：猶大書要我們怎樣看那看不見的世界？〉、〈寫作年代與處境：猶大書寫於何時？偷著進來的是些甚麼人？〉。每一題都列出各家的理由與難處，因為只給結論不給過程，是剝奪讀者思考的權利。</p><p>但有幾件事，全卷沒有任何一個爭議動搖過：<strong>我們是「被召、在父神裡蒙愛、為耶穌基督保守的人」（1:1）；真道是「從前一次交付聖徒的」（1:3）；耶穌基督是「獨一的主宰」（1:4）；我們要「保守自己常在神的愛中」（1:21）；而那一位「能保守你們不失腳」（1:24），榮耀、威嚴、能力、權柄都歸與祂，直到永永遠遠（1:25）。</strong>這是猶大書的根基，也是本講義全卷的根基。</p>"],["【四】這件事該不該影響你的信心","","<p>派別之爭不該影響你的信心。問問題不是不信；寫這封信的猶大，自己曾經不信他的哥哥（約 7:5），後來稱祂為主。主復活以後，門徒「見了耶穌就拜他，然而還有人疑惑」（太 28:17）——主沒有把疑惑的人趕走，祂走近他們，把大使命交給他們，疑惑的人也在其中。</p><p>但有一件事該影響你：<strong>讀完這封信，我更安穩地被主抓住、也更溫柔地去搶救人，還是更多疑、更好鬥？</strong>答案可以有討論，那一位不會改變。爭議可以慢慢想，敬拜卻不必等到所有問題都解決——猶大書不是用警告收尾的，是用頌讚收尾的。</p>"]],"con":[],"say":"本講義的全卷立場：猶大書的爭議都發生在「怎樣理解」的層次，本講義分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。被召蒙愛被保守、一次交付的真道、耶穌基督是獨一的主宰、保守自己常在神的愛中、那能保守你們不失腳的神，這些沒有一個爭議動搖過；存疑心的人是要憐憫的人（1:22），不是背道者。","care":"席上會有正在信仰危機裡、問題多到不敢說出口的人；有一聽到「學者有爭論」就不安的長輩；還有曾經被人用這封信傷過——被貼上「偷著進來的」標籤、被用 4 節恐嚇、因為提問被說成不屬靈——因此連神也不敢信的人。對第一種人，不要說「你就是信心不夠」；先憐憫他、陪著他，這正是 1:22 的吩咐；對第二種人，指給他看 1:1 與 1:24；對第三種人，讓他知道傷他的是人錯用了經文，不是那位「能保守你們不失腳」的主。疑惑若伴隨長期失眠或無望感，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_1","t":"「一次交付聖徒的真道」是甚麼？「竭力爭辯」與愛怎樣並存？","r":"1:3--3；1:8；1:17；1:9；1:22--23","ch":[1],"why":"3 節是猶大寫這封信的理由，也是全卷最常被引用、最常被誤用的一節。「一次交付」有人讀成「正典已經封閉、不再有新的啟示」，有人讀成「福音的核心已經完整交付」；兩種讀法，直接影響今天怎樣面對自稱有新啟示的教導，怎樣分辨核心與枝節。而「竭力地爭辯」幾個字，又常被拿來替網路上的論戰背書——所以要先問清楚：爭的是甚麼？怎麼爭？","pos":[["【一】經文問的是甚麼","","<p>猶大原本想寫信論「我們同得救恩」的事，卻「不得不寫信勸你們，要為從前一次交付聖徒的真道竭力地爭辯」（1:3）。這句話有三個關鍵字。ἐπαγωνίζεσθαι「竭力地爭辯」新約只出現這一次，字根是競技場、摔角場：運動員為獎賞全力奮鬥，不是吵架。ἅπαξ「一次」，是一次而永遠、不必重來的那一次。παραδοθείσῃ「交付」是傳承的字，像保羅說「我當日所領受又傳給你們的」（林前 15:3）。而 πίστει「真道」在這裡不是指信心的動作，是指所信的內容。</p><p>經文問的是：這個「一次交付」的內容有多大？是指整本新約正典，還是指使徒傳下來的福音核心？而「竭力爭辯」的人，又怎樣同時是「蒙愛」、也去「憐憫」的人？</p>"],["正典封閉說（一次交付＝聖經已經完整）","","<p>這一讀把「一次交付」連到正典：神的啟示在使徒的時代已經完整賜下，新約寫成之後，不再有與聖經同等權威的新啟示；任何自稱有新啟示、要補充或修改聖經的教導，都越過了這「一次」。這一讀的長處很清楚：8 節「這些做夢的人」多半正是用異夢越過使徒的教訓，而猶大要讀者「記念我們主耶穌基督之使徒從前所說的話」（1:17），把準則放在使徒所傳的上面。神「在這末世藉著他兒子曉諭我們」（來 1:2），兒子之後沒有更高的話。</p><p><strong>難處：</strong>猶大寫信的時候，新約還沒有全部寫成，更沒有收集成冊；猶大書本身也是後來才被各地教會普遍接納的。把「一次交付的真道」直接等同於二十七卷書的書目，是把後來的問題放回猶大口中。這一讀若講過了頭，也容易把今天聖靈在人心裡的光照與引導一併否定。</p>"],["福音核心說（一次交付＝使徒所傳的福音內容）","","<p>這一讀認為 πίστει 指的是使徒傳下來的福音內容：耶穌基督是「獨一的主宰」，他的死與復活，因恩典得救，並且因恩典過聖潔的生活。猶大的對手沒有爭論聖經有幾卷，他們做的是「將我們神的恩變作放縱情慾的機會，並且不認獨一的主宰」（1:4）——被改換的正是福音的核心。照這一讀，「一次交付」是說核心已經完整交付，不需要新的啟示來補，也不容人另換一個；這使我們想起保羅說，就是天上來的使者，「若傳福音給你們，與我們所傳給你們的不同，他就應當被咒詛」（加 1:8）。</p><p><strong>難處：</strong>「核心」由誰來劃？界線劃得太窄，甚麼都可以算作枝節；劃得太寬，連次要的分歧都成了「為真道爭辯」。這一讀必須以使徒的著作作為核心的實際內容，否則「核心」很容易變成各人心中的核心。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義兩讀並陳，採福音核心說，並承認它與正典說有交集。</strong>「一次交付」說的是：神在基督裡所成就、由使徒傳下來的福音，已經完整交付，不需要新的啟示來補，也不容人改換；這個核心今天的實際內容，就在使徒所寫、教會所認出的新約聖經裡。所以兩讀在講台上可以同時守住：自稱有新啟示、要越過聖經的，越過了這「一次」；但「一次交付」不等於一切細節都已凍結，教會在次要的事上仍要謙卑地查考、彼此包容。</p><p>至於「竭力爭辯」與愛怎樣並存，本講義的全卷立場見議題「為真道爭辯而不好爭競：『竭力地爭辯』是甚麼樣的爭？」——爭的是真道，不是人，不是自己的面子；方式猶大自己示範了：9 節米迦勒不用毀謗的話，只說「主責備你吧」；20--21 節先保守自己；22--23 節第一個動詞是「憐憫」。本章不另立說法。</p>"],["【四】這件事該不該影響你的信心","","<p>不該；這一題反倒給人安穩。你所信的，不是一套每隔幾年就要更新的說法，而是「從前一次交付聖徒的真道」（1:3）。你不必追逐每一個新的異夢、新的啟示，才算跟得上神；你手上的聖經，就是那一次交付的真道傳到你手上的樣子。</p><p>而「竭力」也不是要你變成一個好鬥的人。猶大自己是先被保守的人，才為真道爭；他爭辯的方式，最後落在憐憫與搶救。守住真道的人，可以溫柔，因為真道不靠我們的音量站立。</p>"]],"con":[],"say":"本講義的立場：「一次交付的真道」是使徒傳下、已經完整交付的福音核心，今天的內容就在新約聖經裡；不需要新的啟示來補，也不等於一切細節都已凍結。「竭力爭辯」與愛怎樣並存，本講義的全卷立場見議題「為真道爭辯而不好爭競：『竭力地爭辯』是甚麼樣的爭？」。","care":"會眾席上有兩種人會被這一節傷到：一種是曾被「為真道爭辯」的人在網路上或小組裡圍攻過的人，一聽到 3 節就縮起來；另一種是被某些「新啟示」吸引、心裡不安卻不敢開口的人。不要把 3 節講成號角，叫會眾去打仗；也不要嘲笑那位被新說法吸引的人。先讓人看見猶大寫信的對象是「被召、在父神裡蒙愛、為耶穌基督保守的人」（1:1）。牧者可以陪那位受過傷的人說：猶大要的爭，是米迦勒那一種，不是羞辱人的那一種；也可以陪那位被吸引的人，一起把新說法帶回使徒的話裡慢慢查考。"},{"id":"ISS01_2","t":"「自古被定受刑罰」——是預定沉淪，還是早已寫下的結局？","r":"1:4--4；1:1；1:5--16；1:24","ch":[1],"why":"「自古被定受刑罰的」是猶大書最容易讓人害怕的一句。敏感的信徒讀到這裡，常常想到的不是那些偷著進來的人，而是自己：「我會不會就是被定了的那一個？」這一題牽涉預定論的大爭論，也牽涉一個人晚上能不能安心睡覺。所以要先看清楚猶大用的是哪一個字，再說他說了甚麼、沒有說甚麼。","pos":[["【一】經文問的是甚麼","","<p>和合本「就是自古被定受刑罰的」（1:4），原文是 οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα。πάλαι 是「很久以前」；προγεγραμμένοι 是 προγράφω 的完成式被動分詞，字面是「預先寫下的」「早已公告出來的」。保羅說「從前所寫的聖經都是為教訓我們寫的」（羅 15:4），「從前所寫的」用的就是這個字；他對加拉太人說，耶穌基督釘十字架「已經活畫在你們眼前」（加 3:1），「活畫」也是同一個字——像貼在公告欄上、寫出來給人看。</p><p>經文問的是：猶大說這些人「早已被寫下」，寫在哪裡？是神在永恆裡定了某些人必然沉淪，還是有一份早已寫好的文字，預先描寫了這類人與他們的結局？</p>"],["預定沉淪說（神永恆的定旨）","","<p>這一讀把「被定」讀成神永恆的預定：這些人在創世以前就被神定為要受這樣的審判。支持者會引「他們這樣絆跌也是預定的」（彼前 2:8），以及「那可怒、預備遭毀滅的器皿」（羅 9:22），認為聖經確實談到神在審判上的主權；歷史上也有解經家把 4 節放在「棄絕」的教義底下。</p><p><strong>難處：</strong>猶大用的不是「揀選、預定」一類的字，而是「寫」；而且他接著用了十二節（5--16）把「寫下的」一件一件擺出來：出埃及後不信的人、不守本位的天使、所多瑪、該隱、巴蘭、可拉、以諾的預言。這一讀把一個描寫「這類人的結局早有記載」的字，讀成了對個人命運的宣判，跳過了上下文。即使在最看重神主權的傳統裡，也有許多解經家不從這一節建立棄絕的教義。</p>"],["早已寫下說（舊約與以諾的預言早已寫下這類人的結局）","","<p>這一讀照字面：這些人的審判，早就「寫」在那裡了。舊約記載了出埃及後不信的人倒在曠野（民 14）、所多瑪的火、可拉被地吞下；以諾的預言（1:14--15）也早已說到主要來審判一切不敬虔的人。猶大的意思是：這些偷著進來的人不是新鮮事，他們的樣子、他們的結局，早就寫好了；5--16 節就是那些「寫下的」。猶大整段用「例子—『這些人』—解釋」的寫法，正好支持這一讀。</p><p><strong>難處：</strong>πάλαι「自古」說得很遠，而猶大所引的「寫下的」，有一部分（以諾的預言）不在舊約正典裡，讀者會問：寫在哪一本書裡才算？另外，這一讀若只講「早有記載」，也可能把神在審判上的主權講得太輕，好像審判只是一份歷史紀錄。</p>"],["天上冊子說（記在神面前的案卷）","","<p>第三種讀法認為「寫下」指天上的冊子。但以理看見審判的寶座，「他坐著要行審判，案卷都展開了」（但 7:10）；第二聖殿時期的猶太文獻也常說人的作為與結局記在天上的書上。照這一讀，這些人的審判早已記在神面前，只等那日揭開。</p><p><strong>難處：</strong>猶大沒有提到冊子；他緊接著擺出來的是讀者讀得到的經文與預言，不是看不見的案卷。而且這一讀與第一讀一樣，很容易被聽成「有些人的名字早已寫進沉淪的名單」，與這封信開頭和結尾的盼望對不上。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採早已寫下說，並陳其他兩讀。</strong>4 節說的是這一類人的結局早就寫下了——舊約與以諾的預言早已描寫了這類人，也寫明了他們的審判；猶大是在說「這不是新鮮事，聖經早有預備」，不是對任何今天的人宣判。講台可以說「他們的結局早已寫在聖經裡」，不可以說某些人生下來就沒有盼望，更不可以指著會眾席上任何一個人這樣說。偷著進來的人，猶大給的是記號，不是名單（全卷立場見議題「分辨假教訓：猶大給的是記號，還是名單？」）。</p><p>神的主權與我們的確據這個大問題，本講義的全卷立場見議題「被保守與保守自己：神保守我，為甚麼還要我保守自己？」。同一封信的開頭說讀者是「為耶穌基督保守的人」（1:1），結尾說神「能保守你們不失腳」（1:24）。4 節的「寫下」，要放在這兩個「保守」中間讀。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你害怕。一個會擔心「我是不是被定了」的人，多半正是一個在乎神的人；4 節描寫的人卻是把神的恩當作放縱的許可證、用生活否認獨一主宰的人——他們不會為這一節失眠。</p><p>猶大寫給你的第一句話，是你「在父神裡蒙愛、為耶穌基督保守」；他寫給你的最後一句話，是那位神「能保守你們不失腳」。寫下的審判是真的，寫下的保守也是真的；你可以把擔心交給那位寫下保守的神。</p>"]],"con":[],"say":"本講義的立場：προγεγραμμένοι 是「早已寫下的」——舊約與以諾的預言早已寫下這類人的結局（5--16 節就是那些寫下的），不是對任何今天的人宣判；講到 4 節，一定同時帶出 1 節「為耶穌基督保守的人」與 24 節「那能保守你們不失腳」。神的主權與確據，本講義的全卷立場見議題「被保守與保守自己：神保守我，為甚麼還要我保守自己？」。","care":"會眾席上有容易自責、常常睡不著的人，也有曾經被人用預定論嚇過的人；他們一聽到「自古被定」，心就往下沉。不要在講台上用這一節推測任何人的結局，也不要對發問的人說「你怎麼知道你不是」。牧者可以告訴他：會為這件事不安，往往正說明聖靈還在你心裡動工；然後陪他把 1 節和 24 節一起讀出來。若他長期被這類恐懼纏住、影響睡眠與生活，要溫柔地陪他尋求協談與專業的幫助。"},{"id":"ISS01_3","t":"救百姓出埃及的是「主」還是「耶穌」？","r":"1:5--5；1:4；林前 10:4；林前 10:9","ch":[1],"why":"和合本說「從前主救了他的百姓出埃及地」，但今天通行的希臘文校勘本 SBLGNT 與 NA28 在這裡作「耶穌」。這是新約經文鑑別最有名的難題之一，也直接碰到基督論：如果猶大寫的是「耶穌」，他是在說先存的基督在出埃及的時候就在拯救，也在審判。會眾若在別的譯本讀到「耶穌救了百姓出埃及」，難免以為有人改了聖經——所以要把證據攤開來。","pos":[["【一】經文問的是甚麼","","<p>5 節的主詞，各家希臘文本不一樣：SBLGNT、NA28 作 Ἰησοῦς（耶穌）；WH、Treg 作 κύριος（主）；RP 作 ὁ κύριος，和合本「主」與它相合；另有少數抄本作「神」，最古老的蒲草紙抄本之一甚至作「神基督」。接著 τὸ δεύτερον「後來」把兩件事連在一起：同一位救了百姓出埃及，後來也 ἀπώλεσεν「滅絕了」那些不信的。</p><p>經文問的是：猶大原來寫的是哪一個字？如果是「耶穌」，猶大是在說甚麼？這與我們對基督的認識有甚麼關係？</p>"],["「耶穌」讀法（SBLGNT、NA28；部分英文譯本）","","<p>外證：支持「耶穌」的抄本古老而分布廣，包括亞歷山大抄本、梵蒂岡抄本與幾份重要的小楷抄本，以及拉丁、科普替等古譯本。內證：「耶穌救百姓出埃及」是難讀的經文，抄寫者較可能把難讀的「耶穌」改成順口的「主」，而不太會反過來；而且抄本裡「主」與「耶穌」都用兩個字母的縮寫，只差一個字母，也容易抄錯。神學上也不奇怪：保羅說曠野裡「那磐石就是基督」（林前 10:4），又說「也不要試探主，像他們有人試探的」（林前 10:9），而那一節許多古抄本作「試探基督」。猶大 4 節剛稱耶穌基督為「獨一的主宰」，5 節接著說他在出埃及時就在作工，順理成章。</p><p><strong>難處：</strong>新約很少用「耶穌」這個道成肉身以後的名字，去稱呼成為人以前的基督；把「耶穌」放在出埃及的時代，讀者聽來難免突兀。連「後來就把那些不信的滅絕了」也歸給耶穌，對許多讀者是一個需要解釋的說法。</p>"],["「主」讀法（WH、Treg、RP；和合本）","","<p>外證：西乃抄本、以法蓮抄本等重要抄本作「主」，後來的多數抄本作 ὁ κύριος。內證：猶大明說「我們主耶穌基督」的地方（4、17、21、25 節）之外，單用 κύριος 的 9 節「主責備你吧」與 14 節「主帶著他的千萬聖者降臨」，多半指神（14 節也有人認為指基督）；5 節的「主」正好落在舊約出埃及敘事裡「耶和華」的位置，讀起來最自然。照這一讀，「主」所指可以是父神，也可以是基督；許多解經家也指出，在猶大的用法裡，這個「主」可以把子包括在內。</p><p><strong>難處：</strong>如果原文是順口的「主」，就很難解釋為甚麼有那麼多古老的抄本，會把它改成更難讀的「耶穌」；抄寫者通常是把難處抹平，而不是製造難處。這也是今天的校勘本改採「耶穌」的主要理由。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義兩讀並陳；講台照和合本講「主」，在議題頁與解經的文法欄說明異文。</strong>SBLGNT、NA28 根據抄本證據判斷「耶穌」較可能是原來的讀法，這個判斷要誠實告訴會眾；和合本根據的是另一個抄本傳統，它不是「翻錯」。</p><p>兩讀的神學沒有衝突。若讀「耶穌」，猶大是說先存的基督在出埃及時就在拯救與審判——這使我們想起林前 10:4、9。若讀「主」，4 節已經稱耶穌基督為「獨一的主宰」，猶大的基督論一樣高。而基督的先存不靠這一節建立：「太初有道，道與神同在，道就是神」（約 1:1）；「還沒有亞伯拉罕就有了我」（約 8:58）；「他在萬有之先」（西 1:17）。5 節若作「耶穌」，只是多了一個見證；若作「主」，也不少一分。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。抄本之間的差異，大多是這樣一個字的差別，而且全都公開擺在校勘本裡，任何人都可以查；教會沒有隱藏甚麼。正因為抄本這麼多，我們才知道差異在哪裡，也才能分辨。</p><p>無論哪一讀，猶大要你記住的是同一件事：救了你的那一位，也是會審判的那一位；蒙拯救的百姓，後來也有人因不信倒在曠野。這不是要你害怕，是要你繼續信下去——鑑戒先照自己，然後回到那位救你的主面前。</p>"]],"con":[],"say":"本講義的立場：1:5 兩讀並陳——SBLGNT、NA28 作「耶穌」，WH、Treg 作「主」，RP 作「主」（帶冠詞），和合本作「主」；講台照和合本講「主」，議題頁說明異文。無論哪一讀，耶穌基督是 4 節的「獨一的主宰」；基督的先存另有清楚的經文（約 1:1；西 1:17），不靠這一節建立。","care":"有些會眾第一次聽到「抄本有異文」會很不安，以為聖經不可靠了；也有人拿這一節到處說「和合本翻錯了」。不要在講台上把異文講成醜聞，也不要拿它來炫耀學問、貶低和合本或任何一個譯本。牧者可以平靜地告訴不安的人：我們手上的抄本多到可以彼此對照，這正是神保守他話語的方式；也可以陪那位愛挑錯的人，把焦點從「誰翻錯了」帶回「救我的主也是審判的主」。"},{"id":"ISS01_4","t":"「不守本位的天使」是誰？","r":"1:6--6；1:7；創 6:1--4；彼後 2:4","ch":[1],"why":"6 節只有一句話，卻引出許多問題：這些天使是誰？甚麼時候「不守本位」？為甚麼已經被拘留？是不是創世記第 6 章「神的兒子們」的事？這一題常常把人帶進天使學的長篇猜測，網路上更有各種巨人、混種的神祕說法。同時，6 節又是全卷與「本位」最貼近的一節，更需要先把經文自己的意思講清楚，再說它使我們想起甚麼。","pos":[["【一】經文問的是甚麼","","<p>原文說這些天使是 τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον——「不守自己的本位，離開自己的住處」。ἀρχή 可以是「起初」，也可以是「權位、所分派的管轄」；οἰκητήριον 是「居所」。神的回應是 τετήρηκεν「拘留」，和「不守」是同一個字：不肯守本位的，被神守住。7 節接著說所多瑪「也照他們」（τούτοις），「他們」最自然指 6 節的天使。</p><p>經文問的是：這是哪一次的墮落？與創 6:1--4 有沒有關係？猶大要讀者從這件事看見甚麼？</p>"],["創 6 說（神的兒子們是天使）","","<p>這是第二聖殿時期猶太人的主流讀法：創 6:2、4 的神的兒子們是天使，他們離開天上的居所，與人的女子交合。《以諾一書》6--10 章詳細講這個故事，說這些天使被捆鎖在黑暗裡等候審判，用語與 6 節非常接近。支持的理由還有：舊約稱天使為「神的眾子」（伯 1:6；38:7）；7 節「也照他們」把天使的越界與所多瑪人追求「別的肉體」並排；彼後 2:4--5 也把犯罪的天使與挪亞的洪水排在一起。早期教父中有不少人採這一讀。</p><p><strong>難處：</strong>耶穌說復活的人「也不娶也不嫁，乃像天上的使者一樣」（太 22:30），許多人據此認為天使與人無從結合（雖然這句話說的是天上的使者，不一定涵蓋墮落的）。這一讀也很容易把讀者帶進次經的天使學，越講越遠。</p>"],["起初的墮落說（撒但與跟從他的天使）","","<p>這一讀認為 6 節說的是撒但與跟從他的天使在起初的背叛，不必連到創 6。理由是：創 6 本身沒有提到天使；猶大三個鑑戒（出埃及、天使、所多瑪）未必照歷史次序排列；許多人也把賽 14:12--15、結 28:12--17 讀成這次墮落的背景（雖然那兩段字面上是對巴比倫王、推羅王說的）。</p><p><strong>難處：</strong>如果是起初的墮落，為甚麼這些天使已經被「用鎖鍊把他們永遠拘留在黑暗裡」（1:6），而新約裡魔鬼卻仍然「如同吼叫的獅子，遍地遊行」（彼前 5:8）？這一讀需要把墮落的天使分成已被拘留與尚未拘留的兩群，經文並沒有說明。</p>"],["塞特後裔說（創 6 另論，6 節另指天使墮落）","","<p>從第三、四世紀起，許多解經家（包括奧古斯丁）認為創 6 的「神的兒子們」是塞特敬虔的後裔，「人的女子們」是該隱的後裔，兩條家譜通婚，敬虔的一脈因此敗壞。照這一讀，猶大 6 節與創 6 無關，另指天使的墮落。支持的理由是：創 4--5 章正好排列了該隱與塞特兩條家譜，而且這一讀避開了天使與人結合的難題。</p><p><strong>難處：</strong>「神的兒子們」與「人的女子們」的對照，在創 6 的上下文裡不太像兩條家譜的分別；而猶大的讀者普遍熟悉第一讀的背景，猶大寫 6、7 兩節的時候，很可能也預設了那個背景。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義三讀並陳，傾向不裁判。</strong>6 節的重點不在這些天使是誰、在甚麼時候，而在審判的確定：連天使不守本位，都逃不過神的審判；他們被拘留，「等候大日的審判」（1:6）。猶大用同一個字說他們「不守」又被「拘留」——不肯守本位的，被鎖鍊守住。</p><p>天使、魔鬼與屬靈爭戰的大問題，本講義的全卷立場見議題「天使、魔鬼與屬靈爭戰：猶大書要我們怎樣看那看不見的世界？」；這一節背後的次經背景，見議題「正典引用次經的原則：猶大引用《摩西升天記》與《以諾一書》，代表甚麼？」。講台不從《以諾一書》建構天使的名字、階級與細節。講完審判的確定之後，才說：ἀρχή 是所分派的位置，越界去抓不屬於自己的，正是驕傲的形狀——這使我們想起 321 說的「驕傲是離開本位抓住權力」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你不必知道這些天使是誰，就能聽懂猶大要說的話：神的審判是確定的，連最有能力的受造之物也不例外。</p><p>而猶大在同一封信裡，給了我們一個要守的位置：「保守自己常在神的愛中」（1:21）。天使離開了神分派給他們的位置；我們被叫去守住的位置，是神的愛。不肯守本位的，被鎖鍊守住；肯在神的愛中守住的，被神的手守住。</p>"]],"con":[],"say":"本講義的立場：6 節「不守本位的天使」三讀並陳（創 6 的神的兒子們／起初的墮落／創 6 另作塞特後裔、6 節另指天使墮落），傾向不裁判；重點在審判的確定——不肯守本位的，被神「拘留」。天使與屬靈爭戰，本講義的全卷立場見議題「天使、魔鬼與屬靈爭戰：猶大書要我們怎樣看那看不見的世界？」。","care":"有些弟兄姊妹，特別是年輕人，對這類題目十分著迷，網路上關於巨人、混種、天使名字的說法讀了一大堆；也有人一聽到天使墮落就害怕起來。不要在講台上把 6 節講成奇幻故事，也不要嘲笑問這類問題的人。牧者可以陪那位著迷的人分辨哪些是經文說的、哪些是後人加的；陪那位害怕的人看見：連這些天使都在神的手底下，你更是在他的手裡（1:24）。"},{"id":"ISS01_5","t":"所多瑪「隨從逆性的情慾」——所多瑪的罪是甚麼？今天怎樣講？","r":"1:7--7；1:6；1:8；創 19:4--11；結 16:49--50","ch":[1],"why":"7 節直接碰到今天教會最敏感的題目之一：性倫理。有人用這一節證明所多瑪的罪只有同性性行為；有人說所多瑪的罪只是不接待客旅、欺壓窮人，與性無關。講台若避而不談，等於把會眾留給網路；若講得粗暴，又會把會眾席上正在掙扎的人推出門外。所以要誠實地看經文說了甚麼，也要想清楚坐在下面聽的人是誰。","pos":[["【一】經文問的是甚麼","","<p>和合本「也照他們一味地行淫，隨從逆性的情慾」（1:7）；原文是 τὸν ὅμοιον τρόπον τούτοις ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας。ἐκπορνεύσασαι 是加強的「行淫」；σαρκὸς ἑτέρας 字面是「別的肉體」，「逆性的情慾」是和合本的意譯。τούτοις「他們」最自然指 6 節的天使：天使越界向人，所多瑪人越界向來到城裡的「人」——創 19 章那兩位客人其實是天使。最後一句 δεῖγμα「鑑戒」，是擺出來給人看的樣本。</p><p>經文問的是：「別的肉體」指甚麼？所多瑪的罪是一件，還是好幾件？今天講這一節，要對誰說、怎麼說？</p>"],["同性性行為說","","<p>創 19 章城裡的人圍住羅得的房子，要他把客人帶出來，「任我們所為」（創 19:5）——這是男人對男人的性暴力要求。古代猶太作者與許多教父都把所多瑪的罪連到同性性行為；新約的性倫理也說「男和男行可羞恥的事」（羅 1:27），林前 6:9 的清單裡也有相關的字。照這一讀，「別的」是指離開神起初所定男女結合的那條路。</p><p><strong>難處：</strong>σαρκὸς ἑτέρας 字面是「不同的肉體」，同性的肉體嚴格說並不是「別的」肉體；這一讀需要把「別的」解成「違反本性的」，字面上有一段距離。而且創 19 章的人是要對客人施暴，不能直接拿來描寫今天每一個在性傾向上掙扎的人。</p>"],["人與天使說","","<p>這一讀認為「別的肉體」指天使：所多瑪人要侵犯的其實是天使（雖然他們不知道），正好與 6 節天使越界追求人對稱——天使越界向下，人越界向上，兩邊都越過了神所定的界限。7 節「也照他們」把兩件事並排，支持這一讀。</p><p><strong>難處：</strong>所多瑪人並不知道那兩位是天使，他們的意圖是對「人」施暴；若重點只在天使，這個鑑戒對讀者的性生活就沒有直接的話要說。可是猶大 8 節緊接著說「這些做夢的人也像他們污穢身體」（1:8），顯然是在講人身上的性罪。</p>"],["越界總括說（越過神為性所定的界限）","","<p>這一讀把重點放在「越界」：天使與人、性暴力、同性的性行為，都是離開神為性所設的位置。這一讀把 6、7、8 節串成一條線：天使不守本位，所多瑪人越過界限，「這些人」污穢身體——同一個「不守本位」的形狀。先知又提醒所多瑪的罪不只一項：「她和她的眾女都心驕氣傲，糧食飽足，大享安逸，並沒有扶助困苦和窮乏人的手」（結 16:49），而且「在我面前行可憎的事」（結 16:50）。</p><p><strong>難處：</strong>這一讀涵蓋面廣，容易被人用來把性的問題講得模糊，或者反過來，把所有的罪都講成性的罪；講的人必須誠實地兩邊都講到。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義三讀並陳，採越界總括說，並且持守聖經的性倫理。</strong>性是神所賜的好禮物，屬於一男一女在婚姻裡的盟約；婚姻以外的性行為，無論異性或同性，聖經都稱為罪（羅 1:26--27；林前 6:9--10）。同時，所多瑪的罪不只一項：驕傲、飽足、安逸、不扶助困苦人，也都在神的審判底下——這一句先照的，是我們這些吃得飽、住得好的人。猶大自己的落點在 8 節：「這些做夢的人也像他們」——鑑戒是給讀者照的鏡子。</p><p>講台不羞辱、不嘲笑、不標籤任何群體或個人，也不因為怕爭議而略過。一位在試探中掙扎、願意跟隨主的人，不是 4 節那種把神的恩當作放縱藉口的人。保羅列完那張清單，緊接著說：「你們中間也有人從前是這樣；但如今你們奉主耶穌基督的名，並藉著我們神的靈，已經洗淨，成聖，稱義了」（林前 6:11）。</p>"],["【四】這件事該不該影響你的信心","","<p>若你正在性的方面掙扎，不論是哪一種掙扎，這一節不是把你關在門外的一節。所多瑪被擺出來作鑑戒，是要所有的人——包括講台上的人——都看見罪的終點，然後回頭；而回頭的路，林前 6:11 已經寫好了：洗淨、成聖、稱義，都是神作成的。</p><p>猶大在同一封信裡說，那位神「能保守你們不失腳，叫你們無瑕無疵、歡歡喜喜站在他榮耀之前」（1:24）。無瑕無疵不是你自己掙來的，是他給你換上的衣裳。</p>"]],"con":[],"say":"本講義的立場：7 節「別的肉體」三讀並陳（同性性行為／人與天使／越過神所定的界限），採越界總括說；持守聖經的性倫理（羅 1:26--27；林前 6:9--11），同時並陳所多瑪的罪不只一項（結 16:49--50）；鑑戒先照自己（1:8），不羞辱、不標籤任何群體或個人，也不因怕爭議而略過。","care":"會眾席上一定有人正在性的方面掙扎——可能是同性的吸引，可能是色情，可能是一段不該有的關係——而且多半沒有人知道。他們聽 7 節的時候，是在聽教會會不會把門關上。不要在講台上講這類的笑話，不要用輕蔑的稱呼指任何群體，也不要說「所多瑪的罪只是不好客」來迴避。牧者可以讓他們知道：你可以來找我，我會為你保密（除非你的安全有危險），我會陪你走；「已經洗淨」是寫給真實的人的。若有人因此陷入羞愧、有傷害自己的念頭，要立刻陪他尋求專業的協助。"},{"id":"ISS01_6","t":"米迦勒與摩西的屍首——出自何處？信徒可以「斥責魔鬼」嗎？","r":"1:9--9；1:8；1:10；申 34:5--6；亞 3:2","ch":[1],"why":"9 節講了一件舊約沒有記載的事：天使長米迦勒為摩西的屍首與魔鬼爭辯。讀者自然會問：猶大從哪裡知道的？另一方面，今天不少聚會流行大聲「斥責魔鬼」的禱告，有人得了幫助，也有人被嚇著。連天使長都只說「主責備你吧」——這一句對我們的禱告和屬靈爭戰，到底有甚麼意思？","pos":[["【一】經文問的是甚麼","","<p>原文是 ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος。舊約只說摩西死在摩押地，神將他埋葬，「只是到今日沒有人知道他的墳墓」（申 34:6）；米迦勒則出現在但 10:13、12:1 與啟 12:7。米迦勒 οὐκ ἐτόλμησεν「不敢」用 κρίσιν ἐπενεγκεῖν βλασφημίας「毀謗的話罪責他」，只說 Ἐπιτιμήσαι σοι κύριος——祈願語氣，「願主責備你」。這使我們想起「撒但哪，耶和華責備你」（亞 3:2）。διακρινόμενος「爭辯」，與 22 節「存疑心」是同一個字。</p><p>經文問的是兩件事：這個故事出自哪裡？連天使長都不敢擅自宣判，那我們能不能、該不該「斥責魔鬼」？</p>"],["出處一：《摩西升天記》（早期教父的記載）","","<p>亞歷山大的革利免、俄利根等早期教父都說，這段故事出自一本稱為《摩西升天記》的猶太作品。今存的拉丁文殘本缺了結尾，看不到這一段；後來的文獻轉述了故事的輪廓：摩西死後，魔鬼要奪他的屍首，理由是摩西曾經殺過人，不配得光榮的埋葬；米迦勒不與他爭論，只把這事交給主。</p><p><strong>難處：</strong>今存本沒有這一段，我們無法逐字核對猶大引用的原文；故事的細節來自後人的轉述，各版本不完全一致。講台若把這些細節講得太滿，就是在替一本今天看不到的書說話。</p>"],["出處二：讀者熟知的口傳傳統","","<p>這一讀認為，這段故事在猶大時代的猶太群體裡廣為人知，猶大未必是從某一本書抄來，而是用讀者熟悉的傳統說明他的重點，就像講員引用一個大家都聽過的故事。猶大的重點也很清楚：爭辯的時候，連天使長都不擅自宣判。</p><p><strong>難處：</strong>早期教父明說它出自一本書；而無論是書或口傳，問題都一樣：猶大用了一個舊約以外的傳統。這一讀只是把問題換了一個說法，並沒有讓問題消失。</p>"],["斥責之一：奉主的名直接命令邪靈","","<p>主耶穌對試探他的說「撒但，退去吧」（太 4:10）；七十個人回來說「主啊！因你的名，就是鬼也服了我們」（路 10:17）；保羅「轉身對那鬼說：『我奉耶穌基督的名，吩咐你從她身上出來！』」（徒 16:18）；雅各也說「務要抵擋魔鬼，魔鬼就必離開你們逃跑了」（雅 4:7）。照這一讀，信徒奉主的名命令邪靈離開，是有根據的。</p><p><strong>難處：</strong>這些例子多半是趕鬼的具體場合，不是在日常禱告裡向魔鬼喊話的習慣；主同時說「不要因鬼服了你們就歡喜，要因你們的名記錄在天上歡喜」（路 10:20）。斥責若變成表演、口號或嘲弄，或者把一切難處都推給魔鬼，就離 9 節米迦勒的樣子很遠了。</p>"],["斥責之二：只向神求，不對魔鬼宣判","","<p>這一讀抓住 9 節的「不敢」：連天使長面對魔鬼都不擅自宣判，把審判交給主。照這一讀，信徒不必對魔鬼說話，只要向神禱告，求主親自責備他——這是 9 節最直接的榜樣，也最能避免禱告變成表演。</p><p><strong>難處：</strong>這一讀若推得太遠，會忽略新約確實給了門徒奉主名的權柄（路 10:19），也忽略了「抵擋」是命令（雅 4:7；彼前 5:9）。9 節不准的是用毀謗的話去宣判，不是說一切對邪惡的抵擋都不可以。</p>"],["【三】本講義站在哪裡","","<p><strong>出處：本講義採早期教父的記載（《摩西升天記》，今存本缺此段），並陳口傳說。</strong>受默示的是猶大書，不是被引用的書；引用一個傳統，不等於替整本書背書；講台也不從這一段建構天使學。本講義的全卷立場見議題「正典引用次經的原則：猶大引用《摩西升天記》與《以諾一書》，代表甚麼？」。</p><p><strong>斥責：抵擋魔鬼是命令，權柄在主的名，不在我們的音量；姿態是米迦勒的——不毀謗、不嘲弄、不表演，把審判交還給主。</strong>需要的時候可以奉主名命令，像門徒與保羅所行的（路 10:17；徒 16:18）；無論用哪一種方式，9 節那一句「主責備你吧」都是禱告的姿態：權柄與審判都在主。屬靈爭戰的大問題，本講義的全卷立場見議題「天使、魔鬼與屬靈爭戰：猶大書要我們怎樣看那看不見的世界？」。9 節同時也是 3 節「竭力爭辯」的示範：為真理站穩的人，可以把定罪的話留給神。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你不必知道故事的每個細節，也不必學會某一種禱告的音調，才算站在得勝的一邊。得勝不在你喊得多大聲，在那位「主」——米迦勒把事交給他，你也可以。</p><p>你若曾被大聲斥責的聚會嚇著，可以安心：猶大給你的榜樣正是安靜的那一句。你若習慣奉主名抵擋，也很好；只要記得，權柄是他的，榮耀也是他的（1:25）。</p>"]],"con":[],"say":"本講義的立場：9 節出處採早期教父所指的《摩西升天記》（今存本缺此段），並陳口傳傳統說；受默示的是猶大書，引用不等於背書，全卷立場見議題「正典引用次經的原則：猶大引用《摩西升天記》與《以諾一書》，代表甚麼？」。抵擋魔鬼是聖經的命令（雅 4:7），權柄在主的名；姿態照米迦勒——不毀謗、不表演，把審判交還給主。屬靈爭戰的全卷立場見議題「天使、魔鬼與屬靈爭戰：猶大書要我們怎樣看那看不見的世界？」。","care":"會眾席上有人曾被大聲「斥責魔鬼」的聚會嚇著，從此不敢去禱告會；也有人把自己的憂鬱、病痛、家庭衝突一律歸給魔鬼，延誤了就醫和該有的和好；還有人把屬靈爭戰當成笑話。不要在講台上表演斥責，也不要拿魔鬼開玩笑。牧者可以陪那位害怕的人安靜地禱告「主責備你吧」；陪那位甚麼都歸給魔鬼的人，同時禱告、也去看醫生、也去面對該面對的人——這些都不衝突。"},{"id":"ISS01_7","t":"猶大引用《以諾一書》，代表甚麼？","r":"1:14--15；1:9；創 5:21--24；徒 17:28；多 1:12","ch":[1],"why":"14--15 節猶大引了「亞當的七世孫以諾」的預言，這段話在舊約裡找不到，卻幾乎逐字見於《以諾一書》1:9。早期教會有人因此遲疑要不要接納猶大書，也有人反過來因此把《以諾一書》當成聖經；今天網路上更有人說「教會把以諾書藏起來了」。這一題關係到正典、默示，也關係到我們怎樣讀古代的文獻——要誠實地講清楚。","pos":[["【一】經文問的是甚麼","","<p>原文是 Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ——猶大用「預言」這個動詞介紹以諾的話。引文說：「看哪，主帶著他的千萬聖者降臨，要在眾人身上行審判」（1:14--15）。這段話與《以諾一書》1:9 幾乎一樣。《以諾一書》是第二聖殿時期的猶太作品，各部分大約寫於主前三世紀到主後一世紀之間（引文所在的開頭部分屬於最早的一批）；完整的本子保存在古衣索比亞文裡，死海古卷中也發現了亞蘭文殘卷。「七世孫」是照創 5 章的家譜，從亞當算起；聖經記載以諾與神同行，神將他取去（創 5:24）。</p><p>經文問的是：猶大稱這段話為「預言」，是不是表示他認為《以諾一書》是聖經？</p>"],["正典說（猶大承認這本書受默示）","","<p>這一讀認為：猶大既稱之為預言，就是承認《以諾一書》是受默示的書。早期教會確實有人這樣看——特土良主張接納這本書，理由之一正是猶大引用了它；今天衣索比亞正教會的舊約正典也收了《以諾一書》。這是一個古老教會傳統的真實選擇，講台應當照實介紹，不必嘲笑。</p><p><strong>難處：</strong>除了衣索比亞教會之外，猶太人的正典與歷代大多數教會的正典都沒有收這本書；連猶大書本身也因為引用它，在早期一度被人遲疑。而且「預言」這個字可以只指這一句話的內容——對將來審判的預告——不必涵蓋全書。</p>"],["例證說（引用讀者熟悉的作品）","","<p>這一讀認為：猶大引用一本讀者熟悉的作品作例證，就像講員引用一句大家都知道的話；他是借讀者熟悉的話來說明「這些人」的結局，不是在對這本書的地位表態。5--16 節整段都是「例子—『這些人』—解釋」的寫法，以諾的話是其中一個例子。</p><p><strong>難處：</strong>猶大不只是引用，而是說以諾「曾預言」，這比單純借用更重；完全說成「只是借來用用」，也低估了猶大對這句話內容的肯定。</p>"],["真話說（這一句是真的，不等於整本書受默示）","","<p>這一讀認為：猶大肯定的是這一句話的內容是真的——主必帶著千萬聖者來審判不敬虔的人，這與舊約的審判主題一致（申 33:2 說耶和華「從萬萬聖者中來臨」；亞 14:5）。肯定一句話是真的，不等於肯定整本書受默示。保羅在雅典引希臘詩人「我們也是他所生的」（徒 17:28），在提多書引克里特人自己的「本地先知」，還說「這個見證是真的」（多 1:13）——保羅並沒有因此把那些詩人的作品收進聖經。</p><p><strong>難處：</strong>讀者仍會追問：那句話是真的，那本書其他部分呢？答案需要一段一段去分辨，不能一句話打發；這一讀要求講的人對古代文獻有基本的認識與誠實。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義三讀並陳，採真話說，兼取例證說：受默示的是猶大書，不是被引用的書；引用一句真話，不等於替整本書背書。</strong>本講義的全卷立場見議題「正典引用次經的原則：猶大引用《摩西升天記》與《以諾一書》，代表甚麼？」。講台照實介紹衣索比亞教會的正典，不嘲笑；不從《以諾一書》建構天使的名字、末世的時間表；也不因為猶大引用了它，就貶低猶大書——教會早期雖有遲疑，最後仍普遍接納猶大書為正典（全卷立場見議題「作者、收信人與正典地位：『雅各的弟兄猶大』是誰？這封信怎樣被接納為正典？」）。</p><p>以諾這段話在猶大書裡的作用很單純：主必來審判，審判是全面的。SBLGNT 原文一節之內四次「不敬虔」，要讀者看清那條路的終點。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。神的話借用人的話，並不稀奇：保羅引過希臘詩人，猶大引過讀者熟悉的作品；默示保證的，是聖經作者寫下的話真實可靠，不是他所引用的每一本書都同等權威。教會沒有藏起甚麼，這些書今天任何人都讀得到。</p><p>以諾是「與神同行」的人；猶大引他的話，是要讀者看見審判，更要讀者回頭與神同行——這是比一切考據更重要的落點。</p>"]],"con":[],"say":"本講義的立場：14--15 節引《以諾一書》1:9；三讀並陳（正典說／例證說／真話說），採真話說——受默示的是猶大書，引用一句真話不等於替整本書背書（徒 17:28；多 1:12）；照實介紹衣索比亞教會的正典，不從次經建構天使學，也不以此貶低猶大書。本講義的全卷立場見議題「正典引用次經的原則：猶大引用《摩西升天記》與《以諾一書》，代表甚麼？」。","care":"有好奇的年輕人會自己上網讀《以諾一書》，然後帶著一堆巨人、天使名字、曆法計算的問題回來；也有人聽說「聖經引用次經」，就覺得信仰的地基鬆動了。不要在講台上嘲笑讀次經的人，也不要把次經講成禁書；不要說「教會隱瞞」，也不要假裝沒有這回事。牧者可以陪那位好奇的人一起讀，教他分辨引文與全書、真話與默示；陪那位不安的人看見：聖經經得起這樣的查考。"},{"id":"ISS01_8","t":"「在聖靈裡禱告」是指說方言嗎？","r":"1:20--20；1:19；林前 14:14--15；弗 6:18；羅 8:26","ch":[1],"why":"20 節「在聖靈裡禱告」是猶大四個動作中的一個。在華人教會裡，方言是一個容易分裂的題目：有的教會把說方言看作被聖靈充滿的記號，有的教會對方言避之唯恐不及；「在聖靈裡禱告」這幾個字，兩邊都會拿來用。講台若定義錯了，會讓一部分會眾覺得自己不夠屬靈，或讓另一部分會眾覺得自己的經歷被否定。","pos":[["【一】經文問的是甚麼","","<p>原文是 ἐν πνεύματι ἁγίῳ προσευχόμενοι，分詞，與「造就」「仰望」一起說明怎樣「保守自己常在神的愛中」（1:21）。它刻意對照 19 節：那些自以為屬靈、引人結黨的人，是 πνεῦμα μὴ ἔχοντες——「沒有聖靈的人」（1:19）；你們卻要在聖靈裡禱告。分水嶺不是口才、異夢或任何一種外顯的經歷，是有沒有聖靈。</p><p>經文問的是：「在聖靈裡」是指一種特定的禱告方式（方言），還是指一切靠聖靈、被聖靈引導、與聖靈同工的禱告？</p>"],["包括方言禱告說","","<p>保羅說「我若用方言禱告，是我的靈禱告」（林前 14:14），又說「我要用靈禱告，也要用悟性禱告」（林前 14:15）；「說方言的，是造就自己」（林前 14:4），而猶大 20 節正好把「造就自己」與「在聖靈裡禱告」並排。照這一讀，猶大說的在聖靈裡禱告，至少包括方言的禱告。保羅自己「說方言比你們眾人還多」（林前 14:18），也吩咐「不要禁止說方言」（林前 14:39）。</p><p><strong>難處：</strong>猶大書全卷沒有提到方言，我們也不知道猶大的讀者是否普遍說方言。保羅又問「豈都是說方言的嗎？」（林前 12:30），答案是否定的；若把 20 節限定為方言，就把許多信徒排在這個命令之外，與 20 節是對全體「親愛的」說的不合。</p>"],["一切靠聖靈的禱告說","","<p>保羅說「靠著聖靈，隨時多方禱告祈求」（弗 6:18）；又說「我們本不曉得當怎樣禱告，只是聖靈親自用說不出來的歎息替我們禱告」（羅 8:26）；聖靈在我們心裡「呼叫：『阿爸！父！』」（加 4:6）。照這一讀，「在聖靈裡禱告」是被聖靈引導、靠聖靈的能力、照神的心意禱告——用悟性的禱告、用方言的禱告，都可以在其中。</p><p><strong>難處：</strong>這一讀若講得太寬，「在聖靈裡」可能變成一個空泛的形容詞，好像只要禱告就自動算數；也可能被人拿來暗中淡化方言，好像方言是可有可無、甚至可疑的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義兩讀並陳，不定義、不裁判。</strong>可以確定的是：20 節是對全體讀者說的，不說方言的信徒，同樣蒙召在聖靈裡禱告；說方言的信徒，也不必因為這一節被看成次等或可疑。講台不把「在聖靈裡禱告」定義成必須說方言，也不貶抑方言。</p><p>猶大的重點在對照：19 節那些人「沒有聖靈」，所以他們的屬靈是自己撐出來的；你們卻要在聖靈裡禱告，承認自己不曉得當怎樣禱告，讓聖靈帶著你禱告。落點是一個靠聖靈禱告的生活：造就、禱告、保守、仰望，一起構成「常在神的愛中」的日子。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你若不說方言，你的禱告不是次等的禱告；聖靈「親自用說不出來的歎息」替你禱告，正是在你最說不出話的時候。你若說方言，也不必隱藏或羞愧；保羅感謝神賜他這恩賜。</p><p>無論哪一種，猶大要你問的不是「我用甚麼方式禱告」，而是「我是不是靠著聖靈、帶著仰望的心禱告」。這一問，所有人都可以每天回答。</p>"]],"con":[],"say":"本講義的立場：20 節「在聖靈裡禱告」兩讀並陳——包括說方言的禱告（林前 14:14--15）／一切靠聖靈引導、與聖靈同工的禱告（弗 6:18；羅 8:26）；不定義成必須說方言，也不貶抑方言；落點在靠聖靈禱告的生活，對照 19 節「沒有聖靈的人」。","care":"會眾席上可能有人被告知「不會說方言，就是還沒有被聖靈充滿」，從此在禱告會上抬不起頭；也有人在別的教會說方言被當成異類，來到這裡不敢提起。不要在講台上用自己教會的習慣替 20 節下定義，也不要拿任何一方的經歷開玩笑。牧者可以陪那位自覺次等的人一起讀羅 8:26，陪那位受過排斥的人讀林前 14:39；讓兩種人都知道，在這裡可以一起禱告。"},{"id":"ISS01_9","t":"22--23 節是兩種人還是三種人？怎樣對待存疑心的人？","r":"1:22--23；1:9；1:2；1:21；約 7:5；雅 1:6","ch":[1],"why":"這兩節是猶大書最溫柔的地方，也是全卷抄本最紛亂的地方：有的抄本讀出三種人，有的讀出兩種人，有的把「憐憫」換成「駁正」。這不只是學術問題——它決定小組裡那個滿腹疑問的年輕人，在教會眼中是「要憐憫的人」，還是「要駁倒的人」。而寫這兩節的猶大，自己曾經不信他的哥哥。","pos":[["【一】經文問的是甚麼","","<p>SBLGNT 作三組：καὶ οὓς μὲν ἐλεᾶτε διακρινομένους, οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ——和合本照這個讀法譯成「有些人存疑心，你們要憐憫他們；有些人你們要從火中搶出來，搭救他們；有些人你們要存懼怕的心憐憫他們」（1:22--23）。διακρινομένους「存疑心」，與 9 節米迦勒 διακρινόμενος「爭辯」是同一個字：一個在外面與魔鬼爭辯，一個在心裡自己和自己爭辯。</p><p>經文問的是：猶大說的是兩種人還是三種人？「存疑心」是甚麼？對這樣的人，教會的第一個動作應該是甚麼？</p>"],["三組說（SBLGNT、NA28；和合本）","","<p>三種人，三種救法：存疑心的，憐憫他們；已經在火邊的，把他們搶出來；陷得很深的，存懼怕的心憐憫，連那被情慾沾染的衣服也當厭惡。支持的理由是：「有些……有些……有些」的結構整齊；猶大本來就喜歡三個一組（1 節三個稱呼、2 節三樣祝福、11 節三條路）。三種人的分別，也合乎牧養的實情：每一個人需要的救法不一樣。</p><p><strong>難處：</strong>這兩節的抄本傳統非常紛亂，三組讀法並不是壓倒性的；「憐憫」出現兩次，也讓有些學者懷疑是抄寫時重複造成的。</p>"],["兩組說（WH、RP）","","<p>WH 與 RP 都只讀出兩組人，最早的蒲草紙抄本 P72 也是兩組。RP 作 διακρινόμενοι，是主格，指讀者自己：「有些人你們要憐憫，要分辨著對待；有些人要存懼怕的心搭救，從火中搶出來」——早期的英文欽定本就是照這一讀。照這一讀，這個字不是說那些人在疑惑，而是要讀者有分辨。</p><p><strong>難處：</strong>兩組讀法本身也有好幾種形式，彼此並不一致；而且把這個字讀成「你們要分辨」，就失去了與 9 節米迦勒「爭辯」同字的那條線，也讓 22 節不再特別提到心裡有疑問的人。</p>"],["駁正說（Treg 作 ἐλέγχετε）","","<p>Treg 等讀法在 22 節作 ἐλέγχετε「駁正、指正」，與 15 節 ἐλέγξαι「證實」同一個動詞：「有些存疑心的人，你們要駁正他們」。照這一讀，對第一種人要的是說理、指出錯處；διακρινομένους 也可以解作「與你們爭辯的人」。</p><p><strong>難處：</strong>抄寫者較可能把重複出現的「憐憫」改成別的動詞，而不是反過來；而且「駁正」放在全卷「憐憫」這條線上（2、21、22、23 節）顯得突兀。即使採這一讀，說理也不是羞辱：主的僕人要「用溫柔勸戒那抵擋的人」（提後 2:25）。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採三組（照 SBLGNT 與和合本），並陳兩組與駁正兩種讀法。存疑心不等於背道；22 節的第一個動詞是「憐憫」。</strong>διακρινομένους 是心裡在爭辯、在搖擺——雅各說「那疑惑的人」（雅 1:6）用的也是這個字。對與魔鬼爭辯的米迦勒，猶大說把審判交給主；對心裡在爭辯的信徒，猶大說憐憫他。</p><p>寫這句話的人，自己曾經不信：「因為連他的弟兄說這話，是因為不信他」（約 7:5）。門徒見了復活的主，「然而還有人疑惑」（太 28:17）；一位父親喊著說「我信！但我信不足，求主幫助」（可 9:24）——主沒有趕走他們。有疑問的人是要憐憫、要陪伴的人，本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」；怎樣爭辯而不好爭競，見議題「為真道爭辯而不好爭競：『竭力地爭辯』是甚麼樣的爭？」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該——除非是讓你更敢問。你心裡若正在爭辯，猶大沒有叫教會把你趕出去，他叫教會憐憫你。憐憫不是不理你的問題，是陪著你、不急著給你貼標籤，和你一起回到那位「能保守你們不失腳」的神面前（1:24）。</p><p>你若是那個去搶救人的人，23 節也提醒你：搶救的時候要存懼怕的心，自己也要小心，「恐怕也被引誘」（加 6:1）。愛人而恨罪，救人而自守；因為你自己也是從火中被抓出來的。</p>"]],"con":[],"say":"本講義的立場：22--23 節採三組（SBLGNT、和合本），並陳兩組（WH、RP）與 Treg 的「駁正」讀法；διακρινομένους 與 9 節同字，存疑心不等於背道，第一個動詞是「憐憫」；寫這句話的猶大自己曾經不信（約 7:5）。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上、小組裡，總有滿腹疑問的年輕人，也有信主多年、心裡卻悄悄起了疑惑的長輩；他們最怕的是一開口就被貼上「信心不夠」「受了世界影響」的標籤。不要在講台上把疑問說成背道，也不要用「你就是不夠屬靈」堵住任何人的嘴。牧者可以說：「問吧，我們一起找答案。」一位有很多問題的年輕人聽完這兩節，要更敢問；一位去陪伴的人聽完，要更溫柔，也更謹慎地保守自己。"}],"terrain":{"points":[[0.52,86,1,"為耶穌基督保守的人","top"],[0.6,70,3,"竭力地爭辯",null],[0.64,18,4,"有些人偷著進來","bot"],[0.72,12,6,"不守本位、離開自己住處的天使","bot"],[0.84,58,9,"主責備你吧",null],[0.92,10,11,"走了該隱的道路","bot"],[1.0,4,13,"有墨黑的幽暗為他們永遠存留","bot"],[1.16,48,17,"要記念我們主耶穌基督之使徒從前所說的話",null],[1.32,90,21,"保守自己常在神的愛中","top"],[1.4,78,23,"從火中搶出來",null],[1.44,99,24,"那能保守你們不失腳","top"]]},"tracks":[{"gk":"τηρέω／φυλάσσω","tr":"tēreō / phylassō","gl":"保守、守、拘留、存留","code":"G5083","root":"τηρέω——看守、保守、持守、存留；φυλάσσω——看守、護衛。和合本把 τηρέω 譯成「保守」「守」「拘留」「存留」四個詞，原文是同一個字，全卷出現五次，再加上 24 節的 φυλάσσω。這是猶大書的珍珠：誰守住誰，是全卷的一條線","ins":"第一站，信一開頭就說我們是誰：「為耶穌基督保守的人」（1:1）——τετηρημένοις 是完成式被動分詞：在我們想守住甚麼以前，我們已經被守住了，而且一直被守著。第二站是反面：天使「不守本位」（1:6，μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχήν）——同一個字，他們不肯守住神分派給他們的位置。第三站是第一個翻轉：不肯守本位的，反被神「拘留」（1:6，τετήρηκεν）——不守自己位置的，最後被鎖鍊守住；第四站把這個結局說盡：「有墨黑的幽暗為他們永遠存留」（1:13，τετήρηται）。第五站，鏡頭轉回我們：「保守自己常在神的愛中」（1:21，τηρήσατε）——這是全卷唯一一個叫我們去守的命令，而我們要守的不是一套規矩，是神的愛這個「位置」。第六站是第二個翻轉，也是全卷的終點：「那能保守你們不失腳」（1:24，φυλάξαι）——最後守住我們的，還是他。從被保守開始，到被保守結束；中間那一句「保守自己」，是住在一雙已經抓住你的手裡。","stops":[["1:1","為耶穌基督保守的人","top"],["1:6","又有不守本位、離開自己住處的天使",""],["1:6","主用鎖鍊把他們永遠拘留在黑暗裡",""],["1:13","有墨黑的幽暗為他們永遠存留",""],["1:21","保守自己常在神的愛中","top"],["1:24","那能保守你們不失腳","top"]]},{"gk":"ἀσεβής／ἀσέβεια／ἀσεβέω","tr":"asebēs / asebeia / asebeō","gl":"不虔誠、不敬虔","code":"G765","root":"ἀσεβής——不敬虔的、沒有敬畏的；字根 σέβομαι 是「敬拜、敬畏」，加上否定的 ἀ-。這個字族在全卷出現六次，其中四次擠在 15 節一節之內。猶大書描寫「這些人」用了許多畫面，一言以蔽之：沒有敬畏","ins":"第一站是診斷：偷著進來的人「是不虔誠的」（1:4）——在描寫他們做了甚麼以前，猶大先說他們缺了甚麼：對神沒有敬畏。第二站，以諾的預言把這個字一口氣用了三次：「證實那一切不敬虔的人所妄行一切不敬虔的事」（1:15）——人是不敬虔的、事是不敬虔的、連「妄行」原文也是 ἠσέβησαν，「行得不敬虔」。第三站落在口上：「又證實不敬虔之罪人所說頂撞他的剛愎話」（1:15）——不敬虔不只表現在行為，也表現在嘴巴：頂撞神的剛愎話（這使我們想起 16 節的怨言與誇大的話）。第四站把它帶到末世：「隨從自己不敬虔的私慾而行」（1:18）——沒有敬畏的人，最後的主人是自己的私慾。這條線是 4.7 的反面鏡子：敬虔不是一套外在的規矩，是對神的敬畏；猶大書所有黑暗的畫面，都從「不敬畏神」這一個根長出來。","stops":[["1:4","是不虔誠的",""],["1:15","證實那一切不敬虔的人所妄行一切不敬虔的事","top"],["1:15","又證實不敬虔之罪人所說頂撞他的剛愎話",""],["1:18","隨從自己不敬虔的私慾而行",""]]},{"gk":"ἔλεος／ἐλεάω","tr":"eleos / eleaō","gl":"憐恤、憐憫","code":"G1656","root":"ἔλεος——憐憫、憐恤，向著困苦的人動了心、伸出手；ἐλεάω 是它的動詞。全卷四次：前兩次是我們領受的，後兩次是我們給出去的","ins":"第一站在問安裡：「願憐恤、平安、慈愛多多地加給你們」（1:2）——猶大的問安以「憐恤」打頭，這在新約書信的問安裡並不常見；他要寫一封最嚴厲的信，先求神把憐恤「多多地」加給讀信的人。第二站是等候：「仰望我們主耶穌基督的憐憫，直到永生」（1:21）——連守住自己在神的愛中的人，也不是靠自己站到最後，而是仰望憐憫。第三站是第一個翻轉：「有些人存疑心，你們要憐憫他們」（1:22）——領受憐憫的人，現在成為給出憐憫的人；面對心裡正在掙扎的人，第一個動詞不是駁斥，是憐憫。第四站加上分寸：「有些人你們要存懼怕的心憐憫他們」（1:23）——憐憫不是天真，救人的時候也要提防自己被拖下去。從領受、等候、給出，到有分寸地給出：一個知道自己活在憐憫裡的人，才給得出憐憫。寫這句話的猶大，自己曾經不信他的哥哥（這使我們想起約 7:5）。","stops":[["1:2","願憐恤、平安、慈愛多多地加給你們",""],["1:21","仰望我們主耶穌基督的憐憫，直到永生","top"],["1:22","有些人存疑心，你們要憐憫他們","top"],["1:23","有些人你們要存懼怕的心憐憫他們",""]]},{"gk":"ἀγαπητός／ἀγάπη ↔ οὗτοι","tr":"agapētos / agapē ↔ houtoi","gl":"親愛的、愛 ↔ 這些人","code":"G27","root":"ἀγαπητοί——蒙愛的、親愛的，猶大稱呼讀者的話；ἀγάπη——愛，也指早期教會的愛筵。另一邊是 οὗτοι——「這些人」，全卷六次。兩組人在信裡交替出現：猶大寫「這些人」時是冷的，寫「親愛的」時是熱的","ins":"第一站，讀者是「在父神裡蒙愛」的人（1:1）——身分先從愛說起。第二站，猶大叫他們「親愛的弟兄啊」（1:3），然後說他不得不寫一封爭辯的信：嚴厲的話是包在愛的稱呼裡說的。第三站，另一組人出場：「這些做夢的人」（1:8）——從 8 節到 19 節，「這些人」像一聲聲鐘響，一再敲下去。第四站，兩組人坐在同一張桌子上：「這樣的人在你們的愛席上」（1:12）——愛筵本來是弟兄姊妹彼此相愛的地方，礁石卻藏在那裡。第五站是「這些人」最後一次出現：「這就是那些引人結黨、屬乎血氣、沒有聖靈的人」（1:19）。第六站是全卷的轉折：「親愛的弟兄啊，你們卻要……」（1:20，Ὑμεῖς δέ, ἀγαπητοί）——鏡頭從「這些人」轉回「你們」；猶大用十二節描寫別人，只用兩節告訴我們怎麼辦。第七站是那個「位置」：「常在神的愛中」（1:21）。蒙愛的人被稱為親愛的，最後被叫去住在神的愛裡——對付錯謬最好的辦法，不是研究錯謬，是常在神的愛中。","stops":[["1:1","在父神裡蒙愛",""],["1:3","親愛的弟兄啊",""],["1:8","這些做夢的人",""],["1:12","這樣的人在你們的愛席上",""],["1:19","這就是那些引人結黨、屬乎血氣、沒有聖靈的人",""],["1:20","親愛的弟兄啊，你們卻要在至聖的真道上造就自己","top"],["1:21","常在神的愛中","top"]]}],"lesson":{"1":{"no":1,"vol":"《321猶大書講義》第一課·猶大書第一章","title":"那能保守你們不失腳——爭辯、鑑戒、保守","chars":5222,"min":60,"deep":8,"dchars":1740,"tchars":1399,"blocks":[["h","一、停在半空的那一秒"],["p","弟兄姊妹平安。請你和我一起把一個畫面停住。吉隆坡一間室內攀岩館，星期六下午四點。四十六歲的建明弟兄，爬到離地大約七公尺的地方，右腳踩在一塊只有兩根手指寬的突起上。他往上伸手，差了一點點；腳下一滑，整個人離開了岩壁。請把畫面定格在這一秒：他沒有掉下去。他吊在半空，繩子繃得筆直，臉朝著地面。"],["p","地面上站著國良，同一個小組的弟兄，今天替他確保。繩子從建明腰上的繩結往上穿過頂端的鐵環，再垂下來，進到國良手裡的確保器。從建明一離地，國良的手就沒有離開過繩子，眼睛也沒有離開過他。腳一滑，他身體往後一坐，繩子就鎖住了。建明事後說：那一下我甚麼都來不及做，等我回過神，已經掛在繩子上了。"],["p","新約有一封信，最後就停在這一秒：「那能保守你們不失腳、叫你們無瑕無疵、歡歡喜喜站在他榮耀之前的我們的救主－獨一的神」（1:24）。不失腳，原文 ἀπταίστους（aptaistous），整本新約只出現這一次，原是說馬不失蹄、人走路不絆倒。奇怪的是，這封信前面二十三節幾乎都在講跌倒：倒在曠野的人、離開本位的天使、所多瑪、該隱、巴蘭、可拉，一路跌進墨黑的幽暗。為甚麼一封寫滿跌倒的信，最後一句是不失腳？"],["p","這封信就是猶大書，一章，二十五節，寫信的猶大，教會傳統認為就是主耶穌的弟弟。這一課我們用三個詞把它走一遍：爭辯、鑑戒、保守。最後回到這條繩子：到底是誰的手，一直扣著我們。"],["d",["「不失腳」是不是表示真基督徒從此不會跌倒、不會再犯罪？","不是。ἀπταίστους 是不被絆倒而摔下去，重點在被保守到底。猶大的哥哥雅各就寫過：「我們在許多事上都有過失」（雅 3:2），原文正是同一個字根 πταίω。詩篇也說：「他必不叫你的腳搖動；保護你的必不打盹！」（詩 121:3）確保的人不打盹。所以 24 節不是完美紀錄的保證書，是一條繩子的應許：腳會離開岩點，人卻不會墜落到底。這不是放縱的理由，也不必因此害怕：靠的是祂的能力，不是你的完美。滑了，就認罪，回到繩子上再往上爬。"]],["h","二、爭辯：先被扣住的人，才爭得乾淨"],["p","「耶穌基督的僕人，雅各的弟兄猶大，寫信給那被召、在父神裡蒙愛、為耶穌基督保守的人。」（1:1）對雅各，猶大說弟兄；對耶穌，他不提血緣，只說僕人，原文 δοῦλος（doulos），屬於主人的人。他怎樣稱呼讀信的人？蒙召、在父裡蒙愛、為基督被保守，三個詞的主詞都不是讀者，是神。「保守」原文 τετηρημένοις（tetērēmenois）是完成式被動，守的動作已經做成，效力一直延續到今天。就像國良的手，在建明還沒有滑以前就扣在繩子上了。接著的祝福，「願憐恤、平安、慈愛多多地加給你們」（1:2），把憐恤放在第一位。"],["p","「親愛的弟兄啊，我想盡心寫信給你們，論我們同得救恩的時候，就不得不寫信勸你們，要為從前一次交付聖徒的真道竭力地爭辯。」（1:3）一封信被迫改了題目。竭力地爭辯，原文 ἐπαγωνίζεσθαι（epagōnizesthai），新約只用這一次，字根 ἀγών（agōn）是競技場、摔角場，是摔角手為了那頂冠冕拼上一身力氣，跟吵架是兩回事。爭的是那一次交付的真道，不是對手這個人，也不是我的面子或宗派特色；方式猶大自己示範了：9 節米迦勒只說主責備你吧，22 節對存疑心的人先憐憫。一次交付的一次，原文 ἅπαξ（hapax），是一次而永遠：福音的核心已經完整交付，不需要誰再補一頁新啟示。"],["p","是甚麼逼他改題目？「因為有些人偷著進來」（1:4）。原文 παρεισέδυσαν（pareisedysan），字面是從旁邊潛進來：他們沒有走正門，已經坐在愛筵的桌邊。猶大不開名單，只列出兩個記號：「將我們神的恩變作放縱情慾的機會，並且不認獨一的主宰－我們主耶穌基督」（1:4）。恩典被改成安心犯罪的許可證。主宰原文 δεσπότης（despotēs），正好和 1 節的 δοῦλος 對著：寫信的人甘心作奴僕，這些人卻不認那位主人，常常是用行為否認。記號不是名單，先拿來照自己：這個禮拜，我的行事曆是誰在安排？"],["p","「就是自古被定受刑罰的」（1:4）這一句，最容易讀出恐懼。προγεγραμμένοι（progegrammenoi）字面是預先寫下，和羅 15:4 從前所寫的同一個字：這條路的結局，經上早就寫明了。寫明的是路的盡頭，沒有寫上你的名字。若你心裡一緊，怕自己就在那張紙上，請看這條繩子的兩頭：開頭，你是為耶穌基督保守的人（1:1）；結尾，祂是那能保守你們不失腳的（1:24）。"],["d",["「自古被定受刑罰的」是不是說有些人生來就注定沉淪？我會不會是其中一個？","原文 προγεγραμμένοι 是預先寫下，在新約裡不是預定的術語。多數解經家讀作：舊約的例子和以諾的預言，早已把這一類人的結局寫下來；猶大接著在 5 到 16 節列出的，正是那些寫下的例子。也有人讀成永恆裡的預定，本講義並陳，但取早已寫下的讀法：寫明的是路的盡頭，不是名冊；猶大沒有對任何讀者宣判，講台與小組也不可以。若你為這個問題睡不著，請記得信的頭尾：你是為耶穌基督保守的人，祂是那能保守你們不失腳的。把這份不安帶到主面前，也帶給一位信得過的牧者。"]],["d",["「一次交付」是不是表示一切新的解釋、新的詩歌、新的聚會方式都不可以？","不是。ἅπαξ 是一次而永遠，說的是福音的核心已經完整交到聖徒手裡：基督是誰，祂為我們成就了甚麼，人怎樣因信靠祂得救。猶大要擋的，是第八節那些做夢的人，想用異夢改寫使徒的福音。這不等於每一個宗派特色、每一種解經細節、每一種聚會形式，都等於那一次交付的真道。一次交付守的是內容，不是工具；線上聚會、新的譯本、新的詩歌，本身都不是偷著進來的。要問的是：它所傳的是不是那位獨一的主宰？它把恩典當成救人脫離罪的力量，還是安心犯罪的許可證？"]],["h","三、鑑戒：照片先照自己，再看路的盡頭"],["p","「這一切的事，你們雖然都知道，我卻仍要提醒你們。」（1:5）猶大擺出三張照片。第一張：主救了百姓出埃及，後來那些不信的倒在曠野（有古老抄本讀作耶穌，見議題頁）；拍的是蒙救的人，所以先照自己。第二張：「又有不守本位、離開自己住處的天使，主用鎖鍊把他們永遠拘留在黑暗裡，等候大日的審判。」（1:6）天使的身分，解經家有三種讀法，議題頁並陳；這一節自己要說的很清楚：本位原文 ἀρχή（archē），是神分派的崗位，連天使擅離崗位，審判也是確定的。6 節的意思到這裡講完；這使我們想起 321 說的：驕傲是離開本位抓住權力。"],["p","第三張是所多瑪和蛾摩拉。和合本的逆性的情慾，字面是去追隨別的肉體，有人讀作同性的性行為，有人讀作人與天使的越界，也有人說兩者都在內：越過神為性所定的界限。神為性所定的界限，我們持守，也不跳過這一節；可是以西結列所多瑪的罪，頭一項並不是性：「心驕氣傲，糧食飽足，大享安逸，並沒有扶助困苦和窮乏人的手」（結 16:49）。這一節從來不是拿來嘲笑人的。保羅在林前 6 章列完一張罪的清單，下一句是：「你們中間也有人從前是這樣；但如今你們……已經洗淨」（林前 6:11）。若你正在性的試探裡掙扎，心裡卻想跟隨主，這句話是寫給你的：照片後面有一條回家的路。"],["p","「這些做夢的人也像他們污穢身體，輕慢主治的，毀謗在尊位的。」（1:8）也像他們，照片成了鏡子。主治的多數解作主的權柄，在尊位的多數解作天使；這一句不能拿來堵住對領袖正當的提問。接著是全卷最安靜的一幕：「天使長米迦勒為摩西的屍首與魔鬼爭辯的時候，尚且不敢用毀謗的話罪責他，只說：『主責備你吧！』」（1:9）早期教父說這段出自《摩西升天記》；受默示的是猶大書，引一段傳統，不表示那本書也是聖經。天使長沒有替神宣判；這些人卻「毀謗他們所不知道的」（1:10）。"],["p","然後是三條路：「走了該隱的道路，又為利往巴蘭的錯謬裡直奔，並在可拉的背叛中滅亡了。」（1:11）一條傷弟兄，一條貪錢財，一條奪位置；可拉不甘心只作利未人，要奪祭司的職分。再來是五幅畫：愛席上的礁石，中間夾一句只知餵養自己的牧人，然後是無雨的雲、無果的樹、狂浪，最後是「流蕩的星，有墨黑的幽暗為他們永遠存留」（1:13）。都是應許了卻給不出來。存留，原文又是 τηρέω（tēreō）。"],["p","以諾那段話今天見於《以諾一書》，猶大取的是這句話的內容：「看哪，主帶著他的千萬聖者降臨」（1:14）。主必再來，日子不由我們推算。15 節原文連說四個不敬虔，又連說四個一切，沒有一件會漏掉。16 節的常發怨言，原文 μεμψίμοιροι（mempsimoiroi），字面是對自己那一份命運嘀咕不滿。照片看完，先問自己：神分給我的那一份，我私下抱怨過嗎？"],["d",["我正在性的試探裡掙扎，讀到所多瑪那一節，我還能留在教會嗎？","能，而且教會正是你該在的地方。第七節所說神為性所定的界限，我們持守，這一點不因時代改變；可是同一位神，也透過保羅說：「你們中間也有人從前是這樣；但如今你們奉主耶穌基督的名，並藉著我們神的靈，已經洗淨，成聖，稱義了。」（林前 6:11）掙扎不是被趕出去的理由，是需要被陪伴的理由；被試探本身不是罪，主耶穌也「凡事受過試探，與我們一樣，只是他沒有犯罪」（來 4:15）；所多瑪的罪還有心驕氣傲、不扶助窮乏人，這張照片照的是每一個人。具體可以這樣做：找一位信得過、口風緊的同性別牧者或長輩，私下說出掙扎，一起禱告；若牽涉過去的傷害或成癮，請他陪你尋求專業協助。任何人若因此羞辱你，那不是這封信的意思。"]],["d",["我對教會的帳目和決策有疑問，提出來算不算「輕慢主治的，毀謗在尊位的」？","不算。主治的，原文 κυριότης，多數解作主的權柄，也有人解作天上的權勢；在尊位的，原文 δόξας，多數解作天使、榮耀的屬靈存在。這一句說的是主與天上的事，不是今天某一位領袖的職位；同一封信第十二節定罪的，正是只知餵養自己的牧人（這使我們想起結 34:2）。按著次序、帶著尊重提出疑問，是保護羊群，不是毀謗。具體可以這樣做：先帶著禱告，私下向負責的同工或長執會提出；不在群組公開指控，不散布未經查證的消息。若正常管道被堵住，或牽涉傷害人，請找教會以外可信任的屬靈長輩或機構協助；涉及違法的，依法處理。"]],["h","四、原文亮光：一個守字、一個爭字、一雙不失的腳"],["p","猶大抬起頭：「親愛的弟兄啊，你們要記念我們主耶穌基督之使徒從前所說的話。」（1:17）他把讀者帶回使徒的教訓，沒有把他們帶到自己身上。19 節是這些人最後一次出現：「這就是那些引人結黨、屬乎血氣、沒有聖靈的人。」（1:19）結黨原文 ἀποδιορίζοντες（apodiorizontes），是在群體裡畫線，把人分出上下。然後鏡頭轉過來：「親愛的弟兄啊，你們卻要在至聖的真道上造就自己，在聖靈裡禱告，」（1:20）描寫黑暗用了十幾節，該怎麼辦只用兩節。請和我一起拆三個原文。"],["p","第一個字：τηρέω（tēreō），守。和合本用了四個詞翻它，原文是同一個字。1 節，我們被保守；6 節，天使不守本位；同一節，神就把他們拘留；13 節，幽暗為流蕩的星存留；21 節，「保守自己常在神的愛中，仰望我們主耶穌基督的憐憫，直到永生」（1:21）。整封信只有這一處，守是命令讀者去做的；守的是自己留在神愛我們的那個位置裡，不是守住自己心裡的熱度。造就、禱告、仰望，都圍著這個命令轉。在聖靈裡禱告有兩種讀法：包括說方言的禱告，或一切倚靠聖靈、與聖靈同工的禱告；兩讀並陳，不拿方言把人分等，也不輕看方言。攀岩的人自己只有一件事要守：不去解開腰上的繩結，拉住繩子的不是他。6 節的天使解開了繩結；結果還是被守住，只是被鎖鍊守住。"],["p","第二個字：διακρίνω（diakrinō），爭辯。第九節米迦勒與魔鬼爭辯，原文 διακρινόμενος（diakrinomenos）；第二十二節有些人存疑心，原文 διακρινομένους（diakrinomenous），是同一個字。天使長的那一場，猶大要我們學的是把審判交給主；信徒心裡的那一場，猶大要教會做的第一件事是憐憫。存疑心不等於背道。福音書記得，「因為連他的弟兄說這話，是因為不信他」（約 7:5）。那幾個不信的弟弟裡，就有猶大；寫下二十二節的人，自己是被憐憫過的。我們卻常把這兩種爭辯弄反。"],["p","然後是另外兩種人：「有些人你們要從火中搶出來，搭救他們；有些人你們要存懼怕的心憐憫他們，連那被情慾沾染的衣服也當厭惡。」（1:23）搶，原文 ἁρπάζω（harpazō），是緊急而用力的抓。這使我們想起撒迦利亞看見的那根從火中抽出來的柴（亞 3:2）。存懼怕的心，是提防自己也被拖下去；要厭惡的是那件衣服，對那個人仍是憐憫。"],["p","第三個字：ἀπταίστους（aptaistous），不失腳。24 節，守這個字換了：φυλάξαι（phylaxai），φυλάσσω（phylassō）是衛兵看守城門的字。這一句的主詞不是你們，是「那能保守你們不失腳」（1:24）的那一位：分詞 δυναμένῳ，重點在祂能。建明的腳離開了岩點，人卻沒有墜下去；不失腳，不是從此不會滑，是滑的那一刻有一隻手沒有鬆。被沾染的人，最後無瑕無疵地站在祂面前。最後一句是「願榮耀、威嚴、能力、權柄，因我們的主耶穌基督歸與他，從萬古以前並現今，直到永永遠遠。阿們！」（1:25）信的開頭有人不認那位獨一的主宰；信寫到最後，猶大領著讀信的人，把頌讚獻給那獨一的神。"],["d",["「在聖靈裡禱告」是不是指說方言？我不會說方言，算不算在聖靈裡禱告？","經文沒有限定。一種讀法認為包括說方言的禱告，保羅說「我若用方言禱告，是我的靈禱告」（林前 14:14）；也有人認為泛指倚靠聖靈、與聖靈同工的禱告，弗 6:18 的靠著聖靈隨時多方禱告，用的正是同樣的說法，羅 8:26 也說聖靈親自替我們禱告。本講義兩讀並陳：不定義成必須說方言，也不看輕方言。猶大真正的對照在 19 節和 20 節：那些人沒有聖靈，你們卻在聖靈裡禱告。要問的不是我有沒有某一種恩賜，而是我的禱告靠自己的口才，還是倚靠聖靈。這一週，每天禱告以前先安靜一分鐘，說：聖靈，求你教我怎樣禱告。"]],["d",["朋友陷在賭債和一段危險的關係裡，「從火中搶出來」是不是要我一個人去扛？","不是。同一句經文說「存懼怕的心」，就是在提醒救人的人：你也可能被拖下去。保羅也說：「又當自己小心，恐怕也被引誘。」（加 6:1）確保的人自己也要站穩、繫好。具體可以這樣做：第一，這個禮拜先找一位同工或組長一起禱告，商量誰去、怎麼去；第二，兩個人一起見他，只聽，不訓話，不給錢；第三，事先查好債務協談、戒賭輔導等轉介資源；若有暴力或自傷的危險，立刻協助他聯絡專業機構或緊急求助管道。搶救是一群被保守的人一起伸手。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是拿第三節替網路罵戰撐腰。ἐπαγωνίζεσθαι 是為獎賞拼搏，對象是那一次交付的真道；猶大示範的方式，是米迦勒的不毀謗和二十二節的憐憫。用驕傲的方式捍衛真理，本身就已經輸了。"],["p","第二個偏差，是把記號抄成名單，替今天的某位傳道人、某個群體貼上偷著進來的標籤。猶大一給記號，第八節就把鏡子轉回讀信的人；記號用來照自己，名單留在神手裡。"],["p","第三個偏差，是拿第八節要會友閉嘴，好像對帳目、對決策發問就是毀謗；或拿二十三節要人遠離陷在罪裡的人。第十二節受審判的，正是牧養自己的牧人；二十二到二十三節貫穿的動詞仍是憐憫。"],["p","第四個偏差，是對有疑問的人說你大概沒有重生；或拿第四節替人宣判，讓敏感的弟兄姊妹一夜睡不著。經上寫明的是路的盡頭，信的頭一句和末一句，都是神的保守。"],["p","第五個偏差，是先喊 321 的口號，再拿第六節和可拉來當例證；或越講越佩服猶大的嚴厲。經文先講完審判與保守，321 才在後面認出它；榮耀歸給保守人的神，不歸給寫信的人。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：家族群組裡，表舅轉來一支影片，標題是揭發某位知名牧師其實是偷著進來的假師傅，幾十萬人看過，有人留言說要為真道爭辯。我要不要轉？要不要跟著罵？先記得第八節，記號是給讀信的人照的鏡子；再記得米迦勒，面對魔鬼都不敢用毀謗的話，我們更不必替神在群組裡開庭。所以不轉、不按讚、不在留言區開戰。可是不轉，不等於當作沒看見：第十二節也不准我們替只餵養自己的牧人遮掩。若真有人受害、帳目真有問題，就交給該負責的教會或機構，走正式的管道；牽涉性侵、暴力或詐騙的，要報警、走法律程序。受害的人若就在身邊，先認真聽他、保護他，不叫他為了教會的名聲閉嘴。然後私下傳一句問候給表舅。爭的是真道，不是點閱率。"],["p","第二個問題：晚飯桌上，大學二年級的女兒低著頭說：媽，我好像不太信了。坐在旁邊的阿嬤筷子一放就說：你讀書讀到頭殼壞去了，明天跟我去教會認罪。責備常常是因為害怕；可是二十二節的第一個動詞是憐憫。存疑心，原文是心裡在爭辯，她還在爭辯，就表示她還在乎。媽媽可以晚一點敲女兒的門，只問一句：你最卡的是哪裡？不急著回答，也不丟一串影片給她。也可以私下對阿嬤說：寫猶大書的人，自己也曾經不信過他的哥哥。若疑問後面是在教會受過的傷，更不要急；先陪著，必要時一起找信得過的牧者或專業的人。"],["d",["家人說「我好像不太信了」，第一次坐下來談，我可以怎樣開口？","先記得 22 節的第一個動詞是憐憫，然後把談話的目的定得很小：不是今晚就把他說服，是讓他知道問題可以帶回家。可以這樣開口：謝謝你願意告訴我，這一定不容易說出口。接著只問：最卡的是哪裡？是一個問題、一段經歷，還是一個人？聽完先不反駁，可以說：我也想一起找答案，下個禮拜再談一次好嗎？如果疑問背後是在教會受過的傷，就先為那份傷難過，不替任何人辯護。寫這封信的猶大自己也曾經不信過；神沒有放棄他。"]],["h","七、活出321——繩子的兩頭"],["p","經文走完了，我們才用 321 認出它。"],["p","耶穌是我的榜樣：這些人不認的，是「獨一的主宰－我們主耶穌基督」（1:4），我們偏偏跟隨祂。祂守住真理從不讓步，被罵卻不還口，對沉下去的彼得伸手拉住。"],["p","聖經是我的準則：「你們要記念我們主耶穌基督之使徒從前所說的話」（1:17）。準則是一次交付的；聽見有人說他做了夢、得了新啟示，先回到使徒說過的話。"],["p","聖靈是我的引導：十九節說那些人「沒有聖靈」，二十節說「在聖靈裡禱告」（1:20）。他們靠異夢和口才，我們靠住在裡面的那一位。"],["p","讓耶穌作王：「獨一」的主宰（1:4），寶座上沒有第二張椅子，連留給我自己的也沒有。讓祂作王，也包括走下審判台：米迦勒只說「主責備你吧」（1:9）。"],["p","讓耶穌得到一切的榮耀：全卷最後一句是「願榮耀、威嚴、能力、權柄，因我們的主耶穌基督歸與他」（1:25）。榮耀不歸給爭得最大聲的，也不歸給看得最準的，歸給那位扣住繩子的。"],["p","建立屬神的體系：「在至聖的真道上造就自己」（1:20），自己是複數，是一群人在同一個根基上往上蓋；十九節的結黨卻是畫線拆開。所以小組裡要有人一起分辨聽到的教導，有人可以安心發問，也有人被分派去陪伴靠近火邊的人。"],["h","八、四種心，各在繩子的哪一段"],["p","驕傲型的心，常站在岩壁下評論誰的腳法不對，留言越寫越長，其實是怕輸。米迦勒那一句是給你的：天使長都不敢替神宣判。可拉也是給你的：嫌自己的位置太小，就是離開本位的開始。"],["p","恐懼型的心，最怕自己就是那個會失腳的人：讀到自古被定，就一夜睡不著；讀到天使、所多瑪，就覺得下一個是我。請看繩子的兩頭：你是為耶穌基督保守的人，祂是那能保守你們不失腳的。"],["p","羞恥型的心，也許曾經在性的事上跌倒，也許曾經在群組裡罵過人、轉過不該轉的影片，也許現在就站在火邊。請記得二十三節的動詞是搶出來，二十四節的形容詞是無瑕無疵。被沾染的衣服可以脫下來，主要給你換上新的。"],["p","受傷型的心，也許曾經被人用爭真道的名義羞辱，提問被說成沒有重生，對領袖的疑問被說成毀謗。那些話不是這封信的意思，猶大第一個吩咐是憐憫。若那些傷到現在還讓你不敢進教會，請找一位信得過的人陪你，必要時尋求專業協助；你不必一個人吊在半空。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 1:20–21，讀到保守自己常在神的愛中就停下來說：我今天先留在你愛我的位置裡。晚上讀 1:24，把今天差一點滑倒的地方交給祂。"],["p","第二，下一次手指停在送出鍵上，先問三個問題：我要守的是哪一條真道？這段話裡有沒有米迦勒不敢用的字？我是在爭真道，還是在爭面子？三個都答得出來，再按。"],["p","第三，想一位最近對你說過「我好像不太確定了」的朋友或家人，這一週約他喝一杯咖啡，只問一句：你最卡的是哪裡？"],["p","第四，拿一張紙寫下一件你對神分給你的那一份不滿的事，在旁邊寫一句：主，這是你分給我的本位，我願意守。"],["p","第五，和組長談一談：小組裡誰在疑惑、誰靠近火邊？每一位配兩個人同行；需要的話，先打聽好附近可以轉介的輔導。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我是被召、蒙愛、被保守的人；我腳下一滑，神也不放手。"],["p","我宣告：我為一次交付的真道爭，不為自己的面子爭；審判交給主，我不坐審判台。"],["p","我宣告：存疑心的，我要憐憫；在火邊的，我要和弟兄姊妹一起去搶。"],["p","我宣告：那能保守我不失腳的，要叫我歡歡喜喜站在祂榮耀之前；願榮耀歸與祂。"],["h","十、結語"],["p","那天傍晚，建明從岩壁下來，把確保器扣在自己腰上，對第一次來攀岩館的大兒子說：上去吧，我在下面。兒子爬到一半，腿在發抖。建明說：你滑也沒關係，我不會放手。他在半空被抓住過，所以知道怎麼抓住別人。這就是猶大書的次序：先被保守的人，才去憐憫人、去搶救人。"],["p","這一課的焦點，不在猶大的嚴厲，也不在我們爭辯得多漂亮、分辨得多準，焦點在那一位：開頭把我們保守（1:1），中間叫我們留在祂的愛中（1:21），最後能保守我們不失腳、叫我們歡歡喜喜站在祂榮耀之前（1:24）。不肯守本位的，最後被鎖鍊看守；留在神愛中的，一路被神的手看守。請你離開這裡的時候，更愛那一位：你腳下一滑的那一秒，繩子的另一頭是祂。"],["p","我們一起低頭禱告。天父，謝謝你，在我們還沒有滑以前，你的手已經扣住了繩子。求你教我們為真道竭力地爭，卻不毀謗任何人，把審判交還給你。求你使我們留在你的愛中，彼此建造，在聖靈裡禱告。求你賜我們溫柔的心，去憐憫心裡正在爭辯的孩子，也一起去搶救在火邊的人。願榮耀、威嚴、能力、權柄都歸與你，從萬古以前並現今，直到永永遠遠。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","小組不比誰爭得最有理，也不比誰看得最準，是讓每一個人說出自己在繩子的哪一段、身邊有誰正在心裡爭辯，和這一週要伸出的那一隻手；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是繩子的兩頭：先被保守，才為真道爭；被扣住的人去憐憫、去搶救。席上可能有正在疑惑、在性的方面掙扎、被教會傷過的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：爭辯是為真道奮力，不是羞辱人；守這個字從 1 節走到 24 節，最後守住我們的是神；存疑心和爭辯是同一個字，第一個動詞是憐憫。"],["n","1. ★ 你有沒有一次腳下一滑、卻被人抓住的經驗？可能是走山路，也可能是一段很難的日子。是誰抓住了你？"],["n","2. ★★★ 竭力地爭辯在競技場上是甚麼畫面？爭的對象是甚麼？猶大在 9 節和 22 節示範了甚麼方式？舉一個你爭錯對象的例子。"],["n","3. ★★ 從 1 節到 24 節，把守這個字走一遍：被保守、不守、拘留、存留、保守自己、能保守。哪一站最讓你停下來？為甚麼？"],["n","4. ★★ 米迦勒與魔鬼爭辯，和有些人存疑心，原文是同一個字。你最常在甚麼場合把這兩種爭辯弄反？"],["m","帶領提醒：耶穌或主、天使是誰、以諾一書這些問題，一句指向講義的議題頁，不在組裡辯論；不點名任何牧者、教會、宗派、網路講員或組員。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出自己在繩子的哪一段，和這一週要走的一小步。"],["t","【看】看見自己"],["n","5. ★★★ 你最近比較像哪一種人：在群組裡爭的人、看照片先看別人的人、心裡正在爭辯的人，還是靠近火邊的人？說出一件具體的事。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 1:20–21 和 1:24 兩遍。哪一個詞讓你停下來：你們卻要、保守自己，還是不失腳？"],["t","【想】想通關卡"],["n","7. ★★★ 你比較常卡在哪裡：怕輸，所以爭得太兇；怕被定，所以不敢問；還是怕被看穿，所以不讓人靠近？"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：我是為耶穌基督保守的人，扣住繩子的是神的手。下一位只回一句：祂能保守你不失腳，不給建議、不分析。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週的一小步：哪一天、對誰、做哪一件事。若你自己就在火邊，這一步可以只是告訴一位信得過的人。"],["m","帶領提醒：這一化可能碰到信仰的疑惑、性的掙扎、曾被教會或屬靈領袖傷害、家人離開信仰，以及長期無望感。不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，不在組裡處理，會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一個群組、一頓飯、一張名單、一位「2」、一位朋友。"],["n","10. ★★ 說出你最常起爭執的地方：哪一個群組或哪一張餐桌。這一週你在那裡要守的是哪一條真道？要刪掉哪一種口氣？"],["n","11. ★★ 這一週你要約哪一位存疑心的朋友或家人吃飯？說出星期幾、在哪裡，和你準備問的那一句：你最卡的是哪裡？"],["n","12. ★ 我們小組的陪伴名單上，誰在存疑心、誰靠近火邊？可用代稱。這個月由哪兩位組員
