<title>321猶大書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}

<script>
/* 開機守門員：主程式若沒能在 8 秒內畫出東西，就顯示可診斷的畫面，而不是一片白 */
window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}
setTimeout(function(){
  var m = document.querySelector('main');
  if (!window.__booted && (!m || m.innerHTML.trim().length < 40)){
    var b = document.getElementById('boot');
    if (b) b.style.display = 'flex';
  }
}, 8000);
</script>

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"那能保守你們不失腳","sub":"爭、鑑、守","lv":"A","arc":"爭・鑑・守","sec":[["1:1--4","為從前一次交付聖徒的真道竭力地爭辯：被保守的人與偷著進來的人"],["1:5--10","作為鑑戒：三個鑑戒與天使長米迦勒"],["1:11--16","他們有禍了：三條路、五幅畫與以諾的預言"],["1:17--21","保守自己常在神的愛中：記念、造就、禱告、仰望"],["1:22--23","從火中搶出來：憐憫存疑心的人"],["1:24--25","那能保守你們不失腳：頌讚"]],"serm":{"pts":[["為真道竭力爭辯","1:1--4","「為從前一次交付聖徒的真道竭力地爭辯」——寫信的人先被保守，才為真道爭；爭的是一次交付的真道，不是自己的面子；因為有些人偷著進來，把神的恩變作放縱情慾的機會"],["看清不守本位的路","1:5--16","「作為鑑戒」——出埃及後不信的、不守本位的天使、所多瑪；該隱、巴蘭、可拉；連天使長都只說「主責備你吧」；鑑戒先照自己，再看清那條路的終點"],["被抓住的人去搶救人","1:17--25","「保守自己常在神的愛中」——你們卻要造就、禱告、保守、仰望；憐憫存疑心的，從火中搶出來；最後守住我們的，是那能保守你們不失腳的獨一的神"]]},"q":"晚上十一點半，你還在一則影片底下打字。那位講員把恩典講得很怪，你越看越氣，回覆已經寫了八百字，最後一句是「你這種人就是猶大書說的偷著進來的」，手指停在「送出」上面。\n同一支手機裡，還有一則兩個小時前的私訊，你還沒點開。是小組裡那個常常發問的大學生：「我最近好像不太信了，可以跟你說嗎？」\n這一章要問：我為真道爭辯的那股力氣，是從被神抓住的安穩裡出來的，還是從怕輸、怕被看不起的心裡出來的？我先回覆的，會是那位講員，還是那個正在心裡爭辯的孩子？到最後，守住我、也守住他的，是誰的手？","truth":"對付錯謬最好的辦法，不是住在錯謬裡研究它，而是轉身住進一個位置：「保守自己常在神的愛中，仰望我們主耶穌基督的憐憫，直到永生」（1:21）——在真道上建造、在聖靈裡禱告、仰望憐憫，都是為了留在那個位置裡。\n我們守得住那個位置，是因為我們先是「為耶穌基督保守的人」（1:1），最後也有「那能保守你們不失腳」（1:24）的那一位守在兩頭；神的手在外面，我們在裡面住下，這就是全部的保守。","mv":{"t":"那能保守你們不失腳、叫你們無瑕無疵、歡歡喜喜站在他榮耀之前的我們的救主－獨一的神","r":"猶1:24"},"card":["猶大書只有一章，這一章就是爭・鑑・守的整條路。先是爭（1:1--4）：被召、蒙愛、被保守的人，「要為從前一次交付聖徒的真道竭力地爭辯」（1:3），因為有人已經坐在桌邊；再是鑑（1:5--16）：看清不守本位的路通到哪裡，鑑戒先照自己；最後是守（1:17--25）：在神的愛中住下，去憐憫、去搶救，被那能保守你們不失腳的神抓住。猶大要的是哪一種爭，他自己在信裡示範了：9 節天使長只說「主責備你吧」，22 節對存疑心的人第一個動作是憐憫。次序不能倒：不是爭贏了才守得住，是先被守住，才爭得乾淨。","這封信看起來滿是「這些人」，真正的主詞是神。在任何一句警告以前，神已經召了我們、在父裡愛了我們、為耶穌基督保守了我們（1:1）；祂多多地加給人憐恤、平安、慈愛（1:2）；祂把真道「一次交付」給聖徒，不需要誰再補一頁（1:3）；祂救百姓出埃及，也審判不信的（1:5）；祂拘留不守本位的（1:6），連天使長都把責備魔鬼的事交給祂（1:9），祂必帶著千萬聖者降臨（1:14）；最後，祂能保守、能叫人無瑕無疵地站在祂榮耀之前（1:24）。整封信從神的手開始，也在神的手裡結束。","9 節米迦勒與魔鬼「爭辯」，原文 διακρινόμενος；22 節「有些人存疑心」，原文 διακρινομένους——同一個字。猶大用同一個字，寫一位和魔鬼爭辯的天使長，和一個心裡正在爭辯的信徒；對前者，把審判交給主；對後者，憐憫他。這改變今天我們拿手機的方式：我們常常把力氣倒過來用——對網路上的陌生講員，用天使長都不敢用的毀謗話；對小組裡那個說「我好像不太信了」的孩子，卻冷冷回一句「你要多讀經」。按下送出以前，先問：我現在面對的是哪一種爭辯？","這一章最不舒服的一句是「這些做夢的人也像他們」（1:8）——前面三個鑑戒忽然轉過身來，對著讀信的人。我可能不會偷著進誰的教會，卻可能在愛宴收桌子的時候，私下議論那位新來的同工；可能對神分給我的位置常有怨言，嫌自己的服事太小、太沒人看見（1:16）；可能一邊說要守真道，一邊把和我意見不同的人劃到圈外（1:19）。猶大的鑑戒，先照的是讀信的人，再照別人。","「主責備你吧」（1:9）。全章最該被記住的，是一個把手收回來的動作。米迦勒是天使長，面對的是魔鬼，論資格、論對錯，他都最有理由當場宣判；他卻「不敢」，把審判交還給主。這一句翻轉了我們對「為真道爭辯」的想像：守住真理的人，不必坐上審判的位置；越確定自己站在真理那邊，越要把定罪的權柄交回去。也因為手收回來了，才空得出來，在 22 節去憐憫一個存疑心的人。","這一週，打開你最常爭論的那個地方——留言區、家族群組、教會的 LINE 群。下一次想回覆一則讓你生氣的信息以前，先做三件事：用一句話寫下我要守的是哪一條真道，而不是哪一個人；把罵人的形容詞全部刪掉；最後學米迦勒把審判交回去，禱告一句「主啊，審判在你，不在我」，再決定要不要送出。然後做另一件事：找出那一則你一直沒點開的私訊，是一個存疑心、或正靠近火邊的人，這週約他吃一頓飯，只聽、不急著答。","最終整合：星期六早上八點半，復健病房。\n阿公中風三個月，今天第一次要放開助行器走路。治療師在他腰上繫了一條寬寬的步態帶，背後那一段，緊緊握在她手裡。\n孫子站在門邊。他是小組裡那個問題最多的大學生，上個月才傳訊息給組長說：「我好像不太信了。」阿公是全家第一個信主的人，孫子不知道該怎麼面對他。\n第一步，阿公的右腳拖了一下。第二步，膝蓋一軟，整個人往前傾。\n孫子衝過去，卻還是慢了。他還沒碰到阿公，阿公已經停在半空中——那條帶子，被治療師一把拉住。\n阿公喘著氣，竟然笑了。他對孫子說：「你看，腳是軟了，人沒有倒——有人沒有放手。」\n他慢慢站直，又往前走了三步。孫子沒有回門邊，他走到阿公另一邊，輕輕扶著。\n病床旁的小桌上，有一張阿公每天要人念給他聽的卡片：\n「那能保守你們不失腳、叫你們無瑕無疵、歡歡喜喜站在他榮耀之前的我們的救主－獨一的神」（1:24）\n得勝者不是從來沒有腳軟的人，是腰上那條帶子一直握在神手裡的人。\n那一天，被抓住的阿公在學走路，存疑心的孫子在學扶人；而那一位，兩個人的帶子都握在祂手裡，從來沒有鬆手。"],"self":"這一章照出來的「有己」，常常穿著「捍衛真理」的外衣：我在網路上越爭越大聲，其實是怕輸、怕沒面子；我用記號去量別人，卻不肯先照自己；我對神分給我的位置私下議論、常發怨言，想去抓一個更被看見的位置。\n有己也會穿上「屬靈」的衣服：把有疑問的人劃到圈外，好讓自己顯得站得比較穩；或者反過來，心裡一緊就以為自己是「被定」的那一個，忘了這封信的第一句就說，我是「為耶穌基督保守的人」（1:1）。","t321":{"k":"耶穌是我的榜樣：那些人不認的「獨一的主宰」（1:4），正是我們跟從的那一位，而祂自己怎樣面對攻擊，彼得記得很清楚：「他被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主」（彼前 2:23）。祂守真理，從不讓步，卻從不用毀謗回擊毀謗；祂對存疑心的人伸出手：對多馬說「伸過你的指頭來」（約 20:27），對沉下去的彼得「趕緊伸手拉住他」（太 14:31），對將要跌倒的彼得說「我已經為你祈求，叫你不至於失了信心」（路 22:32）。祂還向父交帳：「因你所賜給我的名保守了他們」（約 17:12）。我學的不是猶大的嚴厲，是這位既守真道、又不放手的主。","g":"讓耶穌作王：這一章要人讓出兩個位置。第一個是審判台：9 節米迦勒「不敢用毀謗的話罪責他」，我也不坐上去替神宣判誰是「偷著進來的」，只教記號，把名單交給主。第二個是不屬於我的位置：6 節先講完一件事——連天使離開神所分派的本位，都逃不過確定的審判；11 節可拉嫌利未人的事奉太小，要奪祭司的職分。經文講完了，這使我們想起 321 說的「驕傲是離開本位抓住權力」。「獨一的主宰」（1:4）那個位置只容一位坐，我自己也不可以偷偷坐上去；可以自己檢查：我最近的不滿，是為主的名，還是為我沒有被分到的那一份？","p":"建立屬神的體系：「在至聖的真道上造就自己」（1:20）的「自己」是複數，原文是在根基上往上蓋——一群人彼此建造；19 節的「引人結黨」卻是劃界拆開。一個肯被建造的群體，至少要有三樣安排：其一，有明說的教導原則與講員邀請流程，由兩三位同工一起禱告分辨，不靠一個人的眼力，也不在群組公審；其二，有讓人可以按次序、帶著尊重提問的管道：決策說得清楚、帳目公開，領袖也樂意被問責——這不是防著哪一個人，是讓牧者和羊群都不必活在猜疑裡；12 節「只知餵養自己」的警告，是先對每一個服事的人說的；其三，有一張陪伴名單：誰在存疑心、誰靠近火邊、誰陷得很深，各有人陪、需要時轉介。國度321空中團契散在各國，線上小組也可以這樣分工，讓每一格畫面背後都有人被記得。"},"grp":["【一、破冰】你最近一次在網路上、家族群組或餐桌上「吵起來」是為了甚麼？事後回頭看，你比較想贏的是道理，還是面子？（可以是很小的事，例如選哪一家餐廳。）","【二、扎心】猶大寫：「尚且不敢用毀謗的話罪責他，只說：『主責備你吧！』」（1:9）。說出一個你最近很想替神宣判的人或場合——是哪一則貼文、哪一次會議、哪一位家人？如果你把審判交還給主，你那天的話會少掉哪一句？","【三、福音】讀 1:1 與 1:24：我們是「為耶穌基督保守的人」，神是「那能保守你們不失腳」的。如果守住我的是神的手，不是我爭贏了多少場，這會怎樣改變我對自己信心的焦慮？又會怎樣改變我對一個存疑心的人說話的語氣？","【四、行動】22--23 節說有三種人：存疑心的、靠近火邊的、陷得很深的。說出一位你心裡想到的人（可以只說稱呼），這一週你要在哪一天、用甚麼方式聯絡他——吃飯、電話、陪他去一個地方？如果他陷得很深，你要先邀請哪一位同工一起去？","【五、代禱】為三種人指名禱告：一位心裡有很多疑問、不敢在教會開口的年輕人，求主使他更敢問；一位在網路上為信仰爭得很累、心裡越來越硬的弟兄姊妹，求主使他把審判交還給主；一位正在火邊——上癮、債務或一段危險關係裡——的人，求主差派一隻手去拉住他，也保守拉他的人。"],"prac":{"main":"這一週，我先在神的愛中住下，再為真道爭：不坐審判台，不放開存疑心的人。","items":["對神：每天早上讀 1:20--21，讀到「保守自己常在神的愛中」就停下來，向主說：「我今天不先證明自己對，我先住在你愛我的那個位置裡。」晚上再讀 1:24，把今天差點失腳的地方交給祂。","對自己：寫下最近一次讓你氣到想回覆、想轉發、想點名的事，在旁邊寫兩行：我要守的是哪一條真道？我心裡不滿的，是不是神沒有分給我的那一份？寫完以後，為自己禱告「主責備我心裡的驕傲」。","對人：主動聯絡一位存疑心的人，約一頓飯或一通電話，這一次只聽、只問「你最卡的是哪裡」，不急著回答、不轉給他一串影片；最後告訴他：「有問題可以一直來問，我們一起找。」","對生活：這一週任何爭論，送出以前先刪掉一切罵人的形容詞，不在公開場合點名任何牧者、教會或講員；真的需要處理的，私下去問、或交給教會負責的同工。","對使命：在小組或同工會提出一張「22--23 節陪伴名單」：誰在存疑心、誰靠近火邊、誰陷得很深，各安排兩個人一起陪；陷得深的，事先查好可以轉介的輔導或戒癮資源，不讓任何人一個人去救火。"]},"safe":["① 先講 321「驕傲是離開本位抓住權力」，再拿 1:6「不守本位」和 1:11 可拉當插圖，說「這兩節證明了 321 的理念」。","6 節自己講的是神審判的確定——連天使離開神所分派的位置，都被拘留等候大日的審判；11 節講的是三條往下的路與「他們有禍了」。經文的意思講完了，才能說「這使我們想起 321」；把經文當理念的插圖，會眾記得的是一套說法，不是那位審判又保守的神。","檢驗標準：講完 6 節，會眾先記得的是神的審判與保守，還是一句 321 的口號？","② 用 1:3「竭力地爭辯」替網路論戰、群組罵戰、羞辱持不同意見的人背書：「猶大叫我們要爭，所以不必客氣。」","ἐπαγωνίζεσθαι 是競技場上為獎賞奮力，不是吵架；爭的對象是一次交付的真道，不是人、不是面子、不是宗派特色；方式猶大自己示範了——9 節不毀謗、把審判交給主，22--23 節憐憫與搶救（全卷立場見〈為真道爭辯而不好爭競：「竭力地爭辯」是甚麼樣的爭？〉）。辯贏了一場、卻丟了基督的樣式，這一場就已經輸了。","檢驗標準：講完 3 節，會眾更知道要爭的是哪一條真道、要用甚麼樣的口氣，還是更有理由去罵人？","③ 在講台、群組或影片裡點名今天的某位牧者、某間教會、某個宗派或某位網路傳道人，說他們就是「偷著進來的人」。","猶大給的是記號，不是名單：把恩典變作放縱、不認獨一的主宰（1:4）、只知餵養自己（1:12）、怨言諂媚（1:16）、引人結黨（1:19）；而且 8 節「這些做夢的人也像他們」先把鏡子轉向讀信的人。點名獵巫會把教會變成法庭，也把講台變成自己的審判台（全卷立場見〈分辨假教訓：猶大給的是記號，還是名單？〉）。","檢驗標準：會眾帶回家的是一組可以先照自己的記號，還是一份可以拿去攻擊別人的名單？","④ 講 1:7 所多瑪時，拿某一個群體開玩笑、貼標籤、用羞辱的字眼；或反過來，怕爭議而整節跳過，或說「聖經的性倫理已經過時」。","我們持守聖經的性倫理（羅 1:26--27；林前 6:9--11），也並陳「別的肉體」的三種讀法，並記得所多瑪的罪不只一項：「心驕氣傲，糧食飽足，大享安逸，並沒有扶助困苦和窮乏人的手」（結 16:49）。保羅列完清單，接著說「你們中間也有人從前是這樣；但如今你們……已經洗淨」（林前 6:11）——同一段要有恩典、悔改，也要先照自己。","檢驗標準：一位在性的方面正在掙扎、想跟隨主的弟兄姊妹聽完，是覺得被接住、知道回家的路，還是想從後門離開教會？","⑤ 用 1:8「輕慢主治的，毀謗在尊位的」堵住會友對教會領袖的正當質疑：「你問帳目、問決策，就是毀謗在尊位的。」","「主治的」多數指主的權柄，「在尊位的」多數指天使、榮耀者；而 12 節被定罪的，正是「作牧人，只知餵養自己」的人（這使我們想起結 34:2；彼前 5:3「不是轄制所託付你們的」）。按著次序、帶著尊重提出的質疑，不是輕慢主治的；拿這節保護領袖免於問責，是把一封保護羊群的信講成保護牧人的信；反過來，拿 12 節在會眾面前影射某一位牧者，也是另一種毀謗。","檢驗標準：一位對教會某項決定有疑問的同工聽完，是更知道可以按次序、帶著尊重提出，還是更確定自己最好閉嘴？","⑥ 從 9 節與 14--15 節建構一套天使學、末世劇本，或說「猶大引用了，可見《以諾一書》和《摩西升天記》也是聖經」；或反過來說「猶大引次經，所以這卷書不可靠」。","受默示的是猶大書，不是被引用的書；引用一句真話不等於替整本書背書，保羅也引過希臘詩人（徒 17:28；多 1:12）。既不另起一套次經神學，也不以此貶低猶大書（全卷立場見〈正典引用次經的原則：猶大引用《摩西升天記》與《以諾一書》，代表甚麼？〉）。","檢驗標準：講完這兩處，會眾是更安心地把猶大書當神的話讀，還是開始去網路上找次經、或開始懷疑這卷書？","⑦ 把「斥責魔鬼」講成一場表演：教會眾人大聲喊叫命令魔鬼，越大聲越屬靈，還說「這是照猶大書屬靈爭戰」。","9 節正好是反面教材：連天使長面對魔鬼，都「尚且不敢用毀謗的話罪責他」，只說「主責備你吧」（這使我們想起亞 3:2）。抵擋魔鬼是聖經的命令（雅 4:7），屬靈世界也是真實的，力量卻不在音量，在主；把焦點放在魔鬼身上，會讓會眾怕魔鬼多過信靠基督（全卷立場見〈天使、魔鬼與屬靈爭戰：猶大書要我們怎樣看那看不見的世界？〉）。","檢驗標準：會眾聽完，是更專注倚靠那位已經得勝的主，還是更好奇、更害怕、更想表演？","⑧ 把 1:22「有些人存疑心」的人當成背道者、敵人或「偷著進來的人」：「你有這麼多疑問，表示你根本沒有重生。」","「存疑心」和 9 節米迦勒「爭辯」是同一個字：是心裡正在爭辯、搖擺，不等於離開；第一個動詞是「憐憫」，不是糾正、更不是趕出去。寫這句話的猶大，自己曾經不信他的哥哥：「因為連他的弟兄說這話，是因為不信他」（約 7:5）（全卷立場見〈這些爭議該不該影響一個人的信心？〉）。","檢驗標準：一位心裡有很多懷疑的年輕人聽完，是更敢把問題帶到小組裡，還是學會了閉嘴、或乾脆離開？","⑨ 用 1:4「自古被定受刑罰的」對人宣判：「有些人生來就被定沉淪」；或讓敏感的會眾帶著「我是不是被定了」的恐懼回家。","原文 προγεγραμμένοι 是「早已寫下的」：舊約與以諾的預言早已寫下這條路的結局，被寫定的是路的終點，不是今天哪一個人的名字；同一封信的頭尾，是「為耶穌基督保守的人」（1:1）與「那能保守你們不失腳」（1:24）（全卷立場見〈被保守與保守自己：神保守我，為甚麼還要我保守自己？〉）。","檢驗標準：一位常常懷疑自己得救的弟兄聽完，是更安穩地被主的手保守，還是一夜睡不著？","⑩ 把 1:20「在聖靈裡禱告」定義成「必須說方言才算」，或反過來說「說方言是情緒、是異端，在聖靈裡禱告跟方言無關」。","這一句並陳兩讀：包括說方言的禱告（林前 14:14--15），或一切靠聖靈引導、與聖靈同工的禱告（弗 6:18；羅 8:26）；保羅自己說「豈都是說方言的嗎？」（林前 12:30），也說「也不要禁止說方言」（林前 14:39）。落點是靠聖靈禱告的生活，對照 19 節「沒有聖靈」。","檢驗標準：會眾聽完，是更想在每天的禱告裡倚靠聖靈，還是開始用有沒有說方言把人分成兩等？","⑪ 用處境取消原則：「這是第一世紀愛筵上的假教師，今天沒有這種人，跟我們無關」；或把處境硬搬：「凡是新的詩歌、新的聚會形式、新的譯本，都是偷著進來的。」","書信三問要走完：處境是一群巡迴的人坐進家庭教會的愛筵，把恩典講成放縱（全卷立場見〈寫作年代與處境：猶大書寫於何時？偷著進來的是些甚麼人？〉）；原則是福音的核心「一次交付」，不需要新啟示來補，恩典不是放縱的許可證；今天的落點是講台、課程、小組推薦與網路教導。「一次交付」守的是內容，不是聚會的形式與工具。","檢驗標準：會眾聽完，是知道這封信今天落在自己的講台、群組和手機上，還是覺得它要嘛太遙遠、要嘛被拿來反對一切新事物？","⑫ 把整卷講成猶大的嚴厲與口才：「你看猶大罵得多痛快，我們也要學他這樣不留情面。」","猶大明明可以寫「耶穌的弟弟」，卻寫「耶穌基督的僕人」（1:1）；他把十多節描寫黑暗，最後兩節卻全給了頌讚（1:24--25）。焦點落在「那能保守你們不失腳」的那一位，不在寫信人的嚴厲；學猶大的語氣而不學他的跪下，就把一封頌讚的信講成一封罵人的信。","檢驗標準：會眾聽完，是更佩服猶大的嚴厲，還是更愛那位能保守人不失腳的神？","⑬ 用 1:23「連那被情慾沾染的衣服也當厭惡」叫人疏遠陷在罪裡的人：「不要跟他吃飯，免得被污染。」","同一句的主要動詞是「憐憫」；厭惡的是衣服，不是穿衣服的人——這使我們想起亞 3:3--4，神親自給穿污穢衣服的約書亞換上華美的衣服。「存懼怕的心」是敬畏神、也提防自己，不是把人推開；主自己被人議論「這個人接待罪人，又同他們吃飯」（路 15:2）。","檢驗標準：一位剛從一段罪裡走出來、坐在後排的人聽完，是覺得有人願意靠近他，還是覺得自己被當成傳染病？","⑭ 用 1:23「從火中搶出來」鼓勵人單槍匹馬去救陷得很深的人：「愛他就要一個人扛，不必找別人，也不必找專業。」","猶大在同一句說「存懼怕的心」：救人的也會被拖下去——「又當自己小心，恐怕也被引誘」（加 6:1）。面對上癮、暴力、自傷或危險關係，要請同工一起陪，需要專業協助的就轉介；把搶救講成英雄劇，會讓救人的和被救的一起燒傷。","檢驗標準：講完這一節，會眾是更知道要找誰一起去、甚麼時候要轉介，還是更想一個人衝進火裡證明自己的愛？","⑮ 用 1:14「主帶著他的千萬聖者降臨」與 1:18「末世必有好譏誚的人」推算日子，或說「這就是今天的某某人、某某事件」。","「末世」在新約指基督第一次來到第二次來之間的整段時間（來 1:2）；主必再來，但「父憑著自己的權柄所定的時候、日期，不是你們可以知道的」（徒 1:7）。把預言變成時間表，會讓人在恐慌與失望之間擺盪，忘了要住在神的愛中等候。","檢驗標準：會眾聽完，是更安靜地仰望主的憐憫，還是更急著轉發末日的推算？","⑯ 因為怕 1:4「將我們神的恩變作放縱情慾的機會」，講台就不敢講恩典，改用加條件、加規矩、加恐嚇來保守人：「恩典講太多，大家就會放縱。」","猶大反對的是把恩典「變作」放縱，不是恩典本身；同一封信開頭就是「願憐恤、平安、慈愛多多地加給你們」（1:2），結尾是仰望憐憫直到永生（1:21）。救人的恩典本身就「教訓我們除去不敬虔的心和世俗的情慾」（多 2:12）；用律法主義防放縱，只是換一種方式不認獨一的主宰。","檢驗標準：會眾聽完，是更深地領受恩典、也因此更願意聖潔，還是覺得恩典很危險、只好靠自己守規矩？"]}],"txt":{"1":["耶穌基督的僕人，雅各的弟兄猶大，寫信給那被召、在父神裡蒙愛、為耶穌基督保守的人。","願憐恤、平安、慈愛多多地加給你們。","親愛的弟兄啊，我想盡心寫信給你們，論我們同得救恩的時候，就不得不寫信勸你們，要為從前一次交付聖徒的真道竭力地爭辯。","因為有些人偷著進來，就是自古被定受刑罰的，是不虔誠的，將我們神的恩變作放縱情慾的機會，並且不認獨一的主宰－我們主耶穌基督。","從前主救了他的百姓出埃及地，後來就把那些不信的滅絕了。這一切的事，你們雖然都知道，我卻仍要提醒你們。","又有不守本位、離開自己住處的天使，主用鎖鍊把他們永遠拘留在黑暗裡，等候大日的審判。","又如所多瑪、蛾摩拉和周圍城邑的人，也照他們一味地行淫，隨從逆性的情慾，就受永火的刑罰，作為鑑戒。","這些做夢的人也像他們污穢身體，輕慢主治的，毀謗在尊位的。","天使長米迦勒為摩西的屍首與魔鬼爭辯的時候，尚且不敢用毀謗的話罪責他，只說：「主責備你吧！」。","但這些人毀謗他們所不知道的。他們本性所知道的事與那沒有靈性的畜類一樣，在這事上竟敗壞了自己。","他們有禍了！因為走了該隱的道路，又為利往巴蘭的錯謬裡直奔，並在可拉的背叛中滅亡了。","這樣的人在你們的愛席上與你們同吃的時候，正是礁石。他們作牧人，只知餵養自己，無所懼怕；是沒有雨的雲彩，被風飄蕩；是秋天沒有果子的樹，死而又死，連根被拔出來；","是海裡的狂浪，湧出自己可恥的沫子來；是流蕩的星，有墨黑的幽暗為他們永遠存留。","亞當的七世孫以諾曾預言這些人說：「看哪，主帶著他的千萬聖者降臨，","要在眾人身上行審判，證實那一切不敬虔的人所妄行一切不敬虔的事，又證實不敬虔之罪人所說頂撞他的剛愎話。」","這些人是私下議論，常發怨言的，隨從自己的情慾而行，口中說誇大的話，為得便宜諂媚人。","親愛的弟兄啊，你們要記念我們主耶穌基督之使徒從前所說的話。","他們曾對你們說過，末世必有好譏誚的人隨從自己不敬虔的私慾而行。","這就是那些引人結黨、屬乎血氣、沒有聖靈的人。","親愛的弟兄啊，你們卻要在至聖的真道上造就自己，在聖靈裡禱告，","保守自己常在神的愛中，仰望我們主耶穌基督的憐憫，直到永生。","有些人存疑心，你們要憐憫他們；","有些人你們要從火中搶出來，搭救他們；有些人你們要存懼怕的心憐憫他們，連那被情慾沾染的衣服也當厭惡。","那能保守你們不失腳、叫你們無瑕無疵、歡歡喜喜站在他榮耀之前的我們的救主－獨一的神，","願榮耀、威嚴、能力、權柄，因我們的主耶穌基督歸與他，從萬古以前並現今，直到永永遠遠。阿們！"]},"blk":{"1":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·</p><p lang=\"grc\">ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη πληθυνθείη.</p>","lit":"<p>猶大，耶穌基督的奴僕，雅各的兄弟，寫給那些在父神裡蒙愛、為耶穌基督被保守著的蒙召之人：</p><p>願憐憫、平安、愛，多多地加給你們。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἰησοῦ Χριστοῦ δοῦλος</td><td>Iēsou Christou doulos</td><td>耶穌基督的奴僕</td><td>不提血緣，只提主權</td></tr><tr><td>ἀδελφὸς δὲ Ἰακώβου</td><td>adelphos de Iakōbou</td><td>而是雅各的兄弟</td><td>讓讀者認得他：耶路撒冷教會的雅各</td></tr><tr><td>ἐν θεῷ πατρὶ ἠγαπημένοις</td><td>en theō patri ēgapēmenois</td><td>在父神裡蒙愛的</td><td>◆ 完成式被動；RP 作「成聖」</td></tr><tr><td>Ἰησοῦ Χριστῷ τετηρημένοις</td><td>Iēsou Christō tetērēmenois</td><td>為耶穌基督被保守著的</td><td>◆ 完成式被動；追蹤一第一站</td></tr><tr><td>κλητοῖς</td><td>klētois</td><td>蒙召的人</td><td>放在句末，是整句的主體</td></tr><tr><td>ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη</td><td>eleos hymin kai eirēnē kai agapē</td><td>憐憫、平安、愛給你們</td><td>三樣福分；追蹤三第一站</td></tr><tr><td>πληθυνθείη</td><td>plēthyntheiē</td><td>願它多多地增加</td><td>祈願語氣，新約少見</td></tr></table>","gram":"<p><strong>δοῦλος（doulos） 與「弟兄」。</strong>猶大介紹自己只用兩個名詞：Ἰησοῦ Χριστοῦ δοῦλος（Iēsou Christou doulos），ἀδελφὸς δὲ Ἰακώβου（adelphos de Iakōbou）。δοῦλος（doulos） 是奴僕，是屬於主人、沒有自己名分的人。本講義採教會傳統與多數學者的看法：這位猶大是主耶穌的肉身兄弟（太 13:55；可 6:3），哥哥雅各是耶路撒冷教會的領袖（徒 15:13；加 1:19）。他對雅各用 ἀδελφός（adelphos），對耶穌卻不用，只用 δοῦλος（doulos）。雅各寫信也是同一個姿態：「作神和主耶穌基督僕人的雅各」（雅 1:1）。兩兄弟都不打血緣這張牌。其他說法（十二使徒中的「雅各的兒子猶大」〔路 6:16〕、託名之作）並陳於議題頁〈作者、收信人與正典地位：「雅各的弟兄猶大」是誰？這封信怎樣被接納為正典？〉；「雅各的兄弟」這個介紹，最自然的讀法仍是前者。</p><p><strong>描寫讀者的三個字都是被動的。</strong>τοῖς ἐν θεῷ πατρὶ ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς（tois en theō patri ēgapēmenois kai Iēsou Christō tetērēmenois klētois）：兩個完成式被動分詞，加上一個動詞性形容詞。κλητοῖς（klētois） 放在最後，是這句話的主體「蒙召的人」，前兩個分詞是在描寫他們。完成式說的是：蒙愛、被保守已經發生，結果到今天仍然有效。三個字都沒有一個是讀者自己做的；讀者是被神作成的人。τετηρημένοις（tetērēmenois） 是全卷主追蹤 τηρέω（tēreō） 的第一站，下面在 6、13、21 節還會再出現，24 節換成 φυλάξαι（phylaxai） 收尾。</p><p><strong>Ἰησοῦ Χριστῷ（Iēsou Christō） 沒有介系詞。</strong>這個單純的與格有兩讀：①利益與格，「為耶穌基督」被保守：保留給主，直到祂再來的日子，和合本照這個讀法；②工具與格，「被耶穌基督」保守、靠著祂被保守。兩讀殊途同歸：保守是神作的，終點是主自己。本講義以①為主，②也合乎全卷，因為 24--25 節說保守我們的是「獨一的神」，而且是「因我們的主耶穌基督」。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg、NA28 作 ἠγαπημένοις（ēgapēmenois）「蒙愛」，和合本「在父神裡蒙愛」照這個讀法；RP（拜占庭多數抄本）作 ἡγιασμένοις（hēgiasmenois）「成聖」。「在父神裡蒙愛」是不常見的說法，抄寫者較可能照林前 1:2「在基督耶穌裡成聖」的熟悉句型改成「成聖」，而不是反過來；較早的抄本也支持「蒙愛」。本講義從 SBLGNT 與和合本。</p></blockquote><p><strong>πληθυνθείη（plēthyntheiē） 是祈願語氣。</strong>祈願語氣在新約裡不多見；彼得前後書的問安也用這個字（彼前 1:2；彼後 1:2）。猶大列了三樣：ἔλεος（eleos）、εἰρήνη（eirēnē）、ἀγάπη（agapē）。保羅的問安通常是「恩惠、平安」；猶大把憐憫放在第一位，而 ἀγάπη（agapē） 又回應 1 節的「蒙愛」。ἔλεος（eleos） 是追蹤三的第一站，21、22、23 節還會出現三次：領受憐憫的人，後來成了給出憐憫的人。</p>","exp":"<p>〔背景〕約 7:3--5；徒 1:14--14（約翰福音講義第 7 章；使徒行傳講義第 1 章）</p><p>「耶穌基督的僕人，雅各的弟兄猶大」（1:1）。這是一個本來可以寫「耶穌的弟弟」的人。那是全世界最耀眼的頭銜，他卻一個字都沒有用。</p><p>福音書沒有替他美化過去。主在加利利傳道的時候，弟兄們催祂上猶太去顯揚名聲，約翰冷冷地補了一句：「因為連他的弟兄說這話，是因為不信他」（約 7:5）。更早的時候，親屬甚至出來要拉住祂，「因為他們說他癲狂了」（可 3:21）。是復活改變了這個家。主復活以後，樓上同心合意恆切禱告的人中間，有「耶穌的弟兄」（徒 1:14）。從不信到僕人，中間是一位活過來的哥哥。</p><p>所以「僕人」這兩個字不是客套。一個與耶穌同桌吃飯長大、看過這位「木匠」（可 6:3）做工、家裡曾有人說祂癲狂了的弟弟，後來稱祂為主人，稱自己為奴僕。這是全新約最安靜的一個「無己」。講這一節，焦點不在猶大有多謙卑，在那位能把一個不信的弟弟變成僕人的主。今天坐在教會裡、家人還不信的人，可以從這裡得著盼望：神改變人，連最近、最不服的那一位都改變得了。</p><p>接著猶大說讀者是誰：「寫信給那被召、在父神裡蒙愛、為耶穌基督保守的人」（1:1）。這封信等一下要講偷著進來的人、被拘留的天使、所多瑪、墨黑的幽暗。可是在任何一句警告之前，猶大先把讀者安放好：你們是被召的，是蒙愛的，是被保守的。三個字都是神作的。一個人讀到 4 節「自古被定受刑罰的」心裡發緊，讀到 13 節「墨黑的幽暗」心裡發冷，都要回到這一節來：「為耶穌基督保守的人」（1:1）。全卷的確據從這裡起頭，在 24 節的「能保守你們不失腳」收尾，中間的黑暗夾在兩次「保守」之間。</p><p>「願憐恤、平安、慈愛多多地加給你們」（1:2）。一封要人為真道竭力爭辯的信，第一個祝福是憐恤。這個次序很要緊：先被憐恤的人，爭辯的時候才不會忘了自己也是靠憐恤站著的。猶大求的也不是一點點，是「多多地加給」。爭戰的日子，神的供應不是配給的。</p><p>321 說無己：主的弟弟稱自己為僕人。也說 235 的「2」是屬靈同伴：「雅各的弟兄」這幾個字背後，是曾經一同不信、後來一同作僕人的兩兄弟。</p>"},{"a":3,"z":4,"star":3,"grk":"<p lang=\"grc\">Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.</p><p lang=\"grc\">παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.</p>","lit":"<p>蒙愛的人哪，我正用盡一切殷勤要寫信給你們，論到我們共同的救恩，就覺得不得不寫信給你們，勸你們要為那一次而永遠交付給聖徒的信仰，奮力爭戰。</p><p>因為有些人悄悄溜了進來——他們是從前早已被寫下、歸於這個審判的人——是不敬虔的，把我們神的恩典轉成放蕩，並且否認我們唯一的主宰和主耶穌基督。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀγαπητοί</td><td>Agapētoi</td><td>蒙愛的人哪</td><td>追蹤四；和合本補「弟兄」</td></tr><tr><td>πᾶσαν σπουδὴν ποιούμενος γράφειν</td><td>pasan spoudēn poioumenos graphein</td><td>正用盡殷勤要寫</td><td>現在式：本來的計畫</td></tr><tr><td>ἀνάγκην ἔσχον γράψαι</td><td>anankēn eschon grapsai</td><td>不得不寫</td><td>不定過去式：一封信被迫改題</td></tr><tr><td>ἐπαγωνίζεσθαι</td><td>epagōnizesthai</td><td>為……奮力爭戰</td><td>◆◆ 新約僅此一次；競技場的字</td></tr><tr><td>τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει</td><td>tē hapax paradotheisē tois hagiois pistei</td><td>為那一次交付聖徒的信仰</td><td>◆ ἅπαξ：一次而永遠</td></tr><tr><td>παρεισέδυσαν</td><td>pareisedysan</td><td>從旁溜進來</td><td>◆◆ 新約僅此一次</td></tr><tr><td>οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα</td><td>hoi palai progegrammenoi eis touto to krima</td><td>早已被寫下、歸於這審判的</td><td>◆◆ 早已寫下的結局，不是對人宣判</td></tr><tr><td>χάριτα μετατιθέντες εἰς ἀσέλγειαν</td><td>charita metatithentes eis aselgeian</td><td>把恩典轉成放蕩</td><td>恩典被講成許可證</td></tr><tr><td>τὸν μόνον δεσπότην καὶ κύριον ἡμῶν</td><td>ton monon despotēn kai kyrion hēmōn</td><td>唯一的主宰和我們的主</td><td>◆ 一個冠詞統管兩個稱號</td></tr></table>","gram":"<p><strong>一封信被迫改了題目。</strong>πᾶσαν σπουδὴν ποιούμενος γράφειν（pasan spoudēn poioumenos graphein） 是現在分詞加現在式不定詞：猶大「正在」用盡心力預備寫一封論「我們同得的救恩」的信；ἀνάγκην ἔσχον γράψαι（anankēn eschon grapsai） 換成不定過去式：某一刻，他「不得不」寫另一封。ἀνάγκη（anankē） 是逼迫、不得已。περὶ τῆς κοινῆς ἡμῶν σωτηρίας（peri tēs koinēs hēmōn sōtērias）：κοινός（koinos） 是「共同的」，不分你我、大家一起有分的救恩。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg、NA28 有 ἡμῶν（hēmōn），作「我們共同的救恩」，和合本「我們同得救恩」與此相合；RP 沒有 ἡμῶν（hēmōn），只作「共同的救恩」。兩讀意思幾乎一樣，「共同的」本身就含著「我們」。本講義從 SBLGNT。</p></blockquote><p><strong>ἐπαγωνίζεσθαι（epagōnizesthai） 是競技場的字。</strong>新約只出現這一次。字根 ἀγών（agōn） 是比賽、競技場、摔角場；來 12:1「奔那擺在我們前頭的路程」的「路程」就是 ἀγῶνα（agōna）。前面加上 ἐπί（epi），是「為某一樣東西全力以赴」。這是運動員為獎賞拼搏的畫面，不是吵架，也不是罵人。同字根的 ἀγωνίζου（agōnizou） 出現在「你要為真道打那美好的仗」（提前 6:12）；保羅也要腓立比人「為所信的福音齊心努力」（腓 1:27），那裡用的是另一個運動場的字 συναθλοῦντες（synathlountes）。</p><p><strong>爭的是甚麼。</strong>不定詞的受詞是與格 τῇ（tē）……πίστει（pistei），「為了那信仰」。πίστις（pistis） 在這裡不是信的動作，是所信的內容，和合本譯作「真道」很準確。ἅπαξ（hapax） 是「一次而永遠」，與來 9:26--28 說基督「一次」獻上用同一個字；παραδοθείσῃ（paradotheisē） 是不定過去式被動分詞，交付已經完成；παραδίδωμι（paradidōmi） 是傳承的字，保羅說「我當日所領受又傳給你們的」（林前 15:3）也用它。交給的對象是 τοῖς ἁγίοις（tois hagiois），聖徒群體，不是哪一位領袖私人保管。</p><p>「一次交付」有兩種理解：①福音的核心已經完整交付，不需要新的啟示來補；②一切教義細節、宗派傳統都已凍結，任何新的解釋都是背離。本講義取①不取②：猶大要擋的是 8 節那些「做夢的人」，他們想用異夢補充、甚至改寫使徒的福音；可是這不等於我們今天的每一個解釋、每一個宗派特色都等於那「一次交付的真道」。這個問題詳見議題頁〈「一次交付聖徒的真道」是甚麼？「竭力爭辯」與愛怎樣並存？〉。</p><p><strong>4 節用 γάρ（gar） 起頭</strong>，說明為甚麼不得不寫。παρεισέδυσαν（pareisedysan） 新約只出現這一次：παρά（para）「從旁」、εἰς（eis）「進入」、δύνω（dynō）「沉入、潛入」，像從籬笆縫鑽進羊圈，不走正門。保羅向加拉太人提到耶路撒冷那些「偷著引進來的假弟兄」（加 2:4），用的是意思相近的 παρεισάκτους（pareisaktous）。他們不是外面的逼迫者，是已經在裡面的人。</p><p><strong>οἱ πάλαι προγεγραμμένοι（hoi palai progegrammenoi） 有兩讀。</strong>προγράφω（prographō） 字面是「預先寫下」，羅 15:4「從前所寫的聖經」用的就是它；和合本譯作「自古被定」。①<strong>早已寫下的結局</strong>：πάλαι（palai）「很久以前」，指舊約的例子與以諾的預言，早已把這類人的結局寫下；猶大接下來 5--16 節列的，正是那些「寫下的」，多數解經家這樣讀。②<strong>預定沉淪</strong>：神在永恆裡把某些人預定受刑罰。②的難處是：προγράφω（prographō） 在新約其他地方都是寫下或公開地描繪的意思（羅 15:4；加 3:1），不是預定的術語；而且 κρίμα（krima） 前面有 τοῦτο（touto），「這個審判」，指的是下文寫下的審判。本講義取①：被寫定的是這條路與它的審判，不是今天哪一個人的名字。</p><p><strong>τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν（tēn tou theou hēmōn charita metatithentes eis aselgeian）。</strong>χάριτα（charita） 是 χάρις（charis） 少見的寫法。μετατίθημι（metatithēmi） 是「轉移、改換」，保羅希奇加拉太人「離開那藉著基督之恩召你們的，去從別的福音」（加 1:6），「離開」就是這個字。ἀσέλγεια（aselgeia） 是不受約束的放縱，常指性方面。恩典被他們改了用途：從救人脫離罪，改成讓人安心犯罪的許可證。</p><p><strong>一個冠詞統管兩個名詞。</strong>τὸν μόνον δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν（ton monon despotēn kai kyrion hēmōn Iēsoun Christon）：冠詞 τὸν（ton） 同時管 δεσπότην（despotēn） 與 κύριον（kyrion）。照希臘文的常例（學界稱 Granville Sharp 規則：兩個單數、指人的普通名詞被同一個冠詞統管、以 καί（kai） 相連，通常指同一位），「獨一的主宰」與「我們的主」同指耶穌基督。和合本用破折號「獨一的主宰－我們主耶穌基督」表達這個同位；和合本的小字註「或譯：和我們」，則把「獨一的主宰」讀成父神、「我們的主耶穌基督」是另一位。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg、NA28 作 τὸν μόνον δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν（ton monon despotēn kai kyrion hēmōn Iēsoun Christon）；RP 在 δεσπότην（despotēn） 後加 θεόν（theon），作「獨一的主宰神，和我們的主耶穌基督」，分成兩位的讀法就更明顯。θεόν（theon） 不見於較早的抄本，可能是抄寫者為了區分父與子而加。本講義從 SBLGNT 與和合本正文：獨一的主宰就是耶穌基督。δεσπότης（despotēs） 是奴僕的主人，正對著 1 節的 δοῦλος（doulos）：猶大自稱奴僕，那些人卻不認主人。ἀρνούμενοι（arnoumenoi） 是現在分詞，「不認」是持續的生活樣式，多半是用行為否認，不一定是口頭（多 1:16）。</p></blockquote>","exp":"<p>〔彼後〕彼後 2:1--3（彼得後書講義第 2 章）</p><p>「親愛的弟兄啊，我想盡心寫信給你們，論我們同得救恩的時候，就不得不寫信勸你們，要為從前一次交付聖徒的真道竭力地爭辯」（1:3）。猶大本來要寫的是救恩的豐富，大家同得的那一份恩典。提筆以後，他發現羊圈的籬笆被鑽了洞。他把想寫的那封放下，寫了一封不得不寫的。</p><p>這是牧者最真實的處境。我們想講恩典的豐富，有時候必須先守住恩典不被扭曲。可是要留意：那封沒寫成的信並沒有消失。「我們同得的救恩」仍然是這封急信的地基；猶大要守的，正是他本來想歌頌的。爭辯不是救恩以外的另一個題目，是為了救恩不被改寫。</p><p>「竭力地爭辯」是全卷最容易被誤用的一句話。原文是競技場上的字：運動員為獎賞拼搏，摔角手全力以赴。它不是吵架，不是辯贏，更不是羞辱對方。爭的對象，猶大寫得清清楚楚，是「從前一次交付聖徒的真道」，不是人，不是自己的面子，也不是自己宗派的特色。爭的方式，猶大在同一封信裡自己示範了：9 節米迦勒不用毀謗的話，只說「主責備你吧」；20--21 節先保守自己在神的愛中；22--23 節憐憫存疑心的，從火中搶救人。所以這一節不能拿來合理化網路上的論戰，或羞辱持不同意見的弟兄姊妹。用驕傲的方式捍衛真道，在守住真道之前，已經先丟了真道的樣子。</p><p>「一次交付」也給我們一個安穩。真道不是每一季要改版的產品，不需要等待更新的異夢來補充。神在基督裡說的話已經說完全了，使徒已經傳下來了，我們要做的是領受、持守、傳下去。這不是說每一代都不必思考，而是說我們不必追逐每一個「新的啟示」。福音夠用。</p><p>「因為有些人偷著進來」（1:4）。他們不是城外攻城的敵軍，是已經坐在桌邊、一起吃愛筵的人（1:12）。猶大給的是記號，不是名單：一，「將我們神的恩變作放縱情慾的機會」（1:4）；二，「不認獨一的主宰－我們主耶穌基督」（1:4）。今天的講台與小組也只該教記號，不點名任何牧者、教會、宗派或網路傳道人。記號先照自己：我有沒有把「神反正會赦免」當成放縱的理由？我口裡稱祂為主，生活裡誰在作主？</p><p>恩典被講成許可證，是最古老的誤用。保羅早就回答過：「我們可以仍在罪中、叫恩典顯多嗎？斷乎不可！」（羅 6:1--2）。真正的恩典把人從罪裡救出來，不是讓人在罪裡住得更安心。</p><p>「就是自古被定受刑罰的」（1:4）這一句，要讀準。原文是「早已寫下的」：舊約的例子與以諾的預言，早已把這條路的結局寫下來了，猶大接著 5--16 節一一列出。被寫定的是這條路通往哪裡，不是今天哪一個人的名字。猶大沒有對任何人宣判，講台也不可以。一位讀到這裡心裡發慌、問「我是不是被定了」的弟兄姊妹，要被帶回這封信的頭尾：你是「為耶穌基督保守的人」（1:1），而神是「那能保守你們不失腳」的那一位（1:24）。會為這個問題不安的人，多半正是在乎主的人。</p><p>321 說讓耶穌作王：主宰是「獨一」的，不容第二位，也不容我自己。也說耶穌是我的榜樣：那些人用生活不認的，正是我們要一步一步跟從的那一位。聖經是我的準則：準則是「一次交付」的，不是不斷翻新的。</p>"},{"a":5,"z":7,"star":3,"grk":"<p lang=\"grc\">Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ὑμᾶς ἅπαξ πάντα ὅτι Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,</p><p lang=\"grc\">ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·</p><p lang=\"grc\">ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον τρόπον τούτοις ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.</p>","lit":"<p>雖然你們一次就已經完全知道了一切，我仍然願意提醒你們：耶穌救了百姓出埃及地以後，第二次就把那些不信的毀滅了。</p><p>還有那些沒有守住自己的權位、反而離開自己居所的天使，他用永遠的鎖鏈，把他們看守在幽暗之下，等候那大日的審判；</p><p>正如所多瑪、蛾摩拉和周圍的城，也照著與這些相同的方式行淫，去追隨另一種肉體，擺在那裡作為一個樣本，承受永火的刑罰。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι</td><td>Hypomnēsai de hymas boulomai</td><td>我願意提醒你們</td><td>提醒，不是教新東西</td></tr><tr><td>εἰδότας ὑμᾶς ἅπαξ πάντα</td><td>eidotas hymas hapax panta</td><td>你們一次就知道了一切</td><td>ἅπαξ 第二次出現</td></tr><tr><td>Ἰησοῦς</td><td>Iēsous</td><td>耶穌</td><td>◆◆ 異文：WH、Treg κύριος；RP ὁ κύριος＝和合本「主」</td></tr><tr><td>τὸ δεύτερον</td><td>to deuteron</td><td>第二次、後來</td><td>蒙救的群體，後來也有人倒下</td></tr><tr><td>τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν</td><td>tous mē tērēsantas tēn heautōn archēn</td><td>那些沒有守住自己權位的</td><td>◆◆ 追蹤一第二站</td></tr><tr><td>ἀπολιπόντας τὸ ἴδιον οἰκητήριον</td><td>apolipontas to idion oikētērion</td><td>離開了自己的居所</td><td>越界</td></tr><tr><td>δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν</td><td>desmois aidiois hypo zophon tetērēken</td><td>用永遠的鎖鍊看守在幽暗之下</td><td>◆ 追蹤一第三站：翻轉</td></tr><tr><td>ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας</td><td>apelthousai opisō sarkos heteras</td><td>去追隨別的肉體</td><td>◆◆ 三讀並陳</td></tr><tr><td>πρόκεινται δεῖγμα</td><td>prokeintai deigma</td><td>擺在那裡作樣本</td><td>現在式：至今仍擺著</td></tr></table>","gram":"<p><strong>ἅπαξ（hapax） 第二次出現。</strong>3 節真道「一次」交付給聖徒，5 節 εἰδότας ὑμᾶς ἅπαξ πάντα（eidotas hymas hapax panta）「你們一次就已經知道了一切」。真道一次交付，你們也一次就領受了；所以猶大用的動詞是 Ὑπομνῆσαι（Hypomnēsai）「提醒」，不是「教導」。ἅπαξ（hapax） 也有人連到下文，與 τὸ δεύτερον（to deuteron）「第二次、後來」成對：主「一次」救了百姓，「第二次」滅絕不信的。兩讀都通，SBLGNT 的字序較支持前者。</p><blockquote><p>◆ 經文鑑別（新約經文鑑別最有名的難題之一）：SBLGNT、NA28 作 Ἰησοῦς（Iēsous）「耶穌救了百姓出埃及地」；WH、Treg 作 κύριος（kyrios）；RP、NIV 作 ὁ κύριος（ho kyrios），和合本「主」照這個讀法；另有少數抄本作 θεός（theos）。外證上，「耶穌」有相當古老而分布廣的抄本支持（如 A、B、33 等）；內證上，「耶穌救百姓出埃及」是較難的讀法，抄寫者較可能把它改成順口的「主」，很難想像有人把「主」改成「耶穌」。若讀 Ἰησοῦς（Iēsous），猶大是說先存的基督在出埃及時就在拯救、也在審判，這使我們想起保羅說「那磐石就是基督」（林前 10:4）；若讀 κύριος（kyrios），所指可以是父神，也可以是基督。本講義判斷：原文欄照 SBLGNT，講台照和合本講「主」，並在議題頁〈救百姓出埃及的是「主」還是「耶穌」？〉說明。兩讀都不改變本節的重點：救人的與審判不信的，是同一位主。另 SBLGNT 作 ἅπαξ πάντα（hapax panta）「一切」，RP 作 τοῦτο（touto）「這事」，意思相近。</p></blockquote><p><strong>τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν（tous mē tērēsantas tēn heautōn archēn）。</strong>ἀρχή（archē） 有「起初」的意思，也有「權位、管轄範圍」的意思（弗 1:21 的「執政的」、西 1:16 的 ἀρχαὶ（archai））；這裡指神分派給天使的位置與職分，和合本譯作「本位」很傳神。ἀπολιπόντας τὸ ἴδιον οἰκητήριον（apolipontas to idion oikētērion）：οἰκητήριον（oikētērion） 是居所，新約另一次在林後 5:2，指「從天上來的房屋」；ἴδιον（idion） 是「屬於自己的」，神分給他們的那一份。兩個分詞一負一正：沒有守住，反而離開。</p><p><strong>同一節裡 τηρέω（tēreō） 出現兩次，意思翻轉。</strong>μὴ τηρήσαντας（mē tērēsantas）……τετήρηκεν（tetērēken）：他們不肯「守」自己的位置，神就把他們「守」在永遠的鎖鍊裡。τετήρηκεν（tetērēken） 是完成式，看守至今仍在。和合本譯作「不守」與「拘留」，中文看不出是同一個字；原文卻像一面鏡子：不肯守本位的，被鎖鍊守住。ζόφον（zophon）「幽暗」13 節還會再出現。</p><p><strong>6 節的天使是誰，三讀並陳。</strong>①創 6:1--4「神的兒子們」是天使，與人的女子交合。這是第二聖殿時期猶太人普遍的讀法，《以諾一書》6--10 章詳述，猶大的讀者很熟悉；7 節說所多瑪「也照他們」隨從別的肉體，把天使與所多瑪並列，兩者都越過了「肉體」的界限，支持這讀。難處是主說復活的人「乃像天上的使者一樣」（太 22:30），不娶也不嫁。②指撒但與一部分天使起初的墮落，與創 6 無關（啟 12:7--9）。③創 6 的「神的兒子們」是塞特的後裔，6 節另指天使的墮落；難處是要說明 7 節為甚麼說所多瑪「照他們一樣」。本講義並陳，傾向不裁判：6 節的重點不在天使的身分，在連天使不守本位都逃不過審判。不從這一節另外建構天使學。</p><p><strong>σαρκὸς ἑτέρας（sarkos heteras） 三讀。</strong>τούτοις（toutois）「他們」是陽性複數，最自然指 6 節的天使，而不是陰性的「城邑」。ἐκπορνεύσασαι（ekporneusasai） 的 ἐκ（ek） 有加強的意思，和合本「一味地行淫」；ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας（apelthousai opisō sarkos heteras） 字面是「去追隨別的肉體」。①指同性的性行為：所多瑪人要與住在羅得家的客人交合（創 19:4--5）；②指人與天使的越界：所多瑪人追求的那兩位客人其實是天使（創 19:1），正好與 6 節天使越界追求人倒過來；③兩者都在內，重點是越過神所定的界限。本講義判斷：③最能容納經文，ἑτέρας（heteras）「另一類」強調的是越界本身；同時本講義持守聖經的性倫理（羅 1:26--27；林前 6:9--11），不因讀法有爭議就把它講空；也不拿它羞辱任何人，這是鑑戒，先照自己。</p><p><strong>δεῖγμα（deigma） 是樣本、展示品。</strong>πρόκεινται（prokeintai） 是現在式，「擺在那裡」：猶大寫信的時候，死海一帶（傳統上認為在南岸）的荒涼仍在那裡給人看。δίκην ὑπέχουσαι（dikēn hypechousai） 是「承受刑罰」。鑑戒不是為了讓人嘲笑所多瑪，是為了讓看見的人回頭看自己。</p>","exp":"<p>〔舊約〕民 14:26--35（民數記講義第 14 章）</p><p>〔舊約〕創 6:1--4（創世記講義第 6 章）</p><p>〔舊約〕創 19:4--11（創世記講義第 19 章）</p><p>〔彼後〕彼後 2:4--6（彼得後書講義第 2 章）</p><p>「這一切的事，你們雖然都知道，我卻仍要提醒你們」（1:5）。猶大沒有新東西要教。屬靈的危險很少是因為不知道，多半是因為忘了。所以他舉了三個大家都聽過的例子，像把三張舊照片重新擺在桌上。</p><p>第一張照片最令人不安：「從前主救了他的百姓出埃及地，後來就把那些不信的滅絕了」（1:5）。這些人過了紅海，吃過嗎哪，看過雲柱火柱；可是到了加低斯，他們不肯信神能帶他們進去。神說：「你們的屍首必倒在這曠野」（民 14:29）。本系列民數記講義第 14 章講過那一夜的哭聲。猶大把這個例子放在第一個，意思很清楚：鑑戒的對象是蒙救的百姓，所以要先照自己。這不是要製造「我會不會也失去救恩」的恐懼；這一張照片要擋住的，是把恩典當成保險、可以一路不信下去的人。全卷的立場見〈被保守與保守自己：神保守我，為甚麼還要我保守自己？〉。和合本讀作「主」，原文有一個古老的讀法是「耶穌」；不論哪一讀，救人的與審判人的是同一位。</p><p>第二張照片在天上：「又有不守本位、離開自己住處的天使，主用鎖鍊把他們永遠拘留在黑暗裡，等候大日的審判」（1:6）。猶大沒有說這些天使是誰、怎樣墮落；他說的是結局。連天使這樣高的受造物，離開了神所分派的位置，都逃不過審判。神的審判是確定的，地位再高也不能豁免。原文的鏡子要讀出來：他們不肯「守」，就被神「守」住。這一個字 τηρέω（tēreō） 會一路走到 21 節：「保守自己常在神的愛中」（1:21）。同樣一個「守」，一邊是鎖鍊，一邊是神的愛。</p><p>第三張照片在地上：「又如所多瑪、蛾摩拉和周圍城邑的人，也照他們一味地行淫，隨從逆性的情慾，就受永火的刑罰，作為鑑戒」（1:7）。這一節要誠實地講。本講義持守聖經的性倫理：保羅在羅 1:26--27 與林前 6:9--11 說得很清楚，神所定的界限不因時代改變。同時要並陳所多瑪的罪不只一項：「她和她的眾女都心驕氣傲，糧食飽足，大享安逸，並沒有扶助困苦和窮乏人的手」（結 16:49）。驕傲、飽足、安逸、不扶助窮人，和越界的情慾，一起堆成了那座城的罪。</p><p>所以講這一節，不羞辱、不嘲笑、不給任何群體或個人貼標籤；也不因為怕爭議而略過。保羅列完那張罪的清單，緊接著說：「你們中間也有人從前是這樣；但如今你們……已經洗淨」（林前 6:11）。同一段經文指出罪，也宣告洗淨。一位在性的方面正在掙扎、想跟隨主的弟兄姊妹，聽完這一節，應該覺得被接住：這張照片指著越界之路的終點，也指著已經為他預備好的恩典與悔改的路。而對其餘的人，結 16:49 是一面很近的鏡子：驕傲、飽足、安逸、對窮人關上手，有哪一樣與我們無關？8 節馬上會說「這些……人也像他們」，鑑戒先照自己。</p><p>三張照片有一個共同點：都是越過了神所定的界限。百姓不肯留在信靠裡，天使不肯留在本位上，所多瑪不肯留在神所定的界限內。經文的意思講到這裡已經完整：神的審判是確定的，連蒙救的百姓與天使都不例外；越界的路，終點寫得清清楚楚。</p><p>這使我們想起 321 說的「驕傲是離開本位抓住權力」。ἀρχή（archē） 是神「所分派的位置」；越界去抓不屬於自己的，正是驕傲的形狀。也使我們想起它說的出路：謙卑，回到本位。被神放在哪裡，就在那裡忠心；那個位置不是牢籠，是神愛我們的地方。</p>"},{"a":8,"z":10,"star":2,"grk":"<p lang=\"grc\">Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.</p><p lang=\"grc\">ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.</p><p lang=\"grc\">οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.</p>","lit":"<p>然而照樣，這些人也在作夢中玷污肉體，棄絕主權，毀謗榮耀者。</p><p>可是天使長米迦勒，當他與魔鬼爭辯、為了摩西的身體辯論的時候，也不敢帶上一個毀謗的判決，只說：「願主斥責你。」</p><p>但這些人，凡他們所不知道的，就毀謗；凡他們像沒有理性的動物一樣憑本能所懂的，就在這些事上自取敗壞。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ὁμοίως μέντοι καὶ οὗτοι</td><td>Homoiōs mentoi kai houtoi</td><td>然而照樣，這些人也</td><td>第一次 οὗτοι：鑑戒是鏡子</td></tr><tr><td>ἐνυπνιαζόμενοι</td><td>enypniazomenoi</td><td>在作夢中的</td><td>自稱異夢啟示</td></tr><tr><td>σάρκα μὲν μιαίνουσιν</td><td>sarka men miainousin</td><td>玷污肉體</td><td>μέν……δέ……δέ 三件事</td></tr><tr><td>κυριότητα δὲ ἀθετοῦσιν</td><td>kyriotēta de athetousin</td><td>棄絕主權</td><td>◆ 多解作主的權柄</td></tr><tr><td>δόξας δὲ βλασφημοῦσιν</td><td>doxas de blasphēmousin</td><td>毀謗榮耀者</td><td>◆ 多解作天使</td></tr><tr><td>τῷ διαβόλῳ διακρινόμενος</td><td>tō diabolō diakrinomenos</td><td>與魔鬼爭辯</td><td>◆◆ 與 22 節「存疑心」同字</td></tr><tr><td>οὐκ ἐτόλμησεν</td><td>ouk etolmēsen</td><td>不敢</td><td>連天使長都不越位</td></tr><tr><td>Ἐπιτιμήσαι σοι κύριος</td><td>Epitimēsai soi kyrios</td><td>願主斥責你</td><td>◆◆ 祈願語氣；亞 3:2</td></tr><tr><td>τὰ ἄλογα ζῷα</td><td>ta aloga zōa</td><td>沒有理性的動物</td><td>只剩本能</td></tr></table>","gram":"<p><strong>猶大的寫法：例子，然後「這些人」。</strong>5--7 節舉了三個例子，8 節用 Ὁμοίως μέντοι καὶ οὗτοι（Homoiōs mentoi kai houtoi） 把例子套到眼前的人身上。這個指示代名詞 οὗτος（houtos） 在 5--19 節一再出現（8、10、12、14、16、19 節）：先舉經文或傳統的例子，再說「這些人就是……」，然後解釋。學界常拿昆蘭群體的 pesher 註釋來比較這種寫法：用舊約的話照亮眼前的處境。認出這個節奏，就知道猶大不是在罵人，是在讀經：每一個「這些人」前面，都有一段經文。</p><p><strong>ἐνυπνιαζόμενοι（enypniazomenoi）「做夢的」。</strong>同一個動詞出現在彼得五旬節引約珥的話：「老年人要做異夢」（徒 2:17）。夢本身不是罪；這些人多半自稱從異夢得了啟示，用夢來越過、改寫一次交付的真道。這使我們想起摩西的警告：「你也不可聽那先知或是那做夢之人的話」（申 13:3），也想起耶利米時代假先知喊的「我做了夢！我做了夢！」（耶 23:25）。</p><p><strong>μέν（men）……δέ（de）……δέ（de） 三件事。</strong>σάρκα（sarka） 肉體、κυριότητα（kyriotēta） 主權、δόξας（doxas） 榮耀者。κυριότης（kyriotēs） 有兩讀：①主（κύριος（kyrios））的權柄，與 4 節「不認……我們主耶穌基督」相應，多數解經家這樣讀；②天上的權勢，弗 1:21 與西 1:16 的「主治的」用同一個字。δόξας（doxas） 多數解作天使、榮耀的屬靈存在，彼後 2:10--11 也把「在尊位的」與天使並提。本講義判斷：這兩個字指的是主與天上的事，不是教會今天某一位領袖的職位或人格。</p><p><strong>διακρινόμενος（diakrinomenos） 與 22 節同字。</strong>διακρίνω（diakrinō） 在新約有「分辨、判斷」，也有「爭辯」和「疑惑」的意思。9 節米迦勒與魔鬼「爭辯」用 διακρινόμενος（diakrinomenos），22 節「有些人存疑心」用 διακρινομένους（diakrinomenous），是同一個字。一個與魔鬼爭辯的天使長，一個心裡正在爭辯的信徒：對前者，交給主；對後者，憐憫他。這是全卷第二顆珍珠。διελέγετο（dielegeto） 是未完成式，爭論持續了一段時間。</p><p><strong>出處與引用。</strong>米迦勒見但 10:13、21；12:1；啟 12:7；摩西的埋葬見申 34:5--6。米迦勒為摩西的屍首與魔鬼爭辯，舊約沒有記載。亞歷山大的革利免、俄利根等早期教父指出它出自《摩西升天記》；今存的拉丁文殘本缺了結尾，無法逐字核對。各說：①猶大承認該書為正典（極少數）；②猶大引用一個讀者熟悉的傳統作例證；③該傳統的這一段內容屬實，但書本身不是正典。本講義採②③：受默示的是猶大書，引用一段傳統不等於替整本書背書，正如保羅引用希臘詩人的話（徒 17:28；多 1:12）。講台不從這裡另建天使學，也不因此貶低猶大書。</p><p><strong>οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας（ouk etolmēsen krisin epenenkein blasphēmias）。</strong>κρίσιν βλασφημίας（krisin blasphēmias） 可以讀成「毀謗性的判決」，也可以讀成「定他毀謗之罪」；兩讀的重點相同：米迦勒不敢自己下判決。Ἐπιτιμήσαι（Epitimēsai） 是不定過去式祈願語氣，「願主斥責你」，把斥責交給主。這句話幾乎就是亞 3:2 的話。10 節兩個 ὅσα（hosa） 對照：ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν（hosa men ouk oidasin blasphēmousin） 不懂的就毀謗；ὅσα δὲ φυσικῶς（hosa de physikōs）……ἐπίστανται（epistantai） 憑本能懂的，ἐν τούτοις φθείρονται（en toutois phtheirontai） 正在那些事上敗壞。</p>","exp":"<p>〔彼後〕彼後 2:10--12（彼得後書講義第 2 章）</p><p>「這些做夢的人也像他們污穢身體，輕慢主治的，毀謗在尊位的」（1:8）。「也像他們」這四個字，把前面三張照片變成了鏡子。猶大不是要讀者拿著照片去對照別人，是先承認：不守本位的事，不只發生在遠古，也可以發生在今天的聚會裡。記號是三件事：污穢身體，輕慢主，毀謗屬靈的事。講台教記號，不給名單；記號先照自己。</p><p>這一節常被誤用。「輕慢主治的，毀謗在尊位的」，常被拿來堵住會眾對教會領袖的問題：「你質疑牧師，就是毀謗在尊位的。」經文不是這個意思。「主治的」多數指主的權柄或天上的權勢，「在尊位的」多數指天使；這裡沒有替任何一位今天的領袖築起免責的牆。猶大在 12 節定罪的，恰恰是「作牧人，只知餵養自己」的人。向領袖提出正當的質疑、要求交代、按著次序問責，不等於輕慢主治的；拒絕任何質疑的領袖，倒要小心自己是不是正在走「牧養自己」的路。</p><p>「天使長米迦勒為摩西的屍首與魔鬼爭辯的時候，尚且不敢用毀謗的話罪責他，只說：『主責備你吧！』」（1:9）。舊約說摩西死後，神親自埋葬他，「只是到今日沒有人知道他的墳墓」（申 34:6）。猶大引用一段當時讀者熟悉的傳統，說天使長為這個屍首與魔鬼起了爭論。引用一段傳統，不等於替那本書背書；我們也不必替這場爭論補細節。猶大要我們看的只有一件事：米迦勒怎樣說話。</p><p>他面對的是魔鬼，論理他最有資格罵。可是他「不敢」。他沒有自己坐上審判的位，只說：「主責備你吧！」這句話幾乎就是撒迦利亞看見的異象：「撒但哪，耶和華責備你！」（亞 3:2）。連天使長都不越位，把審判交還給主。這就是 3 節「竭力地爭辯」的示範：守住真理的人，不必替神坐上審判的位。</p><p>這一節也是「斥責魔鬼」最好的反面教材。有些聚會把斥責魔鬼當成表演，聲音越大越屬靈。米迦勒正好相反：最有權柄的天使長，用最安靜的一句話，把斥責交給主。屬靈爭戰的力量不在我們的音量，在主。</p><p>「但這些人毀謗他們所不知道的」（1:10）。對照很強烈：天使長知道得最多，卻不敢；這些人不知道，卻敢。他們只剩下像畜類一樣的本能，偏偏就在本能的事上敗壞了自己。越懂的人越謹慎，越不懂的人越大膽。321 說謙卑，回到本位：讓人作人，讓神作神。也說驕傲激起驕傲：用毀謗回應毀謗，自己就成了「這些人」的樣子。</p>"},{"a":11,"z":11,"star":2,"grk":"<p lang=\"grc\">οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.</p>","lit":"<p>他們有禍了！因為他們走了該隱的路，為了工價傾倒進巴蘭的錯謬裡，又在可拉的頂撞中滅亡了。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οὐαὶ αὐτοῖς</td><td>ouai autois</td><td>他們有禍了</td><td>先知的哀歌：哀哭也是警告</td></tr><tr><td>τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν</td><td>tē hodō tou Kain eporeuthēsan</td><td>走了該隱的路</td><td>對弟兄：嫉妒、殺害</td></tr><tr><td>τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν</td><td>tē planē tou Balaam misthou exechythēsan</td><td>為工價傾倒進巴蘭的錯謬</td><td>對錢：像水一樣衝進去</td></tr><tr><td>τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο</td><td>tē antilogia tou Kore apōlonto</td><td>在可拉的頂撞中滅亡了</td><td>對權柄：越位奪權</td></tr></table>","gram":"<p><strong>οὐαί（ouai） 是先知的哀歌。</strong>猶大用的是先知與主耶穌的語氣：太 23 章主對文士和法利賽人一連說了七次「有禍了」（有古卷多 14 節，就是八次）。οὐαί（ouai） 同時是哀哭與警告，不是幸災樂禍。</p><p><strong>三個平行的子句，三個不定過去式漸進。</strong>每一句都是「與格的名詞＋屬格的人名＋動詞」：τῇ ὁδῷ τοῦ Κάϊν（tē hodō tou Kain）、τῇ πλάνῃ τοῦ Βαλαὰμ（tē planē tou Balaam）、τῇ ἀντιλογίᾳ τοῦ Κόρε（tē antilogia tou Kore）。動詞一句比一句重：ἐπορεύθησαν（eporeuthēsan）「走了」，是開始上路；ἐξεχύθησαν（exechythēsan）「傾倒出去」，是 ἐκχέω（ekcheō） 的被動，像水被倒出來，一股腦衝進去；ἀπώλοντο（apōlonto）「滅亡了」，是終點。μισθοῦ（misthou） 是價錢的屬格，「為了工價」。</p><p><strong>ἀπώλοντο（apōlonto） 為甚麼是過去式？</strong>這些人還活著，猶大卻說他們「已經滅亡了」。兩讀：①先知式的不定過去式，把確定要發生的事說成已經發生；②猶大說的是可拉當年的滅亡，他們走進了那個故事。本講義兩讀並取：走上可拉的路，就已經站在那場滅亡裡了。</p><p><strong>三個人的猶太傳統。</strong>該隱在舊約只是殺弟兄的人（創 4:8）；到了第二聖殿時期，猶太傳統把他看作不信、嫉妒、教人犯罪的原型，約壹 3:12 與來 11:4 也從這個角度看他。巴蘭在民 22--24 章看似拒絕咒詛以色列，可是民 31:16 揭露他教摩押女子引誘以色列人行淫拜偶像，啟 2:14 也這樣記他。可拉是利未人，已經在會幕裡事奉，卻聯合眾人要奪亞倫祭司的職分（民 16:8--10）。ἀντιλογία（antilogia） 是「頂撞、反駁」，來 12:3「那忍受罪人這樣頂撞的」用同一個字。</p><p>三人大致代表三個方向：對弟兄（嫉妒到殺害）、對錢（為利引人犯罪）、對權柄（不滿足於本分而奪權）。這個分法是講台的歸納，不是猶大明寫的；但三個例子正好涵蓋了人際、財物、地位三個試探最深的地方。</p>","exp":"<p>〔舊約〕創 4:3--8（創世記講義第 4 章）</p><p>〔舊約〕民 22:5--7（民數記講義第 22 章）</p><p>〔舊約〕民 16:1--3；民 16:31--33（民數記講義第 16 章）</p><p>〔彼後〕彼後 2:15--16（彼得後書講義第 2 章）</p><p>「他們有禍了！因為走了該隱的道路，又為利往巴蘭的錯謬裡直奔，並在可拉的背叛中滅亡了」（1:11）。這一節是一聲哀嘆。猶大列出三個名字，像三條往下的路。</p><p>第一條是該隱的路。神在出事以前就警告過他：「罪就伏在門前。它必戀慕你，你卻要制伏它」（創 4:7）。他沒有制伏，嫉妒長成了殺害。約翰說：「不可像該隱；他是屬那惡者，殺了他的兄弟」（約壹 3:12）。該隱的路從心裡對弟兄的不滿開始。今天在教會裡，這條路可能從一句酸話、一次比較、一份見不得別人被祝福的心開始。</p><p>第二條是巴蘭的路。彼得後書講義第 2 章已經講過巴蘭的驢；猶大多出來的一筆，是那個動詞：「直奔」。原文像水從瓶子裡倒出來，一衝而下。貪財的人不是慢慢滑下去的，是被錢拉著往前衝。巴蘭沒有咒詛成以色列，卻替巴勒出了更毒的主意：「這些婦女因巴蘭的計謀，叫以色列人在毗珥的事上得罪耶和華」（民 31:16）。為利，他把神的百姓引去犯罪。</p><p>第三條是可拉的路。可拉不是外人，是在會幕裡事奉的利未人。摩西問他：「這豈為小事？……你們還要求祭司的職任嗎？」（民 16:9--10）。神已經把他放在一個尊貴的位置上，他卻嫌不夠，要奪別人的位置。結局是地開了口。猶大用過去式說這些人「滅亡了」：走上可拉的路，就已經站在那場滅亡裡。</p><p>三條路對著人生三個最深的試探：對弟兄、對錢、對位置。鑑戒先照自己：我心裡有沒有一個不能祝福的弟兄？我的事奉裡有沒有一筆算計？我對神給我的位置，是感恩，還是嫌小？</p><p>經文的意思講完了，這使我們想起 321 說的「驕傲是離開本位抓住權力」。可拉正是這句話的一幅人像：嫌自己的事奉小，要伸手抓不屬於自己的職分。321 的出路也在這裡：謙卑，回到本位，在神所給的位置上忠心，不去爭神沒有給的。</p>"},{"a":12,"z":13,"star":1,"grk":"<p lang=\"grc\">οὗτοί εἰσιν οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,</p><p lang=\"grc\">κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας, ἀστέρες πλανῆται οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται.</p>","lit":"<p>這些人是你們愛筵中的暗礁，與你們一同宴樂，毫無懼怕地牧養自己；是沒有水的雲，被風吹過去；是晚秋沒有果子的樹，死了兩次，被連根拔起；</p><p>是海上狂野的浪，把自己的羞恥像泡沫一樣湧出來；是流蕩的星，那黑暗的幽冥為他們被永遠存留著。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες</td><td>en tais agapais hymōn spilades</td><td>在你們的愛筵中是暗礁</td><td>◆ 和合本註：或譯：玷污</td></tr><tr><td>συνευωχούμενοι</td><td>syneuōchoumenoi</td><td>一同宴樂</td><td>坐在桌邊的人</td></tr><tr><td>ἀφόβως ἑαυτοὺς ποιμαίνοντες</td><td>aphobōs heautous poimainontes</td><td>毫無懼怕地牧養自己</td><td>有己的牧人；結 34:2</td></tr><tr><td>νεφέλαι ἄνυδροι</td><td>nephelai anydroi</td><td>沒有水的雲</td><td>天</td></tr><tr><td>δένδρα φθινοπωρινὰ ἄκαρπα</td><td>dendra phthinopōrina akarpa</td><td>晚秋沒有果子的樹</td><td>地</td></tr><tr><td>δὶς ἀποθανόντα ἐκριζωθέντα</td><td>dis apothanonta ekrizōthenta</td><td>死了兩次，被連根拔起</td><td>沒有果子，又失了根</td></tr><tr><td>κύματα ἄγρια θαλάσσης</td><td>kymata agria thalassēs</td><td>海上狂野的浪</td><td>海；賽 57:20</td></tr><tr><td>ἀστέρες πλανῆται</td><td>asteres planētai</td><td>流蕩的星</td><td>星；與 11 節 πλάνῃ 同字根</td></tr><tr><td>εἰς αἰῶνα τετήρηται</td><td>eis aiōna tetērētai</td><td>永遠被存留著</td><td>追蹤一第四站</td></tr></table>","gram":"<p><strong>σπιλάδες（spilades） 有兩讀。</strong>σπιλάς（spilas） 在古希臘文多指海面下的暗礁，看不見，船一撞就破，和合本正文「礁石」照這個讀法；和合本的小字註「或譯：玷污」，因為它與 σπίλος（spilos）「斑點」字形相近，彼後 2:13 平行處正作 σπίλοι（spiloi）「斑點」。本講義正文取「礁石」：它與 13 節海浪、星辰的航海畫面連成一氣；但「玷污」也有它的理由，23 節 ἐσπιλωμένον（espilōmenon）「被沾染的」、24 節 ἀμώμους（amōmous）「無瑕疵」都與它呼應。兩讀並陳，講台照和合本。</p><p><strong>ἀγάπαις（agapais） 是「愛筵」。</strong>早期教會的團契飯，與主餐相連（林前 11:20--22）。συνευωχούμενοι（syneuōchoumenoi）「一同宴樂」：他們就坐在你們旁邊吃。ἀφόβως ἑαυτοὺς ποιμαίνοντες（aphobōs heautous poimainontes）：ποιμαίνω（poimainō） 是「牧養」，受詞是反身代名詞 ἑαυτοὺς（heautous），「牧養自己」；和合本「只知餵養自己」意思準確。ἀφόβως（aphobōs）「毫無懼怕」，對神沒有敬畏。</p><p><strong>四幅自然的畫，涵蓋天、地、海、星。</strong>νεφέλαι ἄνυδροι（nephelai anydroi） 沒有水的雲；δένδρα φθινοπωρινὰ ἄκαρπα（dendra phthinopōrina akarpa） 晚秋沒有果子的樹，正是該結果子的季節；δὶς ἀποθανόντα（dis apothanonta） 「死了兩次」有三讀：①沒有果子是一次死，被連根拔起又一次；②屬靈上的兩次死，信主前一次，背離後又一次；③指啟 20:14 的「第二次的死」。本講義取①，最貼近樹的畫面。κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας（kymata agria thalassēs epaphrizonta tas heautōn aischynas） 狂浪把自己的羞恥像泡沫一樣湧出來；ἀστέρες πλανῆται（asteres planētai） 流蕩的星，πλανήτης（planētēs） 與 11 節巴蘭的 πλάνῃ（planē）「錯謬」同字根。</p><p><strong>τετήρηται（tetērētai） 是追蹤一的第四站。</strong>完成式被動：墨黑的幽暗「已經被存留著」。6 節天使被拘留在 ζόφον（zophon） 之下，13 節 ὁ ζόφος τοῦ σκότους（ho zophos tou skotous） 為這些人存留：同一個字、同一個結局。全卷地勢在這裡落到最低。</p>","exp":"<p>〔彼後〕彼後 2:13--17（彼得後書講義第 2 章）</p><p>「這樣的人在你們的愛席上與你們同吃的時候，正是礁石」（1:12）。愛筵是早期教會最溫暖的地方：富的窮的坐在一起，分同一個餅。礁石偏偏藏在這裡。海面平靜，看不出危險，船卻在這裡破碎。最傷人的，往往不是外面的風浪，是坐在桌邊、看起來一樣的人。</p><p>「他們作牧人，只知餵養自己，無所懼怕」（1:12）。這使我們想起以西結的話：「以色列的牧人只知牧養自己」（結 34:2），也想起彼得對長老的吩咐：「也不是轄制所託付你們的，乃是作群羊的榜樣」（彼前 5:3）。被定罪的是牧養自己的牧人，所以這封信從來沒有叫羊閉嘴；它倒是叫每一位牧者先問自己：我是在餵羊，還是在餵自己？</p><p>接著是四幅畫：「是沒有雨的雲彩，被風飄蕩」（1:12），應許了雨，一滴也沒有，「好像無雨的風雲」（箴 25:14）；「是秋天沒有果子的樹」（1:12），正是該結果子的季節，枝上空空；海裡的狂浪，「其中的水常湧出污穢和淤泥來」（賽 57:20）；「是流蕩的星，有墨黑的幽暗為他們永遠存留」（1:13），水手靠星辰定方向，跟著流蕩的星走的人必定迷航。</p><p>連同愛席上的礁石，五幅畫有一個共同點：外表有，內裡空。礁石藏在平靜的海面下，像雲卻沒有雨，像樹卻沒有果，聲勢浩大卻只有泡沫，發光卻不在軌道上。鑑戒先照自己：我的服事有沒有變成沒有雨的雲？</p><p>全卷在這裡落到最深的谷。可是猶大不是叫我們住在谷底研究黑暗；他帶我們走過去，是為了 20 節的「你們卻要」，和 24 節站在頂上的敬拜。321 說人比事重要：愛筵是人與人相交的地方，礁石讓船在那裡破碎。</p>"},{"a":14,"z":16,"star":1,"grk":"<p lang=\"grc\">Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,</p><p lang=\"grc\">ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι πάντας τοὺς ἀσεβεῖς περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατʼ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.</p><p lang=\"grc\">οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.</p>","lit":"<p>亞當的第七代以諾，也對著這些人預言說：「看哪，主帶著他千萬的聖者來了，</p><p>要向眾人施行審判，並且要定一切不敬虔之人的罪——為著他們以不敬虔所行的一切不敬虔的作為，也為著不敬虔的罪人說來頂撞他的一切剛硬的話。」</p><p>這些人是發怨言的、抱怨自己命運的，照著自己的私慾而行；他們的口說出誇大的話，為了得利益而奉承人的臉面。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ</td><td>hebdomos apo Adam Henōch</td><td>從亞當起第七代的以諾</td><td>照創 5 的家譜</td></tr><tr><td>Προεφήτευσεν</td><td>Proephēteusen</td><td>預言了</td><td>◆◆ 引《以諾一書》1:9</td></tr><tr><td>Ἰδοὺ ἦλθεν κύριος</td><td>Idou ēlthen kyrios</td><td>看哪，主來了</td><td>先知式的過去式</td></tr><tr><td>ἐν ἁγίαις μυριάσιν αὐτοῦ</td><td>en hagiais myriasin autou</td><td>帶著他千萬的聖者</td><td>申 33:2；亞 14:5</td></tr><tr><td>πάντας τοὺς ἀσεβεῖς</td><td>pantas tous asebeis</td><td>一切不敬虔的人</td><td>◆ NA28 作「各人」；追蹤二</td></tr><tr><td>γογγυσταί, μεμψίμοιροι</td><td>gongystai, mempsimoiroi</td><td>發怨言的、抱怨命運的</td><td>後者新約僅此一次</td></tr><tr><td>λαλεῖ ὑπέρογκα</td><td>lalei hyperonka</td><td>說誇大的話</td><td>膨脹、浮誇</td></tr><tr><td>θαυμάζοντες πρόσωπα ὠφελείας χάριν</td><td>thaumazontes prosōpa ōpheleias charin</td><td>為了好處羨慕人的臉面</td><td>χάριν 是介系詞「為了」</td></tr></table>","gram":"<p><strong>引文出自《以諾一書》1:9。</strong>猶大說「以諾曾預言」，引的話與《以諾一書》開頭的一段非常接近。這本書在第二聖殿時期廣為流傳，昆蘭也發現了它的亞蘭文殘卷。早期教會對這次引用反應不一：有人因此懷疑猶大書（耶柔米記載過），也有人因此想接納《以諾一書》。各說：①猶大承認《以諾一書》為正典（極少數；今天主要是衣索比亞〔與厄利垂亞〕正教會這樣列）；②猶大引一句當時讀者熟悉、而且內容真實的話；③這一句話的內容是真的，與舊約的審判主題一致，但不等於整本書受默示。本講義採②③：受默示的是猶大書；引用一句真話，不等於替整本書背書（徒 17:28；多 1:12）。也不因此否定猶大書的正典地位。</p><p><strong>ἕβδομος ἀπὸ Ἀδὰμ（hebdomos apo Adam）。</strong>照創 5 章的家譜，連亞當在內數下來：亞當、塞特、以挪士、該南、瑪勒列、雅列、以諾，正是第七代。Προεφήτευσεν δὲ καὶ τούτοις（Proephēteusen de kai toutois） 的與格 τούτοις（toutois） 可以讀成「論到這些人」，也可以讀成「對這些人」；和合本「預言這些人」取前者。ἦλθεν（ēlthen） 是不定過去式，先知把將來的事說得像已經發生，這是先知式的過去式，不是在講一件已經過去的事，也不提供任何日期。</p><p><strong>15 節：ἀσεβ（aseb）- 四次，πάντ（pant）- 四次。</strong>ἀσεβεῖς（asebeis）、ἀσεβείας（asebeias）、ἠσέβησαν（ēsebēsan）、ἀσεβεῖς（asebeis）：一節之內「不敬虔」出現四次，這是追蹤二的高峰；πάντων（pantōn）、πάντας（pantas）、πάντων（pantōn）、πάντων（pantōn） 也是四次：審判是全面的，行為與言語都在內。ἐλέγξαι（elenxai） 是「證實、使人知罪」，不只是判刑，是把罪顯明出來。σκληρῶν（sklērōn） 是剛硬、刺耳的話：不敬虔從口出。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg 作 ἐλέγξαι πάντας τοὺς ἀσεβεῖς（elenxai pantas tous asebeis）「證實一切不敬虔的人」，和合本照這個讀法；NA28 作 πᾶσαν ψυχήν（pasan psychēn）「各人、每一個靈魂」。兩讀意思接近；前者把焦點放在「不敬虔的人」，後者更廣。本講義從 SBLGNT 與和合本。</p></blockquote><p><strong>16 節的五個記號。</strong>γογγυσταί（gongystai） 嘟囔、發怨言的人，這使我們想起曠野裡的以色列人（民 14:27）。μεμψίμοιροι（mempsimoiroi） 新約只出現這一次，由「怪罪」與「命運、分到的一份」組成，是對自己分到的那一份不滿的人。λαλεῖ ὑπέρογκα（lalei hyperonka） 說膨脹浮誇的話（彼後 2:18）。θαυμάζοντες πρόσωπα（thaumazontes prosōpa） 是希伯來式的說法「抬舉人的臉」，即看人的地位、討好有用的人；ὠφελείας χάριν（ōpheleias charin）「為了好處」。這裡的 χάριν（charin） 是介系詞「為了」，不是 4 節的恩典 χάριτα（charita）。</p>","exp":"<p>〔舊約〕創 5:21--24（創世記講義第 5 章）</p><p>「亞當的七世孫以諾曾預言這些人說」（1:14）。以諾是那位「與神同行，神將他取去，他就不在世了」（創 5:24）的人。一個與神同行的人，看得最清楚甚麼是不敬虔。</p><p>猶大引的這段預言，出自當時讀者熟悉的《以諾一書》。這需要說清楚：引用一句真話，不等於替整本書背書。保羅在雅典引過希臘詩人「我們也是他所生的」（徒 17:28），沒有人因此說那位詩人的全集是聖經。受默示的是猶大書；猶大選了一句與舊約審判主題完全一致的話。我們不必從這裡另外建構天使學，也不必因此懷疑猶大書。</p><p>「看哪，主帶著他的千萬聖者降臨」（1:14）。這使我們想起摩西的祝福「從萬萬聖者中來臨」（申 33:2），也想起撒迦利亞說「有一切聖者同來」（亞 14:5）。先知把將來說得像已經發生：主一定會來。這節經文不給日期，我們也不算日子。</p><p>「證實那一切不敬虔的人所妄行一切不敬虔的事，又證實不敬虔之罪人所說頂撞他的剛愎話」（1:15）。原文一節之內四次「不敬虔」，四次「一切」（和合本譯出三次「不敬虔」、兩次「一切」）。審判是全面的，連說過的話都在內。猶大特別點出「剛愎話」：不敬虔常常先從嘴巴出來。</p><p>「這些人是私下議論，常發怨言的，隨從自己的情慾而行，口中說誇大的話，為得便宜諂媚人」（1:16）。這是一幅口的畫像：抱怨、誇大、討好。「常發怨言」原文是對自己分到的那一份不滿，又是「不守本位」的另一個樣子。「諂媚人」原文是看人的臉面，討好有用的人。猶大的哥哥雅各寫過：「你們信奉我們榮耀的主耶穌基督，便不可按著外貌待人」（雅 2:1）；本系列雅各書講義第 2 章講過。兩兄弟看見的是同一種病。</p><p>鑑戒先照自己：我私下的議論多，還是禱告多？我說話看人的臉，還是看神的臉？321 說有己的口：抱怨、誇大、討好，都是以自己為中心的話。</p>"},{"a":17,"z":19,"star":1,"grk":"<p lang=\"grc\">Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·</p><p lang=\"grc\">ὅτι ἔλεγον ὑμῖν Ἐπʼ ἐσχάτου χρόνου ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.</p><p lang=\"grc\">οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.</p>","lit":"<p>但你們，蒙愛的人哪，要記住我們主耶穌基督的使徒們預先所說的話；</p><p>因為他們曾對你們說：「在末後的時候，必有嘲笑的人，照著自己不敬虔的私慾而行。」</p><p>這些人是製造分裂的，是屬魂的，沒有靈。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ὑμεῖς δέ, ἀγαπητοί</td><td>Hymeis de, agapētoi</td><td>但你們，蒙愛的人哪</td><td>第一次 Ὑμεῖς δέ；20 節再一次</td></tr><tr><td>μνήσθητε τῶν ῥημάτων</td><td>mnēsthēte tōn rhēmatōn</td><td>要記住那些話</td><td>不定過去式命令</td></tr><tr><td>τῶν προειρημένων ὑπὸ τῶν ἀποστόλων</td><td>tōn proeirēmenōn hypo tōn apostolōn</td><td>使徒們預先說過的</td><td>猶大沒有說「我們使徒」</td></tr><tr><td>ἐσχάτου χρόνου</td><td>eschatou chronou</td><td>末後的時候</td><td>基督兩次來臨之間</td></tr><tr><td>ἐμπαῖκται</td><td>empaiktai</td><td>嘲笑的人</td><td>新約只在這裡與彼後 3:3</td></tr><tr><td>οἱ ἀποδιορίζοντες</td><td>hoi apodiorizontes</td><td>劃界分裂的人</td><td>◆◆ 新約僅此一次</td></tr><tr><td>ψυχικοί</td><td>psychikoi</td><td>屬魂的</td><td>◆◆ 和合本「屬乎血氣」</td></tr><tr><td>πνεῦμα μὴ ἔχοντες</td><td>pneuma mē echontes</td><td>沒有靈</td><td>和合本補「聖」小字</td></tr></table>","gram":"<p><strong>Ὑμεῖς δέ（Hymeis de） 第一次出現。</strong>前面一連串的 οὗτοι（houtoi）「這些人」，17 節第一次轉成 Ὑμεῖς δέ（Hymeis de）「但你們」，20 節再一次。ἀγαπητοί（agapētoi） 是追蹤四，和合本補「弟兄」小字。μνήσθητε（mnēsthēte） 是不定過去式命令：要記起來。</p><p><strong>τῶν προειρημένων ὑπὸ τῶν ἀποστόλων（tōn proeirēmenōn hypo tōn apostolōn）。</strong>猶大沒有說「我們使徒」，他把自己放在使徒之外，指向使徒的教訓。這一點常被拿來討論年代：①有人認為這表示寫信時使徒已經過世，信寫得較晚；②也有人認為只表示猶大本人不是十二使徒之一，而讀者曾親耳聽過使徒傳道（18 節 ἔλεγον ὑμῖν（elegon hymin）「他們曾對你們說」）。本講義取②，詳見全卷立場〈寫作年代與處境：猶大書寫於何時？偷著進來的是些甚麼人？〉。ἔλεγον（elegon） 是未完成式，使徒們不是說一次，是常常這樣說（徒 20:29--30；提前 4:1；提後 3:1--5）。</p><p><strong>ἐσχάτου χρόνου（eschatou chronou）「末後的時候」。</strong>在新約，「末世」指基督第一次來到第二次來之間的整段時間，來 1:2 說神「就在這末世藉著他兒子曉諭我們」。不是一個可以算出日子的時刻表。ἐμπαῖκται（empaiktai） 是嘲笑的人，新約只在這裡與彼後 3:3。ἀσεβειῶν（asebeiōn） 是追蹤二的最後一站。</p><p><strong>19 節是最後一個 οὗτοι（houtoi），也是最反諷的一句。</strong>ἀποδιορίζοντες（apodiorizontes） 新約只出現這一次：ἀπό（apo） 加 διορίζω（diorizō）「劃界線」，是劃出界線、分出等級、製造分裂。很可能這些人自視為屬靈的上等人，把別人劃在外面。猶大給他們的稱呼正好相反：ψυχικοί（psychikoi），「屬魂的」。保羅說「屬血氣的人不領會神聖靈的事」，「屬血氣的」也是這個字（林前 2:14），和合本兩處都譯作「血氣」。πνεῦμα μὴ ἔχοντες（pneuma mē echontes） 有兩讀：①沒有聖靈（和合本補「聖」小字，多數解經家這樣讀，因為 20 節緊接著 ἐν πνεύματι ἁγίῳ（en pneumati hagiō））；②沒有屬靈的生命、人裡面的靈沒有活過來。本講義取①，②在意思上也被①包含。自以為最屬靈的人，猶大說他們沒有聖靈。</p>","exp":"<p>〔彼後〕彼後 3:2--3（彼得後書講義第 3 章）</p><p>「親愛的弟兄啊，你們要記念我們主耶穌基督之使徒從前所說的話」（1:17）。十多節的黑暗之後，鏡頭第一次轉回來：「你們」。猶大給讀者的第一個功課不是去研究那些人，是記起使徒的話。面對新的聲音，最好的錨是舊的話。321 說聖經是我的準則：準則是使徒傳下來的話，不是誰最近的異夢。</p><p>「他們曾對你們說過，末世必有好譏誚的人隨從自己不敬虔的私慾而行」（1:18）。這是一個被預告過的現象。事先知道會下雨的人，雨來了不會慌。教會裡出現嘲笑信仰、隨私慾而行的人，不證明福音失敗了；它正好證明使徒說的話是真的。這節經文不是叫我們推算末日，而是叫我們在整段「末世」裡站穩。</p><p>「這就是那些引人結黨、屬乎血氣、沒有聖靈的人」（1:19）。這是「這些人」最後一次出現，也是最尖銳的一句。他們劃界線、分等級，自以為是屬靈的上等人；猶大說，他們是屬魂的，沒有聖靈。分水嶺不是口才，不是異夢，不是誰的聚會更熱鬧，是有沒有聖靈。</p><p>這一節也要守住分寸。猶大給的是記號，不是一頂可以隨手扣在別人頭上的帽子。和我們意見不同的人，不一定就是「沒有聖靈的人」；倒是那些急著把別人劃到外面的，要先看看自己是不是正在 ἀποδιορίζοντες（apodiorizontes）。記號先照自己：我是在建造，還是在劃界？</p><p>19 節與 20 節放在一起讀最清楚：一邊「引人結黨」，一邊「造就自己」；一邊「沒有聖靈」，一邊「在聖靈裡禱告」。一邊在拆，一邊在建。321 說聖靈是我的引導，也說用心靠聖靈：屬魂的人靠自己，屬靈的人靠聖靈。</p>"},{"a":20,"z":21,"star":3,"grk":"<p lang=\"grc\">ὑμεῖς δέ, ἀγαπητοί, ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει, ἐν πνεύματι ἁγίῳ προσευχόμενοι,</p><p lang=\"grc\">ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.</p>","lit":"<p>但你們，蒙愛的人哪，要在你們至聖的信仰上把自己建造起來，在聖靈裡禱告，</p><p>要守住你們自己在神的愛裡，等候我們主耶穌基督的憐憫，直到永生。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑμεῖς δέ, ἀγαπητοί</td><td>hymeis de, agapētoi</td><td>但你們，蒙愛的人哪</td><td>◆◆ 全卷樞紐：鏡頭轉回來</td></tr><tr><td>ἐποικοδομοῦντες ἑαυτοὺς</td><td>epoikodomountes heautous</td><td>在上面建造你們自己</td><td>◆◆ 分詞一；複數：彼此建造</td></tr><tr><td>τῇ ἁγιωτάτῃ ὑμῶν πίστει</td><td>tē hagiōtatē hymōn pistei</td><td>在你們至聖的信仰上</td><td>最高級；回應 3 節</td></tr><tr><td>ἐν πνεύματι ἁγίῳ προσευχόμενοι</td><td>en pneumati hagiō proseuchomenoi</td><td>在聖靈裡禱告</td><td>◆◆ 分詞二；兩讀並陳</td></tr><tr><td>ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε</td><td>heautous en agapē theou tērēsate</td><td>要守住自己在神的愛裡</td><td>◆◆ 全卷唯一叫我們守的命令</td></tr><tr><td>προσδεχόμενοι τὸ ἔλεος</td><td>prosdechomenoi to eleos</td><td>等候那憐憫</td><td>分詞三；追蹤三第二站</td></tr><tr><td>εἰς ζωὴν αἰώνιον</td><td>eis zōēn aiōnion</td><td>直到永生</td><td>憐憫的終點</td></tr></table>","gram":"<p><strong>一個命令，三個分詞。</strong>20--21 節的主要動詞只有一個：21 節的 τηρήσατε（tērēsate）「要保守」，不定過去式命令。其餘三個都是分詞：ἐποικοδομοῦντες（epoikodomountes）「造就」、προσευχόμενοι（proseuchomenoi）「禱告」、προσδεχόμενοι（prosdechomenoi）「仰望」。文法上有兩讀：①三個分詞說明怎樣保守，造就、禱告、仰望是保守的方法；②三個分詞帶命令的語氣，各自是一個吩咐，和合本把四個動作都譯成命令。本講義判斷：句子的骨架以 τηρήσατε（tērēsate） 為中心，三個分詞圍著它；講台照和合本講成四個動作也可以，但要讓會眾看見中心是「保守自己常在神的愛中」。</p><p><strong>ἐποικοδομοῦντες ἑαυτοὺς（epoikodomountes heautous）。</strong>ἐποικοδομέω（epoikodomeō） 是 ἐπί（epi）「在上面」加 οἰκοδομέω（oikodomeō）「建造」：在根基上往上蓋。保羅用同一個字說「被建造在使徒和先知的根基上」（弗 2:20），又說「在他裡面生根建造」（西 2:7）。根基是 τῇ ἁγιωτάτῃ ὑμῶν πίστει（tē hagiōtatē hymōn pistei）「你們至聖的信仰」，ἁγιωτάτῃ（hagiōtatē） 是最高級；πίστις（pistis） 回應 3 節「一次交付聖徒的真道」：所信的內容。ἑαυτοὺς（heautous） 是複數反身代名詞，可以讀成「造就你們自己」，也可以讀成「彼此建造」，希臘文的反身代名詞常有交互的意思（西 3:13、16）。本講義兩讀並取：造就是群體的事，不是各自修行。對照 19 節的 ἀποδιορίζοντες（apodiorizontes）：一邊劃界拆開，一邊在同一個根基上一起建造。</p><p><strong>ἐν πνεύματι ἁγίῳ προσευχόμενοι（en pneumati hagiō proseuchomenoi） 兩讀並陳。</strong>①包括說方言的禱告：保羅說「我若用方言禱告，是我的靈禱告」，「用靈」與「在靈裡」相近（林前 14:14--15）；②一切靠聖靈引導、與聖靈同工的禱告：弗 6:18 「靠著聖靈，隨時多方禱告祈求」用的正是 ἐν πνεύματι（en pneumati），羅 8:26 說聖靈幫助我們的軟弱。經文沒有限定是哪一種。本講義不裁判，不把「在聖靈裡禱告」定義成必須說方言，也不貶抑方言；兩讀共同的落點是：禱告是靠聖靈的，不是靠自己的口才。這一句的對照才是猶大的重點：19 節 πνεῦμα μὴ ἔχοντες（pneuma mē echontes），20 節 ἐν πνεύματι ἁγίῳ（en pneumati hagiō）。</p><p><strong>ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε（heautous en agapē theou tērēsate）。</strong>這是追蹤一的第五站，也是全卷唯一一次叫讀者去「守」的命令。ἀγάπῃ θεοῦ（agapē theou） 的屬格有兩讀：①主詞屬格「神對我們的愛」；②受詞屬格「我們對神的愛」。本講義取①為主：1 節讀者是「在父神裡蒙愛」的，21 節要他們留在那份愛裡；不是叫我們守住自己愛神的熱度，是叫我們住在神愛我們的那個「位置」裡。這與 6 節正好成對：天使 μὴ τηρήσαντας（mē tērēsantas） 自己的 ἀρχὴν（archēn），讀者被吩咐 τηρήσατε（tērēsate） 自己在神的愛中。</p><p><strong>προσδεχόμενοι（prosdechomenoi） 是等候、盼望、迎接。</strong>路加用它描寫西面「素常盼望以色列的安慰者來到」（路 2:25）。τὸ ἔλεος τοῦ κυρίου（to eleos tou kyriou） 是追蹤三的第二站：連守住的人，也是一路仰望憐憫到底的。三一的結構也在這裡：聖靈（20 節）、神（21 節）、主耶穌基督（21 節）。</p>","exp":"<p>「親愛的弟兄啊，你們卻要在至聖的真道上造就自己，在聖靈裡禱告」（1:20）。這是全卷的樞紐。前面「這些人」敲了六次鐘，20 節一句「你們卻要」，把鏡頭轉回來。猶大用十多節描寫別人，只用兩節告訴我們怎麼辦。比例很值得留意：對付錯謬最好的辦法，不是花更多時間研究錯謬，是常在神的愛中。</p><p>第一個動作是造就。原文是「在上面建造」：根基已經有了，就是 3 節那「一次交付」、這裡稱為「至聖」的真道，我們要做的是往上蓋。「自己」是複數，造就是彼此的事：在小組裡一起讀經，在主日一起敬拜，在生活裡彼此扶持。19 節的人在劃界、拆開，20 節的人在同一個根基上一起建。321 說建立屬神的體系：體系不是一個人蓋起來的，是一群人在同一個根基上一起蓋的。</p><p>第二個動作是禱告，「在聖靈裡」。這一句有兩種讀法：有人認為包括說方言的禱告，也有人認為指一切靠聖靈引導、與聖靈同工的禱告。經文沒有限定，本講義兩讀並陳，不把它定義成必須說方言，也不貶抑方言。落點在靠聖靈禱告的生活：「況且，我們的軟弱有聖靈幫助」（羅 8:26）。19 節說那些人「沒有聖靈」，20 節說你們「在聖靈裡禱告」。分水嶺不在聲音，在依靠誰。</p><p>第三個動作是中心：「保守自己常在神的愛中」（1:21）。這是全卷唯一一次叫我們去「守」的命令。要守的不是我們對神的愛的溫度，那會起起落落；要守的是神愛我們的那個位置。主耶穌說：「我愛你們，正如父愛我一樣；你們要常在我的愛裡」（約 15:9）。6 節的天使不肯守自己的位置；21 節，我們被叫去守住一個位置，就是神的愛。那不是牢籠，是家。</p><p>這也解開了全卷「保守」的三層。1 節：我們是「為耶穌基督保守的人」，神先保守我們。21 節：「保守自己常在神的愛中」，我們有責任留在那裡。24 節：神是「那能保守你們不失腳」的。三句話不互相打架：神的保守是我們能守的根據，我們的守是對神保守的回應，最後守住我們的還是神。全卷立場見〈被保守與保守自己：神保守我，為甚麼還要我保守自己？〉。</p><p>第四個動作是仰望：「仰望我們主耶穌基督的憐憫，直到永生」（1:21）。原文是等候、迎接，像西面一生等候以色列的安慰。連守住的人，也是靠憐憫走到終點的。沒有人在最後那天憑自己的守功站立；我們等候的是憐憫。</p><p>聖靈、神、主耶穌基督，三一的神都在這兩節裡。猶大在全卷最黑的谷底之後，沒有給讀者一份防禦手冊，給了一個位置：在神的愛中。321 說焦點在耶穌：等候的姿勢是仰望。眼睛從「這些人」轉回主，人就站穩了。</p>"},{"a":22,"z":23,"star":3,"grk":"<p lang=\"grc\">καὶ οὓς μὲν ἐλεᾶτε διακρινομένους,</p><p lang=\"grc\">οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.</p>","lit":"<p>對有些在疑惑中的人，你們要憐憫；</p><p>有些人，你們要從火中抓出來拯救；有些人，你們要在懼怕中憐憫，連那被肉體玷污的貼身衣服也要恨惡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οὓς μὲν ἐλεᾶτε διακρινομένους</td><td>hous men eleate diakrinomenous</td><td>有些在疑惑中的，你們要憐憫</td><td>◆◆ 第一組；第一個動詞是憐憫</td></tr><tr><td>διακρινομένους</td><td>diakrinomenous</td><td>心裡在爭辯、搖擺的</td><td>◆◆ 與 9 節 διακρινόμενος 同字</td></tr><tr><td>οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες</td><td>hous de sōzete ek pyros harpazontes</td><td>有些要從火中抓出來拯救</td><td>◆ 第二組；亞 3:2</td></tr><tr><td>οὓς δὲ ἐλεᾶτε ἐν φόβῳ</td><td>hous de eleate en phobō</td><td>有些要在懼怕中憐憫</td><td>第三組；提防自己</td></tr><tr><td>τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα</td><td>ton apo tēs sarkos espilōmenon chitōna</td><td>被肉體玷污的貼身衣服</td><td>與 12 節 σπιλάδες 同字根</td></tr></table>","gram":"<blockquote><p>◆ 經文鑑別（22--23 節）：SBLGNT、Treg、NA28 作三組：καὶ οὓς μὲν ἐλεᾶτε διακρινομένους（kai hous men eleate diakrinomenous）, οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες（hous de sōzete ek pyros harpazontes）, οὓς δὲ ἐλεᾶτε ἐν φόβῳ（hous de eleate en phobō），和合本也是三組；WH 作兩組；RP 作 διακρινόμενοι（主格，意思變成「你們要分辨著憐憫有些人」），也是兩組，並作 ἐλεεῖτε（eleeite）；Treg 同樣分三組，只是 22 節第一個動詞作 ἐλέγχετε（elenchete）「駁正、指正」。這是猶大書抄本最紛亂的一處，抄寫者很早就對「憐憫存疑心的」覺得難懂。本講義判斷：採三組，這也是 SBLGNT、NA28 與多數解經家的選擇。理由是 οὓς μὲν（hous men）……οὓς δὲ（hous de）……οὓς δὲ（hous de） 的句型完整；猶大全卷偏愛三個一組（三個描寫、三樣福分、三個鑑戒、三條路）；而且三組讀法較能解釋其他讀法怎樣從它簡化而來。但這不是定論：最早的蒲草紙抄本 P72 也是兩組，有學者據此主張較短的形式才是原文。不論兩組或三組，ἐλεᾶτε（eleate）「憐憫」都是這兩節的主要動詞。</p></blockquote><p><strong>διακρινομένους（diakrinomenous） 有兩讀。</strong>①「存疑心的」：心裡在爭辯、搖擺，雅 1:6「那疑惑的人」、太 21:21「不疑惑」、羅 4:20「起疑惑」都是這個字，和合本照這個讀法；②「與你們爭辯的」：照 9 節 διακρινόμενος（diakrinomenos） 的用法。本講義取①為主；②提醒我們，連與我們爭辯的人，猶大的第一個吩咐也是憐憫。同一個字在 9 節與 22 節，這是全卷第二顆珍珠：對魔鬼，米迦勒交給主；對存疑心的信徒，教會要憐憫。ἐλεᾶτε（eleate） 是現在式命令，是持續的態度，不是一次的施捨。</p><p><strong>σῴζετε ἐκ πυρὸς ἁρπάζοντες（sōzete ek pyros harpazontes）。</strong>ἁρπάζω（harpazō） 是抓、搶，緊急而用力，千夫長「把他從眾人當中搶出來」（徒 23:10）就是這個字。ἐκ πυρὸς（ek pyros） 的畫面，這使我們想起亞 3:2「這不是從火中抽出來的一根柴嗎？」與摩 4:11。猶大沒有說這是引用撒迦利亞，但 9 節的「主責備你吧」與 23 節的「從火中」都在亞 3 章，很難說是巧合。</p><p><strong>ἐν φόβῳ（en phobō） 與被玷污的衣服。</strong>ἐν φόβῳ（en phobō） 是敬畏神，也是提防自己被拖下去。μισοῦντες（misountes） 是現在分詞「恨惡」；χιτών（chitōn） 是貼身的內衣；ἐσπιλωμένον（espilōmenon） 是完成式被動分詞「被玷污了的」，σπιλόω（spiloō） 與 12 節 σπιλάδες（spilades） 同字根，雅 3:6 舌頭「能污穢全身」也是它。亞 3:3--4 約書亞穿著污穢的衣服，神吩咐脫去，給他換上華美的衣服：恨的是衣服上的污穢，不是穿衣服的人。</p>","exp":"<p>「有些人存疑心，你們要憐憫他們」（1:22）。全卷最溫柔的一句，放在最嚴厲的一卷書的末尾。第一個動詞是「憐憫」，不是「糾正」，不是「隔離」，更不是「趕出去」。</p><p>存疑心不等於背道。一位在信仰上有很多問題的年輕人，一位經歷大難之後問「神在哪裡」的姊妹，一位讀到聖經難處而睡不著的弟兄，都不是「偷著進來的人」。他們是心裡正在爭辯的信徒。寫這句話的人最懂：他自己曾經不信他的哥哥，「因為連他的弟兄說這話，是因為不信他」（約 7:5）。猶大是被憐憫過的人，所以他叫教會去憐憫。</p><p>原文還藏著一層。「存疑心」和 9 節米迦勒與魔鬼「爭辯」是同一個字。一個與魔鬼爭辯的天使長，一個心裡正在爭辯的信徒，猶大用同一個字。對魔鬼，米迦勒說「主責備你吧」，把它交給主；對心裡在爭辯的弟兄姊妹，猶大說「你們要憐憫他們」。教會最常犯的錯，是把這兩種「爭辯」弄反了：對屬靈的黑暗輕描淡寫，對有疑問的人嚴厲審查。一位有很多問題的年輕人，在一個這樣讀猶大書的教會裡，應該更敢問，而不是更不敢。</p><p>「有些人你們要從火中搶出來，搭救他們」（1:23）。第二種人已經靠近火了，需要的是緊急而有力的手。這使我們想起撒迦利亞的異象：「這不是從火中抽出來的一根柴嗎？」（亞 3:2）。我們每一個人都曾經是那根柴。被搶出來的人，最知道該怎樣去搶救別人。</p><p>「有些人你們要存懼怕的心憐憫他們，連那被情慾沾染的衣服也當厭惡」（1:23）。第三種人陷得更深，搶救的人自己也有危險。所以要「存懼怕的心」：敬畏神，也提防自己。保羅說：「又當自己小心，恐怕也被引誘」（加 6:1）。搶救人不是逞英雄。陷得深的人，最好由成熟的同工一起陪伴，不單獨承擔，也不讓自己被拖下去；需要專業協助的，就轉介。愛人而恨罪，救人而自守。恨的是被玷污的衣服，不是穿衣服的人；神在撒迦利亞的異象裡，正是替約書亞脫去污穢的衣服，換上華美的衣服。</p><p>三種人，三種救法，都在同一個動詞「憐憫」裡。這是追蹤三的轉折：2 節讀者領受憐恤，21 節讀者仰望憐憫，22--23 節，領受憐憫的人成了給出憐憫的人。被保守的人，不是躲在堡壘裡的人，是走出去搶救人的人。</p><p>321 的 920 在這裡：每一個「2」都需要不同的救法。有的要陪他問完問題，有的要立刻伸手，有的要帶著敬畏、謹慎地靠近。猶大給的不是一套話術，是一顆分辨的心和一雙憐憫的手。</p>"},{"a":24,"z":25,"star":3,"grk":"<p lang=\"grc\">Τῷ δὲ δυναμένῳ φυλάξαι ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει</p><p lang=\"grc\">μόνῳ θεῷ σωτῆρι ἡμῶν διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν δόξα μεγαλωσύνη κράτος καὶ ἐξουσία πρὸ παντὸς τοῦ αἰῶνος καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.</p>","lit":"<p>那能守護你們不跌倒、使你們毫無瑕疵、在大歡樂中站在他榮耀面前的，</p><p>就是獨一的神、我們的救主，藉著我們的主耶穌基督，願榮耀、威嚴、權能、權柄歸與他，在萬世以前、現在、直到萬世。阿們。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τῷ δὲ δυναμένῳ</td><td>Tō de dynamenō</td><td>但歸給那能夠的</td><td>重點在他能，不在我們能</td></tr><tr><td>φυλάξαι ὑμᾶς ἀπταίστους</td><td>phylaxai hymas aptaistous</td><td>守護你們不跌倒</td><td>◆◆ 追蹤一終站；ἄπταιστος 新約僅此</td></tr><tr><td>στῆσαι κατενώπιον τῆς δόξης αὐτοῦ</td><td>stēsai katenōpion tēs doxēs autou</td><td>使你們站在他榮耀面前</td><td>最後的站立</td></tr><tr><td>ἀμώμους ἐν ἀγαλλιάσει</td><td>amōmous en agalliasei</td><td>毫無瑕疵、在大歡樂中</td><td>獻祭用語；對照 12、23 節</td></tr><tr><td>μόνῳ θεῷ σωτῆρι ἡμῶν</td><td>monō theō sōtēri hēmōn</td><td>獨一的神、我們的救主</td><td>呼應 4 節「獨一的主宰」</td></tr><tr><td>διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν</td><td>dia Iēsou Christou tou kyriou hēmōn</td><td>藉著我們的主耶穌基督</td><td>◆ RP 缺</td></tr><tr><td>δόξα μεγαλωσύνη κράτος καὶ ἐξουσία</td><td>doxa megalōsynē kratos kai exousia</td><td>榮耀、威嚴、權能、權柄</td><td>四個名詞，沒有動詞</td></tr><tr><td>πρὸ παντὸς τοῦ αἰῶνος καὶ νῦν</td><td>pro pantos tou aiōnos kai nyn</td><td>萬世以前，以及現在</td><td>◆ RP 缺「萬古以前」</td></tr></table>","gram":"<p><strong>頌讚的骨架。</strong>Τῷ δὲ δυναμένῳ（Tō de dynamenō）……μόνῳ θεῷ（monō theō）……δόξα（doxa）……：與格是領受頌讚的對象，四個名詞 δόξα μεγαλωσύνη κράτος καὶ ἐξουσία（doxa megalōsynē kratos kai exousia） 後面沒有動詞。兩讀：①祈願，「願……歸與他」，和合本照這個讀法；②直說，「是屬他的」，彼前 4:11「原來榮耀、權能都是他的」就補了「是」。本講義兩讀並取：頌讚既是心願，也是宣告。δυναμένῳ（dynamenō）「那能夠的」：重點不在我們能不能，在他能。</p><p><strong>φυλάξαι ὑμᾶς ἀπταίστους（phylaxai hymas aptaistous）。</strong>追蹤一在這裡換了一個字。前面五次都是 τηρέω（tēreō），24 節用 φυλάσσω（phylassō）：看守、護衛，像衛兵守城門。ἄπταιστος（aptaistos） 新約只出現這一次，由否定字首與 πταίω（ptaiō）「絆跌」組成：不跌倒、不失足，古希臘文用來形容馬匹不失蹄、人走路不絆倒。πταίω（ptaiō） 在新約也見於雅 3:2「我們在許多事上都有過失」與彼後 1:10「就永不失腳」。和合本「不失腳」譯得極好。</p><blockquote><p>◆ 經文鑑別（24 節）：SBLGNT、WH、Treg、NA28 作 ὑμᾶς（hymas）「保守你們」，和合本照這個讀法；RP 作 αὐτούς（autous）「保守他們」，可能是把頌讚讀成接續 22--23 節，指那些被搶救的人。ὑμᾶς（hymas） 有較好的抄本支持，也與全封信的「你們」一致。本講義從 SBLGNT 與和合本。</p></blockquote><p><strong>ἀμώμους ἐν ἀγαλλιάσει（amōmous en agalliasei）。</strong>ἄμωμος（amōmos） 是獻祭用語，沒有殘疾的祭物，彼前 1:19 用它說基督是「無瑕疵、無玷污的羔羊」；弗 1:4 說神揀選我們，要我們在他面前「無有瑕疵」。12 節的 σπιλάδες（spilades）、23 節的 ἐσπιλωμένον（espilōmenon），到 24 節成了 ἀμώμους（amōmous）：被玷污的人，最後毫無瑕疵地站在他面前。ἀγαλλίασις（agalliasis） 是極大的歡喜、歡呼，彼前 1:8 用同字根的動詞。</p><blockquote><p>◆ 經文鑑別（25 節）：SBLGNT、WH、Treg、NA28 作 μόνῳ θεῷ σωτῆρι ἡμῶν διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν（monō theō sōtēri hēmōn dia Iēsou Christou tou kyriou hēmōn），又有 πρὸ παντὸς τοῦ αἰῶνος（pro pantos tou aiōnos）「從萬古以前」，和合本兩處都有；RP 在 θεῷ（theō） 前加 σοφῷ（sophō）「獨一智慧的神」，又缺「因我們的主耶穌基督」與「從萬古以前」。σοφῷ（sophō） 很可能是抄寫者照羅 16:27「獨一全智的神」補上的；較短的 RP 讀法缺了兩處重要內容，抄本支持也較晚。本講義從 SBLGNT 與和合本。</p></blockquote><p><strong>完整的時間表。</strong>πρὸ παντὸς τοῦ αἰῶνος καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας（pro pantos tou aiōnos kai nyn kai eis pantas tous aiōnas）：過去、現在、將來三段，新約頌讚裡少見的完整時間表。μόνῳ θεῷ（monō theō） 與 4 節 τὸν μόνον δεσπότην（ton monon despotēn） 前後呼應：μόνος（monos） 開頭被那些人否認，結尾被全教會頌讚。</p>","exp":"<p>「那能保守你們不失腳、叫你們無瑕無疵、歡歡喜喜站在他榮耀之前的我們的救主－獨一的神」（1:24）。全卷地勢最高的一點在這裡。猶大用十多節描寫黑暗：礁石、無雨的雲、連根拔起的樹、狂浪、流蕩的星。然後最後兩節，整個天亮了。這封信用頌讚收尾，不用警告收尾。</p><p>「那能」兩個字是全節的重心。猶大不是說「你們要努力不失腳」，是說「那能保守你們不失腳」的。21 節叫我們保守自己在神的愛中，24 節告訴我們，最後真正守住我們的是神。一個人讀完 5--16 節，心裡難免發緊：天使會不守本位，蒙救的百姓會倒在曠野，我會不會也跌倒？24 節是猶大的回答。</p><p>全卷的「保守」在這裡走完了一圈。1 節，我們是「為耶穌基督保守的人」；6 節，天使不守本位，被神用鎖鍊拘留；13 節，墨黑的幽暗為流蕩的星存留；21 節，「保守自己常在神的愛中」；24 節，「那能保守你們不失腳」。不肯守本位的，被鎖鍊守住；肯在神的愛中守住的，被神的手守住。同樣是被守，一邊是黑暗裡的鎖鍊，一邊是榮耀前的站立。4 節「自古被定」所帶來的不安，答案也在這裡：那早已寫下的審判是真的，可是神為你寫下的是這一句，「能保守你們不失腳」。</p><p>「不失腳」原文新約只出現這一次，用來說馬不失蹄、人走路不絆倒。詩人也這樣唱：「他必不叫你的腳搖動」（詩 121:3）；「他雖失腳也不致全身仆倒，因為耶和華用手攙扶他」（詩 37:24）。得勝者不是從不跌倒的人，是被抓住的人。雅各說「我們在許多事上都有過失」（雅 3:2）；兄弟兩人都知道自己會跌，也都知道誰在攙扶。</p><p>「叫你們無瑕無疵」。12 節的礁石（或譯「玷污」），23 節被情慾沾染的衣服，到 24 節變成無瑕無疵。這不是我們把自己洗乾淨的結果，是基督「如同無瑕疵、無玷污的羔羊」（彼前 1:19）替我們成就的。被玷污過的人，最後毫無瑕疵地站在他面前。而且是「歡歡喜喜」，不是戰戰兢兢：審判台前的人，因為被保守，可以歡呼。</p><p>「願榮耀、威嚴、能力、權柄，因我們的主耶穌基督歸與他，從萬古以前並現今，直到永永遠遠。阿們！」（1:25）。4 節那些人不認「獨一的主宰」，25 節全教會頌讚「獨一的神」。榮耀是藉著子歸給父的。時間表從萬古以前一直拉到永永遠遠，今天的風浪放在這條線上，就顯出它的大小。</p><p>這就是全卷的落點：被神抓住的人，為真道爭而不好鬥，看清黑暗而不住在黑暗裡，常在神的愛中，去憐憫、去搶救，最後歡歡喜喜站在他榮耀之前。讀完猶大書，我們應該更佩服的不是猶大的嚴厲，是那位「能保守你們不失腳」的主。</p><p>321 說得勝者：不是從不跌倒的人，是被抓住的人。說改變觀點：「從萬古以前並現今，直到永永遠遠」，把眼光從暫時挪到永恆。也說讓耶穌得榮耀：這是全卷最後一句話，也是我們一生最後要說的話。</p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《那能保守你們不失腳》"],["p","弟兄姊妹平安。今天我們從一段家裡的對話聽起。"],["q","加利利，一個木匠的家。住棚節快到了。"],["p","幾個弟弟圍著大哥，開口說："],["q","「你離開這裡上猶太去吧，叫你的門徒也看見你所行的事。」（約 7:3）"],["p","接著又說："],["q","「人要顯揚名聲，沒有在暗處行事的」（約 7:4）"],["p","話很客氣，像在替哥哥出主意。"],["p","大哥回答："],["p","「我的時候還沒有到」（約 7:6）。"],["p","約翰在這段對話旁邊，補了一句："],["q","「因為連他的弟兄說這話，是因為不信他。」（約 7:5）"],["p","這幾個弟弟，馬太記下了名字：雅各、約西、西門、猶大。"],["p","猶大多半是和哥哥同桌吃飯長大的，看過哥哥刨木頭。"],["p","可是哥哥出來傳道，他不信。"],["p","家裡的人甚至要把哥哥拉回家，"],["p","「因為他們說他癲狂了」（可 3:21）。"],["q","大約三十多年以後。"],["p","同一個弟弟，頭髮多半已經白了，坐在燈下寫信。"],["p","信的開頭，要寫自己是誰。"],["p","他有一個全世界最耀眼的頭銜：耶穌的弟弟。"],["p","他沒有用。他給自己的第一個稱呼，是僕人。"],["q","「耶穌基督的僕人，雅各的弟兄猶大」（1:1）"],["p","從「你離開這裡」到「僕人」，中間發生了甚麼？"],["p","主復活以後，「顯給雅各看」（林前 15:7）。"],["p","樓上同心禱告的人中間，有「耶穌的弟兄」（徒 1:14）。"],["p","中間站著的，是一位從死裡復活的哥哥。"],["p","今天讀的，就是這個弟弟的信。一章，二十五節。"],["p","三個字：爭，鑑，守。我們就走這三步。"],["q","第一步：為真道竭力爭辯。"],["p","猶大說完自己是誰，接著說你是誰："],["q","「那被召、在父神裡蒙愛、為耶穌基督保守的人。」（1:1）"],["p","被召，蒙愛，被保守。三個都是被動的。"],["p","不是你召了自己，也不是你守住了自己。都是神作的。"],["p","「保守」原文是完成式：早已守住，到今天還守著。"],["p","請把這個「守」字記下來。"],["p","這封短信裡它出現五次，和合本換了四種譯法。"],["p","中文讀不出來，今天我們替它讀出來。"],["p","可是在任何一句警告之前，猶大先把你安放好："],["p","你是被保守的人。"],["p","接著的祝福是：「願憐恤、平安、慈愛多多地加給你們」（1:2）。"],["p","一封要人爭辯的信，第一個祝福是憐恤。"],["p","先被憐恤的人，爭辯時才記得自己也靠憐恤站著。"],["q","「我想盡心寫信給你們，論我們同得救恩的時候，就不得不寫信勸你們」（1:3）"],["p","猶大本來要寫一封溫暖的信：同得的救恩。"],["p","提筆時，他聽見：羊圈的籬笆被鑽了洞。"],["p","他放下想寫的，寫了一封不得不寫的。"],["p","他要守的，正是他本來想歌頌的。"],["q","「要為從前一次交付聖徒的真道竭力地爭辯。」（1:3）"],["p","這是全卷最容易被誤用的一句話。"],["p","「竭力地爭辯」原文是競技場的字，新約只用這一次。"],["p","是運動員為了獎賞，用盡全力。"],["p","不是吵架，不是辯贏，更不是羞辱人。"],["p","爭甚麼？真道。不是人，不是面子，也不是自己宗派的特色。"],["p","怎麼爭？猶大自己示範了。"],["p","第九節，天使長只說「主責備你吧」。"],["p","第二十二節，存疑心的，要憐憫。"],["p","所以這一節，不能拿來替網路上的罵戰找理由。"],["q","用驕傲的方式捍衛真道，已經先丟了真道的樣子。"],["p","「一次交付」，就是一次而永遠。"],["p","真道不是每季改版的產品。"],["p","不必追逐每一個「新啟示」。福音夠用。"],["p","那為甚麼不得不寫？"],["q","「因為有些人偷著進來」（1:4）"],["p","「偷著進來」新約也只用這一次，像從籬笆縫鑽進羊圈。"],["p","他們不是城外的敵軍，是已經坐在愛筵桌邊的人。"],["p","猶大沒有給名字，他給記號。"],["q","「將我們神的恩變作放縱情慾的機會，並且不認獨一的主宰」（1:4）"],["p","第一個記號，是把恩典講成許可證：反正神會赦免。"],["p","保羅早就回答過："],["q","「我們可以仍在罪中、叫恩典顯多嗎？斷乎不可！」（羅 6:1--2）"],["p","第二個記號，是不認主宰。「主宰」，就是奴僕的主人。"],["p","猶大自稱僕人；這些人，不認主人。"],["p","「不認」，多半不是嘴上不認，是生活裡不讓祂作主。"],["p","所以講台和小組，也只教記號，不開名單。"],["p","不點名任何牧者、教會、宗派，或網路上的哪一位。"],["p","記號，先照自己。"],["p","我口裡稱祂為主，生活裡誰在作主？"],["p","主宰是「獨一」的，不容第二位，也不容我自己。"],["p","這就是讓耶穌作王。"],["p","還有一句要讀準：「就是自古被定受刑罰的」（1:4）。"],["p","原文是「早已寫下的」：舊約和以諾的預言，早把這條路的結局寫下了。"],["p","被寫定的，是這條路通往哪裡，不是今天哪一個人的名字。"],["p","猶大沒有對任何人宣判，講台也不可以。"],["p","如果你心裡一緊：我會不會是被定的那一個？"],["p","請回到這封信的頭和尾。"],["p","開頭說，你是「為耶穌基督保守的人」（1:1）。"],["p","結尾說，神是「那能保守你們不失腳」的（1:24）。"],["p","會為這個問題不安的人，多半正是在乎主的人。"],["p","真道值得爭。可是爭的人要先看清：那條路通到哪裡。"],["q","第二步：看清不守本位的路。"],["p","猶大說：「你們雖然都知道，我卻仍要提醒你們」（1:5）。"],["p","屬靈的危險，很少因為不知道，多半因為忘了。"],["p","他把三張舊照片，重新擺在桌上。"],["q","「從前主救了他的百姓出埃及地，後來就把那些不信的滅絕了。」（1:5）"],["p","第一張最讓人不安。這些人過了紅海，吃過嗎哪。"],["p","有古老抄本讀作「耶穌」；救人和審判人的，是同一位。"],["p","這是蒙救的百姓，所以這張照片先照自己。"],["p","不是叫你怕，是擋住把恩典當保險的人。"],["q","「又有不守本位、離開自己住處的天使，主用鎖鍊把他們永遠拘留在黑暗裡」（1:6）"],["p","第二張在天上。這些天使是誰，有幾種讀法，我們不裁判。"],["p","猶大要說的是結局：連天使離開神所分派的位置，都逃不過審判。"],["p","神的審判是確定的，地位再高也不能豁免。"],["p","「不守本位」的守，就是第一節「保守」那個字。"],["p","「拘留」，又是同一個字。他們不肯守，神就把他們守住。"],["q","不肯守本位的，被鎖鍊守住。"],["p","經文的意思講完了。"],["p","這使我們想起 321 說的：「驕傲是離開本位抓住權力。」"],["p","「本位」原文是所分派的位置。"],["p","越界去抓不屬於自己的，正是驕傲的形狀。"],["q","「又如所多瑪、蛾摩拉和周圍城邑的人，也照他們一味地行淫，隨從逆性的情慾」（1:7）"],["p","第三張在地上。這一節要誠實地講。"],["p","我們持守聖經的性倫理。神所定的界限，不因時代改變。"],["p","「逆性的情慾」原文是「別的肉體」，重點是越過神所定的界限。"],["p","同時，所多瑪的罪不只一項。以西結說她"],["q","「心驕氣傲，糧食飽足，大享安逸，並沒有扶助困苦和窮乏人的手。」（結 16:49）"],["p","這四樣，有哪一樣和我們無關？"],["p","所以這一節，不羞辱、不貼標籤，也不跳過去。"],["p","保羅列完罪的清單，接著說："],["q","「你們中間也有人從前是這樣；但如今你們……已經洗淨」（林前 6:11）"],["p","如果你在性的方面正在掙扎，又想跟隨主，請你聽見："],["p","這一節也指著為你鋪好的路：恩典與悔改。"],["p","你不是被趕出去的人，是被等候的人。"],["q","「這些做夢的人也像他們污穢身體，輕慢主治的，毀謗在尊位的。」（1:8）"],["p","「也像他們」，把三張照片變成了鏡子。"],["p","這句常被拿來堵人的嘴：你質疑牧師，就是毀謗。"],["p","經文不是這個意思。"],["p","「主治的」多數指主的權柄，「在尊位的」多數指天使。"],["p","十二節定罪的，恰恰是「只知餵養自己」的牧人。"],["p","按著次序提出正當的質疑，不是輕慢主治的。"],["q","「天使長米迦勒為摩西的屍首與魔鬼爭辯的時候，尚且不敢用毀謗的話罪責他」（1:9）"],["p","這故事早期教父說出自《摩西升天記》。"],["p","引用，不等於替整本書背書。"],["p","他只要我們看一件事：米迦勒怎樣說話。"],["p","面對魔鬼，他最有資格罵。可是他「不敢」。他只說："],["q","主責備你吧！"],["p","這幾乎就是撒迦利亞的異象：「撒但哪，耶和華責備你！」（亞 3:2）"],["p","連天使長都不越位，把審判交還給主。"],["p","這就是爭辯的示範：守住真理的人，不必替神坐審判的位。"],["p","抵擋魔鬼是聖經的命令；可是把「斥責魔鬼」當成表演，這一節正是反面教材。"],["p","屬靈爭戰的力量不在音量，在主。"],["p","「爭辯」這個字，請你先收起來。二十二節還會遇見它。"],["p","「
