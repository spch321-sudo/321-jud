/* Split into sentences. HTML tags are never cut, and a closing quote or bracket stays with its
   sentence. English rule: break after . ! ? (plus any closing quotes/brackets) when whitespace
   follows, except after common abbreviations and initials, or when the next word starts in
   lower case (e.g. "?” he asked"). A colon never breaks, so "1:3" stays whole.
   This one function serves both the tappable sentences and the read-aloud units. */
const SENT_ABBR = /(?:^|[\s(\u201c\u2018"'\[])(?:e\.g|i\.e|cf|vs|viz|al|ca|approx|ibid|Mr|Mrs|Ms|Dr|Rev|St|Jr|Sr|ch|chs|v|vv|ff|pp|lit|Gen|Exod|Ex|Lev|Num|Deut|Josh|Judg|Sam|Kgs|Chr|Neh|Esth|Ps|Pss|Prov|Eccl|Isa|Jer|Lam|Ezek|Dan|Hos|Obad|Mic|Nah|Hab|Zeph|Hag|Zech|Mal|Matt|Mk|Lk|Jn|Rom|Cor|Gal|Eph|Phil|Col|Thess|Tim|Tit|Phlm|Heb|Jas|Pet|Jud|Macc|Sir|Wis|[A-HJ-Z])\.$/;
const SENT_CLOSE = ['\u201d', '\u2019', ')', ']', '"', "'", '&quot;', '&#39;'];
function splitHTML(html){
  const out = []; let cur = '', depth = 0, inTag = false, tag = '';
  for (let i = 0; i < html.length; i++){
    const ch = html[i];
    if (!inTag && ch === '<'){ inTag = true; tag = '<'; cur += ch; continue; }
    if (inTag){
      cur += ch; tag += ch;
      if (ch === '>'){
        inTag = false;
        if (/^<\//.test(tag)) depth--;
        else if (!/\/>$/.test(tag) && !/^<(br|img|hr|input|wbr)\b/i.test(tag)) depth++;
      }
      continue;
    }
    cur += ch;
    if (depth !== 0) continue;                       // never split inside a tag
    if (ch !== '.' && ch !== '!' && ch !== '?') continue;
    if (ch === '.' && SENT_ABBR.test(cur.slice(-14).replace(/<[^>]*>/g, ''))) continue;
    if (ch === '.' && /^\s*\d{1,3}\.$/.test(cur.replace(/<[^>]*>/g, ''))) continue;   // list numbering "1. " at the start
    // take any closing quotes or brackets with the sentence
    let k = i + 1, tail = '';
    for (let more = true; more && k < html.length; ){
      more = false;
      for (const c of SENT_CLOSE) if (html.startsWith(c, k)){ tail += c; k += c.length; more = true; break; }
    }
    // a sentence ends only where whitespace (or the end) follows
    if (k < html.length && !/\s/.test(html[k])) continue;
    let w = k; while (w < html.length && /\s/.test(html[w])) w++;
    if (w < html.length && /[a-z]/.test(html[w])) continue;   // "?” he asked" / "e.g. this"
    cur += tail; i = k - 1;
    while (i + 1 < html.length && (html[i + 1] === ' ' || html[i + 1] === '\n')){ i++; cur += html[i]; }
    out.push(cur); cur = '';
  }
  if (cur.replace(/<[^>]*>|\s|&nbsp;/g, '').length) out.push(cur);
  else if (cur && out.length) out[out.length - 1] += cur;
  return out.length ? out : [html];
}

function sentsOf(html){
  const out = [];

}

let F = null, FT = null, WAKE = null;
function fOpen(mode, n){
  F = { mode, n, i:0, run:true, left:0, tele:mode !== 'live' };
  document.documentElement.setAttribute('data-tele', F.tele ? '1' : '0');
  if (mode === 'lesson'){                       // the lesson manuscript

    F.left = F.total;
    // the title bar shows only the main title; the subtitle is too long and would wrap
    $('#ftitle').textContent = q2(s ? titleMain(s.title) : meta(n).t);
  } else if (mode === 'tele'){
    const s = D.serm[n];
    F.pages = s ? telePages(s.blocks) : outlinePages(n);
    F.total = (s ? s.min : 35) * 60;
    F.left = F.total;
    $('#ftitle').textContent = q2(meta(n).t);
  } else {
    F.pages = livePages(n);
    F.total = F.pages.reduce((a, p) => a + p.sec, 0);
    F.left = F.pages[0].sec;
    $('#ftitle').textContent = 'Chapter ' + n + ' · Small group';
  }

  keepAwake(true);
  fDraw(); fTick();

async function keepAwake(on){

  } catch(e){}
}
function telePages(bl){
  const pages = []; let cur = [];
  const push = () => { if (cur.length){ pages.push(cur); cur = []; } };
  bl.forEach(b => {
    if (b[0] === 'h' || b[0] === 's'){ push(); cur = [b]; return; }
    if (b[0] === 'w'){ cur.push(b); push(); return; }   // a pause in the script = a new page
    cur.push(b);
    const chars = cur.reduce((a, x) => a + (typeof x[1] === 'string' ? x[1].length : 0), 0);
    if (cur.length >= 6 || chars > 420) push();
  });
  push();
  return pages.map(p => ({ blocks:p }));
}
function outlinePages(n){
  const m = meta(n), ps = [{ blocks:[['h', q2(m.t)], ['p', m.sub], ['q', m.mv.t + ' ' + m.mv.r]] }];
  m.serm.pts.forEach(p => ps.push({ blocks:[['h', p[0]], ['p', 'Text: ' + rng(p[1])], ['p', p[2]]] }));
  ps.push({ blocks:[['h','Conclusion'], ['p', m.truth]] });
  return ps;
}
function livePages(n){

            tip:'Take turns reading the chapter’s core verses. When you finish, sit in silence for thirty seconds; don’t rush to explain.' });

function fClock(){

    if (my.length){ r += `<h3 class="sec">My highlights · ${my.length}</h3>`;
      my.slice(0, 10).forEach(k => r += `<button class="chrow" onclick="mkSheet('${k}')">
        <span class="chn">✍</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(mkText(k).slice(0, 110))}…</b>
        ${mkNote(k) ? `<span class="s">${mk(mkNote(k).slice(0, 90))}</span>` : ''}</span></button>`); }
    if (ex.length){ r += `<h3 class="sec">Exposition · ${ex.length}</h3>`;
      ex.slice(0, 12).forEach(b => r += `<button class="chrow" onclick="openV('${b.ch}:${b.a}')">
        <span class="chn">${b.ch}:${b.a === b.z ? b.a : b.a + '–' + b.z}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(((D.txt[b.ch] || [])[b.a - 1] || '').slice(0, 90))}…</b></span></button>`);
      if (ex.length > 12) r += `<p class="xs muted">(Showing the first 12)</p>`; }
    // chapters
    const chs = CH.filter(c => hit(c.t) || hit(c.sub) || hit(c.truth) || hit(c.self) ||
      c.card.some(x => hit(x)) || c.grp.some(x => hit(x)) || c.safe.some(x => hit(x)) || hit(c.mv.t));
    if (chs.length){ r += `<h3 class="sec">Chapter studies · ${chs.length}</h3>`;
      chs.forEach(c => r += `<button class="chrow" onclick="go('course',${c.n})">
        <span class="chn">${String(c.n).padStart(2,'0')}</span>
        <span style="flex:1"><b>${mk(c.t)}</b><span class="s">${mk(c.truth)}</span></span></button>`); }
    // lesson manuscripts
    const ls = [];
    Object.keys(D.lesson || {}).forEach(k => {
      const L = D.lesson[k];
      if (hit(L.title)) { ls.push([k, L.title]); return; }
      for (const x of L.blocks){
        const parts = Array.isArray(x[1]) ? x[1] : [x[1]];   // “Think deeper” is a question and an answer
        const p = parts.find(y => hit(y));
        if (p) { ls.push([k, p]); break; }
      }
    });
    if (ls.length){ r += `<h3 class="sec">Lessons · ${ls.length}</h3>`;
      ls.slice(0, 12).forEach(x => {
        /* show the part of the paragraph around the match */
        const at = Math.max(0, String(x[1]).toLowerCase().indexOf(ql) - 40);
        const piece = String(x[1]).slice(at, at + 130);
        r += `<button class="chrow" onclick="go('course',${x[0]},'lesson')">
        <span class="chn">${String(x[0]).padStart(2,'0')}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${at ? '…' : ''}${mk(piece)}${String(x[1]).length > at + 130 ? '…' : ''}</b></span></button>`; });
      if (ls.length > 12) r += `<p class="xs muted">(Showing the first 12)</p>`; }
    // word tracks
    const tk = D.tracks.filter(t => hit(t.gk) || hit(t.gl) || hit(t.tr) || hit(t.ins) || hit(t.head));
    if (tk.length){ r += `<h3 class="sec">Word tracks · ${tk.length}</h3>`;
      tk.forEach(t => r += `<button class="chrow" onclick="go('tools',0,'tracks')">
        <span class="chn">α</span><span style="flex:1"><b>${mk(t.gk)}</b><span class="s">${mk(t.gl)} &nbsp;·&nbsp; ${mk(t.ins)}</span></span></button>`); }
    // contested questions
    const is = D.issues.filter(i => hit(i.t) || hit(i.why) || hit(i.say));
    if (is.length){ r += `<h3 class="sec">Contested questions · ${is.length}</h3>`;
      is.forEach(i => r += `<button class="chrow" onclick="openIssue('${i.id}')">
        <span class="chn">⚖</span><span style="flex:1"><b>${mk(i.t)}</b><span class="s">Jude ${esc(i.r)}</span></span></button>`); }
    h += r || `<p class="sm muted" style="margin-top:18px">Nothing found for “${esc(q)}”. Try a verse (1:24), a Greek word (τηρέω) or a key word (keep, contend, mercy).</p>`;
  }
  return h;
}
function bindSearch(){
  const el = $('#sq'); if (!el) return;
  el.oninput = () => { R.q = el.value; const p = el.selectionStart; render(); const e2 = $('#sq'); if (e2){ e2.focus(); try { e2.setSelectionRange(p, p); } catch(x){} } };
}

  setTitle('321 Jude Study Notes', true);
  return `<div class="sect"><p class="eyebrow">Before you begin</p>
    <h2 class="big">How will you mainly use these study notes?</h2>
    <p class="sm muted">This only sets your default starting point. Nothing is locked, and you can change it anytime under “Me.”</p></div>
  <button class="chrow" onclick="setRole('read')"><span class="chn">①</span>
    <span style="flex:1"><b>I’m reading on my own</b><span class="s">Start with the cards; the Greek stays hidden for now</span></span></button>
  <button class="chrow" onclick="setRole('group')"><span class="chn">②</span>
    <span style="flex:1"><b>I’m leading a small group</b><span class="s">Go to the group pages and leader mode</span></span></button>
  <button class="chrow" onclick="setRole('preach')"><span class="chn">③</span>
    <span style="flex:1"><b>I’m preaching</b><span class="s">Show the Greek, the sermons and the pulpit guardrails</span></span></button>`;
}
function setRole(r){
  S.set.role = r;
  if (r === 'read') S.set.grk = 0;
  if (r === 'preach') S.set.grk = 1;
  save(); go(r === 'read' ? 'today' : 'course');
  toast('All set. You can change this anytime under “Me.”');
}
