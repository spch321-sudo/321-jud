o have been hurt in a small group or fellowship and no longer dare to join church meals; and co-workers responsible for hospitality and preparing the love feast who, after hearing this question, begin to suspect those who come. Pastors should let the first group know that an unsettled date does not mean the content is unreliable; let the second know that Jude was written precisely to protect that table; and remind the third that the love feast is to be guarded, but not with suspicion. Do not apply first-century descriptions directly to anyone in the church, and do not make historical research the point of this letter."},{"id":"ISS00_9","t":"Should these debates shake anyone’s faith?","r":"1:1–25","ch":[],"why":"9. Stand firm on the foundation; set out secondary matters side by side — a general question for the whole book. Jude has only twenty-five verses, yet it runs into a whole series of debates: which Jude was the author, why the early church hesitated, whether Jude or 2 Peter used the other, how the contending of verse 3 should be done, “long ago written about” in verse 4, whether verse 5 reads “the Lord” or “Jesus,” who the angels of verse 6 are, the sin of Sodom in verse 7, the non-canonical writings in verses 9 and 14, praying in the Holy Spirit in verse 20, and whether verses 22–23 speak of two kinds of people or three. For many believers, the fact that so short a letter carries so many “scholars think” statements is unsettling in itself; others go the other way and treat every debate as a battlefield. This question must explain which things can be set out side by side and which cannot be given up — and why facing the debates honestly is itself learning this letter’s lesson.","pos":[["[1] What the text is asking","","<p>This letter itself models how to face disagreement. Jude draws the lines very clearly: there are some things that cannot be given up — “the faith which was once for all delivered to the saints” (1:3), and “our only Master, God, and Lord, Jesus Christ” (1:4); for these he “contends earnestly.” Yet he also writes verse 22, which the Chinese Union Version renders ‘Have mercy on those who doubt’ (the WEB: “On some have compassion, making a distinction” (1:22)) — those who have disputes and questions in their hearts are not enemies, but people to be shown mercy. The “contending” of verse 9 and the “doubting” of verse 22 (the WEB’s “making a distinction”) are the same word in the Greek, διακρίνω: for an archangel disputing with the devil and for a believer disputing within his own heart, Jude uses the same word; the first, he leaves to the Lord; the second, he shows mercy.</p><p><strong>So the text is asking: Facing so many debates, how should believers conduct themselves? Which disagreements can be respected on both sides and talked through slowly? Will research and questions make people believe less the more they read? Is there a place in the church for people with doubts?</strong></p>"],["The avoidance view (no need to know these things; just believe simply)","","<p>A common reaction in the church is: these debates will make people stumble, so better not raise them from the pulpit; believers need only believe simply. The strength of this view is that it protects weak believers from being swamped by too much information, and reminds us that faith is not gained by learning; Paul also urges, “Now accept one who is weak in faith, but not for disputes over opinions” (Rom 14:1).</p><p><strong>Difficulty: </strong>it is precisely because the church has not explained them clearly that verse 3 gets used to justify wars of words, verse 4 gets used to frighten people, verse 7 gets used to humiliate people, and verses 9 and 14 get used to build strange angelologies. The texts that are never preached are the easiest for those who misuse them to explain first; and treating people who ask questions as unspiritual is exactly the misreading verse 22 sets out to block — doubting is not apostasy.</p>"],["The total scepticism view (with so many debates, the Bible is unreliable)","","<p>Another reaction goes to the other extreme: if even who the author was, whether non-canonical writings are quoted, and which variant is original are all disputed, then the whole Bible is just human opinion. The strength of this view is that it faces the problems honestly, refusing to cover difficulties with religious slogans.</p><p><strong>Difficulty: </strong>this view confuses “uncertain details” with “an uncertain foundation.” Not one of the variants in Jude (1:1, 4, 5, 15, 22–23, 24, 25) changes the core of the message; the discussion of authorship lies between several real early figures; on quoting non-canonical writings, Paul does something similar; and the history of the canon shows the church’s careful discernment, not random patchwork. Treating every discussion as proof that the whole has collapsed is itself a conclusion that has not been through discernment.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: we treat things in layers — stand firm on the foundation; on secondary matters, set the views out side by side, with humility, without closing the case.</strong> The debates of the whole book have been dealt with in their own questions in these notes: “Author, recipients and canonical status: who is “Jude, brother of James”? How was this letter received into the canon?”, “Jude and 2 Peter: about nineteen parallels — who used whom, and how do the two letters divide the work?”, “Contending for the faith without being contentious: what kind of contest is “contend earnestly”?”, “Discerning false teaching: does Jude give us marks, or a list of names?”, “Kept by God and keeping ourselves: if God keeps me, why must I keep myself?”, “Scripture quoting non-canonical books: what does it mean that Jude cites the Assumption of Moses and 1 Enoch?”, “Angels, the devil and spiritual warfare: how does Jude want us to see the unseen world?”, “Date and setting: when was Jude written, and who were the men who crept in?”. Each question lists the reasons and difficulties of every view, because giving only conclusions without the process robs readers of the right to think.</p><p>But there are some things that no debate in the whole book has ever shaken: <strong>we are “those who are called, sanctified by God the Father, and kept for Jesus Christ” (1:1); the faith is the one “which was once for all delivered to the saints” (1:3); Jesus Christ is “our only Master” (1:4); we are to “Keep yourselves in God’s love” (1:21); and to the One who is “able to keep them from stumbling” (1:24) belong glory, majesty, dominion and power, “both now and forever” (1:25).</strong> This is the foundation of Jude, and the foundation of these notes for the whole book.</p>"],["[4] Should this affect your faith?","","<p>Disputes between schools should not affect your faith. Asking questions is not unbelief; Jude, who wrote this letter, once did not believe in his own brother (John 7:5), and later called him Lord. After the Lord’s resurrection, the disciples, “When they saw him, they bowed down to him, but some doubted” (Matt 28:17) — the Lord did not drive the doubters away; he came near to them and gave them the Great Commission, and the doubters were among them.</p><p>But there is one thing that should affect you: <strong>having read this letter, am I held more securely by the Lord and more gentle in rescuing others — or more suspicious and more combative?</strong> Answers can be discussed; he does not change. The debates can be thought through slowly, but worship need not wait until every question is solved — Jude does not end with a warning; it ends with a doxology.</p>"]],"con":[],"say":"Where these notes stand for the whole book: the debates in Jude all take place at the level of “how to understand,” and these notes treat them in layers — stand firm on the foundation; on secondary matters, set the views out side by side, with humility, without closing the case. That we are called, loved and kept; the faith once for all delivered; Jesus Christ as our only Master; keeping ourselves in God’s love; the God who is able to keep us from stumbling — not one debate has shaken any of these. Those who doubt are people to be shown mercy (1:22), not apostates.","care":"In the pews there will be people in the middle of a crisis of faith, with so many questions they dare not voice them; elderly believers who grow uneasy the moment they hear “scholars disagree”; and people who were once hurt by others using this letter — labelled as those who “crept in secretly,” threatened with verse 4, called unspiritual for asking questions — and who now dare not even trust God. With the first, do not say, “You just don’t have enough faith”; first show them mercy and walk alongside them — this is exactly what 1:22 commands. To the second, point out 1:1 and 1:24. With the third, let them know that what hurt them was people misusing Scripture, not the Lord who is “able to keep them from stumbling.” If doubts come with long-term sleeplessness or a sense of hopelessness, follow up with them individually after the meeting, and where necessary help them seek professional help."},{"id":"ISS01_1","t":"What is “the faith which was once for all delivered to the saints”? How can “contending earnestly” live alongside love?","r":"1:3; 1:8; 1:17; 1:9; 1:22–23","ch":[1],"why":"Verse 3 is Jude’s reason for writing this letter, and it is also the most quoted and most misused verse in the whole book. Some read “once for all delivered” as “the canon is closed; there is no more new revelation”; others read it as “the core of the gospel has been delivered complete.” The two readings directly affect how we deal today with teaching that claims new revelation, and how we tell the core from secondary matters. And the words “contend earnestly” are often pressed into service to endorse online wars of words — so we must first be clear: what is being contended for? And how?","pos":[["[1] What the text is asking","","<p>Jude had originally meant to write about “our common salvation,” but “I was constrained to write to you exhorting you to contend earnestly for the faith which was once for all delivered to the saints” (1:3). This sentence has three key words. ἐπαγωνίζεσθαι, “contend earnestly,” appears only here in the New Testament; its root belongs to the arena and the wrestling ground — an athlete striving with everything for the prize, not a quarrel. ἅπαξ, “once,” is the once-for-all kind of once, which never needs repeating. παραδοθείσῃ, “delivered,” is a word for handing on a tradition, as when Paul says, “I delivered to you first of all that which I also received” (1 Cor 15:3). And πίστει, “the faith,” does not mean here the act of believing, but the content of what is believed.</p><p>The text asks: how large is the content of this “once for all delivered”? Does it mean the whole New Testament canon, or the core of the gospel handed down by the apostles? And how can those who “contend earnestly” at the same time be people who are “loved” and who go on to show “mercy”?</p>"],["The closed-canon reading (once for all delivered = the Bible is already complete)","","<p>This reading links “once for all delivered” to the canon: God’s revelation was given complete in the age of the apostles, and once the New Testament was written there is no new revelation with authority equal to Scripture; any teaching that claims new revelation in order to add to or change the Bible has gone beyond this “once.” The strength of this reading is clear: the “dreaming” ones of verse 8 were very probably using dreams to go beyond the apostles’ teaching, and Jude wants his readers to “remember the words which have been spoken before by the apostles of our Lord Jesus Christ” (1:17), placing the standard on what the apostles preached. God “has at the end of these days spoken to us by his Son” (Heb 1:2); after the Son there is no higher word.</p><p><strong>Difficulty: </strong>When Jude wrote, the New Testament had not yet all been written, let alone collected into one volume; and Jude itself was only received generally by the churches later on. To equate “the faith which was once for all delivered” directly with the list of twenty-seven books is to put a later question into Jude’s mouth. Pushed too far, this reading can also easily deny, along with everything else, the Holy Spirit’s illumination and guidance in people’s hearts today.</p>"],["The gospel-core reading (once for all delivered = the content of the gospel the apostles preached)","","<p>This reading holds that πίστει refers to the content of the gospel handed down by the apostles: Jesus Christ is “our only Master”; his death and resurrection; salvation by grace, and by grace a holy life. Jude’s opponents were not arguing about how many books the Bible has; what they were doing was “turning the grace of our God into indecency, and denying our only Master, God, and Lord, Jesus Christ” (1:4) — what was being exchanged was the very core of the gospel. On this reading, “once for all delivered” means that the core has been delivered complete; it needs no new revelation to supplement it, and no one may swap it for another. This reminds us of Paul saying that even if “an angel from heaven, should preach to you any ‘good news’ other than that which we preached to you, let him be cursed” (Gal 1:8).</p><p><strong>Difficulty: </strong>Who draws the line around the “core”? Draw it too narrowly, and anything can be counted a secondary matter; draw it too widely, and even minor disagreements become “contending for the faith.” This reading must take the writings of the apostles as the actual content of the core; otherwise the “core” easily becomes whatever is at the core of each person’s own heart.</p>"],["[3] Where these notes stand","","<p><strong>These notes set the two readings side by side, take the gospel-core reading, and acknowledge that it overlaps with the canon reading.</strong> “Once for all delivered” means this: the gospel that God accomplished in Christ, handed down by the apostles, has been delivered complete; it needs no new revelation to supplement it, and no one may change it. The actual content of this core today is found in the New Testament, written by the apostles and recognised by the church. So in the pulpit both readings can be held together: whoever claims new revelation in order to go beyond the Bible has gone beyond this “once”; but “once for all delivered” does not mean that every detail has been frozen — on secondary matters the church must still search humbly and bear with one another.</p><p>As for how “contending earnestly” and love can live together, For the position of these notes on the whole book, see the issue “Contending for the faith without being contentious: what kind of contest is “contend earnestly”?” — what we contend for is the faith, not people, and not our own face; and Jude himself models the manner: in verse 9 Michael uses no slanderous words, but says only, “May the Lord rebuke you!”; in verses 20–21, keep yourselves first; in verses 22–23, the first verb is “have compassion” (the Chinese Union Version: ‘have mercy’). This chapter sets up no separate view.</p>"],["[4] Should this affect your faith?","","<p>No; if anything, this question brings stability. What you believe is not a set of ideas that has to be updated every few years, but “the faith which was once for all delivered to the saints” (1:3). You do not need to chase every new dream and every new revelation in order to keep up with God; the Bible in your hands is what that faith, once for all delivered, looks like by the time it reaches you.</p><p>Nor is “earnestly” a call for you to become a combative person. Jude himself was first a man who was kept, and only then did he contend for the faith; the way he contends finally lands on mercy and rescue. Those who hold fast to the faith can be gentle, because the faith does not stand by the volume of our voices.</p>"]],"con":[],"say":"Where these notes stand: “the faith which was once for all delivered” is the core of the gospel, handed down by the apostles and delivered complete; its content today is found in the New Testament. It needs no new revelation to supplement it, nor does it mean that every detail has been frozen. On how “contending earnestly” and love can live together, For the position of these notes on the whole book, see the issue “Contending for the faith without being contentious: what kind of contest is “contend earnestly”?”.","care":"There are two kinds of people in the pews who can be hurt by this verse. One has been ganged up on, online or in a small group, by people “contending for the faith,” and shrinks back the moment verse 3 is read; the other has been drawn to some “new revelation,” and is uneasy inside but does not dare to speak. Do not preach verse 3 as a bugle call sending the congregation off to war; and do not mock the person drawn to a new idea. First let people see that the ones Jude is writing to are “those who are called, sanctified by God the Father, and kept for Jesus Christ” (1:1; the Chinese Union Version, with the Greek text, reads ‘beloved in God the Father’). A pastor can tell the one who has been hurt: the contending Jude wants is Michael’s kind, not the kind that humiliates people; and can sit with the one who has been drawn in, taking the new idea back to the apostles’ words and searching it out together, slowly."},{"id":"ISS01_2","t":"“Long ago written about for this condemnation”: predestined to perdition, or a judgement already written down?","r":"1:4; 1:1; 1:5–16; 1:24","ch":[1],"why":"“Who were of old ordained to this condemnation” — so the Chinese Union Version renders it — is the line in Jude most likely to frighten people. When sensitive believers read it, what often comes to mind is not the men who crept in, but themselves: “Could I be the one who has been ordained?” This question touches the great debate over predestination, and it also touches whether a person can sleep in peace at night. So we must first see clearly which word Jude uses, and then say what he says and what he does not say.","pos":[["[1] What the text is asking","","<p>The Chinese Union Version reads ‘who were of old ordained to this condemnation’; the WEB has “those who were long ago written about for this condemnation” (1:4). The Greek is οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα. πάλαι is “long ago”; προγεγραμμένοι is the perfect passive participle of προγράφω, literally “written beforehand,” “publicly posted in advance.” When Paul says, “For whatever things were written before were written for our learning” (Rom 15:4), “written before” is this very word; when he tells the Galatians that Jesus Christ crucified had been “openly portrayed” before their eyes (Gal 3:1), “openly portrayed” is the same word too — like something posted on a public noticeboard, written out for people to see.</p><p>The text asks: when Jude says these men were “written about long ago,” where were they written about? Is it that God in eternity ordained certain people to perish without fail, or that there was a text written long ago that described in advance this kind of person and their end?</p>"],["The predestined-to-perdition reading (God’s eternal decree)","","<p>This reading takes “ordained” as God’s eternal predestination: before the creation of the world these men were ordained by God to undergo this judgement. Its supporters cite “For they stumble at the word, being disobedient, to which also they were appointed” (1 Pet 2:8), and “vessels of wrath prepared for destruction” (Rom 9:22), holding that Scripture does speak of God’s sovereignty in judgement; and historically some interpreters have placed verse 4 under the doctrine of reprobation.</p><p><strong>Difficulty: </strong>The word Jude uses is not one of the words for “choosing” or “predestining,” but “writing”; and he goes straight on to spend twelve verses (5–16) laying out, one by one, the things that were “written”: those who did not believe after the exodus, the angels who did not keep their proper place, Sodom, Cain, Balaam, Korah, Enoch’s prophecy. This reading turns a word describing that “the end of this kind of person is already on record” into a verdict on an individual’s destiny, skipping over the context. Even in the traditions that give most weight to God’s sovereignty, many interpreters do not build the doctrine of reprobation from this verse.</p>"],["The already-written reading (the Old Testament and Enoch’s prophecy had long since written down the end of such people)","","<p>This reading takes the word at face value: the judgement of these men has long been “written” down. The Old Testament records how those who did not believe after the exodus fell in the wilderness (Num 14), the fire of Sodom, and Korah swallowed by the earth; Enoch’s prophecy (1:14–15) had long since spoken of the Lord coming to judge all the ungodly. Jude’s point is: these men who crept in are nothing new; what they look like, and what their end will be, were written long ago; verses 5–16 are those “written” things. Jude’s pattern throughout the passage — “example — ‘these men’ — explanation” — supports this reading well.</p><p><strong>Difficulty: </strong>πάλαι, “long ago,” reaches very far back, and part of what Jude cites as “written” (Enoch’s prophecy) is not in the Old Testament canon, so readers will ask: in which book must it be written to count? Also, if this reading speaks only of “already on record,” it may make God’s sovereignty in judgement sound too light, as if judgement were only a historical record.</p>"],["The heavenly-book reading (a record kept before God)","","<p>A third reading takes “written” to refer to the books of heaven. Daniel saw the throne of judgement: “The judgment was set. The books were opened.” (Dan 7:10) Jewish writings of the Second Temple period also often say that people’s deeds and destinies are recorded in books in heaven. On this reading, the judgement of these men has long been recorded before God, waiting only to be opened on that day.</p><p><strong>Difficulty: </strong>Jude mentions no book; what he lays out immediately afterwards is Scripture and prophecy that readers can read, not records no one can see. And like the first reading, this one is very easily heard as “some people’s names have long been written on a list of the lost,” which does not fit the hope with which this letter opens and closes.</p>"],["[3] Where these notes stand","","<p><strong>These notes take the already-written reading, and set the other two readings alongside it.</strong> Verse 4 says that the end of this kind of person was written down long ago — the Old Testament and Enoch’s prophecy had long since described such people, and stated plainly their judgement; Jude is saying, “This is nothing new; Scripture saw it coming,” not passing sentence on anyone today. The pulpit may say, “Their end is already written in Scripture”; it may not say that some people have no hope from the day they are born, still less point at anyone in the pews and say so. For those who crept in, Jude gives marks, not a list of names (for the position of these notes on the whole book, see the issue “Discerning false teaching: does Jude give us marks, or a list of names?”).</p><p>On the great question of God’s sovereignty and our assurance, For the position of these notes on the whole book, see the issue “Kept by God and keeping ourselves: if God keeps me, why must I keep myself?”. The same letter opens by saying that its readers are those “kept for Jesus Christ” (1:1), and closes by saying that God is “able to keep them from stumbling” (1:24; the Chinese Union Version: ‘able to keep you from stumbling’). The “written” of verse 4 must be read between these two “keeps.”</p>"],["[4] Should this affect your faith?","","<p>It should not make you afraid. Someone who worries, “Have I been ordained to this?” is very likely someone who cares about God; the men verse 4 describes are those who treat God’s grace as a licence for indecency and deny our only Master by the way they live — they will not lose any sleep over this verse.</p><p>The first thing Jude writes to you is that you are loved in God the Father (so the Chinese Union Version; the WEB reads “sanctified by God the Father”) and “kept for Jesus Christ”; the last thing he writes to you is that this God is “able to keep them from stumbling” (1:24; the Chinese Union Version: ‘able to keep you from stumbling’). The judgement that is written is real, and the keeping that is written is real too; you can hand your worry over to the God who wrote down that keeping.</p>"]],"con":[],"say":"Where these notes stand: προγεγραμμένοι means “written down long ago” — the Old Testament and Enoch’s prophecy had long since written down the end of this kind of person (verses 5–16 are those written things); it is not a sentence passed on anyone today. Whenever verse 4 is preached, verse 1, “kept for Jesus Christ,” and verse 24, “able to keep them from stumbling” (the Chinese Union Version: ‘able to keep you from stumbling’), must be brought out with it. On God’s sovereignty and assurance, For the position of these notes on the whole book, see the issue “Kept by God and keeping ourselves: if God keeps me, why must I keep myself?”.","care":"In the pews there are people quick to blame themselves who often cannot sleep, and people who have been frightened by others with predestination; the moment they hear “ordained of old,” their hearts sink. Do not use this verse from the pulpit to speculate about anyone’s end, and do not say to someone who asks, “How do you know you aren’t?” A pastor can tell them: being troubled about this often shows precisely that the Holy Spirit is still at work in your heart; and then read verse 1 and verse 24 aloud together with them. If they are gripped by fears like this over a long period, so that their sleep and daily life are affected, walk with them gently as they seek counselling and professional help."},{"id":"ISS01_3","t":"Who saved the people out of Egypt — “the Lord” or “Jesus”?","r":"1:5; 1:4; 1 Cor 10:4; 1 Cor 10:9","ch":[1],"why":"The Chinese Union Version reads ‘the Lord, having once saved his people out of the land of Egypt’ — and the WEB likewise reads “the Lord” — but the Greek critical editions in common use today, SBLGNT and NA28, read “Jesus” here. This is one of the most famous puzzles in New Testament textual criticism, and it touches Christology directly: if Jude wrote “Jesus,” he is saying that the pre-existent Christ was already saving, and also judging, at the time of the exodus. If members of the congregation read “Jesus saved the people out of Egypt” in another translation, they may well think someone has changed the Bible — so the evidence must be laid out openly.","pos":[["[1] What the text is asking","","<p>The subject of verse 5 differs between the Greek editions: SBLGNT and NA28 read Ἰησοῦς (Jesus); WH and Treg read κύριος (Lord); RP reads ὁ κύριος, and the Chinese Union Version’s ‘the Lord’ agrees with it (as does the WEB: “the Lord, having saved a people out of the land of Egypt” (1:5)); a few other manuscripts read “God,” and one of the oldest papyrus manuscripts even reads “God Christ.” Then τὸ δεύτερον, “afterward,” ties the two events together: the same one who saved the people out of Egypt afterward ἀπώλεσεν, “destroyed,” those who did not believe.</p><p>The text asks: which word did Jude originally write? If it was “Jesus,” what is Jude saying? And what does this have to do with our knowledge of Christ?</p>"],["The “Jesus” reading (SBLGNT, NA28; some English translations)","","<p>External evidence: the manuscripts that support “Jesus” are old and widespread, including Codex Alexandrinus, Codex Vaticanus and several important minuscules, as well as ancient versions such as the Latin and Coptic. Internal evidence: “Jesus saved the people out of Egypt” is the harder reading, and a copyist was more likely to change the difficult “Jesus” into the smoother “Lord” than the other way round; moreover, in the manuscripts “Lord” and “Jesus” were both written as two-letter abbreviations differing by only one letter, which made a copying slip easy. Theologically it is not strange either: Paul says of the wilderness, “the rock was Christ” (1 Cor 10:4), and also, “Let’s not test Christ, as some of them tested” (1 Cor 10:9) — where the Chinese Union Version reads ‘the Lord’, while many ancient manuscripts read “Christ.” Jude has just called Jesus Christ “our only Master” in verse 4; for verse 5 to go on and say he was at work at the exodus follows naturally.</p><p><strong>Difficulty: </strong>The New Testament seldom uses “Jesus,” the name given after the incarnation, for Christ before he became man; placing “Jesus” in the time of the exodus can sound abrupt to readers. Attributing to Jesus even “afterward destroyed those who didn’t believe” (1:5) is, for many readers, a statement that needs explaining.</p>"],["The “Lord” reading (WH, Treg, RP; the Chinese Union Version)","","<p>External evidence: important manuscripts such as Codex Sinaiticus and Codex Ephraemi read “Lord,” and the later majority of manuscripts read ὁ κύριος. Internal evidence: apart from the places where Jude explicitly says “our Lord Jesus Christ” (verses 4, 17, 21, 25 — in verse 25 according to the Greek text and the Chinese Union Version; the WEB lacks the phrase there), the bare κύριος in verse 9, “May the Lord rebuke you!”, and in verse 14, “the Lord came with ten thousands of his holy ones,” most probably refers to God (though some take verse 14 to refer to Christ); the “Lord” of verse 5 falls exactly in the place of “Yahweh” in the Old Testament exodus narrative, and reads most naturally. On this reading, the “Lord” may be God the Father, or may be Christ; and many interpreters point out that, in Jude’s usage, this “Lord” can include the Son.</p><p><strong>Difficulty: </strong>If the original was the smooth “Lord,” it is very hard to explain why so many ancient manuscripts would change it into the harder “Jesus”; copyists usually smoothed difficulties away rather than creating them. This is also the main reason today’s critical editions have changed to “Jesus.”</p>"],["[3] Where these notes stand","","<p><strong>These notes set the two readings side by side; the pulpit follows the Chinese Union Version and preaches “the Lord,” and the variant is explained on the issue page and in the grammar column of the exposition.</strong> SBLGNT and NA28 judge, on the manuscript evidence, that “Jesus” is more likely to be the original reading, and the congregation should be told this judgement honestly; the Chinese Union Version rests on another manuscript tradition — it is not a “mistranslation.”</p><p>There is no conflict between the theology of the two readings. If we read “Jesus,” Jude is saying that the pre-existent Christ was already saving and judging at the exodus — this reminds us of 1 Cor 10:4, 9. If we read “Lord,” verse 4 has already called Jesus Christ “our only Master,” and Jude’s Christology is just as high. And Christ’s pre-existence does not rest on this verse: “In the beginning was the Word, and the Word was with God, and the Word was God” (John 1:1); “before Abraham came into existence, I AM” (John 8:58); “He is before all things” (Col 1:17). If verse 5 reads “Jesus,” that is simply one more witness; if it reads “Lord,” nothing is lost.</p>"],["[4] Should this affect your faith?","","<p>No. The differences between manuscripts are mostly a difference of one word like this, and they are all laid out openly in the critical editions, for anyone to check; the church is hiding nothing. It is precisely because there are so many manuscripts that we know where the differences are, and can weigh them.</p><p>Whichever reading we take, Jude wants you to remember the same thing: the one who saved you is also the one who will judge; among the people who were saved, some afterward fell in the wilderness through unbelief. This is not meant to make you afraid, but to make you go on believing — the warning shines first on ourselves, and then brings us back before the Lord who saved us.</p>"]],"con":[],"say":"Where these notes stand: on 1:5 the two readings are set side by side — SBLGNT and NA28 read “Jesus”; WH and Treg read “Lord”; RP reads “the Lord” (with the article); the Chinese Union Version reads ‘the Lord’ (as does the WEB). The pulpit follows the Chinese Union Version and preaches “the Lord,” and the issue page explains the variant. Whichever reading we take, Jesus Christ is “our only Master” of verse 4; Christ’s pre-existence rests on other clear texts (John 1:1; Col 1:17), not on this verse.","care":"Some in the congregation are deeply unsettled the first time they hear that “the manuscripts have variants,” thinking the Bible can no longer be trusted; others take this verse round telling everyone that “the Chinese Union Version mistranslated it.” Do not present the variant from the pulpit as a scandal, and do not use it to show off learning or to belittle the Chinese Union Version or any other translation. A pastor can calmly tell those who are unsettled: we have so many manuscripts that they can be checked against one another — this is exactly how God has preserved his word; and can sit with the one who loves finding faults, bringing the focus back from “who mistranslated it” to “the Lord who saves me is also the Lord who judges.”"},{"id":"ISS01_4","t":"Who are the angels who “didn’t keep their first domain”?","r":"1:6; 1:7; Gen 6:1–4; 2 Pet 2:4","ch":[1],"why":"Verse 6 is a single sentence, yet it raises many questions: who are these angels? When did they “not keep their first domain”? Why are they already held in custody? Is this the business of “the sons of God” in Genesis 6? This question often draws people into long speculations about angels, and online there are all kinds of mysterious theories about giants and hybrids. At the same time, verse 6 is the verse in the whole book closest to the theme of “proper place,” so it is all the more necessary first to explain clearly what the text itself means, and only then to say what it reminds us of.","pos":[["[1] What the text is asking","","<p>The Greek says these angels are τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον — “who didn’t keep their first domain, but deserted their own dwelling place.” ἀρχή can mean “beginning,” and can also mean “position of authority, an assigned sphere of rule”; οἰκητήριον is “dwelling place.” God’s response is τετήρηκεν, “he has kept,” the same word as “didn’t keep”: those who would not keep their proper place are kept by God. Verse 7 goes on to say that Sodom acted “in the same way as these” (τούτοις), and “these” most naturally refers to the angels of verse 6.</p><p>The text asks: which fall is this? Does it have anything to do with Gen 6:1–4? What does Jude want his readers to see from it?</p>"],["The Genesis 6 reading (the sons of God are angels)","","<p>This was the mainstream Jewish reading in the Second Temple period: the sons of God in Gen 6:2, 4 are angels, who left their heavenly dwelling and had intercourse with the daughters of men. Chapters 6–10 of 1 Enoch tell this story at length, saying that these angels were bound in darkness awaiting judgement, in language very close to verse 6. Further reasons in support: the Old Testament calls angels “God’s sons” (Job 1:6; 38:7); verse 7, “in the same way as these,” sets the angels’ crossing of the boundary side by side with the men of Sodom going after “strange flesh”; and 2 Pet 2:4–5 also places the angels who sinned alongside Noah’s flood. Not a few of the early church fathers took this reading.</p><p><strong>Difficulty: </strong>Jesus said that in the resurrection people “neither marry, nor are given in marriage, but are like God’s angels in heaven” (Matt 22:30), and many conclude from this that angels and humans cannot unite (though this saying speaks of the angels in heaven, and does not necessarily cover the fallen ones). This reading also very easily draws readers into the angelology of non-canonical writings, wandering further and further off.</p>"],["The original-fall reading (Satan and the angels who followed him)","","<p>This reading holds that verse 6 speaks of the original rebellion of Satan and the angels who followed him, with no need to connect it to Genesis 6. The reasons: Genesis 6 itself mentions no angels; Jude’s three warnings (the exodus, the angels, Sodom) need not be in historical order; and many also read Isa 14:12–15 and Ezek 28:12–17 as background to this fall (though on the surface those two passages are addressed to the king of Babylon and the king of Tyre).</p><p><strong>Difficulty: </strong>If this is the original fall, why are these angels already kept “in everlasting bonds under darkness” (1:6), while in the New Testament the devil still “walks around like a roaring lion” (1 Pet 5:8)? This reading needs to divide the fallen angels into two groups — those already in custody and those not yet — and the text does not explain this.</p>"],["The line-of-Seth reading (Genesis 6 is a separate matter; verse 6 refers to a fall of angels)","","<p>From the third and fourth centuries on, many interpreters (including Augustine) held that “the sons of God” in Genesis 6 are the godly descendants of Seth and “the daughters of men” the descendants of Cain; the two family lines intermarried, and the godly line was corrupted as a result. On this reading, Jude 6 has nothing to do with Genesis 6, and refers to a separate fall of angels. Reasons in support: Genesis 4–5 sets out precisely the two genealogies of Cain and Seth, and this reading avoids the difficulty of angels uniting with humans.</p><p><strong>Difficulty: </strong>In the context of Genesis 6, the contrast between “the sons of God” and “the daughters of men” does not look much like a distinction between two genealogies; and Jude’s readers were generally familiar with the background of the first reading, so that when Jude wrote verses 6 and 7 he very probably assumed that background too.</p>"],["[3] Where these notes stand","","<p><strong>These notes set the three readings side by side, and lean towards not giving a verdict.</strong> The point of verse 6 is not who these angels are or when it happened, but the certainty of judgement: not even angels who did not keep their proper place escaped God’s judgement; they are kept in custody “for the judgment of the great day” (1:6). Jude uses the same word for their “not keeping” and their being “kept” — those who would not keep their proper place are kept by chains.</p><p>On the great question of angels, the devil and spiritual warfare, For the position of these notes on the whole book, see the issue “Angels, the devil and spiritual warfare: how does Jude want us to see the unseen world?”; for the non-canonical background behind this verse, see the issue “Scripture quoting non-canonical books: what does it mean that Jude cites the Assumption of Moses and 1 Enoch?”. The pulpit does not build up names, ranks and details of angels from 1 Enoch. Only after the certainty of judgement has been preached do we say: ἀρχή is an assigned position, and crossing the boundary to grab what does not belong to us is the very shape of pride — this reminds us of what 321 says: “pride is leaving our proper place and grasping power.”</p>"],["[4] Should this affect your faith?","","<p>No. You do not need to know who these angels were in order to understand what Jude wants to say: God’s judgement is certain, and not even the most powerful of created beings is an exception.</p><p>And in the same letter Jude gives us a place to keep: “Keep yourselves in God’s love” (1:21). The angels left the place God had assigned them; the place we are called to keep is God’s love. Those who would not keep their proper place are kept by chains; those who are willing to keep themselves in God’s love are kept by God’s hand.</p>"]],"con":[],"say":"Where these notes stand: the three readings of “the angels who didn’t keep their first domain” in verse 6 are set side by side (the sons of God of Genesis 6 / the original fall / Genesis 6 taken separately as the line of Seth, with verse 6 referring to a separate fall of angels), leaning towards not giving a verdict; the point is the certainty of judgement — those who would not keep their proper place are “kept” by God. On angels and spiritual warfare, For the position of these notes on the whole book, see the issue “Angels, the devil and spiritual warfare: how does Jude want us to see the unseen world?”.","care":"Some brothers and sisters, especially young people, are fascinated by topics like this, and have read heaps of online theories about giants, hybrids and the names of angels; others become afraid the moment they hear about angels falling. Do not preach verse 6 from the pulpit as a fantasy story, and do not mock those who ask these questions. A pastor can sit with the fascinated one and help them tell what the text says from what later people have added; and can help the frightened one see that even these angels are under God’s hand — and you are all the more in his hand (1:24)."},{"id":"ISS01_5","t":"Sodom and “strange flesh”: what was Sodom’s sin, and how should we preach it today?","r":"1:7; 1:6; 1:8; Gen 19:4–11; Ezek 16:49–50","ch":[1],"why":"Verse 7 touches directly on one of the most sensitive subjects in the church today: sexual ethics. Some use this verse to prove that Sodom’s sin was nothing but same-sex sexual acts; others say that Sodom’s sin was only failing to welcome strangers and oppressing the poor, and had nothing to do with sex. If the pulpit avoids the subject, it leaves the congregation to the internet; if it speaks roughly, it pushes those in the pews who are struggling right now out of the door. So we must look honestly at what the text says, and also think clearly about who is sitting there listening.","pos":[["[1] What the text is asking","","<p>The Chinese Union Version reads ‘in like manner gave themselves over to fornication, and went after unnatural lust’; the WEB has “having in the same way as these given themselves over to sexual immorality and gone after strange flesh” (1:7). The Greek is τὸν ὅμοιον τρόπον τούτοις ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας. ἐκπορνεύσασαι is an intensified “commit sexual immorality”; σαρκὸς ἑτέρας is literally “other flesh,” and ‘unnatural lust’ is the Chinese Union Version’s interpretive rendering. τούτοις, “these,” most naturally refers to the angels of verse 6: the angels crossed the boundary towards human beings; the men of Sodom crossed the boundary towards the “men” who had come into the city — the two guests in Genesis 19 were in fact angels. The final word, δεῖγμα, “example,” is a specimen set out for people to see.</p><p>The text asks: what does “other flesh” refer to? Was Sodom’s sin one thing, or several? When we preach this verse today, to whom are we speaking, and how?</p>"],["The same-sex sexual acts reading","","<p>In Genesis 19 the men of the city surrounded Lot’s house and demanded that he bring out his guests: “Bring them out to us, that we may have sex with them” (Gen 19:5) — a demand by men for sexual violence against men. Ancient Jewish writers and many church fathers linked Sodom’s sin to same-sex sexual acts; the sexual ethics of the New Testament also speaks of “men doing what is inappropriate with men” (Rom 1:27), and the list in 1 Cor 6:9 includes related words. On this reading, “other” refers to leaving the path God established at the beginning, the union of man and woman.</p><p><strong>Difficulty: </strong>σαρκὸς ἑτέρας is literally “different flesh,” and strictly speaking flesh of the same sex is not “other” flesh; this reading has to take “other” to mean “contrary to nature,” which is some distance from the literal sense. Moreover, the men in Genesis 19 intended violence against the guests; their behaviour cannot be used directly to describe every person today who struggles with their sexual orientation.</p>"],["The humans-and-angels reading","","<p>This reading holds that “other flesh” refers to angels: the ones the men of Sodom meant to violate were in fact angels (though they did not know it), which mirrors exactly the angels of verse 6 crossing the boundary in pursuit of humans — the angels crossed downward, the humans crossed upward, and both went beyond the boundary God had set. Verse 7, “in the same way as these,” places the two side by side, supporting this reading.</p><p><strong>Difficulty: </strong>The men of Sodom did not know that the two were angels; their intention was violence against “men.” If the point were only about angels, this warning would have nothing direct to say about the readers’ sexual lives. Yet Jude goes straight on in verse 8: “Yet in the same way, these also in their dreaming defile the flesh” (1:8) — plainly speaking of sexual sin in human beings.</p>"],["The boundary-crossing reading (crossing the boundaries God set for sex)","","<p>This reading puts the emphasis on “crossing the boundary”: angels with humans, sexual violence, same-sex sexual acts — all are leaving the place God has set for sex. This reading strings verses 6, 7 and 8 into one line: the angels did not keep their proper place, the men of Sodom crossed the boundary, “these men” defile the flesh — one and the same shape of “not keeping one’s proper place.” The prophet also reminds us that Sodom’s sin was not just one thing: “pride, fullness of bread, and prosperous ease was in her and in her daughters. She also didn’t strengthen the hand of the poor and needy” (Ezek 16:49); and they “committed abomination before me” (Ezek 16:50).</p><p><strong>Difficulty: </strong>This reading covers a lot of ground, and can easily be used to make the question of sex vague, or, the other way round, to make every sin into a sexual sin; whoever preaches it must honestly speak to both sides.</p>"],["[3] Where these notes stand","","<p><strong>These notes set the three readings side by side, take the boundary-crossing reading, and hold to the sexual ethics of Scripture.</strong> Sex is a good gift from God, belonging to the covenant of one man and one woman in marriage; sexual acts outside marriage, whether heterosexual or same-sex, Scripture calls sin (Rom 1:26–27; 1 Cor 6:9–10). At the same time, Sodom’s sin was not just one thing: pride, fullness, ease and not helping the poor are all under God’s judgement too — and this line shines first on those of us who eat well and live comfortably. Jude’s own landing point is verse 8: “Yet in the same way, these also” — the warning is a mirror held up for the readers.</p><p>The pulpit does not shame, mock or label any group or individual, nor does it skip this passage for fear of controversy. Someone who is struggling under temptation and wants to follow the Lord is not the kind of person verse 4 describes, who treats God’s grace as an excuse for indecency. Straight after that list, Paul says: “Some of you were such, but you were washed. But you were sanctified. But you were justified in the name of the Lord Jesus, and in the Spirit of our God.” (1 Cor 6:11)</p>"],["[4] Should this affect your faith?","","<p>If you are struggling in the area of sex — whatever kind of struggle it is — this verse is not a verse that shuts you out. Sodom is set out as an example so that everyone — including those in the pulpit — may see where sin ends, and then turn back; and the way back is already written in 1 Cor 6:11: washed, sanctified, justified — all of it accomplished by God.</p><p>In the same letter Jude says that this God is “able to keep them from stumbling, and to present you faultless before the presence of his glory in great joy” (1:24; the Chinese Union Version reads ‘you’ throughout). Faultless is not something you earn for yourself; it is the clothing he puts on you.</p>"]],"con":[],"say":"Where these notes stand: the three readings of “other flesh” in verse 7 are set side by side (same-sex sexual acts / humans and angels / crossing the boundaries God set), and we take the boundary-crossing reading; we hold to the sexual ethics of Scripture (Rom 1:26–27; 1 Cor 6:9–11), while also setting out that Sodom’s sin was not just one thing (Ezek 16:49–50); the warning shines first on ourselves (1:8); we do not shame or label any group or individual, nor skip this passage for fear of controversy.","care":"There will certainly be people in the pews who are struggling in the area of sex right now — it may be same-sex attraction, it may be pornography, it may be a relationship that should not be happening — and most often nobody knows. When they listen to verse 7, they are listening for whether the church is going to shut the door. Do not tell jokes of this kind from the pulpit, do not use contemptuous names for any group, and do not dodge the issue by saying that “Sodom’s sin was only being inhospitable.” A pastor can let them know: you can come and talk to me; I will keep it confidential (unless your safety is at risk); I will walk with you; “you were washed” was written to real people. If anyone falls into shame because of this, or has thoughts of harming themselves, walk with them at once to seek professional help."},{"id":"ISS01_6","t":"Michael and the body of Moses: where does it come from, and may believers “rebuke the devil”?","r":"1:9; 1:8; 1:10; Deut 34:5–6; Zech 3:2","ch":[1],"why":"Verse 9 tells of something the Old Testament does not record: Michael the archangel contending with the devil over the body of Moses. Readers naturally ask: how did Jude know about it? On the other hand, prayers that loudly “rebuke the devil” are popular in many meetings today; some people have been helped by them, and some have been frightened. Even the archangel said only, “May the Lord rebuke you!” — what does this sentence actually mean for our prayer and for spiritual warfare?","pos":[["[1] What the text is asking","","<p>The Greek is ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος. The Old Testament says only that Moses died in the land of Moab and God buried him, “but no man knows where his tomb is to this day” (Deut 34:6); Michael appears in Dan 10:13 and 12:1 and in Rev 12:7. Michael οὐκ ἐτόλμησεν, “dared not,” κρίσιν ἐπενεγκεῖν βλασφημίας, “bring against him an abusive condemnation,” but said only Ἐπιτιμήσαι σοι κύριος — in the optative mood, “May the Lord rebuke you!” This reminds us of “Yahweh rebuke you, Satan!” (Zech 3:2). διακρινόμενος, “contending,” is the same word as “those who doubt” in verse 22 (the Chinese Union Version’s rendering; the WEB: “making a distinction”).</p><p>The text asks two things: where does this story come from? And if even the archangel dared not pass sentence on his own authority, can we — and should we — “rebuke the devil”?</p>"],["Source one: the Assumption of Moses (as the early church fathers record)","","<p>Early church fathers such as Clement of Alexandria and Origen say that this story comes from a Jewish work called the Assumption of Moses. The surviving Latin fragment has lost its ending, and this passage cannot be found in it; later writings retell the outline of the story: after Moses died, the devil tried to claim his body, on the grounds that Moses had once killed a man and did not deserve an honourable burial; Michael did not argue with him, but simply committed the matter to the Lord.</p><p><strong>Difficulty: </strong>The surviving text lacks this passage, so we cannot check word for word the original Jude was quoting; the details of the story come from later retellings, and the versions do not entirely agree. If the pulpit fills in these details too fully, it is speaking on behalf of a book that no one today can see.</p>"],["Source two: an oral tradition well known to the readers","","<p>This reading holds that the story was widely known in the Jewish communities of Jude’s day, and that Jude need not have copied it from any particular book, but used a tradition familiar to his readers to illustrate his point — just as a preacher cites a story everyone has heard. Jude’s point is also very clear: when contending, even the archangel does not pass sentence on his own authority.</p><p><strong>Difficulty: </strong>The early church fathers say plainly that it comes from a book; and whether from a book or from oral tradition, the question is the same: Jude used a tradition from outside the Old Testament. This reading only restates the question; it does not make the question go away.</p>"],["Rebuking, view one: commanding evil spirits directly in the Lord’s name","","<p>The Lord Jesus said to the one tempting him, “Get behind me, Satan!” (Matt 4:10); the seventy returned saying, “Lord, even the demons are subject to us in your name!” (Luke 10:17); Paul “turned and said to the spirit, ‘I command you in the name of Jesus Christ to come out of her!’ ” (Acts 16:18); and James also says, “Resist the devil, and he will flee from you” (Jas 4:7). On this reading, believers have grounds for commanding evil spirits to leave in the Lord’s name.</p><p><strong>Difficulty: </strong>Most of these examples are specific occasions of casting out demons, not a habit of shouting at the devil in everyday prayer; and the Lord also said, “don’t rejoice in this, that the spirits are subject to you, but rejoice that your names are written in heaven” (Luke 10:20). When rebuking becomes a performance, a slogan or a mockery, or when every difficulty is blamed on the devil, it is a long way from Michael in verse 9.</p>"],["Rebuking, view two: ask only of God; pass no sentence on the devil","","<p>This reading seizes on the “dared not” of verse 9: even the archangel, facing the devil, did not pass sentence on his own authority, but handed judgement over to the Lord. On this reading, believers need not speak to the devil at all; they need only pray to God and ask the Lord himself to rebuke him — this is the most direct example in verse 9, and the surest way to keep prayer from becoming a performance.</p><p><strong>Difficulty: </strong>Pushed too far, this reading overlooks the fact that the New Testament really did give the disciples authority in the Lord’s name (Luke 10:19), and that “resist” is a command (Jas 4:7; 1 Pet 5:9). What verse 9 forbids is passing sentence with slanderous words, not every kind of resistance to evil.</p>"],["[3] Where these notes stand","","<p><strong>On the source: these notes take the record of the early church fathers (the Assumption of Moses, whose surviving text lacks this passage), and set the oral-tradition view alongside it.</strong> What is inspired is Jude, not the book it quotes; quoting a tradition is not endorsing the whole book; and the pulpit does not build an angelology from this passage. For the position of these notes on the whole book, see the issue “Scripture quoting non-canonical books: what does it mean that Jude cites the Assumption of Moses and 1 Enoch?”.</p><p><strong>On rebuking: resisting the devil is a command; the authority lies in the Lord’s name, not in the volume of our voices; and the posture is Michael’s — no slander, no mockery, no performance, handing judgement back to the Lord.</strong> When it is needed, we may command in the Lord’s name, as the disciples and Paul did (Luke 10:17; Acts 16:18); whichever way we do it, the words of verse 9, “May the Lord rebuke you!”, are the posture of prayer: authority and judgement both belong to the Lord. On the great question of spiritual warfare, For the position of these notes on the whole book, see the issue “Angels, the devil and spiritual warfare: how does Jude want us to see the unseen world?”. Verse 9 is also a demonstration of the “contend earnestly” of verse 3: those who stand firm for the truth can leave the words of condemnation to God.</p>"],["[4] Should this affect your faith?","","<p>No. You do not need to know every detail of the story, nor learn a particular tone of voice in prayer, in order to be on the winning side. Victory does not lie in how loudly you shout, but in that “Lord” — Michael handed the matter over to him, and so can you.</p><p>If you have ever been frightened by a meeting full of loud rebuking, you can be at peace: the example Jude gives you is precisely that quiet sentence. If you are used to resisting in the Lord’s name, that is good too; only remember that the authority is his, and the glory is his as well (1:25).</p>"]],"con":[],"say":"Where these notes stand: on the source of verse 9 we take the Assumption of Moses named by the early church fathers (its surviving text lacks this passage), and set the oral-tradition view alongside it; what is inspired is Jude, and quoting is not endorsing — for the position of these notes on the whole book, see the issue “Scripture quoting non-canonical books: what does it mean that Jude cites the Assumption of Moses and 1 Enoch?”. Resisting the devil is a command of Scripture (Jas 4:7), and the authority lies in the Lord’s name; the posture follows Michael — no slander, no performance, handing judgement back to the Lord. On spiritual warfare, For the position of these notes on the whole book, see the issue “Angels, the devil and spiritual warfare: how does Jude want us to see the unseen world?”.","care":"In the pews there are people who were once frightened by meetings that loudly “rebuked the devil,” and have not dared to go to a prayer meeting since; there are people who put their own depression, illness and family conflicts all down to the devil, and so have delayed seeing a doctor or making the reconciliation they need; and there are people who treat spiritual warfare as a joke. Do not perform rebukes from the pulpit, and do not make jokes about the devil. A pastor can pray quietly with the one who is afraid, “May the Lord rebuke you!”; and can walk with the one who blames everything on the devil — praying, and also seeing a doctor, and also facing the people they need to face — none of these conflict with one another."},{"id":"ISS01_7","t":"What does it mean that Jude quotes 1 Enoch?","r":"1:14–15; 1:9; Gen 5:21–24; Acts 17:28; Titus 1:12","ch":[1],"why":"In verses 14–15 Jude quotes the prophecy of “Enoch, the seventh from Adam.” These words cannot be found in the Old Testament, yet they appear almost word for word in 1 Enoch 1:9. Because of this, some in the early church hesitated over whether to receive Jude, while others, conversely, came to treat 1 Enoch as Scripture; and online today some claim that “the church hid the Book of Enoch.” This question bears on the canon and on inspiration, and also on how we read ancient literature — it must be explained honestly and clearly.","pos":[["[1] What the text is asking","","<p>The Greek is Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ — Jude introduces Enoch’s words with the verb “prophesied.” The quotation says: “Behold, the Lord came with ten thousands of his holy ones, to execute judgment on all” (1:14–15). These words are almost identical to 1 Enoch 1:9. 1 Enoch is a Jewish work of the Second Temple period, its parts written roughly between the third century BC and the first century AD (the opening section, where the quotation is found, belongs to the earliest group); the complete text survives in ancient Ethiopic (Ge’ez), and Aramaic fragments have also been found among the Dead Sea Scrolls. “The seventh from Adam” follows the genealogy of Genesis 5, counting from Adam; Scripture records that Enoch walked with God, and God took him (Gen 5:24).</p><p>The text asks: when Jude calls these words a “prophecy,” does that mean he regarded 1 Enoch as Scripture?</p>"],["The canonical reading (Jude acknowledges the book as inspired)","","<p>This reading holds that since Jude calls it prophecy, he is acknowledging 1 Enoch as an inspired book. Some in the early church did see it this way — Tertullian argued for accepting the book, and one of his reasons was precisely that Jude quotes it; and today the Old Testament canon of the Ethiopian Orthodox Church includes 1 Enoch. This is a genuine choice made by an ancient church tradition, and the pulpit should present it accurately, without mockery.</p><p><strong>Difficulty: </strong>Apart from the Ethiopian church, neither the Jewish canon nor the canons of most churches through the ages include this book; and Jude itself was for a time hesitated over in the early period precisely because it quotes it. Moreover, the word “prophesied” can refer only to the content of this one saying — a prediction of judgement to come — without covering the whole book.</p>"],["The illustration reading (quoting a work familiar to the readers)","","<p>This reading holds that Jude is quoting a work familiar to his readers as an illustration, just as a preacher quotes a saying everyone knows; he is borrowing words his readers knew in order to make plain the end of “these men,” not taking a position on the status of the book. The whole of verses 5–16 follows the pattern “example — ‘these men’ — explanation,” and Enoch’s words are one of the examples.</p><p><strong>Difficulty: </strong>Jude does not merely quote; he says that Enoch “prophesied,” which carries more weight than simple borrowing; to say that he “just borrowed it” entirely also underrates Jude’s affirmation of the content of this saying.</p>"],["The true-saying reading (this saying is true, which does not make the whole book inspired)","","<p>This reading holds that what Jude affirms is that the content of this saying is true — the Lord will surely come with ten thousands of his holy ones to judge the ungodly, which is in keeping with the Old Testament theme of judgement (Deut 33:2 says of Yahweh, “He came from the ten thousands of holy ones”; Zech 14:5). To affirm that one saying is true is not to affirm that the whole book is inspired. In Athens Paul quoted the Greek poets: “For we are also his offspring” (Acts 17:28); in Titus he quotes the Cretans’ own “prophet of their own,” and even says, “This testimony is true” (Titus 1:13) — yet Paul did not thereby put the works of those poets into the Bible.</p><p><strong>Difficulty: </strong>Readers will still press the question: if that saying is true, what about the rest of the book? The answer requires weighing it passage by passage, and cannot be dismissed in a sentence; this reading requires the preacher to have a basic knowledge of ancient literature, and honesty about it.</p>"],["[3] Where these notes stand","","<p><strong>These notes set the three readings side by side, take the true-saying reading, and also draw on the illustration reading: what is inspired is Jude, not the book it quotes; quoting one true saying is not endorsing the whole book.</strong> For the position of these notes on the whole book, see the issue “Scripture quoting non-canonical books: what does it mean that Jude cites the Assumption of Moses and 1 Enoch?”. The pulpit presents the canon of the Ethiopian church accurately, without mockery; it does not build names of angels or end-times timetables from 1 Enoch; nor, because Jude quotes it, does it belittle Jude — though there was hesitation in the early church, Jude was in the end universally received as canonical (for the whole-book position, see the issue “Author, recipients and canonical status: who is “Jude, brother of James”? How was this letter received into the canon?”).</p><p>The role of Enoch’s words in Jude is very simple: the Lord will surely come to judge, and the judgement is all-embracing. In the Greek, “ungodly” occurs four times within a single verse, so that readers see clearly where that road ends.</p>"],["[4] Should this affect your faith?","","<p>No. It is nothing strange for God’s word to borrow human words: Paul quoted Greek poets, and Jude quoted a work his readers knew; what inspiration guarantees is that what the biblical authors wrote is true and trustworthy, not that every book they quote carries equal authority. The church has hidden nothing; anyone can read these books today.</p><p>Enoch was a man who “walked with God”; Jude quotes his words so that readers will see the judgement, and even more so that they will turn back and walk with God — a landing point more important than any scholarly inquiry.</p>"]],"con":[],"say":"Where these notes stand: verses 14–15 quote 1 Enoch 1:9; the three readings are set side by side (canonical / illustration / true saying), and we take the true-saying reading — what is inspired is Jude, and quoting one true saying is not endorsing the whole book (Acts 17:28; Titus 1:12). We present the canon of the Ethiopian church accurately, do not build an angelology from non-canonical writings, and do not use this to belittle Jude. For the position of these notes on the whole book, see the issue “Scripture quoting non-canonical books: what does it mean that Jude cites the Assumption of Moses and 1 Enoch?”.","care":"Curious young people will go online and read 1 Enoch for themselves, and come back with a pile of questions about giants, the names of angels and calendar calculations; others hear that “the Bible quotes non-canonical books” and feel the foundations of their faith coming loose. Do not mock from the pulpit those who read non-canonical books, nor present such books as forbidden; do not say “the church covered it up,” and do not pretend it never happened. A pastor can read it together with the curious one, teaching them to tell a quotation from the whole book, and a true saying from inspiration; and can help the uneasy one see that the Bible can stand up to this kind of scrutiny."},{"id":"ISS01_8","t":"Does “praying in the Holy Spirit” mean speaking in tongues?","r":"1:20; 1:19; 1 Cor 14:14–15; Eph 6:18; Rom 8:26","ch":[1],"why":"“Praying in the Holy Spirit” in verse 20 is one of Jude’s four actions. In Chinese churches, tongues is a subject that easily divides: some churches regard speaking in tongues as the sign of being filled with the Holy Spirit, while others keep well away from it; and both sides make use of the words “praying in the Holy Spirit.” If the pulpit defines it wrongly, some in the congregation will feel they are not spiritual enough, or others will feel their experience has been dismissed.","pos":[["[1] What the text is asking","","<p>The Greek is ἐν πνεύματι ἁγίῳ προσευχόμενοι, a participle, which together with “building up” and “looking for” explains how to “Keep yourselves in God’s love” (1:21). It deliberately contrasts with verse 19: those who think themselves spiritual and cause divisions are πνεῦμα μὴ ἔχοντες — “not having the Spirit” (1:19); but you are to pray in the Holy Spirit. The dividing line is not eloquence, dreams or any outward experience; it is whether or not one has the Spirit.</p><p>The text asks: does “in the Holy Spirit” refer to a particular way of praying (tongues), or to all prayer that relies on the Holy Spirit, is led by the Holy Spirit, and works together with the Holy Spirit?</p>"],["The reading that includes praying in tongues","","<p>Paul says, “For if I pray in another language, my spirit prays” (1 Cor 14:14), and also, “I will pray with the spirit, and I will pray with the understanding also” (1 Cor 14:15); “He who speaks in another language edifies himself” (1 Cor 14:4) — and Jude 20 sets “building up yourselves” (the same root as “edifies”) right beside “praying in the Holy Spirit.” On this reading, the praying in the Holy Spirit Jude speaks of includes at least praying in tongues. Paul himself said, “I speak with other languages more than you all” (1 Cor 14:18), and also instructed, “don’t forbid speaking with other languages” (1 Cor 14:39).</p><p><strong>Difficulty: </strong>Jude nowhere mentions tongues, and we do not know whether Jude’s readers commonly spoke in tongues. Paul also asks, “Do all speak with various languages?” (1 Cor 12:30), and the answer is no; to restrict verse 20 to tongues would put many believers outside this command, which does not fit the fact that verse 20 is addressed to all the “beloved.”</p>"],["The reading of all prayer that relies on the Holy Spirit","","<p>Paul speaks of “all prayer and requests, praying at all times in the Spirit” (Eph 6:18); and also says, “for we don’t know how to pray as we ought. But the Spirit himself makes intercession for us with groanings which can’t be uttered” (Rom 8:26); the Spirit in our hearts is “crying, ‘Abba, Father!’ ” (Gal 4:6). On this reading, “praying in the Holy Spirit” is praying as the Holy Spirit leads, in the Holy Spirit’s power, according to God’s will — and prayer with the understanding and prayer in tongues can both have a place within it.</p><p><strong>Difficulty: </strong>Taken too broadly, this reading can turn “in the Holy Spirit” into a vague adjective, as though any prayer automatically counts; it can also be used to quietly play down tongues, as though tongues were optional or even suspect.</p>"],["[3] Where these notes stand","","<p><strong>These notes set the two readings side by side, without defining or giving a verdict.</strong> What is certain is this: verse 20 is addressed to all the readers; believers who do not speak in tongues are just as much called to pray in the Holy Spirit; and believers who do speak in tongues need not be regarded, because of this verse, as second-class or suspect. The pulpit does not define “praying in the Holy Spirit” as requiring tongues, nor does it disparage tongues.</p><p>Jude’s point lies in the contrast: the people of verse 19 are “not having the Spirit,” so their spirituality is something they prop up by themselves; but you are to pray in the Holy Spirit, admitting that you do not know how to pray as you ought, and letting the Holy Spirit lead you in prayer. The landing point is a life of prayer that relies on the Holy Spirit: building up, praying, keeping and looking for together make up days lived “in God’s love.”</p>"],["[4] Should this affect your faith?","","<p>No. If you do not speak in tongues, your prayers are not second-class prayers; the Spirit himself “makes intercession for us with groanings which can’t be uttered” — and does so precisely when you are least able to find words. If you do speak in tongues, you need not hide it or be ashamed; Paul thanked God for this gift.</p><p>Whichever is true of you, the question Jude wants you to ask is not “What way do I pray?” but “Am I praying in reliance on the Holy Spirit, with a heart that is looking for him?” This is a question everyone can answer, every day.</p>"]],"con":[],"say":"Where these notes stand: the two readings of “praying in the Holy Spirit” in verse 20 are set side by side — prayer that includes speaking in tongues (1 Cor 14:14–15) / all prayer led by and working together with the Holy Spirit (Eph 6:18; Rom 8:26); we do not define it as requiring tongues, nor disparage tongues; the landing point is a life of prayer that relies on the Holy Spirit, in contrast with “not having the Spirit” in verse 19.","care":"In the pews there may be someone who was told, “If you can’t speak in tongues, you haven’t yet been filled with the Holy Spirit,” and has not been able to hold their head up at prayer meetings since; there may also be someone who spoke in tongues at another church and was treated as an oddity, and does not dare mention it here. Do not use your own church’s habits to define verse 20 from the pulpit, and do not make jokes about either side’s experience. A pastor can read Rom 8:26 with the one who feels second-class, and 1 Cor 14:39 with the one who has been rejected; let both kinds of people know that here we can pray together."},{"id":"ISS01_9","t":"Verses 22–23: two groups or three? How should we treat those who doubt?","r":"1:22–23; 1:9; 1:2; 1:21; John 7:5; Jas 1:6","ch":[1],"why":"These two verses are the gentlest place in Jude, and also the place where the manuscripts of the whole book are most tangled: some manuscripts yield three kinds of people, some yield two, and some replace “have mercy” with “refute.” This is not just an academic question — it decides whether the young person in the small group who is full of questions is, in the church’s eyes, “someone to be shown mercy” or “someone to be argued down.” And Jude, who wrote these two verses, once did not believe in his own brother.","pos":[["[1] What the text is asking","","<p>SBLGNT has three groups: καὶ οὓς μὲν ἐλεᾶτε διακρινομένους, οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ — and the Chinese Union Version follows this reading, rendering it ‘Have mercy on some who doubt; save others, snatching them out of the fire; and on others have mercy with fear’ (1:22–23; the WEB follows a two-group text: “On some have compassion, making a distinction, and some save, snatching them out of the fire with fear”). διακρινομένους, “those who doubt,” is the same word as διακρινόμενος, “contending,” used of Michael in verse 9: one contends outwardly with the devil; the other contends inwardly with himself.</p><p>The text asks: is Jude speaking of two kinds of people or three? What is it to “doubt”? And towards such people, what should the church’s first move be?</p>"],["The three-group reading (SBLGNT, NA28; the Chinese Union Version)","","<p>Three kinds of people, three ways of rescue: those who doubt — have mercy on them; those already at the edge of the fire — snatch them out; those who have sunk deep — have mercy on them with fear, “hating even the clothing stained by the flesh.” Reasons in support: the structure “some … others … others” is neat; and Jude loves groups of three anyway (three titles in verse 1, three blessings in verse 2, three ways in verse 11). The distinction between three kinds of people also fits pastoral reality: each person needs a different kind of rescue.</p><p><strong>Difficulty: </strong>The manuscript tradition of these two verses is extremely tangled, and the three-group reading is not overwhelming; “have mercy” appearing twice also makes some scholars suspect that it arose from repetition in copying.</p>"],["The two-group reading (WH, RP)","","<p>WH and RP both yield only two groups, and the earliest papyrus manuscript, P72, also has two groups. RP reads διακρινόμενοι, a nominative, referring to the readers themselves: ‘On some have compassion, making a distinction; and others save with fear, snatching them out of the fire’ — the early English King James Version followed this reading (and the WEB follows a two-group text too). On this reading, the word does not say that those people are doubting, but calls the readers to discernment.</p><p><strong>Difficulty: </strong>The two-group reading itself comes in several forms that do not agree with one another; and reading the word as “you are to make a distinction” loses the thread linking it to the same word, “contending,” used of Michael in verse 9, and also means that verse 22 no longer speaks specifically of people with questions in their hearts.</p>"],["The refuting reading (Treg reads ἐλέγχετε)","","<p>Treg and others read ἐλέγχετε, “refute, correct,” in verse 22 — the same verb as ἐλέγξαι, “convict,” in verse 15: ‘Refute some who doubt.’ On this reading, what the first group needs is reasoning and having their errors pointed out; διακρινομένους can also be taken as “those who dispute with you.”</p><p><strong>Difficulty: </strong>A copyist was more likely to change a repeated “have mercy” into another verb than the reverse; and “refute” looks out of place on the thread of “mercy” that runs through the whole book (verses 2, 21, 22, 23). Even if this reading is adopted, reasoning is not humiliating: the Lord’s servant is to be “in gentleness correcting those who oppose him” (2 Tim 2:25).</p>"],["[3] Where these notes stand","","<p><strong>These notes take the three-group reading (following SBLGNT and the Chinese Union Version), and set the two-group and refuting readings alongside it. Doubting is not apostasy; the first verb of verse 22 is “have mercy.”</strong> διακρινομένους describes someone arguing inside, wavering — when James speaks of “he who doubts” (Jas 1:6), he uses this same word. Of Michael, contending with the devil, Jude says: leave the judgement to the Lord; of the believer contending within his own heart, Jude says: have mercy on him.</p><p>The man who wrote this sentence once did not believe himself: “For even his brothers didn’t believe in him” (John 7:5). When the disciples saw the risen Lord, “but some doubted” (Matt 28:17); a father cried out, “I believe. Help my unbelief!” (Mark 9:24) — and the Lord did not drive them away. People with questions are people to be shown mercy and walked alongside — for the position of these notes on the whole book, see the issue “Should these debates shake anyone’s faith?”; on how to contend without being contentious, see the issue “Contending for the faith without being contentious: what kind of contest is “contend earnestly”?”.</p>"],["[4] Should this affect your faith?","","<p>It should not — unless it makes you bolder to ask. If you are arguing inside right now, Jude does not tell the church to drive you out; he tells the church to have mercy on you. Mercy does not mean ignoring your questions; it means staying beside you, being in no hurry to label you, and coming back with you before the God who is “able to keep them from stumbling” (1:24; the Chinese Union Version: ‘able to keep you from stumbling’).</p><p>If you are the one going to rescue others, verse 23 also reminds you: rescue with fear, and watch yourself too, “so that you also aren’t tempted” (Gal 6:1). Love people and hate sin; rescue others and keep yourself — for you yourself were snatched out of the fire.</p>"]],"con":[],"say":"Where these notes stand: on verses 22–23 we take the three-group reading (SBLGNT, the Chinese Union Version), and set alongside it the two-group reading (WH, RP) and Treg’s “refute” reading; διακρινομένους is the same word as in verse 9; doubting is not apostasy, and the first verb is “have mercy”; Jude, who wrote these words, once did not believe himself (John 7:5). For the position of these notes on the whole book, see the issue “Should these debates shake anyone’s faith?”.","care":"In the pews and in small groups there are always young people full of questions, and also elders who have believed for many years yet have quietly begun to doubt; what they fear most is being labelled the moment they open their mouths — “not enough faith,” “influenced by the world.” Do not describe questions as apostasy from the pulpit, and do not shut anyone up with “You just aren’t spiritual enough.” A pastor can say: “Ask away — let’s look for the answers together.” A young person with many questions, having heard these two verses, should be bolder to ask; someone who goes to walk alongside others, having heard them, should be gentler, and keep themselves more carefully."}],"terrain":{"points":[[0.52,86,1,"kept for Jesus Christ","top"],[0.6,70,3,"contend earnestly",null],[0.64,18,4,"certain men who crept in secretly","bot"],[0.72,12,6,"Angels who didn’t keep their first domain","bot"],[0.84,58,9,"May the Lord rebuke you!",null],[0.92,10,11,"they went in the way of Cain","bot"],[1.0,4,13,"the blackness of darkness has been reserved forever","bot"],[1.16,48,17,"remember the words which have been spoken before by the apostles",null],[1.32,90,21,"Keep yourselves in God’s love","top"],[1.4,78,23,"snatching them out of the fire",null],[1.44,99,24,"able to keep them from stumbling","top"]]},"tracks":[{"gk":"τηρέω／φυλάσσω","tr":"tēreō / phylassō","gl":"keep, guard, hold, reserve","code":"G5083","root":"τηρέω — to watch over, keep, hold fast, reserve; φυλάσσω — to guard, stand watch over. Where the Chinese Union Version uses four different words for τηρέω (“keep,” “keep to,” “
