these also in their dreaming defile the flesh, despise authority, and slander celestial beings” (Jude 1:8). The words “in the same way” turn the three photographs before them into mirrors. Jude does not want his readers to hold up the photographs against other people; he first admits that failing to keep one’s proper place did not only happen in ancient times — it can happen in today’s gatherings too. The marks are three: defiling the body, despising the Lord, slandering spiritual things. The pulpit teaches marks and gives no list of names; the marks shine on ourselves first.</p><p>This verse is often misused. In the Chinese Union Version it reads ‘despise those who govern, and slander those in high positions’ (1:8), and these words are often used to silence a congregation’s questions to church leaders: “If you question the pastor, you are slandering those in high positions.” That is not what the text means. “Authority” here mostly means the Lord’s authority or heavenly powers, and the “glorious ones” (WEB: “celestial beings”) mostly means angels; nowhere here is a wall of immunity built around any leader today. What Jude condemns in verse 12 is precisely “shepherds who without fear feed themselves.” Raising a legitimate question with a leader, asking for an account, holding someone accountable in an orderly way — none of this is despising authority; a leader who refuses every question should rather beware lest he himself is walking the road of “feeding himself.”</p><p>“But Michael, the archangel, when contending with the devil and arguing about the body of Moses, dared not bring against him an abusive condemnation, but said, ‘May the Lord rebuke you!’” (Jude 1:9). The Old Testament says that after Moses died, God himself buried him, “but no man knows where his tomb is to this day” (Deut 34:6). Jude cites a tradition familiar to his readers at the time, that the archangel disputed with the devil over this body. Citing a tradition does not mean endorsing that book; nor do we need to fill in the details of the dispute. Jude wants us to look at only one thing: how Michael spoke.</p><p>He was facing the devil; by rights, he of all beings was entitled to denounce him. Yet he “dared not.” He did not take the judgement seat himself; he said only, “May the Lord rebuke you!” These words are almost exactly those of the vision Zechariah saw: “Yahweh rebuke you, Satan!” (Zech 3:2). Even the archangel did not overstep his place; he handed judgement back to the Lord. This is the model for “contend earnestly” in verse 3: those who guard the truth need not take God’s seat of judgement for him.</p><p>This verse is also the best counter-example for “rebuking the devil.” In some meetings rebuking the devil becomes a performance: the louder the voice, the more spiritual. Michael is the exact opposite: the archangel with the greatest authority, in one very quiet sentence, hands the rebuke over to the Lord. The power of spiritual warfare lies not in our volume, but in the Lord.</p><p>“But these speak evil of whatever things they don’t know” (Jude 1:10). The contrast is stark: the archangel knew the most, yet did not dare; these people do not know, yet they dare. All they have left is instinct, like the beasts, and it is precisely in the things of instinct that they destroy themselves. The more people understand, the more careful they are; the less they understand, the bolder they become. 321 speaks of humility, returning to our proper place: let people be people, and let God be God. It also says that pride provokes pride: answer slander with slander, and you have taken on the likeness of “these people.”</p>"},{"a":11,"z":11,"star":2,"grk":"<p lang=\"grc\">οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.</p>","lit":"<p>Woe to them! For they have gone the way of Cain, poured themselves for wages into the error of Balaam, and perished in the rebellion of Korah.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>οὐαὶ αὐτοῖς</td><td>ouai autois</td><td>woe to them</td><td>A prophet’s lament: the wailing is also a warning</td></tr><tr><td>τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν</td><td>tē hodō tou Kain eporeuthēsan</td><td>went the way of Cain</td><td>Toward a brother: envy, murder</td></tr><tr><td>τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν</td><td>tē planē tou Balaam misthou exechythēsan</td><td>poured themselves for wages into Balaam’s error</td><td>Toward money: rushing in like water</td></tr><tr><td>τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο</td><td>tē antilogia tou Kore apōlonto</td><td>perished in Korah’s rebellion</td><td>Toward authority: overstepping to seize power</td></tr></table>","gram":"<p><strong>οὐαί (ouai) is a prophet’s lament.</strong>Jude uses the tone of the prophets and of the Lord Jesus: in Matthew 23 the Lord says “woe” seven times in a row to the scribes and Pharisees (some ancient manuscripts add verse 14, making eight). οὐαί (ouai) is both wailing and warning at once; it is never gloating.</p><p><strong>Three parallel clauses, three aorists in a rising sequence.</strong>Each clause has the shape “noun in the dative + personal name in the genitive + verb”: τῇ ὁδῷ τοῦ Κάϊν (tē hodō tou Kain), τῇ πλάνῃ τοῦ Βαλαὰμ (tē planē tou Balaam), τῇ ἀντιλογίᾳ τοῦ Κόρε (tē antilogia tou Kore). Each verb is heavier than the last: ἐπορεύθησαν (eporeuthēsan), “went,” is setting out on the road; ἐξεχύθησαν (exechythēsan), “were poured out,” is the passive of ἐκχέω (ekcheō), like water poured out, rushing headlong in; ἀπώλοντο (apōlonto), “perished,” is the end of the road. μισθοῦ (misthou) is a genitive of price, “for wages.”</p><p><strong>Why is ἀπώλοντο (apōlonto) in the past tense?</strong>These people are still alive, yet Jude says they “have perished.” Two readings: (1) a prophetic aorist, speaking of what will certainly happen as though it had already happened; (2) Jude means Korah’s destruction long ago, and these people have walked into that story. These notes take both: to set out on Korah’s road is already to stand inside that destruction.</p><p><strong>The Jewish traditions about the three men.</strong>In the Old Testament Cain is simply the man who killed his brother (Gen 4:8); by the Second Temple period, Jewish tradition saw him as the prototype of unbelief, envy and leading others into sin, and 1 John 3:12 and Heb 11:4 also view him from this angle. In Numbers 22–24 Balaam appears to refuse to curse Israel, but Num 31:16 reveals that he taught the Moabite women to lure the Israelites into sexual immorality and idolatry, and Rev 2:14 records him the same way. Korah was a Levite who already served in the tabernacle, yet he gathered others to seize Aaron’s priesthood (Num 16:8–10). ἀντιλογία (antilogia) means “contradiction, defiance”; Heb 12:3, “him who has endured such contradiction of sinners against himself,” uses the same word.</p><p>The three men roughly represent three directions: toward a brother (envy that ends in murder), toward money (leading others into sin for profit), and toward authority (not content with one’s own portion, and seizing power). This division is the pulpit’s summary, not something Jude states explicitly; but the three examples happen to cover the three places where temptation runs deepest: relationships, possessions and position.</p>","exp":"<p>[OT] Gen 4:3–8 (Genesis Study Notes, Chapter 4)</p><p>[OT] Num 22:5–7 (Numbers Study Notes, Chapter 22)</p><p>[OT] Num 16:1–3; Num 16:31–33 (Numbers Study Notes, Chapter 16)</p><p>[2 Pet] 2 Pet 2:15–16 (2 Peter Study Notes, Chapter 2)</p><p>“Woe to them! For they went in the way of Cain, and ran riotously in the error of Balaam for hire, and perished in Korah’s rebellion” (Jude 1:11). This verse is a lament. Jude lists three names, like three roads going down.</p><p>The first is the way of Cain. God warned him before anything happened: “sin crouches at the door. Its desire is for you, but you are to rule over it” (Gen 4:7). He did not rule over it, and envy grew into murder. John says: “unlike Cain, who was of the evil one, and killed his brother” (1 John 3:12). Cain’s road begins with resentment toward a brother in the heart. In church today this road may begin with one sour remark, one comparison, one heart that cannot bear to see someone else blessed.</p><p>The second is the way of Balaam. Chapter 2 of the 2 Peter Study Notes has already spoken of Balaam’s donkey; what Jude adds is that verb: “ran riotously.” The Greek is like water poured out of a jar, rushing headlong down. Those who love money do not slide down slowly; they are dragged forward by money at a run. Balaam did not manage to curse Israel, but he gave Balak an even more poisonous idea: “these caused the children of Israel, through the counsel of Balaam, to commit trespass against Yahweh in the matter of Peor” (Num 31:16). For profit, he led God’s people into sin.</p><p>The third is the way of Korah. Korah was no outsider; he was a Levite who served in the tabernacle. Moses asked him whether it was a small thing that God had brought them near: “Do you seek the priesthood also?” (Num 16:9–10). God had already set him in an honourable position, but he thought it was not enough and wanted to seize someone else’s. In the end the earth opened its mouth. Jude uses the past tense to say these people “perished”: to set out on Korah’s road is already to stand inside that destruction.</p><p>The three roads face the three deepest temptations of life: toward brothers, toward money, toward position. The warning shines on ourselves first: is there a brother in my heart whom I cannot bless? Is there some calculation in my ministry? Toward the position God has given me, am I grateful, or do I think it too small?</p><p>With the meaning of the text complete, this reminds us of what 321 says: “pride is leaving our proper place and grasping power.” Korah is a portrait of exactly these words: he thought his own ministry too small and reached out to grasp an office that was not his. The way out that 321 names is here too: humility — returning to our proper place, being faithful in the position God has given, and not fighting for what God has not given.</p>"},{"a":12,"z":13,"star":1,"grk":"<p lang=\"grc\">οὗτοί εἰσιν οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,</p><p lang=\"grc\">κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας, ἀστέρες πλανῆται οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται.</p>","lit":"<p>These people are hidden reefs in your love feasts, feasting with you, shepherding themselves without fear; clouds without water, carried past by winds; late-autumn trees without fruit, twice dead, uprooted;</p><p>wild waves of the sea, foaming up their own shame; wandering stars, for whom the gloom of darkness has been kept forever.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες</td><td>en tais agapais hymōn spilades</td><td>hidden reefs in your love feasts</td><td>◆ CUV note: “or: blemishes”</td></tr><tr><td>συνευωχούμενοι</td><td>syneuōchoumenoi</td><td>feasting together</td><td>People sitting at the table</td></tr><tr><td>ἀφόβως ἑαυτοὺς ποιμαίνοντες</td><td>aphobōs heautous poimainontes</td><td>shepherding themselves without fear</td><td>Self-centred shepherds; Ezek 34:2</td></tr><tr><td>νεφέλαι ἄνυδροι</td><td>nephelai anydroi</td><td>waterless clouds</td><td>Sky</td></tr><tr><td>δένδρα φθινοπωρινὰ ἄκαρπα</td><td>dendra phthinopōrina akarpa</td><td>fruitless late-autumn trees</td><td>Land</td></tr><tr><td>δὶς ἀποθανόντα ἐκριζωθέντα</td><td>dis apothanonta ekrizōthenta</td><td>twice dead, uprooted</td><td>No fruit, and no root either</td></tr><tr><td>κύματα ἄγρια θαλάσσης</td><td>kymata agria thalassēs</td><td>wild waves of the sea</td><td>Sea; Isa 57:20</td></tr><tr><td>ἀστέρες πλανῆται</td><td>asteres planētai</td><td>wandering stars</td><td>Stars; same root as πλάνῃ in verse 11</td></tr><tr><td>εἰς αἰῶνα τετήρηται</td><td>eis aiōna tetērētai</td><td>has been kept forever</td><td>Track 1, fourth stop</td></tr></table>","gram":"<p><strong>σπιλάδες (spilades) can be read two ways.</strong>In ancient Greek σπιλάς (spilas) mostly means a reef below the surface of the sea — invisible, and a ship that strikes it breaks apart; the main text of the Chinese Union Version, “reefs,” follows this reading. The Chinese Union Version’s marginal note, “or: blemishes,” is there because the word looks like σπίλος (spilos), “spot,” and the parallel in 2 Pet 2:13 does read σπίλοι (spiloi), “spots.” The main text of these notes takes “reefs”: it fits together with the seafaring picture of waves and stars in verse 13; but “blemishes” has its reasons too, since ἐσπιλωμένον (espilōmenon), “stained,” in verse 23 and ἀμώμους (amōmous), “without blemish,” in verse 24 both echo it. Both readings are set side by side; the pulpit follows the Chinese Union Version.</p><p><strong>ἀγάπαις (agapais) are “love feasts.”</strong>These were the fellowship meals of the early church, connected with the Lord’s Supper (1 Cor 11:20–22). συνευωχούμενοι (syneuōchoumenoi), “feasting together”: they are sitting right beside you, eating. ἀφόβως ἑαυτοὺς ποιμαίνοντες (aphobōs heautous poimainontes): ποιμαίνω (poimainō) means “to shepherd,” and its object is the reflexive pronoun ἑαυτοὺς (heautous), “themselves” — “shepherding themselves”; the Chinese Union Version’s “only know how to feed themselves” has the meaning exactly. ἀφόβως (aphobōs), “without fear”: with no reverence for God.</p><p><strong>Four pictures from nature, covering sky, land, sea and stars.</strong>νεφέλαι ἄνυδροι (nephelai anydroi), waterless clouds; δένδρα φθινοπωρινὰ ἄκαρπα (dendra phthinopōrina akarpa), fruitless late-autumn trees — and this is exactly the season when they should bear fruit. δὶς ἀποθανόντα (dis apothanonta), “twice dead,” has three readings: (1) having no fruit is one death, and being uprooted is another; (2) two spiritual deaths, one before coming to faith and another after falling away; (3) a reference to “the second death” of Rev 20:14. These notes take (1), which stays closest to the picture of the tree. κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας (kymata agria thalassēs epaphrizonta tas heautōn aischynas): wild waves foaming up their own shame; ἀστέρες πλανῆται (asteres planētai), wandering stars — πλανήτης (planētēs) has the same root as Balaam’s πλάνῃ (planē), “error,” in verse 11.</p><p><strong>τετήρηται (tetērētai) is the fourth stop of Track 1.</strong>A perfect passive: the blackness of darkness “has been kept.” In verse 6 the angels are kept under ζόφον (zophon); in verse 13, ὁ ζόφος τοῦ σκότους (ho zophos tou skotous) is kept for these people: the same word, the same end. Here the terrain of the whole letter reaches its lowest point.</p>","exp":"<p>[2 Pet] 2 Pet 2:13–17 (2 Peter Study Notes, Chapter 2)</p><p>“These are hidden rocky reefs in your love feasts when they feast with you” (Jude 1:12). The love feast was the warmest place in the early church: rich and poor sitting together, sharing the same bread. And that is exactly where the reef lay hidden. The surface of the sea is calm, no danger can be seen, and yet that is where the ship breaks apart. What wounds most is often not the storm outside, but people sitting at the table who look just like everyone else.</p><p>“shepherds who without fear feed themselves” (Jude 1:12). This reminds us of Ezekiel’s words: “Woe to the shepherds of Israel who feed themselves” (Ezek 34:2), and of Peter’s charge to the elders: “not as lording it over those entrusted to you, but making yourselves examples to the flock” (1 Pet 5:3). The ones condemned are shepherds who feed themselves; so this letter never tells the sheep to keep quiet. Instead it tells every pastor to ask himself first: am I feeding the sheep, or feeding myself?</p><p>Then come four pictures: “clouds without water, carried along by winds” (Jude 1:12) — rain was promised, and not a drop fell, “As clouds and wind without rain” (Prov 25:14); “autumn trees without fruit” (Jude 1:12) — exactly the season for fruit, and the branches are bare; the wild waves of the sea, whose “waters cast up mire and mud” (Isa 57:20); “wandering stars, for whom the blackness of darkness has been reserved forever” (Jude 1:13) — sailors steer by the stars, and anyone who follows a wandering star is sure to lose his way.</p><p>Together with the reef at the love feast, the five pictures have one thing in common: outwardly something, inwardly empty. The reef hides beneath a calm sea; they look like clouds but bring no rain, like trees but bear no fruit; they make a great noise but leave only foam; they shine, but not on their course. The warning shines on ourselves first: has my ministry become a cloud without rain?</p><p>Here the whole letter descends into its deepest valley. But Jude does not want us to live on the valley floor studying the darkness; he leads us through it for the sake of the “But you” of verse 20 and the worship standing on the summit in verse 24. 321 says people matter more than tasks: the love feast is a place where people meet one another, and the reef makes the ship break apart right there.</p>"},{"a":14,"z":16,"star":1,"grk":"<p lang=\"grc\">Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,</p><p lang=\"grc\">ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι πάντας τοὺς ἀσεβεῖς περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατʼ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.</p><p lang=\"grc\">οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.</p>","lit":"<p>Enoch, the seventh from Adam, also prophesied about these people, saying, “Look, the Lord has come with his myriads of holy ones,</p><p>to execute judgement on all, and to convict all the ungodly of all their ungodly deeds that they have done in an ungodly way, and of all the harsh words that ungodly sinners have spoken against him.”</p><p>These people are grumblers, blaming their lot, walking according to their own desires; their mouth speaks inflated words, and they flatter faces for the sake of gain.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ</td><td>hebdomos apo Adam Henōch</td><td>Enoch, seventh from Adam</td><td>Following the genealogy of Gen 5</td></tr><tr><td>Προεφήτευσεν</td><td>Proephēteusen</td><td>prophesied</td><td>◆◆ Quoting 1 Enoch 1:9</td></tr><tr><td>Ἰδοὺ ἦλθεν κύριος</td><td>Idou ēlthen kyrios</td><td>look, the Lord came</td><td>Prophetic past tense</td></tr><tr><td>ἐν ἁγίαις μυριάσιν αὐτοῦ</td><td>en hagiais myriasin autou</td><td>with his myriads of holy ones</td><td>Deut 33:2; Zech 14:5</td></tr><tr><td>πάντας τοὺς ἀσεβεῖς</td><td>pantas tous asebeis</td><td>all the ungodly</td><td>◆ NA28 reads “every person”; Track 2</td></tr><tr><td>γογγυσταί, μεμψίμοιροι</td><td>gongystai, mempsimoiroi</td><td>grumblers, blamers of their lot</td><td>The latter only here in the New Testament</td></tr><tr><td>λαλεῖ ὑπέρογκα</td><td>lalei hyperonka</td><td>speaks inflated words</td><td>Swollen, bombastic</td></tr><tr><td>θαυμάζοντες πρόσωπα ὠφελείας χάριν</td><td>thaumazontes prosōpa ōpheleias charin</td><td>admiring faces for the sake of gain</td><td>χάριν is the preposition “for the sake of”</td></tr></table>","gram":"<p><strong>The quotation comes from 1 Enoch 1:9.</strong>Jude says “Enoch prophesied,” and the words he quotes are very close to a passage at the beginning of 1 Enoch. This book circulated widely in the Second Temple period, and Aramaic fragments of it have been found at Qumran. The early church reacted to this quotation in different ways: some doubted the letter of Jude because of it (Jerome records this), and others wanted to accept 1 Enoch because of it. The views: (1) Jude recognised 1 Enoch as canonical (a very small minority; today it is mainly the Ethiopian [and Eritrean] Orthodox Churches that list it so); (2) Jude quoted a saying familiar to his readers at the time and true in its content; (3) the content of this saying is true and agrees with the Old Testament theme of judgement, but this does not make the whole book inspired. These notes take (2) and (3): what is inspired is the letter of Jude; quoting one true saying does not mean endorsing the whole book (Acts 17:28; Titus 1:12). Nor does this deny the canonical status of the letter of Jude.</p><p><strong>ἕβδομος ἀπὸ Ἀδὰμ (hebdomos apo Adam).</strong>Following the genealogy of Genesis 5 and counting Adam himself — Adam, Seth, Enosh, Kenan, Mahalalel, Jared, Enoch — Enoch is exactly the seventh generation. In Προεφήτευσεν δὲ καὶ τούτοις (Proephēteusen de kai toutois), the dative τούτοις (toutois) can be read “about these people” or “to these people”; the Chinese Union Version, “prophesied of these people,” takes the first. ἦλθεν (ēlthen) is aorist: the prophet speaks of the future as though it had already happened. This is a prophetic past tense; it does not describe an event already past, nor does it supply any date.</p><p><strong>Verse 15: ἀσεβ- (aseb-) four times, πάντ- (pant-) four times.</strong>ἀσεβεῖς (asebeis), ἀσεβείας (asebeias), ἠσέβησαν (ēsebēsan), ἀσεβεῖς (asebeis): within a single verse “ungodly” appears four times — the high point of Track 2; πάντων (pantōn), πάντας (pantas), πάντων (pantōn), πάντων (pantōn) also four times: the judgement is total, covering both deeds and words. ἐλέγξαι (elenxai) means “to prove, to convict” — not only to sentence, but to bring sin into the light. σκληρῶν (sklērōn) are hard, grating words: ungodliness comes out of the mouth.</p><blockquote><p>◆ Textual variant: SBLGNT, WH and Treg read ἐλέγξαι πάντας τοὺς ἀσεβεῖς (elenxai pantas tous asebeis), “to convict all the ungodly,” and the Chinese Union Version follows this reading; NA28 reads πᾶσαν ψυχήν (pasan psychēn), “every person, every soul.” The two readings are close in meaning; the first focuses on “the ungodly,” the second is broader. These notes follow SBLGNT and the Chinese Union Version.</p></blockquote><p><strong>The five marks of verse 16.</strong>γογγυσταί (gongystai), mutterers, grumblers — this reminds us of the Israelites in the wilderness (Num 14:27). μεμψίμοιροι (mempsimoiroi) occurs only here in the New Testament; it is made up of “to blame” and “fate, one’s allotted portion”: people dissatisfied with the portion that has fallen to them. λαλεῖ ὑπέρογκα (lalei hyperonka), speaking swollen, bombastic words (2 Pet 2:18). θαυμάζοντες πρόσωπα (thaumazontes prosōpa) is a Hebrew idiom, “to lift up someone’s face” — that is, to look at a person’s status and curry favour with those who are useful; ὠφελείας χάριν (ōpheleias charin), “for the sake of gain.” This χάριν (charin) is the preposition “for the sake of,” not the grace, χάριτα (charita), of verse 4.</p>","exp":"<p>[OT] Gen 5:21–24 (Genesis Study Notes, Chapter 5)</p><p>“About these also Enoch, the seventh from Adam, prophesied” (Jude 1:14). Enoch is the one of whom it is written: “Enoch walked with God, and he was not found, for God took him” (Gen 5:24). A man who walks with God sees most clearly what ungodliness is.</p><p>The prophecy Jude quotes comes from 1 Enoch, a book familiar to his readers at the time. This needs to be said plainly: quoting one true saying does not mean endorsing the whole book. In Athens Paul quoted a Greek poet, “For we are also his offspring” (Acts 17:28), and no one concludes from this that the poet’s collected works are Scripture. What is inspired is the letter of Jude; Jude chose a saying entirely in keeping with the Old Testament theme of judgement. We need not build a separate angelology from this, nor doubt the letter of Jude because of it.</p><p>“Behold, the Lord came with ten thousands of his holy ones” (Jude 1:14). This reminds us of Moses’ blessing, “He came from the ten thousands of holy ones” (Deut 33:2), and of Zechariah’s words, “and all the holy ones with you” (Zech 14:5). The prophet speaks of the future as though it had already happened: the Lord will surely come. This verse gives no date, and we do not count the days.</p><p>“to execute judgment on all, and to convict all the ungodly of all their works of ungodliness which they have done in an ungodly way, and of all the hard things which ungodly sinners have spoken against him” (Jude 1:15). In the Greek, within one verse, “ungodly” comes four times and “all” four times (the Chinese Union Version renders “ungodly” three times and “all” twice). The judgement is total, and even words once spoken are included. Jude singles out the “hard things” spoken: ungodliness often comes out of the mouth first.</p><p>“These are murmurers and complainers, walking after their lusts—and their mouth speaks proud things—showing respect of persons to gain advantage” (Jude 1:16). This is a portrait of the mouth: complaining, boasting, flattering. “Complainers” in the Greek means people dissatisfied with the portion that has fallen to them — yet another form of “not keeping one’s proper place.” “Showing respect of persons” in the Greek means looking at people’s faces, currying favour with the useful. Jude’s brother James wrote: “My brothers, don’t hold the faith of our Lord Jesus Christ of glory with partiality” (Jas 2:1); Chapter 2 of the James Study Notes in this series has spoken of this. The two brothers saw the same disease.</p><p>The warning shines on ourselves first: do I do more talking behind people’s backs, or more praying? When I speak, do I look at people’s faces, or at God’s face? 321 speaks of the mouth of the self-centred life: complaining, boasting and flattering are all words centred on the self.</p>"},{"a":17,"z":19,"star":1,"grk":"<p lang=\"grc\">Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·</p><p lang=\"grc\">ὅτι ἔλεγον ὑμῖν Ἐπʼ ἐσχάτου χρόνου ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.</p><p lang=\"grc\">οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.</p>","lit":"<p>But you, beloved, remember the words spoken beforehand by the apostles of our Lord Jesus Christ;</p><p>for they used to tell you, “In the last time there will be mockers, walking according to their own ungodly desires.”</p><p>These are the ones who cause divisions; they are soulish, not having the Spirit.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>Ὑμεῖς δέ, ἀγαπητοί</td><td>Hymeis de, agapētoi</td><td>but you, beloved</td><td>The first Ὑμεῖς δέ; again in verse 20</td></tr><tr><td>μνήσθητε τῶν ῥημάτων</td><td>mnēsthēte tōn rhēmatōn</td><td>remember the words</td><td>Aorist imperative</td></tr><tr><td>τῶν προειρημένων ὑπὸ τῶν ἀποστόλων</td><td>tōn proeirēmenōn hypo tōn apostolōn</td><td>spoken beforehand by the apostles</td><td>Jude does not say “we apostles”</td></tr><tr><td>ἐσχάτου χρόνου</td><td>eschatou chronou</td><td>the last time</td><td>Between the two comings of Christ</td></tr><tr><td>ἐμπαῖκται</td><td>empaiktai</td><td>mockers</td><td>In the New Testament only here and 2 Pet 3:3</td></tr><tr><td>οἱ ἀποδιορίζοντες</td><td>hoi apodiorizontes</td><td>those who draw lines and divide</td><td>◆◆ Only here in the New Testament</td></tr><tr><td>ψυχικοί</td><td>psychikoi</td><td>soulish</td><td>◆◆ CUV “of blood and breath” (merely natural)</td></tr><tr><td>πνεῦμα μὴ ἔχοντες</td><td>pneuma mē echontes</td><td>not having the Spirit</td><td>CUV supplies “Holy” in small type</td></tr></table>","gram":"<p><strong>The first appearance of Ὑμεῖς δέ (Hymeis de).</strong>After a long string of οὗτοι (houtoi), “these people,” verse 17 turns for the first time to Ὑμεῖς δέ (Hymeis de), “But you,” and verse 20 does so again. ἀγαπητοί (agapētoi) belongs to Track 4; the Chinese Union Version supplies “brothers” in small type. μνήσθητε (mnēsthēte) is an aorist imperative: call it to mind.</p><p><strong>τῶν προειρημένων ὑπὸ τῶν ἀποστόλων (tōn proeirēmenōn hypo tōn apostolōn).</strong>Jude does not say “we apostles”; he places himself outside the apostles and points to their teaching. This point is often discussed in connection with the date: (1) some think it shows that the apostles had already died when the letter was written, so that it is a late letter; (2) others think it shows only that Jude himself was not one of the Twelve, and that the readers had heard the apostles preach with their own ears (verse 18, ἔλεγον ὑμῖν (elegon hymin), “they said to you”). These notes take (2); for details see the volume-wide position “Date and setting: when was Jude written, and who were the men who crept in?”. ἔλεγον (elegon) is imperfect: the apostles did not say this once, but said it often (Acts 20:29–30; 1 Tim 4:1; 2 Tim 3:1–5).</p><p><strong>ἐσχάτου χρόνου (eschatou chronou), “the last time.”</strong>In the New Testament, “the last days” means the whole period between Christ’s first coming and his second; Heb 1:2 says God “has at the end of these days spoken to us by his Son.” It is not a timetable from which a date can be calculated. ἐμπαῖκται (empaiktai) are mockers; in the New Testament the word occurs only here and in 2 Pet 3:3. ἀσεβειῶν (asebeiōn) is the last stop of Track 2.</p><p><strong>Verse 19 is the last οὗτοι (houtoi), and the most ironic sentence of all.</strong>ἀποδιορίζοντες (apodiorizontes) occurs only here in the New Testament: ἀπό (apo) plus διορίζω (diorizō), “to draw a boundary” — drawing lines, ranking people, creating divisions. Very likely these people regarded themselves as a spiritual upper class and drew lines to keep others out. The name Jude gives them is the exact opposite: ψυχικοί (psychikoi), “soulish.” Paul says, “the natural man doesn’t receive the things of God’s Spirit” (1 Cor 2:14), and “natural” there is the same word; the Chinese Union Version renders both places with the same expression, “of blood and breath.” πνεῦμα μὴ ἔχοντες (pneuma mē echontes) can be read two ways: (1) not having the Holy Spirit (the Chinese Union Version supplies “Holy” in small type, and most commentators read it this way, because verse 20 goes straight on with ἐν πνεύματι ἁγίῳ (en pneumati hagiō)); (2) not having spiritual life — the spirit within the person has not come alive. These notes take (1); in meaning, (2) is also contained within (1). Those who think themselves the most spiritual of all, Jude says, do not have the Spirit.</p>","exp":"<p>[2 Pet] 2 Pet 3:2–3 (2 Peter Study Notes, Chapter 3)</p><p>“But you, beloved, remember the words which have been spoken before by the apostles of our Lord Jesus Christ” (Jude 1:17). After more than ten verses of darkness, the camera turns back for the first time: “you.” The first lesson Jude gives his readers is not to study those people, but to remember the apostles’ words. In the face of new voices, the best anchor is the old word. 321 says “the Bible is my standard”: the standard is the word the apostles handed down, not somebody’s latest dream.</p><p>They said to you, “In the last time there will be mockers, walking after their own ungodly lusts” (Jude 1:18). This is something that was announced in advance. Someone who knows beforehand that it is going to rain does not panic when the rain comes. When people appear in the church who mock the faith and walk after their own lusts, it does not prove that the gospel has failed; it proves precisely that the apostles’ words were true. This verse does not tell us to calculate the end; it tells us to stand firm throughout the whole of “the last days.”</p><p>“These are those who cause divisions and are sensual, not having the Spirit” (Jude 1:19). This is the last appearance of “these,” and the sharpest sentence of all. They draw lines and rank people, thinking themselves a spiritual upper class; Jude says they are soulish — merely natural — and do not have the Spirit. The watershed is not eloquence, not dreams, not whose meeting is livelier; it is whether or not one has the Holy Spirit.</p><p>This verse, too, must be handled with restraint. What Jude gives is marks, not a hat to be jammed on someone else’s head at will. People who disagree with us are not necessarily “not having the Spirit”; rather, those in a hurry to draw lines that shut others out should first check whether they themselves are ἀποδιορίζοντες (apodiorizontes). The marks shine on ourselves first: am I building up, or drawing lines?</p><p>Verses 19 and 20 are clearest when read together: on one side, “cause divisions”; on the other, “building up yourselves.” On one side, “not having the Spirit”; on the other, “praying in the Holy Spirit.” One side tears down, the other builds. 321 says “the Holy Spirit is my guide,” and also, “live from the heart, relying on the Holy Spirit”: the soulish rely on themselves; the spiritual rely on the Holy Spirit.</p>"},{"a":20,"z":21,"star":3,"grk":"<p lang=\"grc\">ὑμεῖς δέ, ἀγαπητοί, ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει, ἐν πνεύματι ἁγίῳ προσευχόμενοι,</p><p lang=\"grc\">ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.</p>","lit":"<p>But you, beloved, building yourselves up on your most holy faith, praying in the Holy Spirit,</p><p>keep yourselves in the love of God, waiting for the mercy of our Lord Jesus Christ, to eternal life.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>ὑμεῖς δέ, ἀγαπητοί</td><td>hymeis de, agapētoi</td><td>but you, beloved</td><td>◆◆ The hinge of the letter: the camera turns back</td></tr><tr><td>ἐποικοδομοῦντες ἑαυτοὺς</td><td>epoikodomountes heautous</td><td>building yourselves up on</td><td>◆◆ Participle 1; plural: building one another up</td></tr><tr><td>τῇ ἁγιωτάτῃ ὑμῶν πίστει</td><td>tē hagiōtatē hymōn pistei</td><td>on your most holy faith</td><td>Superlative; echoes verse 3</td></tr><tr><td>ἐν πνεύματι ἁγίῳ προσευχόμενοι</td><td>en pneumati hagiō proseuchomenoi</td><td>praying in the Holy Spirit</td><td>◆◆ Participle 2; two readings set side by side</td></tr><tr><td>ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε</td><td>heautous en agapē theou tērēsate</td><td>keep yourselves in the love of God</td><td>◆◆ The letter’s only command to keep</td></tr><tr><td>προσδεχόμενοι τὸ ἔλεος</td><td>prosdechomenoi to eleos</td><td>waiting for the mercy</td><td>Participle 3; Track 3, second stop</td></tr><tr><td>εἰς ζωὴν αἰώνιον</td><td>eis zōēn aiōnion</td><td>to eternal life</td><td>Where mercy ends up</td></tr></table>","gram":"<p><strong>One command, three participles.</strong>Verses 20–21 have only one main verb: τηρήσατε (tērēsate) in verse 21, “keep,” an aorist imperative. The other three are all participles: ἐποικοδομοῦντες (epoikodomountes), “building up”; προσευχόμενοι (proseuchomenoi), “praying”; προσδεχόμενοι (prosdechomenoi), “looking for.” Grammatically there are two readings: (1) the three participles explain how to keep — building up, praying and looking for are the means of keeping; (2) the three participles carry imperative force, each a command in its own right; the Chinese Union Version translates all four actions as commands. These notes judge that the sentence’s skeleton centres on τηρήσατε (tērēsate), with the three participles arranged around it; the pulpit may follow the Chinese Union Version and preach it as four actions, but should let the congregation see that the centre is “Keep yourselves in God’s love.”</p><p><strong>ἐποικοδομοῦντες ἑαυτοὺς (epoikodomountes heautous).</strong>ἐποικοδομέω (epoikodomeō) is ἐπί (epi), “upon,” plus οἰκοδομέω (oikodomeō), “to build”: building upward on a foundation. Paul uses the same word: “being built on the foundation of the apostles and prophets” (Eph 2:20), and “rooted and built up in him” (Col 2:7). The foundation is τῇ ἁγιωτάτῃ ὑμῶν πίστει (tē hagiōtatē hymōn pistei), “your most holy faith”; ἁγιωτάτῃ (hagiōtatē) is a superlative; πίστις (pistis) echoes “the faith which was once for all delivered to the saints” of verse 3 — the content of what is believed. ἑαυτοὺς (heautous) is a plural reflexive pronoun; it can be read “build yourselves up” or “build one another up,” since Greek reflexive pronouns often carry a reciprocal sense (Col 3:13, 16). These notes take both: building up is a community matter, not a solitary spiritual exercise. Set this against the ἀποδιορίζοντες (apodiorizontes) of verse 19: on one side, drawing lines and tearing apart; on the other, building together on the same foundation.</p><p><strong>ἐν πνεύματι ἁγίῳ προσευχόμενοι (en pneumati hagiō proseuchomenoi): two readings set side by side.</strong>(1) It includes praying in tongues: Paul says, “if I pray in another language, my spirit prays,” and ‘with the spirit’ is close to ‘in the Spirit’ (1 Cor 14:14–15). (2) It means all prayer led by the Holy Spirit and offered in partnership with him: Eph 6:18, “praying at all times in the Spirit,” uses exactly ἐν πνεύματι (en pneumati), and Rom 8:26 says the Spirit helps our weakness. The text does not specify which. These notes do not rule between them; they do not define “praying in the Holy Spirit” as requiring tongues, nor do they disparage tongues. Where the two readings land together is this: prayer relies on the Holy Spirit, not on our own eloquence. Jude’s real point is the contrast: verse 19, πνεῦμα μὴ ἔχοντες (pneuma mē echontes); verse 20, ἐν πνεύματι ἁγίῳ (en pneumati hagiō).</p><p><strong>ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε (heautous en agapē theou tērēsate).</strong>This is the fifth stop of Track 1, and the only command in the whole letter telling the readers to “keep.” The genitive in ἀγάπῃ θεοῦ (agapē theou) can be read two ways: (1) a subjective genitive, “God’s love for us”; (2) an objective genitive, “our love for God.” These notes take (1) as primary: in verse 1 the readers are “loved in God the Father,” and in verse 21 they are told to remain in that love. We are not told to keep up the temperature of our love for God, but to dwell in the “place” of God’s love for us. This pairs exactly with verse 6: the angels μὴ τηρήσαντας (mē tērēsantas), did not keep, their own ἀρχὴν (archēn); the readers are commanded, τηρήσατε (tērēsate), to keep themselves in the love of God.</p><p><strong>προσδεχόμενοι (prosdechomenoi) means waiting for, hoping for, welcoming.</strong>Luke uses it of Simeon, “looking for the consolation of Israel” (Luke 2:25). τὸ ἔλεος τοῦ κυρίου (to eleos tou kyriou) is the second stop of Track 3: even those who keep themselves go on looking for mercy all the way to the end. The Trinitarian structure is here too: the Holy Spirit (verse 20), God (verse 21), the Lord Jesus Christ (verse 21).</p>","exp":"<p>“But you, beloved, keep building up yourselves on your most holy faith, praying in the Holy Spirit” (Jude 1:20). This is the hinge of the whole letter. Before it, “these people” has tolled like a bell six times; in verse 20 a single “But you” turns the camera back around. Jude spends more than ten verses describing others, and only two telling us what to do. The proportion deserves notice: the best way to deal with error is not to spend more time studying error, but to remain in God’s love.</p><p>The first action is building up. The Greek means “building on top”: the foundation is already there — the faith “once for all delivered” of verse 3, called here “most holy” — and our part is to build upward. “Yourselves” is plural; building up is something we do for one another: reading the Bible together in small groups, worshipping together on the Lord’s Day, supporting one another in daily life. The people of verse 19 draw lines and tear apart; the people of verse 20 build together on the same foundation. 321 says, “Establish God’s system”: the system is not built by one person, but by a whole people building together on the same foundation.</p><p>The second action is prayer, “in the Holy Spirit.” This phrase can be read two ways: some take it to include praying in tongues, and others take it to mean all prayer led by the Holy Spirit and offered in partnership with him. The text does not specify; these notes set out both readings side by side, neither defining it as requiring tongues nor disparaging tongues. The point lands on a life of prayer that relies on the Holy Spirit: “the Spirit also helps our weaknesses” (Rom 8:26). Verse 19 says those people are “not having the Spirit”; verse 20 says you are “praying in the Holy Spirit.” The watershed is not the voice, but the one we rely on.</p><p>The third action is the centre: “Keep yourselves in God’s love” (Jude 1:21). This is the only command in the whole letter telling us to “keep.” What we are to keep is not the temperature of our love for God — that rises and falls — but the place of God’s love for us. The Lord Jesus said, “Even as the Father has loved me, I also have loved you. Remain in my love” (John 15:9). The angels of verse 6 would not keep their own position; in verse 21 we are called to keep a position — and that position is God’s love. It is not a cage; it is home.</p><p>This also unlocks the three layers of “keeping” in the whole letter. Verse 1: we are “kept for Jesus Christ” — God keeps us first. Verse 21: “Keep yourselves in God’s love” — we are responsible for remaining there. Verse 24: God is the one who is “able to keep” us “from stumbling” (WEB: “able to keep them from stumbling”; the Chinese Union Version, “able to keep you from stumbling”). The three sayings do not fight one another: God’s keeping is the ground on which we are able to keep ourselves; our keeping is the response to God’s keeping; and in the end it is still God who keeps us. For the position of the whole letter see “Kept by God and keeping ourselves: if God keeps me, why must I keep myself?”.</p><p>The fourth action is looking: “looking for the mercy of our Lord Jesus Christ to eternal life” (Jude 1:21). The Greek means waiting for, welcoming — like Simeon, who waited all his life for the consolation of Israel. Even those who keep themselves reach the finish line by mercy. No one will stand on that last day by the merit of his own keeping; what we wait for is mercy.</p><p>The Holy Spirit, God, the Lord Jesus Christ — the triune God is all here in these two verses. After the darkest valley of the letter, Jude does not hand his readers a defence manual; he gives them a place: in the love of God. 321 says “the focus is on Jesus”: the posture of waiting is looking up. When our eyes turn from “these people” back to the Lord, we stand firm.</p>"},{"a":22,"z":23,"star":3,"grk":"<p lang=\"grc\">καὶ οὓς μὲν ἐλεᾶτε διακρινομένους,</p><p lang=\"grc\">οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.</p>","lit":"<p>On some who are in doubt, have mercy;</p><p>some, save by snatching them out of the fire; on some, have mercy with fear, hating even the undergarment stained by the flesh.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>οὓς μὲν ἐλεᾶτε διακρινομένους</td><td>hous men eleate diakrinomenous</td><td>on some who are in doubt, have mercy</td><td>◆◆ First group; the first verb is mercy</td></tr><tr><td>διακρινομένους</td><td>diakrinomenous</td><td>disputing within, wavering</td><td>◆◆ Same word as διακρινόμενος in verse 9</td></tr><tr><td>οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες</td><td>hous de sōzete ek pyros harpazontes</td><td>some, save by snatching out of the fire</td><td>◆ Second group; Zech 3:2</td></tr><tr><td>οὓς δὲ ἐλεᾶτε ἐν φόβῳ</td><td>hous de eleate en phobō</td><td>on some, have mercy with fear</td><td>Third group; guard yourself</td></tr><tr><td>τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα</td><td>ton apo tēs sarkos espilōmenon chitōna</td><td>the undergarment stained by the flesh</td><td>Same root as σπιλάδες in verse 12</td></tr></table>","gram":"<blockquote><p>◆ Textual variant (verses 22–23): SBLGNT, Treg and NA28 have three groups: καὶ οὓς μὲν ἐλεᾶτε διακρινομένους (kai hous men eleate diakrinomenous), οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες (hous de sōzete ek pyros harpazontes), οὓς δὲ ἐλεᾶτε ἐν φόβῳ (hous de eleate en phobō), and the Chinese Union Version also has three groups; WH has two groups; RP reads διακρινόμενοι (diakrinomenoi) (nominative, so that the sense becomes “have mercy on some, making a distinction” — the reading WEB follows), also with two groups, and reads ἐλεεῖτε (eleeite); Treg likewise has three groups, but its first verb in verse 22 is ἐλέγχετε (elenchete), “refute, correct.” This is the most confused spot in the manuscripts of Jude; copyists found “have mercy on those who doubt” hard to understand from very early on. These notes decide to take three groups, which is also the choice of SBLGNT, NA28 and most commentators. The reasons: the pattern οὓς μὲν (hous men) … οὓς δὲ (hous de) … οὓς δὲ (hous de) is complete; Jude throughout his letter favours groups of three (three descriptions, three blessings, three warnings, three roads); and the three-group reading better explains how the other readings could have been simplified from it. But this is not settled: the earliest papyrus, P72, also has two groups, and some scholars argue on this basis that the shorter form is original. Whether there are two groups or three, ἐλεᾶτε (eleate), “have mercy,” is the main verb of these two verses.</p></blockquote><p><strong>διακρινομένους (diakrinomenous) can be read two ways.</strong>(1) “Those who doubt”: disputing within, wavering — “he who doubts” in Jas 1:6, “don’t doubt” in Matt 21:21, and “didn’t waver” in Rom 4:20 are all this word, and the Chinese Union Version follows this reading. (2) “Those who dispute with you,” following the use of διακρινόμενος (diakrinomenos) in verse 9. These notes take (1) as primary; (2) reminds us that even toward those who dispute with us, Jude’s first command is mercy. The same word in verse 9 and verse 22 is the second pearl of the letter: as for the devil, Michael hands him over to the Lord; as for believers who doubt, the church is to show mercy. ἐλεᾶτε (eleate) is a present imperative: an ongoing attitude, not a one-off handout.</p><p><strong>σῴζετε ἐκ πυρὸς ἁρπάζοντες (sōzete ek pyros harpazontes).</strong>ἁρπάζω (harpazō) means to seize, to snatch — urgently and with force; when the commanding officer had Paul “take him by force from among them” (Acts 23:10), this is the word. The picture of ἐκ πυρὸς (ek pyros) reminds us of Zech 3:2, “Isn’t this a burning stick plucked out of the fire?”, and of Amos 4:11. Jude does not say he is quoting Zechariah, but the “May the Lord rebuke you!” of verse 9 and the “out of the fire” of verse 23 are both in Zechariah 3, which is hard to call a coincidence.</p><p><strong>ἐν φόβῳ (en phobō) and the stained garment.</strong>ἐν φόβῳ (en phobō) is reverence for God, and also being on guard against being dragged down oneself. μισοῦντες (misountes) is a present participle, “hating”; χιτών (chitōn) is the garment worn next to the skin; ἐσπιλωμένον (espilōmenon) is a perfect passive participle, “stained”; σπιλόω (spiloō) shares its root with σπιλάδες (spilades) in verse 12, and it is also the word in Jas 3:6, where the tongue “defiles the whole body.” In Zech 3:3–4 Joshua is clothed in filthy garments, and God commands that they be taken off and gives him rich clothing: what is hated is the filth on the garment, not the person wearing it.</p>","exp":"<p>The Chinese Union Version reads: ‘On some who doubt, have mercy’ (1:22). WEB, following the Byzantine text, reads “On some have compassion, making a distinction” (Jude 1:22); these notes follow the reading “who doubt.” It is the gentlest sentence in the whole letter, set at the end of the sternest book. The first verb is “have mercy” — not “correct,” not “isolate,” and still less “drive out.”</p><p>Doubt is not apostasy. A young person with many questions about faith; a sister who, after a great disaster, asks “Where is God?”; a brother who cannot sleep after reading a hard passage of Scripture — none of these are “men who crept in secretly.” They are believers who are disputing within their own hearts. The man who wrote this sentence understood it best: he himself once did not believe in his elder brother — “For even his brothers didn’t believe in him” (John 7:5). Jude had been shown mercy, so he tells the church to show mercy.</p><p>There is another layer hidden in the Greek. “Doubt” is the same word as Michael “contending” with the devil in verse 9. An archangel disputing with the devil, a believer disputing in his own heart — Jude uses the same word for both. To the devil, Michael says, “May the Lord rebuke you!”, and hands him over to the Lord; for the brothers and sisters disputing in their hearts, Jude says, “have mercy.” The church’s most common mistake is to get these two kinds of “disputing” the wrong way round: making light of spiritual darkness, and putting people with questions under harsh scrutiny. A young person with many questions, in a church that reads Jude this way, should feel freer to ask, not less free.</p><p>‘Some save, snatching them out of the fire’ (1:23) — WEB: “some save, snatching them out of the fire” (Jude 1:23). The second kind of person is already close to the fire; what they need is an urgent and strong hand. This reminds us of Zechariah’s vision: “Isn’t this a burning stick plucked out of the fire?” (Zech 3:2). Every one of us was once that burning stick. Those who have been snatched out know best how to snatch others out.</p><p>‘On some have mercy with fear, hating even the clothing stained by lust’ (1:23) — so the Chinese Union Version, which has a third group here; in WEB the words “with fear, hating even the clothing stained by the flesh” (Jude 1:23) belong to the second group. The third kind of person is in deeper still, and the rescuer is in danger too. So it must be done “with fear”: reverence for God, and being on guard against oneself. Paul says: “looking to yourself so that you also aren’t tempted” (Gal 6:1). Rescuing people is not playing the hero. Someone who is in deep is best accompanied by mature co-workers together — not carried alone, and not in such a way that we ourselves are dragged down; where professional help is needed, refer them on. Love the person and hate the sin; rescue others and keep yourself. What is hated is the stained garment, not the person wearing it; in Zechariah’s vision, God himself has Joshua’s filthy garments taken off and clothes him in rich clothing.</p><p>Three kinds of people, three ways of rescue, all within the same verb: “have mercy.” This is the turning point of Track 3: in verse 2 the readers receive mercy; in verse 21 the readers look for mercy; in verses 22–23, those who have received mercy become those who give it. Those who are kept are not people hiding in a fortress; they are people who go out to rescue others.</p><p>321’s 920 is here: every “2” needs a different kind of rescue. Some need us to stay with them until they have asked all their questions; some need us to reach out a hand at once; some need us to come near with reverence and care. What Jude gives is not a script, but a discerning heart and a pair of merciful hands.</p>"},{"a":24,"z":25,"star":3,"grk":"<p lang=\"grc\">Τῷ δὲ δυναμένῳ φυλάξαι ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει</p><p lang=\"grc\">μόνῳ θεῷ σωτῆρι ἡμῶν διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν δόξα μεγαλωσύνη κράτος καὶ ἐξουσία πρὸ παντὸς τοῦ αἰῶνος καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.</p>","lit":"<p>Now to him who is able to guard you from stumbling, and to make you stand without blemish before his glory in great joy,</p><p>to the only God, our Saviour, through Jesus Christ our Lord, be glory, majesty, might and authority, before all time, and now, and to all the ages. Amen.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>Τῷ δὲ δυναμένῳ</td><td>Tō de dynamenō</td><td>now to him who is able</td><td>The point is that he is able, not that we are</td></tr><tr><td>φυλάξαι ὑμᾶς ἀπταίστους</td><td>phylaxai hymas aptaistous</td><td>to guard you from stumbling</td><td>◆◆ Track 1, final stop; ἄπταιστος only here in the New Testament</td></tr><tr><td>στῆσαι κατενώπιον τῆς δόξης αὐτοῦ</td><td>stēsai katenōpion tēs doxēs autou</td><td>to make you stand before his glory</td><td>The final standing</td></tr><tr><td>ἀμώμους ἐν ἀγαλλιάσει</td><td>amōmous en agalliasei</td><td>without blemish, in great joy</td><td>Sacrificial language; contrast verses 12 and 23</td></tr><tr><td>μόνῳ θεῷ σωτῆρι ἡμῶν</td><td>monō theō sōtēri hēmōn</td><td>to the only God, our Saviour</td><td>Echoes “the only Master” of verse 4</td></tr><tr><td>διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν</td><td>dia Iēsou Christou tou kyriou hēmōn</td><td>through Jesus Christ our Lord</td><td>◆ Lacking in RP</td></tr><tr><td>δόξα μεγαλωσύνη κράτος καὶ ἐξουσία</td><td>doxa megalōsynē kratos kai exousia</td><td>glory, majesty, might, authority</td><td>Four nouns, no verb</td></tr><tr><td>πρὸ παντὸς τοῦ αἰῶνος καὶ νῦν</td><td>pro pantos tou aiōnos kai nyn</td><td>before all time, and now</td><td>◆ RP lacks “before all time”</td></tr></table>","gram":"<p><strong>The skeleton of the doxology.</strong>Τῷ δὲ δυναμένῳ (Tō de dynamenō) … μόνῳ θεῷ (monō theō) … δόξα (doxa) …: the dative marks the one who receives the praise, and the four nouns δόξα μεγαλωσύνη κράτος καὶ ἐξουσία (doxa megalōsynē kratos kai exousia) have no verb after them. Two readings: (1) a wish, “be glory … to him,” which the Chinese Union Version follows; (2) a statement, “belongs to him” — 1 Pet 4:11, “to whom belong the glory and the dominion,” does supply a verb. These notes take both: the doxology is both a desire and a declaration. δυναμένῳ (dynamenō), “him who is able”: the point is not whether we are able, but that he is.</p><p><strong>φυλάξαι ὑμᾶς ἀπταίστους (phylaxai hymas aptaistous).</strong>Here Track 1 changes its word. The previous five times it was τηρέω (tēreō); verse 24 uses φυλάσσω (phylassō): to watch over, to guard, like a sentry guarding a city gate. ἄπταιστος (aptaistos) occurs only here in the New Testament; it is formed from a negative prefix and πταίω (ptaiō), “to stumble”: not falling, not losing one’s footing. Ancient Greek used it of a horse that never stumbles, or of a person who walks without tripping. πταίω (ptaiō) also appears in the New Testament in Jas 3:2, “we all stumble in many things,” and 2 Pet 1:10, “you will never stumble.” The Chinese Union Version’s “not lose your footing” is an excellent rendering.</p><blockquote><p>◆ Textual variant (verse 24): SBLGNT, WH, Treg and NA28 read ὑμᾶς (hymas), “keep you,” which the Chinese Union Version follows; RP reads αὐτούς (autous), “keep them” (the reading WEB follows), perhaps reading the doxology as continuing verses 22–23 and referring to those who have been rescued. ὑμᾶς (hymas) has better manuscript support, and is also consistent with the “you” of the whole letter. These notes follow SBLGNT and the Chinese Union Version.</p></blockquote><p><strong>ἀμώμους ἐν ἀγαλλιάσει (amōmous en agalliasei).</strong>ἄμωμος (amōmos) is sacrificial language: an offering without defect. 1 Pet 1:19 uses it of Christ, “a lamb without blemish or spot”; Eph 1:4 says God chose us to be “without defect before him.” The σπιλάδες (spilades) of verse 12 and the ἐσπιλωμένον (espilōmenon) of verse 23 become ἀμώμους (amōmous) in verse 24: those who were stained finally stand before him without blemish. ἀγαλλίασις (agalliasis) is overwhelming gladness, exultation; 1 Pet 1:8 uses the verb from the same root.</p><blockquote><p>◆ Textual variant (verse 25): SBLGNT, WH, Treg and NA28 read μόνῳ θεῷ σωτῆρι ἡμῶν διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν (monō theō sōtēri hēmōn dia Iēsou Christou tou kyriou hēmōn), and also have πρὸ παντὸς τοῦ αἰῶνος (pro pantos tou aiōnos), “before all time”; the Chinese Union Version has both; RP adds σοφῷ (sophō) before θεῷ (theō), “the only wise God,” and lacks both “through Jesus Christ our Lord” and “before all time” (WEB follows RP here: “to God our Savior, who alone is wise”). σοφῷ (sophō) was very probably supplied by copyists following Rom 16:27, ‘the only wise God’; the shorter RP reading lacks two important elements, and its manuscript support is also later. These notes follow SBLGNT and the Chinese Union Version.</p></blockquote><p><strong>A complete timeline.</strong>πρὸ παντὸς τοῦ αἰῶνος καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας (pro pantos tou aiōnos kai nyn kai eis pantas tous aiōnas): past, present and future — a complete timeline rarely found in New Testament doxologies. μόνῳ θεῷ (monō theō) echoes τὸν μόνον δεσπότην (ton monon despotēn) in verse 4: μόνος (monos), denied by those men at the beginning, is praised by the whole church at the end.</p>","exp":"<p>The Chinese Union Version reads: ‘Now to him who is able to keep you from stumbling, and to present you faultless and with great joy before his glory, our Saviour, the only God’ (1:24); WEB: “Now to him who is able to keep them from stumbling, and to present you faultless before the presence of his glory in great joy” (Jude 1:24) — where WEB, following the Byzantine text, has “them,” the earlier manuscripts and the Chinese Union Version have “you.” The highest point of the whole letter’s terrain is here. Jude spends more than ten verses describing darkness: reefs, clouds without rain, trees plucked up by the roots, wild waves, wandering stars. Then, in the last two verses, the whole sky grows light. This letter ends with praise, not with a warning.</p><p>The words “who is able” are the centre of gravity of the whole verse. Jude does not say, “You must strive not to stumble”; he speaks of the one who “is able to keep you from stumbling.” Verse 21 tells us to keep ourselves in God’s love; verse 24 tells us that in the end it is God who truly keeps us. Anyone who has read verses 5–16 can hardly help a tightening of the heart: angels may fail to keep their proper place, a people who were saved may fall in the wilderness — might I stumble too? Verse 24 is Jude’s answer.</p><p>Here the “keeping” of the whole letter completes its circle. Verse 1: we are “kept for Jesus Christ.” Verse 6: angels who did not keep their proper place are kept by God in chains. Verse 13: the blackness of darkness is reserved for the wandering stars. Verse 21: “Keep yourselves in God’s love.” Verse 24: the one who is “able to keep you from stumbling.” Those who would not keep their proper place are kept by chains; those who are willing to keep themselves in God’s love are kept by God’s hand. Both are “kept”: on one side, chains in the darkness; on the other, standing before the glory. The unease stirred by the “ordained of old” of verse 4 also finds its answer here: the judgement written down long ago is real, but what God has written for you is this sentence: “able to keep you from stumbling.”</p><p>The Greek word for “from stumbling” occurs only here in the New Testament; it was used of a horse that does not stumble, a person who walks without tripping. The psalmist sings the same: “He will not allow your foot to be moved” (Ps 121:3); “Though he stumble, he shall not fall, for Yahweh holds him up with his hand” (Ps 37:24). An overcomer is not someone who never falls, but someone who has been caught and held. James says, “For we all stumble in many things” (Jas 3:2); both brothers knew that they would stumble, and both knew who held them up.</p><p>“To present you faultless.” The reefs of verse 12 (or, as the alternative rendering has it, “blemishes”) and the clothing stained by the flesh in verse 23 become, in verse 24, faultless. This is not the result of our washing ourselves clean; it is what Christ, “a lamb without blemish or spot” (1 Pet 1:19), has accomplished for us. Those who were once stained finally stand before him without blemish. And it is “in great joy,” not in fear and trembling: those standing before the judgement seat, because they have been kept, can shout for joy.</p><p>The Chinese Union Version reads: ‘To him be glory, majesty, dominion and power, through our Lord Jesus Christ, before all time, and now, and for ever and ever. Amen!’ (1:25). (WEB, following the Byzantine text, has “to God our Savior, who alone is wise, be glory and majesty, dominion and power, both now and forever. Amen” (Jude 1:25), without “through Jesus Christ our Lord” and “before all time.”) In verse 4 those men deny “the only Master”; in verse 25 the whole church praises “the only God.” Glory comes to the Father through the Son. The timeline stretches from before all time to for ever and ever; set today’s storms on that line, and their true size appears.</p><p>This is where the whole letter lands: people held by God contend for the faith without being quarrelsome, see the darkness clearly without living in it, remain in God’s love, go out to show mercy and to rescue, and in the end stand before his glory in great joy. When we finish reading Jude, what should impress us most is not Jude’s severity, but the Lord who is “able to keep you from stumbling.”</p><p>321 speaks of the overcomer: not someone who never falls, but someone who has been caught and held. It speaks of changing your perspective: “before all time, and now, and for ever and ever” lifts our eyes from the temporary to the eternal. And it says, “Let Jesus receive all the glory”: this is the last sentence of the whole letter, and the last thing we will say with our whole lives.</p>"}]},"serm":{"1":{"min":18,"blocks":[["h","Able to Keep You from Stumbling"],["p","Brothers and sisters, peace to you. Today we begin by listening in on a conversation at home."],["q","Galilee. A carpenter’s house. The Feast of Tabernacles is near."],["p","A few younger brothers gather round their eldest brother and say:"],["q","“Depart from here and go into Judea, that your disciples also may see your works which you do.” (John 7:3)"],["p","Then they add:"],["q","“For no one does anything in secret while he seeks to be known openly.” (John 7:4)"],["p","The words are polite. They sound like brothers giving their big brother some advice."],["p","The eldest brother answers:"],["p","“My time has not yet come” (John 7:6)."],["p","Beside this conversation, John adds one line:"],["q","“For even his brothers didn’t believe in him.” (John 7:5)"],["p","Matthew wrote down the names of these younger brothers: James, Joses, Simon and Judas — the man we call Jude."],["p","Jude most likely grew up eating at the same table as his brother. He watched him plane wood."],["p","But when his brother went out to preach, he did not believe."],["p","His family even set out to take his brother back home,"],["p","for they said, “He is insane.” (Mark 3:21)."],["q","Some thirty years later."],["p","The same younger brother, his hair most likely white by now, sits under a lamp writing a letter."],["p","A letter opens by saying who is writing."],["p","He has the most dazzling title in the world: the brother of Jesus."],["p","He does not use it. The first thing he calls himself is a servant."],["q","“Jude, a servant of Jesus Christ, and brother of James” (1:1)"],["p","From “depart from here” to “servant” — what happened in between?"],["p","After the Lord rose, “he appeared to James” (1 Corinthians 15:7)."],["p","Among those praying with one accord in the upper room were “his brothers” (Acts 1:14)."],["p","Standing in between is a brother who rose from the dead."],["p","Today we read this younger brother’s letter. One chapter. Twenty-five verses."],["p","Three words: Contend. Beware. Keep. We will take these three steps."],["q","Step one: contend earnestly for the faith."],["p","Jude has said who he is. Next he says who you are:"],["q","“to those who are called, sanctified by God the Father, and kept for Jesus Christ” (1:1)"],["p","Called. Loved — the Chinese Union Version, with the Greek text it follows, reads “beloved in God the Father.” Kept. All three are passive."],["p","You did not call yourself. You did not keep yourself. God did it all."],["p","“Kept” in the Greek is a perfect: kept long ago, and still being kept today."],["p","Please write this word “keep” down."],["p","It appears five times in this short letter, and the Chinese Union Version translates it four different ways."],["p","In Chinese you cannot hear it. Today we will read it out for you."],["p","But before a single warning, Jude first sets you in your place:"],["p","You are someone who is kept."],["p","Then comes the blessing: “Mercy to you and peace and love be multiplied” (1:2)."],["p","A letter that calls people to contend opens its blessing with mercy."],["p","Only those who have first received mercy will remember, while they contend, that they too stand by mercy."],["q","“while I was very eager to write to you about our common salvation, I was constrained to write to you exhorting you” (1:3)"],["p","Jude meant to write a warm letter: the salvation we share."],["p","As he picked up his pen, he heard it: someone had cut a hole in the fence of the sheepfold."],["p","He set aside the letter he wanted to write, and wrote the one he had to write."],["p","What he must guard is exactly what he had meant to celebrate."],["q","“to contend earnestly for the faith which was once for all delivered to the saints.” (1:3)"],["p","This is the most easily misused sentence in the whole letter."],["p","“Contend earnestly” in the Greek is a word from the arena. The New Testament uses it only here."],["p","It is an athlete straining every muscle for the prize."],["p","It is not quarrelling. It is not winning arguments. Still less is it shaming people."],["p","Contend for what? The faith. Not people. Not face. Not the distinctives of our own denomination."],["p","Contend how? Jude shows us himself."],["p","In verse 9, the archangel says only, “May the Lord rebuke you!”"],["p","In verse 22, those who doubt are to receive mercy."],["p","So this verse cannot be used to justify a flame war online."],["q","Defend the faith with pride, and you have already lost the look of the faith."],["p","“Once for all” means once, and for ever."],["p","The faith is not a product that gets a new version every quarter."],["p","You do not need to chase every “new revelation.” The gospel is enough."],["p","So why did he have to write?"],["q","“For there are certain men who crept in secretly” (1:4)"],["p","“Crept in secretly” is also used only here in the New Testament — like slipping into the sheepfold through a gap in the fence."],["p","They are not an enemy army outside the city. They are people already sitting at the love feast."],["p","Jude gives no names. He gives marks."],["q","“turning the grace of our God into indecency, and denying our only Master” (1:4)"],["p","The first mark: preaching grace as a licence. God will forgive anyway."],["p","Paul answered that long ago:"],["q","“Shall we continue in sin, that grace may abound? May it never be!” (Romans 6:1–2)"],["p","The second mark: denying the Master. “Master” means the owner of a servant."],["p","Jude calls himself a servant. These men do not acknowledge the owner."],["p","“Denying” is usually not denial with the lips. It is not letting him rule in daily life."],["p","So the pulpit and the small group teach marks only. We do not draw up lists of names."],["p","We name no pastor, no church, no denomination, no one online."],["p","Marks are a mirror for ourselves first."],["p","With my mouth I call him Lord. In my daily life, who is ruling?"],["p","The Master is the “only” one. There is no room for a second — not even for me."],["p","This is what it means to let Jesus be King."],["p","There is one more phrase to read accurately. The Chinese Union Version says these men were “ordained of old” to this condemnation (1:4)."],["p","The Greek says “written beforehand”: the prophecies of the Old Testament and of Enoch wrote down long ago where this road ends."],["p","What has been written down is where this road leads — not the name of anyone alive today."],["p","Jude passes sentence on no one. Neither may the pulpit."],["p","Perhaps your heart tightens: what if I am the one who was ordained to this?"],["p","Then please go back to the beginning and the end of this letter."],["p","At the beginning: you are “kept for Jesus Christ” (1:1)."],["p","At the end: God is the one “who is able to keep … from stumbling” (1:24). Keep you."],["p","Those who lose sleep over this question are usually the very ones who care about the Lord."],["p","The faith is worth contending for. But those who contend must first see clearly where that road leads."],["q","Step two: beware the road of those who leave their place."],["p","Jude says: “Now I desire to remind you, though you already know this” (1:5)."],["p","Spiritual danger rarely comes from not knowing. Mostly it comes from forgetting."],["p","He lays three old photographs back on the table."],["q","“the Lord, having saved a people out of the land of Egypt, afterward destroyed those who didn’t believe.” (1:5)"],["p","The first is the most unsettling. These people had crossed the Red Sea. They had eaten manna."],["p","Some ancient manuscripts read “Jesus.” The one who saves and the one who judges are the same."],["p","These were a saved people. So this photograph is a mirror for us first."],["p","It is not meant to frighten you. It is meant to stop those who treat grace as an insurance policy."],["q","“Angels who didn’t keep their first domain, but deserted their own dwelling place, he has kept in everlasting bonds under darkness” (1:6)"],["p","The second is in heaven. Who these angels are — there are several readings, and we will not rule on them."],["p","What Jude wants to say is the outcome: even angels who left the place God assigned them could not escape judgement."],["p","God’s judgement is certain. No rank, however high, is exempt."],["p","The “keep” in “didn’t keep their first domain” is the same word as “kept” in verse 1."],["p","“He has kept” — the same word again. They would not keep; so God keeps them."],["q","Those who would not keep their place are kept — in chains."],["p","That is what the text means. Now one application."],["p","This reminds us of what 321 says: “Pride is leaving our proper place and grasping power.”"],["p","The Greek word behind their “domain” means the position assigned to them."],["p","Reaching across the line to grasp what is not ours — that is the very shape of pride."],["q","“Even as Sodom and Gomorrah and the cities around them, having in the same way as these given themselves over to sexual immorality and gone after strange flesh” (1:7)"],["p","The third is on earth. This verse must be preached honestly."],["p","We hold to the Bible’s sexual ethics. The boundaries God has set do not change with the times."],["p","“Strange flesh” — the Chinese Union Version says “unnatural lust” — is literally “other flesh” in the Greek. The point is crossing the boundary God has set."],["p","At the same time, Sodom’s sin was not only one thing. Ezekiel says of her:"],["q","“pride, fullness of bread, and prosperous ease was in her and in her daughters. She also didn’t strengthen the hand of the poor and needy.” (Ezekiel 16:49)"],["p","Which of these four has nothing to do with us?"],["p","So with this verse we do not shame, we do not label — and we do not skip it."],["p","Paul finishes his list of sins and goes on:"],["q","“Some of you were such, but you were washed.” (1 Corinthians 6:11)"],["p","If you are struggling in the area of sex, and you want to follow the Lord, please hear this:"],["p","This verse also points to a road laid down for you: grace and repentance."],["p","You are not someone being driven out. You are someone being waited for."],["q","“Yet in the same way, these also in their dreaming defile the flesh, despise authority, and slander celestial beings.” (1:8)"],["p","“In the same way” turns the three photographs into a mirror."],["p","This verse is often used to shut people up: question your pastor, and you are slandering."],["p","That is not what the text means."],["p","“Authority” most likely means the Lord’s authority. “Celestial beings” most likely means angels."],["p","The ones verse 12 condemns are precisely shepherds who “feed themselves.”"],["p","Raising a legitimate question, through the proper channels, is not despising authority."],["q","“But Michael, the archangel, when contending with the devil and arguing about the body of Moses, dared not bring against him an abusive condemnation” (1:9)"],["p","The early church fathers said this story comes from the *Assumption of Moses*."],["p","Quoting a book is not endorsing the whole book."],["p","Jude wants us to look at one thing only: how Michael speaks."],["p","Facing the devil, he had every right to rail at him. But he “dared not.” He said only:"],["q","“May the Lord rebuke you!”"],["p","It is almost Zechariah’s vision: “Yahweh rebuke you, Satan!” (Zechariah 3:2)."],["p","Even the archangel does not step out of his place. He hands judgement back to the Lord."],["p","This is how to contend: those who hold to the truth do not need to sit in God’s judgement seat."],["p","Resisting the devil is a command of Scripture. But making a performance of “rebuking the devil” — this verse is the lesson in what not to do."],["p","The power of spiritual warfare is not in the volume. It is in the Lord."],["p","Please put this word “contending” away for now. We will meet it again in verse 22."],["p","“But these speak evil of whatever things they don’t know.” (1:10)."],["p","The archangel knew the most, yet did not dare. These men do not know, yet they dare."],["q","“For they went in the way of Cain, and ran riotously in the error of Balaam for hire, and perished in Korah’s rebellion.” (1:11)"],["p","Three names. Three roads going down."],["p","Cain, toward his brother: resentment in the heart grew into murder."],["p","Balaam, toward money: “ran riotously” is like water poured out, rushing downhill."],["p","Korah, toward position: serving was not enough; he wanted to seize the priesthood."],["p","The warning is a mirror for me first: is there a brother I cannot bless?"],["q","“These are hidden rocky reefs in your love feasts when they feast with you” (1:12)"],["p","The love feast was the warmest place in the early church — and that is exactly where the reefs were hidden."],["p","The sea is calm, yet this is where ships break apart. So people matter more than programmes."],["p","“Shepherds who … feed themselves” — in the Greek: shepherding themselves."],["p","This letter does not tell the sheep to keep quiet."],["p","It tells the shepherds to ask first: am I feeding the sheep, or feeding myself?"],["p","Then four pictures: clouds without water, autumn trees without fruit, wild waves of the sea,"],["q","“wandering stars, for whom the blackness of darkness has been reserved forever.” (1:13)"],["p","Something on the outside, nothing on the inside. Could my service also be a cloud without rain?"],["p","“Reserved” — “keep” again. The fourth time. The blackness of darkness is keeping a place for them."],["p","Here the letter reaches the bottom of the valley."],["p","But Jude does not want us to live in the valley studying the dark."],["p","He leads us through it so that we can stand on the summit and worship."],["p","Verse 14: Enoch’s prophecy comes from *1 Enoch*."],["p","Paul quoted Greek poets too."],["p","It is the letter of Jude that is inspired. We do not build a separate angelology on this, nor do we doubt the letter because of it."],["p","“Behold, the Lord came with ten thousands of his holy ones” (1:14)."],["p","The Lord will surely come. But we do not calculate the day."],["p","Verse 15: in the Greek, “ungodly” four times in one verse. The judgement is total."],["q","“These are murmurers and complainers … and their mouth speaks proud things—showing respect of persons to gain advantage.” (1:16)"],["p","“Complainers” in the Greek means people who find fault with the share they were given. Not keeping their place — again."],["p","“Showing respect of persons” means watching people’s faces and flattering the useful ones."],["p","His brother James says it too: “don’t hold the faith of our Lord Jesus Christ of glory with partiality.” (James 2:1)."],["p","When I speak, am I watching people’s faces — or God’s?"],["p","The photographs have all been shown. Jude looks up and speaks to those reading his letter."],["q","Step three: those who have been caught hold of go and rescue others."],["q","“But you, beloved, remember the words which have been spoken before by the apostles of our Lord Jesus Christ.” (1:17)"],["p","Jude does not say “we apostles.” He points to the apostles’ words, not to himself."],["p","Facing new voices, the best anchor is the old words. The Bible is my standard."],["p","The apostles said long ago that in the last time there would be mockers (1:18)."],["p","If you know the rain is coming, you do not panic when it comes."],["q","“These are those who cause divisions and are sensual, not having the Spirit.” (1:19)"],["p","“Cause divisions” in the Greek means drawing lines and ranking people."],["p","Those who think themselves the spiritual upper class — Jude says they do not have the Spirit."],["p","This is a mark, not a label to pin on others. If you are in a hurry to draw someone outside the line, look at yourself first."],["p","“These” has tolled like a bell six times in this letter. This is the last time. And then:"],["q","“But you, beloved, keep building up yourselves on your most holy faith, praying in the Holy Spirit.” (1:20)"],["q","But you."],["p","This is the hinge of the whole letter."],["p","Jude spends more than ten verses describing others, and only two verses telling us what to do."],["p","The best way to deal with error is not to study error."],["p","Two verses. Four actions: build, pray, keep, look."],["p","“Building up” in the Greek is “building on top.” The foundation is already laid. We build upwards."],["p","“Yourselves” is plural: building one another up."],["p","Verse 19 draws lines and pulls apart. Verse 20 builds together."],["p","Pray — “in the Holy Spirit.”"],["p","Some believe this includes speaking in tongues. Others believe it means all prayer led by the Holy Spirit."],["p","The text does not narrow it. We do not make tongues a requirement, and we do not look down on tongues either."],["p","Where it lands is a life of praying in dependence on the Holy Spirit. The dividing line is not eloquence. It is whom you depend on."],["p","The third action is the centre:"],["q","“Keep yourselves in God’s love” (1:21)"],["p","The fifth “keep” — and the only time in the whole letter that we are told to keep."],["p","What you are to keep is not the temperature of your love for God. That rises and falls."],["p","What you are to keep is your place — in God’s love for you."],["q","“Remain in my love.” (John 15:9)"],["p","The angels of verse 6 would not keep their place."],["p","We are called to keep a place: God’s love."],["p","That is not a prison. It is home."],["p","The fourth action: “looking for the mercy of our Lord Jesus Christ to eternal life” (1:21)."],["p","Even those who keep themselves reach the finish line by mercy."],["p","Turn your eyes back to the Lord, and you will stand firm."],["p","Then Jude tells these people who stand firm to turn around."],["q","“On some have compassion” (1:22)"],["p","Who are “some”? The Chinese Union Version reads: those who doubt. And the first verb is compassion — not correction, still less expulsion."],["p","Remember the word we put away? “Doubt” here and Michael’s “contending” are the same Greek word
