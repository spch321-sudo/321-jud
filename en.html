. (The WEB renders it here as “making a distinction.”)"],["p","An archangel contending with the devil. A believer contending within his own heart."],["p","The devil — leave him to the Lord. The one contending within — have mercy on him."],["p","The church’s most common mistake is to get these two kinds of contending the wrong way round."],["p","Doubt is not apostasy."],["p","If your heart is full of questions, this verse wants you to dare to ask more, not less."],["p","The man who wrote this sentence understood it best. Go back to that house at the beginning:"],["p","“For even his brothers didn’t believe in him.” (John 7:5)."],["p","Jude had been shown mercy. That is why he tells the church to show mercy."],["q","“and some save, snatching them out of the fire” (1:23)"],["p","The second kind of people are already close to the fire. They need an urgent hand."],["q","“Isn’t this a burning stick plucked out of the fire?” (Zechariah 3:2)"],["p","Every one of us was once that burning stick."],["p","The third kind are in deeper still. The Chinese Union Version reads 1:23 as “have mercy on them with fear”: fear of God, and watchfulness over yourself."],["p","Rescuing people is not playing the hero."],["p","Ask co-workers to walk with you. Where professional help is needed, refer people on."],["p","What we hate is the stained clothing, not the person wearing it."],["p","Three kinds of people. Three ways of rescue. All held in one verb: mercy."],["p","Those who rescue others can slip too. Will I fall?"],["q","“Now to him who is able to keep them from stumbling, and to present you faultless before the presence of his glory in great joy” (1:24)"],["p","The whole letter — here the day breaks."],["p","Jude does not say: work hard not to stumble. He says: there is One who is able. (The WEB has “keep them”; the Chinese Union Version reads “keep you.”)"],["p","“From stumbling” is used only here in the New Testament. Ancient Greek used it of a horse that does not lose its footing."],["p","“Keep” here is a different word — like a sentry standing guard."],["q","“Though he stumble, he shall not fall, for Yahweh holds him up with his hand.” (Psalm 37:24)"],["p","An overcomer is not someone who never falls. An overcomer is someone who has been caught hold of."],["p","Now let us walk this word “keep” from beginning to end."],["p","Verse 1: we are kept."],["p","Verse 6: the angels did not keep their place, and are kept in chains."],["p","Verse 13: the darkness is reserved for the wandering stars."],["p","Verse 21: keep yourselves in God’s love."],["p","Verse 24: the One who is able to keep you from stumbling."],["q","Those who would not keep their place are kept in chains. Those in God’s love are kept by God’s hand."],["p","The reefs, the stained clothing — here they become “faultless.”"],["p","This reminds us: that is what the Lamb has done for us."],["p","And it is “in great joy” — not in fear and trembling."],["q","“to God our Savior, who alone is wise, be glory and majesty, dominion and power, both now and forever. Amen.” (1:25)"],["p","In verse 4, those men deny our only Master. In verse 25, the whole church praises the God who alone is God."],["p","One last time, back to that house."],["p","That day, the younger brothers said: go to Judea, go and make a name for yourself."],["p","The eldest brother said: my time has not yet come."],["p","Later, his time did come. He did not go to make a name for himself. He went to the cross."],["p","He rose from the dead. Not long after, those unbelieving younger brothers appeared among the people at prayer."],["q","Some thirty years later, one of those younger brothers wrote the last line: to him be glory."],["p","Jude did not become better at arguing. He was caught hold of."],["p","So please do not come away admiring Jude’s severity more."],["p","Come away loving that One more: the One who caught hold of an unbelieving younger brother — and has caught hold of you."],["p","This week, pray for one person who doubts. Then make a phone call."],["p","What keeps you is not your hand. It is his."],["p","Let us bow our heads together and pray."]]}},"issues":[{"id":"ISS00_1","t":"Author, recipients and canonical status: who is “Jude, brother of James”? How was this letter received into the canon?","r":"1:1; 1:17; Matt 13:55; Mark 6:3; John 7:5; Acts 1:14; Luke 6:16","ch":[],"why":"1. A younger brother who once did not believe in his elder brother, and later called himself that brother’s servant — position 1 of these notes for the whole book (newly established in this volume). Jude opens with a single line of self-introduction: “Jude, a servant of Jesus Christ, and brother of James” (1:1). There are at least five men called Judas or Jude in the New Testament, and which one this is sets the tone of the whole letter. The recipients are not named, and readers often do not know to whom the letter was first written. Fewer still know that in the early church some people hesitated over this letter — precisely because it quotes non-canonical writings. If these three things are not settled at the outset, the congregation will either be tripped up by questions of authorship, or conclude, the moment they hear “non-canonical writings,” that the whole letter cannot be trusted.","pos":[["[1] What the text is asking","","<p>The writer introduces himself like this: “Jude, a servant of Jesus Christ, and brother of James” (1:1). He does not call himself an apostle; on the contrary, in verse 17 he places himself outside the apostles: “remember the words which have been spoken before by the apostles of our Lord Jesus Christ” (1:17). He mentions only one relative — James; and the James in the New Testament who needs no further explanation, whom readers recognise at once, is the pillar of the Jerusalem church, “James, the Lord’s brother” (Gal 1:19).</p><p>The recipients are called only “those who are called, sanctified by God the Father, and kept for Jesus Christ” (1:1; the Chinese Union Version, with many Greek manuscripts, reads ‘beloved in God the Father’) — no city, no personal name. From the content of the letter, they knew Enoch, Moses, Cain, Balaam and Korah, and they knew the traditions circulating among the Jews of the day. <strong>So the text is asking: Who is this “Jude, brother of James”? What kind of community received the letter? And how did the church recognise a short letter that quotes non-canonical writings as the word of God?</strong></p>"],["The Lord’s brother view (Jude, the younger brother of Jesus by birth)","","<p>The view of church tradition and of most scholars: the author is the younger brother of the Lord Jesus by birth. The people of Nazareth asked, “Isn’t his mother called Mary, and his brothers, James, Joses, Simon, and Judas?” (Matt 13:55), and Mark’s list includes him too (Mark 6:3). These brothers once did not believe: “For even his brothers didn’t believe in him” (John 7:5); they even went out with the family to bring their elder brother, said to be “insane,” back home (Mark 3:21). Yet after the Lord’s resurrection, Scripture records: “All these with one accord continued steadfastly in prayer … and with his brothers” (Acts 1:14); and Paul later mentions “the brothers of the Lord” travelling to preach with their wives (1 Cor 9:5). James’s letter likewise calls him only “James, a servant of God and of the Lord Jesus Christ” (Jas 1:1) — neither brother mentions the family tie.</p><p>Hegesippus, in the second century, left an account (Eusebius, Ecclesiastical History 3.19–20): the Roman emperor Domitian summoned two grandsons of “Jude, who was said to be the Lord’s brother according to the flesh”; they showed him their hands, thick with calluses, and said they were only farmers, and the emperor, seeing that they posed no threat, let them go. <strong>Difficulty: </strong>if the author was the Lord’s brother, why does he not write “the brother of Jesus” — would that not carry more weight? Supporters answer that precisely because he was his brother, he knew all the more that he was unworthy to use that title; but this question should be set out honestly — it is an inference, not something the text states.</p>"],["The apostle Jude view (the Judas among the Twelve)","","<p>Among the twelve apostles there was a Judas who was not Iscariot: “Judas the son of James” (Luke 6:16; Acts 1:13). The Greek simply says Ἰούδαν Ἰακώβου (“Judas of James”), which can be filled out as “son” or as “brother”; some older translations supplied “brother,” and so some have argued that the author of Jude is this apostle, and that the letter’s authority comes directly from his apostleship.</p><p><strong>Difficulty: </strong>the most natural word to supply in this phrase is “son,” and the Chinese Union Version translates it so; moreover, in verses 17–18 the author of Jude speaks of “the apostles” as another group who had spoken to the recipients — if he himself were an apostle, this would be an unnatural way to write. Further, the James who was the father of the Judas in the apostolic list has no prominence in the New Testament, not enough for the author to write only “brother of James” and expect readers to know who he was.</p>"],["The pseudonymity view (a later writer borrowing the name of the Lord’s brother)","","<p>Some scholars think the letter was written at a later time by someone who borrowed the name of “Jude, the Lord’s brother” to lend authority to a dispute within the church. Their reasons include: the Greek is quite polished, with a rich vocabulary, as if written by a well-educated person; “the words which have been spoken before by the apostles” in verse 17 sounds like looking back on an era already past; and “the faith which was once for all delivered to the saints” (1:3) sounds like the language of a later church that had organised the faith into a fixed body of content.</p><p><strong>Difficulty: </strong>if someone wanted to write under a borrowed name, why choose a Jude who was almost unknown in the early church, rather than Peter, Paul or James himself? When the early church discovered that a book was pseudonymous, it usually rejected it rather than receiving it. Greek was also widely spoken in the Galilee region, the Lord’s brothers spent years travelling to preach (1 Cor 9:5), and someone may have helped him write; and verse 18, “They said to you,” shows that the recipients had heard the apostles with their own ears — exactly the voice of the first generation of believers.</p>"],["Canonical status: hesitation and reception","","<p>The early church did hesitate. Eusebius, in his Ecclesiastical History 3.25, lists Jude among the “disputed” books, while noting that it was well known to most; in 2.23 he also mentions that not many of the ancients quoted it. Jerome, in On Illustrious Men, chapter 4, records the most direct reason: because Jude quotes the non-canonical Book of Enoch, many did not accept it; but he goes on to say that by its antiquity and long use in the church the letter had gained authority and was counted among the Scriptures. The Peshitta, the version in early use in the Syriac church, did not include it either.</p><p>On the other hand, reception came early too: the Muratorian Fragment (traditionally dated to the end of the second century) lists “the letter of Jude” among the books received by the catholic church; Tertullian and Clement of Alexandria both quote it; Origen calls it “a letter of only a few lines, yet full of the healthful words of heavenly grace.” Athanasius, in his Festal Letter of AD 367, lists the twenty-seven books of the New Testament, Jude among them; and the Council of Carthage in AD 397 likewise acknowledged it. <strong>Difficulty: </strong>reception was gradual, coming at different times in different places; it was not suddenly decided by a single council.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: the author is Jude, the younger brother of the Lord Jesus by birth, and younger brother of James, the leader of the Jerusalem church (Matt 13:55; Mark 6:3; John 7:5; Acts 1:14; 1 Cor 9:5); the apostle Jude view (Luke 6:16; Acts 1:13) and the pseudonymity view are set out alongside, with the difficulties of each view stated plainly. The recipients are not named; these notes say only this: a community of Christians familiar with Jewish tradition, location uncertain.</strong></p><p><strong>Jude is canonical, with the same authority as the other books of the New Testament.</strong> The early hesitation is set out plainly — Eusebius listed it among the “disputed” books, and Jerome records that many did not accept it because it quotes the Book of Enoch; the process of reception is set out plainly too — the Muratorian Fragment, Origen’s praise, Athanasius’ list, the Council of Carthage. The hesitation centred on its quoting non-canonical writings, not on any conflict between its teaching and the apostolic faith; on the matter of quoting non-canonical writings, see also these notes’ issue “Scripture quoting non-canonical books: what does it mean that Jude cites the Assumption of Moses and 1 Enoch?”. <strong>The church did not “make” the canon; it “recognised” the canon.</strong></p><p>From the pulpit we may say “Jude says,” but we do not make the author a hero. <strong>He could have written “the brother of Jesus,” yet he wrote “a servant of Jesus Christ”</strong> — the focus is not on how remarkable this younger brother was, but on the Lord who caught hold of an unbelieving brother and brought him back, and who is “able to keep them from stumbling” (1:24; the Chinese Union Version: ‘able to keep you from stumbling’).</p>"],["[4] Should this affect your faith?","","<p>Which Jude was the author, and how this letter came to be received — these discussions should not shake your faith. Every view agrees: this is a man respected by the early church, writing to believers who were being troubled; and the church spent several centuries carefully discerning before it placed this letter in the Bible — a conclusion that has been tested is more reliable than one that has never been questioned.</p><p>If anything, this question gives you a comfort: <strong>the man who wrote this letter once stood outside the door with his family, wanting to bring home the elder brother people said was “insane” (Mark 3:21, 31).</strong> Later he called that brother “our only Master” (1:4). If you still have many questions today, remember that verse 22 — which the Chinese Union Version renders ‘Have mercy on those who doubt’; the WEB reads, “On some have compassion, making a distinction” (1:22) — was written by a man who had himself been shown mercy.</p>"]],"con":[],"say":"Where these notes stand for the whole book: the author is Jude, the younger brother of the Lord Jesus by birth (Matt 13:55; Mark 6:3; John 7:5; Acts 1:14; 1 Cor 9:5), with the apostle Jude view (Luke 6:16; Acts 1:13) and the pseudonymity view set out alongside; the recipients are not named — a community of Christians familiar with Jewish tradition. Jude is canonical: in the early period there was hesitation because it quotes non-canonical writings (Eusebius listed it among the disputed books; Jerome’s account), but the Muratorian Fragment already lists it, and it was later universally received; the church recognised the canon.","care":"In the pews there will be elderly believers who grow uneasy the moment they hear “the authorship is disputed” or “some in the early church did not accept it”; young people who have read articles online and think the Bible was pieced together at random by later hands; and brothers and sisters whose families still do not believe, who have prayed for years and still see no change. With the first two, pastors should tell the history honestly — state only what is historically certain, and say plainly when something is uncertain; to the third, show the road that runs from John 7:5 to Acts 1:14 — the Lord’s own brothers once did not believe either. Do not turn questions of authorship into a test of faith, and do not, in order to reassure people, speak as if the early hesitation never happened."},{"id":"ISS00_2","t":"Jude and 2 Peter: about nineteen parallels — who used whom, and how do the two letters divide the work?","r":"1:4–18; 2 Pet 2:1–3:3","ch":[],"why":"2. The same group of people, written about in two ways — position 2 of these notes for the whole book (carrying over the 2 Peter Study Notes’ whole-book position on the relationship between the two letters, supplemented from Jude’s side). Jude 4–18 and 2 Pet 2:1–3:3 have about nineteen parallels: angels, Sodom, Balaam, slandering celestial beings, the people at the love feasts, clouds and wells without water, the blackness of darkness, the mockers of the last time. People who have read 2 Peter often feel, when they read Jude, that “this has all been said before,” and so treat Jude as an abridged version of 2 Peter. This question must explain the relationship between the two letters clearly — and, even more, the extra strokes that are Jude’s own, so that the pulpit does not preach the two letters as the same sermon.","pos":[["[1] What the text is asking","","<p>First, set out the parallels: “crept in secretly” (1:4) and “will secretly bring in destructive heresies” (2 Pet 2:1); the angels who did not keep their first domain (1:6) and “angels when they sinned” (2 Pet 2:4); Sodom and Gomorrah (1:7; 2 Pet 2:6); “despise authority, and slander celestial beings” (1:8) and 2 Pet 2:10; Michael, who dared not slander (1:9), and “angels, though greater in might and power, don’t bring a railing judgment against them before the Lord” (2 Pet 2:11); Balaam (1:11; 2 Pet 2:15); feasting at the love feasts (1:12; 2 Pet 2:13); clouds without water (1:12) and “wells without water” (2 Pet 2:17); “for whom the blackness of darkness has been reserved forever” (1:13; 2 Pet 2:17); “In the last time there will be mockers” (1:18; 2 Pet 3:3).</p><p>There are also differences: 2 Peter has no name of Michael, no body of Moses, no prophecy of Enoch; Jude has no Noah, no Lot, no talking donkey of Balaam. Peter says “false teachers will also be among you” (2 Pet 2:1), but Jude says “there are certain men who crept in secretly” (1:4) — one is a forewarning, the other is the scene itself. <strong>So the text is asking: Which of the two letters used the other? Or did both use the same material? And how should the work be divided between them?</strong></p>"],["The Jude-first view (2 Peter took up and expanded Jude)","","<p>Most scholars today take this view: Jude is shorter and more direct, and 2 Peter reworked its material, adding the two examples of Noah and Lot who were saved, so that beside the picture of judgement there is a way out. The strongest argument of this school concerns the non-canonical writings: Jude names Michael explicitly and quotes Enoch’s prophecy; at the same point 2 Peter says only “angels … don’t bring a railing judgment” (2 Pet 2:11), removing the specific source — it is easier to imagine a later writer smoothing this out than an earlier writer leaving it out and a later one deliberately adding it in.</p><p><strong>Difficulty: </strong>“the shorter came first” is only a general tendency, not a law; and if Peter was an apostle, why would he borrow so heavily from a short letter written by a non-apostle? Supporters answer that truth is not diminished by the standing of its source, and there is nothing strange about an apostle using a brother’s words; but this is still an inference.</p>"],["The Peter-first view (Jude drew on 2 Peter)","","<p>Another school holds that 2 Peter came first. The reason most often given is this: Peter uses the future tense, “false teachers will also be among you” (2 Pet 2:1), while Jude uses the past tense, “there are certain men who crept in secretly” (1:4), as though the prophecy had already been fulfilled; Jude also says, “remember the words which have been spoken before by the apostles of our Lord Jesus Christ” (1:17), and the sentence he then quotes, “In the last time there will be mockers” (1:18), is almost exactly 2 Pet 3:3. This school holds that Jude is reminding his readers: Peter said this long ago.</p><p><strong>Difficulty: </strong>Jude speaks of “the apostles” (plural), and says, “They said to you” (1:18), which sounds more like the oral teaching of the apostles, not necessarily a letter of Peter; and if Jude had 2 Peter in hand, it is hard to explain why he would drop the two hope-filled examples of Noah and Lot.</p>"],["The common-source view (both used the same teaching)","","<p>A third view is that both letters used a common body of material in the early church for dealing with false teachers — perhaps a sermon, a teaching outline, or the warnings the apostles passed on by word of mouth. Each author drew on it and trimmed it in his own way, which is why there are so many similarities and also not a few differences. The strength of this view is that it explains both the similarities and the differences, without having to decide who depended on whom.</p><p><strong>Difficulty: </strong>that “common material” has not survived; it is reconstructed backwards from the two letters, and an invisible source can easily be used to explain everything — and so proves nothing. Moreover, in some details the two letters are so close in order and wording that many scholars still think the relationship is direct.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: the three views of the relationship (Jude first / Peter first / common source) are set out side by side, without a verdict, carrying over the treatment in the 2 Peter Study Notes.</strong> Both letters are inspired Scripture; which came first does not affect the authority of either.</p><p><strong>The division of labour between the two letters: 2 Peter speaks of “discernment while growing”; Jude speaks of “contending earnestly for the faith, and being kept.”</strong> Peter ends, “But grow in the grace and knowledge of our Lord and Savior Jesus Christ” (2 Pet 3:18); Jude ends with “him who is able to keep them from stumbling” (1:24). Second Peter teaches us to see clearly in the fog; Jude teaches us to stand firm in the waves — and those who stand firm are those who are held.</p><p>What this means for the pulpit: whatever 2 Peter has treated in detail (the marks of false teachers, Sodom and Lot, Balaam’s donkey) is given only a [2 Pet] cross-reference in this volume and not preached again; this volume preaches only the extra strokes that are Jude’s own — <strong>the three “keeps” (1, 21, 24), Michael’s “May the Lord rebuke you!” (1:9), Cain and Korah (1:11), Enoch’s prophecy (1:14–15), mercy toward three kinds of people (1:22–23), and the closing doxology (1:24–25)</strong>.</p>"],["[4] Should this affect your faith?","","<p>Scholars have not settled which of the two letters came first, and this should not shake your faith. There is nothing strange about two New Testament books using the same material — Matthew, Mark and Luke overlap heavily too; God often uses two witnesses to make the same thing more certain.</p><p>The question we really need to ask ourselves is this: <strong>do I need Peter’s “growing” right now, or Jude’s “standing firm”?</strong> Some need to grow in knowledge and learn to discern; others are already in the waves and need only to know that a hand is holding them. Both letters were given by the same Lord, because the flock has both kinds of people.</p>"]],"con":[],"say":"Where these notes stand for the whole book: we carry over the 2 Peter Study Notes’ whole-book position on the relationship between the two letters — Jude 4–18 and 2 Pet 2:1–3:3 have about nineteen parallels, and the three views of the relationship (Jude first / Peter first / common source) are set out side by side without a verdict. The division of labour: 2 Peter speaks of discernment while growing, Jude of contending earnestly for the faith and being kept; what 2 Peter treats in detail is only cross-referenced, and this volume preaches only the extra strokes that are Jude’s own.","care":"In the pews there will be people who have just finished 2 Peter and are weary of “false teachers again”; and new believers unfamiliar with discussions of literary relationships, who think “copying back and forth” means the Bible cannot be trusted. Pastors should help the first group see the extra strokes that are Jude’s own, especially the keeping and the doxology of verses 20–25; and let the second group know that shared material is two witnesses, not a flaw. Do not spend too much pulpit time debating which came first, and do not preach the two letters as one sermon; touch on this question and move on, and keep the time for the One in verse 24."},{"id":"ISS00_3","t":"Contending for the faith without being contentious: what kind of contest is “contend earnestly”?","r":"1:3; 1:9; 1:20–23; Zech 3:2","ch":[],"why":"3. What we contend for is the faith, not against people; defending the truth in a proud way has already lost — position 3 of these notes for the whole book (newly established in this volume, and the most important position in the whole book). “Contend earnestly” in verse 3 is the most often quoted phrase in Jude, and also the most often misused: some use it to justify online wars of words, to fight every opinion in church until relationships are torn apart, and to humiliate those who disagree; others, afraid of being seen as combative, contend for nothing at all, and say nothing even when the core of the gospel is changed. In this same letter Jude has already shown how to contend: no slander in verse 9; keeping ourselves first in verses 20–21; mercy and rescue in verses 22–23. This question must settle, at the outset, what we contend for and how.","pos":[["[1] What the text is asking","","<p>Jude had originally meant to write a warm letter: “while I was very eager to write to you about our common salvation, I was constrained to write to you exhorting you to contend earnestly for the faith which was once for all delivered to the saints” (1:3). “Contend earnestly” is ἐπαγωνίζεσθαι in the Greek; its root ἀγών is the arena, the wrestling ground. It is the word for an athlete straining every nerve for the prize — not a word for quarrelling or winning an argument. This reminds us of Paul’s “with one soul striving for the faith of the Good News” (Phil 1:27).</p><p>What we contend for is also clearly stated: “the faith which was once for all delivered to the saints.” Here “the faith” is πίστις, meaning the content of what is believed; “once for all,” ἅπαξ, means complete in one act, needing nothing added. What we contend for is not personal opinion, denominational distinctives, or our own face. And the manner of contending, Jude models in this very letter: Michael the archangel, contending with the devil, “dared not bring against him an abusive condemnation, but said, ‘May the Lord rebuke you!’” (1:9); “But you, beloved, keep building up yourselves on your most holy faith, praying in the Holy Spirit” (1:20); and verse 22, which the Chinese Union Version renders ‘Have mercy on those who doubt’ — in the WEB, “On some have compassion, making a distinction” (1:22). <strong>So the text is asking: In contending for the faith, what should we contend for? How should we contend? And when has it already turned into being contentious?</strong></p>"],["The public polemic view (truth above all; error must be named and refuted)","","<p>One reading treats verse 3 as a licence for public polemic: when the truth is threatened, meet it head on, point out the errors, name names, and do not shrink from a harsh tone; its supporters point out that Jude himself uses very strong language — “hidden rocky reefs,” “clouds without water,” “wandering stars” (1:12–13). The strength of this view is its seriousness: it knows that false teaching really does harm people, and it will not keep silent for the sake of a harmonious atmosphere.</p><p><strong>Difficulty: </strong>the strong language Jude uses describes the conduct and the end of a group of people; he does not name a single person in the letter. And the example of contending he gives straight afterwards is Michael, who did not dare bring an abusive condemnation even against the devil (1:9). Moreover, Jude says slander is precisely a mark of “these men”: “But these speak evil of whatever things they don’t know” (1:10). To defend the faith with slander is to oppose “these men” with the methods of “these men.” Paul also says, “The Lord’s servant must not quarrel, but be gentle toward all” (2 Tim 2:24).</p>"],["The peace-and-avoidance view (doctrine divides churches, so better not to contend)","","<p>Another reaction goes to the other extreme: having seen too many churches split over doctrine, and too many people attacking each other online, it concludes that contending is itself the problem, and that Christians had best speak only of love and never of right and wrong. The strength of this view is its gentleness: it remembers, “If it is possible, as much as it is up to you, be at peace with all men” (Rom 12:18), and it remembers that much so-called “defence of the faith” is really a defence of one’s own face.</p><p><strong>Difficulty: </strong>Jude says he was “constrained to write” — there are times when not to contend is to fail in one’s duty. The men of verse 4 were “turning the grace of our God into indecency,” and “denying our only Master”; this is no minor difference of opinion — the core of the gospel has been changed. If the gate of the sheepfold is left open, the first to suffer are the sheep. Speaking only of love without discernment lets those who “crept in secretly” sit most comfortably at the love feasts (1:12).</p>"],["The layered view (hold fast the core faith; give way on secondary differences)","","<p>A third view sorts truth into layers: the core of the gospel — the triune God, the deity and humanity of Christ, the cross and the resurrection, justification by faith, the authority of Scripture, the call to holy living — is the faith “once for all delivered,” and must be held fast; the mode of baptism, church government, the details of the end times, styles of worship and so on are secondary differences that believers can respect in one another and discuss slowly. The strength of this view is that it gives a tool for discernment: we do not fight over everything, nor do we fight over nothing.</p><p><strong>Difficulty: </strong>the boundary between the layers is itself disputed, and traditions do not always agree on which items are core and which are secondary; moreover, the layered view answers only “what to contend for,” not “how to contend” — a person can hold the right core and yet hold it in a proud way, knocking people down along with the error. The layered view needs the other half of Jude’s sentence: verse 9 and verses 22–23.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: we contend for the faith, not for ourselves; we are serious about error, and merciful toward people.</strong> What we contend for is “the faith which was once for all delivered to the saints” (1:3) — that is, what the apostles preached, the core of the gospel; secondary differences are met with mutual respect, and verse 3 is not used to declare war over them. The manner of contending follows Jude’s own example: ① no slander — leave judgement to the Lord: Michael said only, “May the Lord rebuke you!” (1:9), and this reminds us of “Yahweh rebuke you, Satan!” (Zech 3:2); ② keep ourselves first — the four actions of verses 20–21 (building up, praying, keeping, looking for) come before rescuing others; ③ mercy and rescue — “and some save, snatching them out of the fire” (1:23); the goal of contending is to save people, not to beat them.</p><p>Here 321 offers a very precise saying: <strong>Humility overcomes pride; pride provokes pride. Defending the truth in a proud way has already lost.</strong> You can be right on every point and still push the other person further from Christ. “For the anger of man doesn’t produce the righteousness of God” (Jas 1:20); “in gentleness correcting those who oppose him: perhaps God may give them repentance” (2 Tim 2:25).</p><p><strong>Pastoral bottom line: </strong>in online discussions, first ask, “Am I guarding the faith, or guarding my face?”; do not forward content that humiliates people, and do not name people in public settings. With doctrinal differences inside the church, first discern whether the matter is core or secondary; core matters are dealt with in proper order by elders, deacons and co-workers, and secondary matters are met with mutual acceptance. At no time use “for the sake of the faith” as a reason to slander, mock or humiliate anyone.</p>"],["[4] Should this affect your faith?","","<p>If you have been hurt in church quarrels, or humiliated by someone in the name of “the faith,” please do not conclude from this that the truth itself is cold. What hurt you was a proud manner, not the Lord who called you and in whom you are “called, sanctified by God the Father” (1:1; the Chinese Union Version: ‘called, beloved in God the Father’).</p><p>If you are someone who easily gets red in the face arguing about faith, this question asks you: <strong>after I have finished arguing, is the other person closer to Christ, or further away?</strong> When Jude wrote this letter, he himself was someone who had been “won back” by his brother’s truth — not argued down, but met by the risen Lord. The faith is worth contending for, because it has saved us; so the way we contend should also be like the One who saved us.</p>"]],"con":[],"say":"Where these notes stand for the whole book: “contend earnestly” in verse 3, ἐπαγωνίζεσθαι, is a word from the arena; what we contend for is the faith once for all delivered, not against people, not for our face. The manner follows Jude’s own example — no slander in verse 9, leaving judgement to the Lord (Zech 3:2); keeping ourselves first in verses 20–21; mercy and rescue in verses 22–23. Hold fast the core faith; give way on secondary differences. Humility overcomes pride, and pride provokes pride; defending the truth in a proud way has already lost.","care":"In the pews there will be people who have been hurt by doctrinal quarrels in church and no longer dare to talk about faith; brothers who argue about faith online, angrier each time; and people tense because family members or colleagues hold a different faith, unsure whether they ought to “contend.” Pastors should let the first group know that what hurt them was a proud manner, not the faith itself; walk with the second through verse 9 and 2 Tim 2:24–25, asking whether, after they have argued, the other person is closer to Christ or further away; and help the third to tell the core from the secondary. Do not use verse 3 from the pulpit to stir the congregation up to “fight” anyone, and do not use “don’t argue” to silence people with genuine doubts."},{"id":"ISS00_4","t":"Discerning false teaching: does Jude give us marks, or a list of names?","r":"1:4–19; 1:8; 1:12; 1:16; 1:19","ch":[],"why":"4. The pulpit teaches marks and gives no list of names; the marks are first a mirror for ourselves — position 4 of these notes for the whole book (carrying over the 2 Peter Study Notes’ whole-book position “Discerning false teaching: marks, not a list of names; the interpretation of Scripture and the freedom to read it”). Jude 4–19 spends more than ten verses describing “these men”; the Greek οὗτοι appears six times, and the language is extremely strong. These verses are the easiest to use for witch-hunts in the church: pinning a particular preacher, a particular church or a particular online speaker directly as “those who crept in secretly”; others go the other way and think it was only a first-century matter with nothing to do with today. This question must explain what Jude gives us, and how we should use it.","pos":[["[1] What the text is asking","","<p>Jude does not write a single name; what he writes is a string of marks: “turning the grace of our God into indecency, and denying our only Master, God, and Lord, Jesus Christ” (1:4); “defile the flesh, despise authority, and slander celestial beings” (1:8); “these speak evil of whatever things they don’t know” (1:10); they went in the way of Cain, “ran riotously in the error of Balaam for hire,” and perished in Korah’s rebellion (1:11); “These are hidden rocky reefs in your love feasts when they feast with you, shepherds who without fear feed themselves” (1:12); “These are murmurers and complainers, walking after their lusts—and their mouth speaks proud things—showing respect of persons to gain advantage” (1:16); “These are those who cause divisions and are sensual, not having the Spirit” (1:19).</p><p>These marks have three layers: in teaching — preaching grace as licence, and denying that Christ is Lord; in life — indulging lust, and acting for gain; in the community — despising authority, complaining, flattering, and drawing lines into factions. And in the middle of this string of descriptions Jude places a sentence: “Yet in the same way, these also in their dreaming” (1:8) — the three examples before it are a mirror held up for the readers. <strong>So the text is asking: How should these marks be used? To identify others, or first to examine ourselves? Do they still apply today?</strong></p>"],["The list view (applying the marks directly to people today)","","<p>One use treats Jude’s description as a wanted poster: whichever preacher speaks of grace too broadly, whichever church values dreams and visions, whichever online speaker takes in a lot of offerings — declare straight away that this is the man Jude was talking about. The strength of this view is its alertness: it believes error really does enter the church, and refuses to close its eyes to danger; the Lord Jesus also said, “By their fruits you will know them” (Matt 7:16).</p><p><strong>Difficulty: </strong>Jude himself names no one; what he gives are marks, and marks are for each person to use in discerning for themselves. Once a list is opened, it cannot be stopped: those who name others today may be named by others tomorrow; and “murmurers” (1:16) and “those who cause divisions” (1:19) are precisely marks Jude lists — taking the lead in witch-hunts in the church and drawing hard lines may itself fall into these two marks. A list also leads people to think the danger lies only in others, forgetting the mirror of verse 8.</p>"],["The purely historical view (a first-century matter, nothing to do with today)","","<p>Another reading puts these descriptions entirely back into history: Jude was dealing with a particular group of people who are no longer here, and today’s church need not use these verses to say anything. The strength of this view is its caution: it avoids forcing ancient disputes onto today, and avoids harming innocent people.</p><p><strong>Difficulty: </strong>Jude himself places these men on a very long line: from the generation of the exodus, the angels and Sodom, to Cain, Balaam and Korah, and on to the mockers the apostles foretold, “In the last time there will be mockers” (1:18). What he describes is a shape that keeps recurring, not a one-off historical event. The apostle Paul also foretold, “Men will arise from among your own selves, speaking perverse things” (Acts 20:30). If these marks are never used, the church loses its tools for discernment.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: we carry over the 2 Peter Study Notes’ whole-book position “Discerning false teaching: marks, not a list of names; the interpretation of Scripture and the freedom to read it” — the pulpit teaches marks and gives no list of names; the marks are first a mirror for ourselves.</strong> These notes do not name any pastor, church, denomination or online preacher today as one of “those who crept in secretly.”</p><p>Jude’s marks can be gathered into three questions for the congregation to take home: ① <strong>What is grace being preached as?</strong> Is it grace that leads people away from sin, or a “grace” that lets people sin with an easy mind (1:4)? ② <strong>Is Jesus Lord?</strong> Do we want him only as Saviour, or do we also let him be “our only Master” (1:4)? ③ <strong>Is this person, this group, building up or tearing down?</strong> Are they “building up yourselves on your most holy faith” (1:20), or are they “those who cause divisions” (1:19), “shepherds who … feed themselves” (1:12)?</p><p>These three questions: <strong>ask yourself first, then the pulpit, and only last other people</strong>. Verse 8, “Yet in the same way, these also in their dreaming,” reminds us that the examples are a mirror, not a telescope. Nor may “despise authority” in verse 8 be used to silence legitimate questioning of church leaders — those condemned in verse 12 are precisely the “shepherds who … feed themselves,” and this reminds us of “Woe to the shepherds of Israel who feed themselves!” (Ezek 34:2). When the church really does face erroneous teaching, deal with it in proper order through the elders, deacons and co-workers — searching the Scriptures and admonishing face to face — rather than putting labels on people in public.</p>"],["[4] Should this affect your faith?","","<p>Knowing that there may be people in the church who “crept in secretly” should not lead you to suspect everyone from now on. Jude did not write this letter so that his readers would live in suspicion and fear, but so that they would stand firm in God’s love: he spends more than ten verses describing “these men,” then with one phrase, “But you, beloved” (1:20), turns the camera back.</p><p>If you have ever been labelled, called “false,” please know that Jude gave no one such authority. <strong>The best way to deal with error is not to study error, but to remain in God’s love.</strong> Those who can tell true from false are those who know the True One well.</p>"]],"con":[],"say":"Where these notes stand for the whole book: we carry over the 2 Peter Study Notes’ whole-book position “Discerning false teaching: marks, not a list of names; the interpretation of Scripture and the freedom to read it” — what Jude gives are marks (1:4, 8, 11, 12, 16, 19); the pulpit teaches marks and gives no list of names; the marks are first a mirror for ourselves (1:8, “Yet in the same way, these also in their dreaming”); we name no one today, and do not use verse 8 to silence legitimate questioning of leaders (1:12; Ezek 34:2).","care":"In the pews there will be people who have been labelled “false” or “heretic” in church; people who were carried off by erroneous teaching for a time and, since coming back, have always feared being looked down on; and people who have already made up their minds about some speaker or church and are waiting for the pulpit to name him for them. Pastors should let the first two groups know that Jude gave no one the authority to name names, and that they are welcomed back to the love feast; with the third, gently turn the mirror of verse 8 back around. Do not insinuate anything about anyone from the pulpit, and do not apply “crept in secretly” to personnel disputes within the church; if there really is erroneous teaching to deal with, handle it privately and in proper order."},{"id":"ISS00_5","t":"Kept by God and keeping ourselves: if God keeps me, why must I keep myself?","r":"1:1–24; 1:21; 1:4","ch":[],"why":"5. Held by God’s hand, dwelling in God’s love — position 5 of these notes for the whole book (carrying over the Hebrews Study Notes’ whole-book position on assurance and the 1 John Study Notes’ issue “Sin and assurance”; this volume adds verses 1, 21 and 24). The pearl of the whole letter of Jude is “keep,” τηρέω (verse 24 switches to φυλάσσω): God keeps us (1:1), we are to keep ourselves in God’s love (1:21), and God is able to keep us from stumbling (1:24). Yet the same letter also speaks of those destroyed after the exodus (1:5), the angels who did not keep their first domain (1:6), and, in verse 4, those “long ago written about for this condemnation.” The question believers with sensitive consciences most often ask here is: Could I fall away too? Have I been condemned in advance? This question must put assurance and responsibility back in their proper places.","pos":[["[1] What the text is asking","","<p>Jude places “keep” at the head, the middle and the end of the letter. At the opening: “kept for Jesus Christ” (1:1); the Greek τετηρημένοις is a perfect passive — being kept is something that has already happened and goes on being in force, something done for us by another. In the middle: “Keep yourselves in God’s love” (1:21); τηρήσατε is an imperative, the only command in the whole letter telling us to keep; what is to be kept is not our own performance, but this position, “in God’s love.” At the end: “Now to him who is able to keep them from stumbling, and to present you faultless before the presence of his glory in great joy, to God our Savior” (1:24–25; the Chinese Union Version reads ‘keep you’); φυλάξαι means to guard, to keep watch over, and ἀπταίστους means without stumbling.</p><p>Yet the same letter also writes that the Lord “afterward destroyed those who didn’t believe” (1:5), and that angels “didn’t keep their first domain” (1:6). And verse 4 says that some were “long ago written about for this condemnation” (the Chinese Union Version: ‘ordained of old’); the Greek προγεγραμμένοι means “written down beforehand.” <strong>So the text is asking: If God keeps us, why must we keep ourselves? Are those examples saying believers can lose their salvation? Is “long ago written about” saying that some people are destined from birth for perdition?</strong></p>"],["The perseverance of the saints view (the Calvinist tradition: true believers will surely be kept to the end)","","<p>The Reformed tradition stresses that those who are truly called, God will surely keep to the end. The Lord said, “no one will snatch them out of my hand” (John 10:28); Paul said, “he who began a good work in you will complete it” (Phil 1:6). The opening and close of Jude form exactly this frame: already kept (1:1), and surely to be kept from stumbling (1:24). The command of verse 21 is the response that those who are kept will inevitably make, not an extra condition added on; the examples of verses 5–6 refer to people who were outwardly in the community but inwardly never truly believed.</p><p><strong>Difficulty: </strong>read carelessly, the warnings can seem not to be addressed to believers at all, and assurance can easily become a reason to sin with an easy mind — which is exactly the danger of verse 4, “turning the grace of our God into indecency.” On the other hand, sensitive people may go the opposite way and keep asking, “Am I one of those who never truly believed?”</p>"],["The possibility of falling away view (the Arminian tradition: believers can leave)","","<p>The Arminian and Wesleyan traditions stress that God’s keeping is real, but not without regard to human response; if a person persists in unbelief and deliberately departs, he may lose the grace he received. They point out that verse 21 is a real command, and that the people of verse 5 were truly “saved” out of Egypt, yet were later destroyed because of unbelief; Hebrews also says, “For we have become partakers of Christ, if we hold the beginning of our confidence firm to the end” (Heb 3:14). The strength of this view is that it takes warnings and responsibility seriously.</p><p><strong>Difficulty: </strong>verse 24 places the outcome in the hands of God, “him who is able to keep,” not in our perseverance; if assurance depends on whether we have kept well enough, a sensitive conscience will never find rest. Moreover, this school also agrees that losing grace comes not from one fall or one season of doubt, but from persistent, deliberate departure — and this is often lost in the preaching.</p>"],["The warnings-as-means-of-keeping view (God keeps people by warning them)","","<p>In recent years many scholars have proposed a third reading: warnings do not predict who will fall away; they are one of the means by which God keeps his people. Like a roadside sign reading “Cliff — danger,” the sign itself is the guardrail that keeps people from falling. God keeps us (1:1, 24), and the means he uses include examples (1:5–7), commands (1:21), the community rescuing one another (1:22–23), and reminders: “Now I desire to remind you” (1:5). The Lord said to Peter, “but I prayed for you, that your faith wouldn’t fail” (Luke 22:32); keeping and reminding are two sides of the same thing.</p><p><strong>Difficulty: </strong>this reading is sometimes criticised for evading the question “can true believers lose their salvation?”; and to an extremely sensitive conscience, “a warning is a guardrail” may still be heard as a threat. It needs to be paired with a clear gospel and gentle pastoral care.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: assurance rests on God’s hand; responsibility is to dwell in his love.</strong> We carry over the Hebrews Study Notes’ whole-book position on assurance and the 1 John Study Notes’ issue “Sin and assurance”; the three traditions are set out side by side, and we do not adjudicate denominational disputes from the pulpit. Jude’s own order is: God keeps first (1:1) → we respond and dwell in his love (1:21) → God keeps to the end (1:24). Verse 21 is not “keep yourselves so that God will love you”; it is “Keep yourselves in God’s love” — the love is already there; what we must do is not leave it. These notes adopt the reading “warnings are a means of keeping”: the examples of verses 5–7 are a guardrail, not a verdict.</p><p><strong>Verse 4, “long ago written about for this condemnation,” pronounces sentence on no one.</strong> προγεγραμμένοι means “written down beforehand” — the Old Testament and Enoch’s prophecy (1:14–15) had long ago written down the end of people like this; Jude is saying that the end of such conduct was recorded long ago, not that there is a list and certain people are destined from birth for perdition. These notes do not use this verse to create the fear “Have I been condemned in advance?”; whenever verse 4 is preached, verse 1, “kept for Jesus Christ,” and verse 24, “him who is able to keep them from stumbling,” are preached with it.</p><p>This reminds us: <strong>those who would not keep their proper place are kept in chains; those who are willing to keep themselves in God’s love are kept by God’s hand.</strong> An overcomer is not someone who never stumbles, but someone who is held.</p>"],["[4] Should this affect your faith?","","<p>Theological traditions have long disagreed over whether believers can lose their salvation, and this should not shake your faith; whichever tradition one stands in, all agree: God’s keeping is real, human response matters, and one fall or one season of doubt is not the same as departure.</p><p>If you often fear that you have been “condemned in advance,” please hear this: <strong>those who are afraid of leaving God are precisely those who still care about God.</strong> Jude did not write to make you count whether you have kept well enough, but to make you lift your eyes to the Lord “who is able to keep them from stumbling” (1:24). “These things I have written to you who believe in the name of the Son of God, that you may know that you have eternal life” (1 John 5:13).</p>"]],"con":[],"say":"Where these notes stand for the whole book: we carry over the Hebrews Study Notes’ whole-book position on assurance and the 1 John Study Notes’ issue “Sin and assurance”; this volume adds verses 1, 21 and 24 — God keeps us (1:1, 24), and we keep ourselves in God’s love (1:21); assurance rests on God’s hand, and responsibility is to dwell in his love. The perseverance of the saints, the possibility of falling away, and warnings as a means of keeping are set out side by side, and we adopt the last reading; “long ago written about” in verse 4 means “written down beforehand,” and pronounces sentence on no one.","care":"In the pews there will be people with especially sensitive consciences who often wonder whether they have been condemned in advance; people who have fallen and feel they are exactly “those who didn’t believe” in verse 5; and people who treat assurance as a reason to sin with an easy mind. With the first two, pastors should first read verses 1 and 24, and read 1 John 5:13 with them, so that they know their fear shows they still care; with the third, gently point to verse 4, “turning the grace of our God into indecency.” Do not use verse 4 or verse 5 to frighten people into staying in church, and do not tell anyone, “You may be one of the condemned”; if anxiety is already affecting sleep and daily life, follow up with them individually after the meeting, and where necessary help them seek professional help."},{"id":"ISS00_6","t":"Scripture quoting non-canonical books: what does it mean that Jude cites the Assumption of Moses and 1 Enoch?","r":"1:9–15; Acts 17:28; Titus 1:12","ch":[],"why":"6. What is inspired is the letter of Jude, not the books it quotes — a general question for the whole book. Jude is the New Testament book that most obviously quotes non-canonical writings: in verse 9 Michael disputes with the devil over the body of Moses, which early church fathers say comes from the Assumption of Moses; Enoch’s prophecy in verses 14–15 is very close to 1 Enoch 1:9. This has led to two opposite misuses: some have raised the non-canonical writings to the level of Scripture and built a whole angelology from them; others have used it to belittle Jude, saying it is not fit to be Scripture. The early church also hesitated over it. This question must make clear the principles of quotation.","pos":[["[1] What the text is asking","","<p>The first instance: “But Michael, the archangel, when contending with the devil and arguing about the body of Moses, dared not bring against him an abusive condemnation, but said, ‘May the Lord rebuke you!’” (1:9). The Old Testament says only that Moses died in the land of Moab, “but no man knows where his tomb is to this day” (Deut 34:6), and mentions no such dispute. Early church fathers such as Clement of Alexandria and Origen say this story comes from a work called the Assumption of Moses; the surviving Latin manuscript is incomplete at the end and lacks exactly this section, so the details cannot be fully checked.</p><p>The second instance: “About these also Enoch, the seventh from Adam, prophesied, saying, ‘Behold, the Lord came with ten thousands of his holy ones, to execute judgment on all …’” (1:14–15). These words are very close to 1 Enoch 1:9; this book circulated widely among Jews in the Second Temple period, and Aramaic fragments of it have been found among the Dead Sea Scrolls. Genesis says of Enoch only, “Enoch walked with God, and he was not found, for God took him” (Gen 5:24). <strong>So the text is asking: Does Jude’s quoting of these books mean he treated them as Scripture? How should we regard these books — and how should we regard Jude?</strong></p>"],["The endorsement view (Jude treated these books as Scripture)","","<p>Some think that Jude’s use of the word “prophesied” (1:14) in quoting Enoch shows that he regarded 1 Enoch as an authoritative scripture. The early church father Tertullian argued on the ground of Jude for accepting the authority of the Book of Enoch; and to this day the Bible of the Ethiopian Orthodox Church includes 1 Enoch and Jubilees. The strength of this view is that it takes the word “prophesied” seriously, rather than passing over it lightly.</p><p><strong>Difficulty: </strong>when Jude quotes, he does not use the formula common when the New Testament quotes the Old, “it is written”; and the word “prophesied” can simply mean that the saying is true. When Paul quotes a poet of the Cretans’ own, he too calls the man “a prophet of their own,” and then says, “This testimony is true” (Titus 1:13) — Paul is clearly not listing that poet’s work as Scripture. Moreover, the great majority of church traditions (and the Jews themselves) have never included 1 Enoch in the canon.</p>"],["The illustration view (quoting traditions familiar to the readers as illustrations)","","<p>Another school holds that Jude’s readers were familiar with these traditions, and the other side may also have been using these books; so Jude used stories they knew as illustrations, just as a preacher quotes a well-known saying to explain a point. In Athens, Paul too quoted Greek poets: “For we are also his offspring” (Acts 17:28) — he was not endorsing the whole poem, but using a line familiar to his hearers to point to the true God.</p><p><strong>Difficulty: </strong>if it were merely an “illustration,” why does Jude specifically say that Enoch “prophesied”? The example of Michael in verse 9 is also central to his whole argument, not mere decoration. Calling the quotations mere rhetoric gives the impression that Jude did not really believe what he quoted, and that does not fit the tone of the text either.</p>"],["The true-saying view (the sentence quoted is true; the book itself is not canonical)","","<p>A third view is that Jude, under the inspiration of the Holy Spirit, took one true saying from these books — that Michael left judgement to the Lord, and that the Lord will surely come with his holy ones to judge the ungodly — and that what he affirms is the content of this sentence, not every word of the whole book. This is exactly what Paul does in Acts 17:28 and Titus 1:12; the New Testament also quotes traditions not recorded in the Old Testament — for example, Paul mentions “Jannes and Jambres,” who opposed Moses (2 Tim 3:8).</p><p><strong>Difficulty: </strong>this school has to answer: how do we know which sentence is true and which is not? The answer is: only the sentence that the letter of Jude (inspired Scripture) affirms do we know for certain to be true; the rest of those books does not receive the same guarantee just because one sentence was quoted. This also means we cannot dig further “truths” out of those books.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: what is inspired is the letter of Jude, not the books it quotes; Jude’s quoting of one true saying does not mean he endorses the whole book</strong> (this reminds us of Paul quoting Greek poets, Acts 17:28; Titus 1:12). These notes adopt the true-saying view, with the illustration view usable alongside it; the endorsement view is set out alongside, with its difficulties explained. The Ethiopian church’s canon follows a different tradition; these notes describe it plainly, without mocking it, and without adopting it.</p><p>From this come three principles for the pulpit: ① <strong>do not build an extra angelology from non-canonical writings</strong> — in Jude, Michael teaches us only one thing: do not slander, and leave judgement to the Lord; do not supplement from 1 Enoch with angels’ names, ranks and stories. ② <strong>do not use this to belittle Jude</strong> — tell the early hesitation plainly (see “Author, recipients and canonical status: who is “Jude, brother of James”? How was this letter received into the canon?”), but the church in the end recognised it as the word of God. ③ <strong>read the text from the pulpit in the Chinese Union Version, and give the sources in the notes on the Greek</strong>, saying “early church fathers say” or “scholars think,” not presenting the sources as settled, and not encouraging the congregation to look for new revelation in non-canonical writings.</p>"],["[4] Should this affect your faith?","","<p>Knowing that the Bible quotes books outside the Bible should not shake your faith; rather, it lets you see that God’s inspiration does not pluck the writer out of his own time, but uses the language, stories and traditions he knew to say what God wants to say.</p><p>But this question also protects you: if someone says, “The books Jude quoted are Scripture too, and there are more secrets in them,” you can gently say: <strong>what is inspired is the letter of Jude.</strong> The Bible in our hands is already enough — “the faith which was once for all delivered to the saints” (1:3): once is enough; nothing needs to be added.</p>"]],"con":[],"say":"Where these notes stand for the whole book: verse 9 comes from the Assumption of Moses (as the early church fathers say; the surviving text lacks this section), and verses 14–15 quote 1 Enoch 1:9; what is inspired is the letter of Jude, not the books it quotes, and quoting one true saying does not mean endorsing the whole book (Acts 17:28; Titus 1:12). The endorsement, illustration and true-saying views are set out side by side, and we adopt the true-saying view; we describe the Ethiopian church’s canon plainly; we do not build an angelology from non-canonical writings, nor use this to belittle Jude.","care":"In the pews there will be elderly believers who are startled the moment they hear “the Bible quotes non-canonical writings,” and think something is wrong with the Bible; young people who have come across claims online about “the hidden Bible” or “the secrets of the Book of Enoch” and are fascinated by them; and brothers and sisters from different church traditions with different understandings of the extent of the canon. With the first, pastors should reassure them, letting them see that Paul quotes in the same way; do not mock the second, but walk with them back to the faith “once for all delivered” of 1:3; with the third, explain respectfully where these notes stand. Do not speak of the non-canonical writings as forbidden books and so create an air of mystery, and do not preach new angel stories from them."},{"id":"ISS00_7","t":"Angels, the devil and spiritual warfare: how does Jude want us to see the unseen world?","r":"1:6–9; Zech 3:2; Eph 6:12","ch":[],"why":"7. The unseen world is real, but the focus is not there — a general question for the whole book (carrying over the Ephesians Study Notes’ whole-book position on spiritual warfare; this volume adds verses 6 and 9). In just twenty-five verses, Jude has the angels who did not keep their first domain (1:6), the dispute between Michael the archangel and the devil (1:9), and “slander celestial beings” (1:8). These verses are often used in two extreme ways: one treats them as material for building an angelology and demonology, even turning “rebuking the devil” into a performance in meetings; the other simply treats them as ancient myth and dares not touch them. This question must make clear what Jude actually wanted his readers to learn by writing these things.","pos":[["[1] What the text is asking","","<p>Verse 6: “Angels who didn’t keep their first domain, but deserted their own dwelling place, he has kept in everlasting bonds under darkness for the judgment of the great day” (1:6). “First domain,” ἀρχή, is the position assigned, the sphere of rule; “dwelling place,” οἰκητήριον, is the dwelling allotted. Who these angels are, and when they sinned, Jude does not say in detail; he says only that the judgement is certain. Verse 9: Michael the archangel disputed with the devil over the body of Moses, and “dared not bring against him an abusive condemnation, but said, ‘May the Lord rebuke you!’” (1:9). Elsewhere in Scripture, Michael is the angel who protects God’s people (Dan 10:13; Dan 12:1), and in Revelation “Michael and his angels made war on the dragon” (Rev 12:7).</p><p><strong>So the text is asking: Who are the angels of verse 6? What does Michael in verse 9 teach us? How should believers regard the devil and spiritual warfare — may we “rebuke the devil”? And how should we go about it?</strong></p>"],["Three readings of verse 6 (the sons of God of Gen 6 / the original fall / the two kept separate)","","<p><strong>① The “sons of God” of Gen 6.</strong> “God’s sons saw that men’s daughters were beautiful, and they took any that they wanted for themselves as wives” (Gen 6:2); Jews of the Second Temple period (including 1 Enoch) commonly read these “sons of God” as angels. Supporters point out that verse 7 says Sodom, “in the same way as these,” went after “strange flesh,” forming a parallel with verse 6. Difficulty: the Lord said that in the resurrection people “neither marry, nor are given in marriage, but are like God’s angels in heaven” (Matt 22:30), which makes many hesitate over whether angels could marry humans; and this reading depends heavily on the background of non-canonical writings.</p><p><strong>② The original fall.</strong> This refers to Satan and the angels who followed him rebelling against God at the beginning. Difficulty: Scripture actually describes this fall directly very little, and verse 6 says they have already been “kept … under darkness,” which needs to be reconciled with other New Testament passages where the devil still “walks around like a roaring lion” (1 Pet 5:8).</p><p><strong>③ The “sons of God” of Gen 6 are the descendants of Seth, and verse 6 refers separately to the fall of angels.</strong> This has been the reading of many churches since Augustine. Difficulty: read this way, the parallel between verse 6 and verse 7, “in the same way as these,” is weakened. Each of the three readings has its grounds, and each has its difficulties.</p>"],["The power-encounter view (believers should actively rebuke and bind evil spirits)","","<p>Some churches stress the active side of spiritual warfare: believers have authority in the Lord’s name and should rebuke the devil and bind evil spirits in prayer, even identifying the evil spirits over particular regions and calling out their names. They cite the Lord Jesus’ casting out of demons, and also “Resist the devil, and he will flee from you” (Jas 4:7). The strength of this view is that it takes the reality of the spiritual world seriously, and does not shrink faith into a set of morals.</p><p><strong>Difficulty: </strong>verse 9 is precisely the cautionary counter-example: even the archangel, facing the devil, did not presume to pronounce sentence, but said only, “May the Lord rebuke you!” If even Michael did not overstep his place, it is hard to say that believers who loudly revile the devil in meetings and make all kinds of declarations against him are following this example. Second Peter also says, “angels, though greater in might and power, don’t bring a railing judgment against them before the Lord” (2 Pet 2:11). The sentence before James’s “Resist” is “Be subject therefore to God” (Jas 4:7) — the power to resist comes from submission, not from volume.</p>"],["The demythologising view (angels and demons are merely ancient symbols)","","<p>Another reading holds that angels and demons are the symbolic language the ancients used to express good and evil, and that modern people should read them as psychological, social or structural evil. The strength of this view is that it reminds us that evil really does also exist in the form of institutions, cultures and group pressure, and that not every problem can be blamed on demons.</p><p><strong>Difficulty: </strong>Jude and the other New Testament writers clearly treated spiritual beings as real: “For our wrestling is not against flesh and blood, but against the principalities, against the powers, against the world’s rulers of the darkness of this age, and against the spiritual forces of wickedness in the heavenly places” (Eph 6:12). To demythologise them all is to lose the text’s own horizon, and to lose the truly reigning Lord who stands behind “May the Lord rebuke you!”</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: we carry over the Ephesians Study Notes’ whole-book position on spiritual warfare — the spiritual world is real, but the focus is on Christ’s victory, not on the details of the devil; the way to wage war is to stand firm, with truth, righteousness, faith, the word of God and prayer.</strong></p><p>This volume adds two points: <strong>the three readings of verse 6 are set out side by side, without a verdict</strong>; the point of verse 6 is that not even angels who did not keep their proper place escaped judgement — the judgement is certain. This reminds us of what 321 says, “pride is leaving our proper place and grasping power”; but this is an association made after the text has been expounded, not a claim that this verse proves 321. <strong>In verse 9 Michael dared not slander</strong>: facing real evil, the believer’s posture is to hand judgement back to the Lord, and this reminds us of “Yahweh rebuke you, Satan!” (Zech 3:2).</p><p>From this come principles for the pulpit: ① do not build an extra angelology from non-canonical writings (see also “Scripture quoting non-canonical books: what does it mean that Jude cites the Assumption of Moses and 1 Enoch?”); ② <strong>do not make “rebuking the devil” a performance</strong> — prayer may ask the Lord, in his name, to rebuke, but without shouting, reviling, or performative declarations; ③ do not attribute every illness, emotion and difficulty to demons, nor deny the spiritual reality; ④ the focus is on the Lord “who is able to keep them from stumbling” (1:24), not on the darkness.</p>"],["[4] Should this affect your faith?","","<p>Scholars differ over who the angels of verse 6 are, and where the story of verse 9 comes from, and this should not shake your faith. Every view agrees: God’s judgement is certain, spiritual evil is real, and Christ has already won.</p><p>If you have ever been frightened by talk of spiritual warfare — afraid to turn off the light at night, feeling that there is a demon behind every bad thing — please hear this: <strong>Jude writes about angels and the devil not to make you afraid of the darkness, but to make you see clearly who reigns.</strong> Even the archangel said only, “May the Lord rebuke you!”; you do not have to carry this battle on your own shoulders either. Your place is in God’s love (1:21), and there you are safe.</p>"]],"con":[],"say":"Where these notes stand for the whole book: we carry over the Ephesians Study Notes’ whole-book position on spiritual warfare — the spiritual world is real, and the focus is on Christ’s victory. This volume adds: the three readings of the angels who did not keep their first domain in verse 6 (the sons of God of Gen 6 / the original fall / the two kept separate) are set out side by side without a verdict, the point being that the judgement is certain; in verse 9 Michael dared not slander, but left judgement to the Lord (Zech 3:2; 2 Pet 2:11). We do not build an angelology from non-canonical writings, and do not make “rebuking the devil” a performance.","care":"In the pews there will be people who have had demons “cast out” of them in front of everyone at a meeting, and have been left with humiliation and fear; people suffering from depression, anxiety or other physical and mental illnesses who have been told they are “possessed”; and young people intensely curious about the spiritual world, seeking out special experiences everywhere. Pastors should let the first group know that Michael in verse 9 is precisely an example of not overstepping and not humiliating people; tell the second group clearly that illness is not demon possession, pray with them, and also help them seek medical and professional help; and bring the third group’s focus back to 1:21 and 1:24. Do not describe the details of the devil from the pulpit to create an atmosphere, and do not mock anyone’s seriousness about the spiritual world."},{"id":"ISS00_8","t":"Date and setting: when was Jude written, and who were the men who crept in?","r":"1:1–25; 1:12; 1:17–18","ch":[],"why":"8. When was Jude written? Who were the men who “crept in secretly”? — a general question for the whole book. The letter has no place names and no events by which it can be dated; its date and setting can only be inferred from its content. This question does not affect the message itself, but it does affect how readers picture that love feast: is it a group of persecutors from outside, or people already sitting at the table, eating together? A fully formed heretical system, or a climate in which grace was preached as licence? Making clear what the text says and what scholars infer is itself a demonstration of honest Bible reading, and it keeps the pulpit from pinning first-century descriptions on people today at will.","pos":[["[1] What the text is asking","","<p>The text gives few clues, but they are very concrete. These men “crept in secretly” (1:4); the Greek παρεισέδυσαν means to slip in from the side, not to attack from outside. They took part in the church’s love feasts — “These are hidden rocky reefs in your love feasts when they feast with you” (1:12). They are called “dreaming” men (1:8), perhaps claiming dreams and visions as their authority; they were “turning the grace of our God into indecency” (1:4), despised authority (1:8), flattered for gain (1:11, 16), and were “those who cause divisions” (1:19).</p><p>On the date, verses 17–18 are an important clue: “But you, beloved, remember the words which have been spoken before by the apostles of our Lord Jesus Christ. They said to you, ‘In the last time there will be mockers’” (1:17–18). The recipients had heard the apostles’ teaching with their own ears, yet the apostles’ time seems already to lie in the past. <strong>So the text is asking: Roughly when was this letter written? Who were these men — early Gnostics, or a group of itinerant teachers who preached grace as licence?</strong></p>"],["The middle date view (mid-60s to the 80s AD)","","<p>Most scholars date Jude between the mid-60s and the 80s AD. The reasons: the apostles’ teaching is already treated as “the words which have been spoken before” (1:17), yet the recipients had heard it in person (1:18) — the time of handover between the first and second generations of believers; if 2 Peter used Jude, Jude must come before 2 Peter; and Hegesippus records that when Domitian (reigned AD 81–96) summoned Jude’s grandsons, Jude himself seems no longer to have been alive, which fits this range.</p><p><strong>Difficulty: </strong>these clues are all indirect; “spoken before by the apostles” could also refer to a time when the apostles were still alive but simply not with the recipients, so some scholars argue for an earlier date, in the 50s AD. The range of dates is therefore quite wide.</p>"],["The late date view (end of the first century to the beginning of the second)","","<p>Some scholars place Jude later, linked with the pseudonymity view: “the faith which was once for all delivered to the saints” (1:3) sounds as though the faith had already been organised into fixed content; “the words which have been spoken before by the apostles” (1:17) sounds like looking back on an apostolic age that had already ended; and the profile of the opponents has been compared with the Gnostics of the second century.</p><p><strong>Difficulty: </strong>the idea of something “once for all delivered” is already present in Paul’s letters — he says, “For I delivered to you first of all that which I also received” (1 Cor 15:3) — which shows that “the content of the gospel handed down” was an early idea; verse 18, “They said to you,” shows that the recipients had heard the apostles in person, which is very hard to place in the second century. Nor does Jude show any of the complex cosmology and mythology of the second-century Gnostic systems.</p>"],["Two views of the setting (early Gnostic tendencies / libertine itinerant teachers)","","<p><strong>① Early Gnostic tendencies.</strong> Some point out that “sensual” in verse 19, ψυχικοί, was a favourite word of the later Gnostics: they called themselves “the spiritual,” and demoted ordinary believers to “the soulish”; Jude turns this label back on them, saying that they are the ones who are “sensual, not having the Spirit.” If so, the opponents may already have had a tendency to regard themselves as a spiritual elite, and to look down on the body and on morality.</p><p><strong>② Libertine itinerant teachers.</strong> Another, more conservative view: these were teachers moving between house churches in various places, who misunderstood grace and freedom, thinking that after salvation it no longer mattered what they did with their bodies; they used dreams and visions to raise their own authority, and lived off the churches’ provision. This reminds us that Paul too faced the misunderstanding, “Shall we continue in sin, that grace may abound?” (Rom 6:1). <strong>Difficulty: </strong>the first view can easily read the mature second-century system back into the first century; the portrait in the second view is also reconstructed backwards from the text, and its details are hard to establish.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: on the date we follow most scholars — between the mid-60s and the 80s AD; the earlier and later views are set out alongside, and no exegetical conclusion is built on them. The setting is most likely this: a group of itinerant teachers came into the love feasts of the house churches and preached grace as licence.</strong> They may have had certain early Gnostic tendencies, but these notes do not over-determine this, and do not read the second-century system back into Jude. From the pulpit we say “scholars think,” not “the text says.”</p><p>The most important stroke in this picture is this: <strong>they were not persecutors from outside, but people already sitting at the table.</strong> The love feast was the church’s most intimate moment, and the hidden reefs lay right there (1:12). This is not to make us suspect those around us at every church meal, but to remind us: grace is often distorted not by an attack from outside, but by a slow drift out of shape in the warmest of places.</p><p>The setting is read through the three questions for a letter: ① What were the recipients facing? There were people at the love feasts preaching grace as licence. ② What principles does Jude draw from the gospel? Contend for the faith once for all delivered; see clearly the end of those who did not keep their proper place; keep yourselves in God’s love; show mercy and rescue. ③ Where does that principle land today? In small groups, fellowships, online gatherings — every place where people are gathered round a table.</p>"],["[4] Should this affect your faith?","","<p>No. The dates of many New Testament books are discussed; this is the normal state of historical research, not a hole in the Bible; Jude’s message does not depend on a fixed year to stand.</p><p>But this question can make you treasure more the table where you sit: <strong>the love feast is God’s gift to the church, and so it is worth guarding.</strong> Jude did not tell his readers to disband the love feasts; he told them, “keep building up yourselves on your most holy faith” (1:20), building one another up. The best way to guard a table is not to shut the door tight, but to help everyone at the table know that Lord better.</p>"]],"con":[],"say":"Where these notes stand for the whole book: on the date we follow most scholars — between the mid-60s and the 80s AD, with the earlier and later views set out alongside; the setting is most likely a group of itinerant teachers who came into the love feasts of the house churches (1:12) and preached grace as licence (1:4). The early Gnostic tendency view and the libertine view are set out side by side, without over-determining; they were not persecutors from outside, but people already sitting at the table.","care":"In the pews there will be new believers who think the Bible cannot be trusted the moment they hear “scholars dispute the date”; people wh
