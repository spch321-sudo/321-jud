hold in custody,” “reserve”), the Greek has a single word, used five times in the letter, with φυλάσσω added in verse 24. This is the pearl of Jude: who keeps whom is the thread running through the whole letter","ins":"At the first stop, the letter opens by telling us who we are: “kept for Jesus Christ” (1:1) — τετηρημένοις is a perfect passive participle: before we try to keep hold of anything, we have already been kept, and we go on being kept. The second stop is the reverse: angels “who didn’t keep their first domain” (1:6, μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχήν) — the same word; they would not keep the place God had assigned them. The third stop is the first reversal: those who would not keep their place God “has kept in everlasting bonds” (1:6, τετήρηκεν) — those who will not keep their own position end up kept in chains; and the fourth stop states the end in full: “for whom the blackness of darkness has been reserved forever” (1:13, τετήρηται). At the fifth stop the camera turns back to us: “Keep yourselves in God’s love” (1:21, τηρήσατε) — the only command in the letter that tells us to keep, and what we are to keep is not a set of rules but a place: the love of God. The sixth stop is the second reversal, and the destination of the whole letter: “to him who is able to keep them from stumbling” (1:24, φυλάξαι) — in the end, the One who keeps us is he. It begins with being kept and it ends with being kept; the “keep yourselves” in between means living inside a pair of hands that have already taken hold of you.","stops":[["1:1","kept for Jesus Christ","top"],["1:6","Angels who didn’t keep their first domain",""],["1:6","he has kept in everlasting bonds under darkness",""],["1:13","for whom the blackness of darkness has been reserved forever",""],["1:21","Keep yourselves in God’s love","top"],["1:24","able to keep them from stumbling","top"]]},{"gk":"ἀσεβής／ἀσέβεια／ἀσεβέω","tr":"asebēs / asebeia / asebeō","gl":"ungodly, ungodliness","code":"G765","root":"ἀσεβής — ungodly, without reverence; the root σέβομαι means “to worship, to revere,” and the prefix ἀ- negates it. The word family appears six times in the letter, four of them crowded into the single verse 15. Jude paints “these men” in many pictures, but they come down to one thing: no fear of God","ins":"The first stop is the diagnosis: the men who crept in are “ungodly men” (1:4) — before describing what they do, Jude names what they lack: reverence for God. At the second stop, Enoch’s prophecy uses the word three times in one breath: “to convict all the ungodly of all their works of ungodliness which they have done in an ungodly way” (1:15) — ungodly people, ungodly deeds, and even “done” is ἠσέβησαν, “done in an ungodly way.” The third stop lands on the mouth: “and of all the hard things which ungodly sinners have spoken against him” (1:15) — ungodliness shows not only in deeds but in speech: hard, defiant words against God (this reminds us of the grumbling and proud words of verse 16). The fourth stop carries it into the last time: “mockers, walking after their own ungodly lusts” (1:18) — those who do not fear God end up mastered by their own desires. This thread is the mirror image of godliness: godliness is not a set of outward rules but reverence for God; every dark picture in Jude grows from this one root — no fear of God.","stops":[["1:4","ungodly men",""],["1:15","to convict all the ungodly of all their works of ungodliness","top"],["1:15","all the hard things which ungodly sinners have spoken against him",""],["1:18","walking after their own ungodly lusts",""]]},{"gk":"ἔλεος／ἐλεάω","tr":"eleos / eleaō","gl":"mercy, have mercy","code":"G1656","root":"ἔλεος — mercy, compassion: the heart moved and the hand stretched out towards someone in need; ἐλεάω is its verb. Four times in the letter: the first two are mercy we receive, the last two are mercy we give","ins":"The first stop is in the greeting: “Mercy to you and peace and love be multiplied” (1:2) — Jude’s greeting puts mercy first, which is not common in the greetings of New Testament letters; about to write his sternest letter, he first asks that mercy be “multiplied” to those who will read it. The second stop is waiting: “looking for the mercy of our Lord Jesus Christ to eternal life” (1:21) — even those who keep themselves in the love of God do not stand to the end by their own strength; they look for mercy. The third stop is the first reversal: “On some have compassion” (1:22; the Chinese Union Version reads “Some doubt; have mercy on them”) — those who have received mercy now become those who give it; faced with someone wrestling inside, the first verb is not “refute” but “have mercy.” The fourth stop adds a sense of proportion: in the Chinese Union Version, “on some have mercy with fear” (1:23; the World English Bible reads “and some save, snatching them out of the fire with fear”) — mercy is not naivety; while rescuing others we must take care not to be dragged down ourselves. Receiving, waiting, giving, and giving with care: only someone who knows they live by mercy can give mercy. The Jude who wrote this once did not believe in his own brother (this reminds us of John 7:5).","stops":[["1:2","Mercy to you and peace and love be multiplied",""],["1:21","looking for the mercy of our Lord Jesus Christ to eternal life","top"],["1:22","On some have compassion","top"],["1:23","snatching them out of the fire with fear",""]]},{"gk":"ἀγαπητός／ἀγάπη ↔ οὗτοι","tr":"agapētos / agapē ↔ houtoi","gl":"beloved, love ↔ these men","code":"G27","root":"ἀγαπητοί — beloved, dearly loved: Jude’s way of addressing his readers; ἀγάπη — love, and also the early church’s love feast. On the other side stands οὗτοι — “these men,” six times in the letter. The two groups alternate through the letter: when Jude writes “these men” he is cold; when he writes “beloved” he is warm","ins":"At the first stop, the readers are those “sanctified by God the Father” (1:1; the Greek here reads “loved in God the Father,” as the Chinese Union Version has it) — their identity begins with love. At the second stop, Jude calls them “Beloved” (1:3), and then says he has had to write a letter urging them to contend: the stern words are spoken inside a term of love. At the third stop the other group appears: “these also in their dreaming” (1:8) — from verse 8 to verse 19, “these” rings out like a bell, struck again and again. At the fourth stop the two groups sit at the same table: “These are hidden rocky reefs in your love feasts” (1:12) — the love feast was the place where brothers and sisters loved one another, and the reef was hidden right there. The fifth stop is the last appearance of “these”: “These are those who cause divisions and are sensual, not having the Spirit” (1:19). The sixth stop is the turning point of the letter: “But you, beloved, keep building up yourselves” (1:20, Ὑμεῖς δέ, ἀγαπητοί) — the camera swings from “these” back to “you”; Jude spends twelve verses describing others and only two telling us what to do. The seventh stop is the place itself: “in God’s love” (1:21). The beloved are called beloved, and in the end are told to live in the love of God — the best answer to error is not to study error, but to remain in the love of God.","stops":[["1:1","sanctified by God the Father",""],["1:3","Beloved",""],["1:8","these also in their dreaming",""],["1:12","These are hidden rocky reefs in your love feasts",""],["1:19","These are those who cause divisions and are sensual, not having the Spirit",""],["1:20","But you, beloved, keep building up yourselves","top"],["1:21","in God’s love","top"]]}],"lesson":{"1":{"no":1,"vol":"321 Jude Study Notes · Lesson 1 · Jude 1","title":"Able to Keep You from Stumbling — Contend, Beware, Keep","chars":4691,"min":60,"deep":8,"dchars":1443,"tchars":1268,"blocks":[["h","1. The Second Frozen in Mid-Air"],["p","Brothers and sisters, peace to you. Please freeze a picture with me. An indoor climbing gym in Kuala Lumpur, four o’clock on a Saturday afternoon. Brother Jianming, forty-six years old, has climbed to about seven metres off the ground. His right foot is on a hold no wider than two fingers. He reaches up and falls just short; his foot slips, and his whole body comes off the wall. Please freeze the picture at this second: he does not fall. He hangs in mid-air, the rope pulled taut, his face turned toward the ground."],["p","On the ground stands Guoliang, a brother from the same small group, belaying him today. The rope runs from the knot at Jianming’s waist up through the steel ring at the top, then back down into the belay device in Guoliang’s hands. From the moment Jianming left the ground, Guoliang’s hands have not left the rope, and his eyes have not left Jianming. The foot slips; Guoliang sits back, and the rope locks. Afterwards Jianming said: in that moment I had no time to do anything. By the time I came to myself, I was already hanging on the rope."],["p","There is a letter in the New Testament that ends at exactly this second: “Now to him who is able to keep them from stumbling, and to present you faultless before the presence of his glory in great joy, to God our Savior, who alone is wise” (1:24–25). “From stumbling” is ἀπταίστους (aptaistous) in the Greek. It appears only once in the whole New Testament, and was used of a horse that keeps its footing, or of a person walking without tripping. The strange thing is that the twenty-three verses before it are almost all about falling: people who fell in the wilderness, angels who left their proper place, Sodom, Cain, Balaam, Korah — falling all the way into the blackness of darkness. Why does a letter full of falling end with “from stumbling”?"],["p","This letter is Jude: one chapter, twenty-five verses. According to church tradition, the Jude who wrote it is the younger brother of the Lord Jesus. In this lesson we will walk through it with three words: contend, beware, keep. And at the end we come back to this rope: whose hand has been holding us all along?"],["d",["Does “from stumbling” mean that true Christians will never fall again, never sin again?","No. ἀπταίστους means not being tripped up and crashing down; the emphasis is on being kept to the end. Jude’s elder brother James wrote, “For we all stumble in many things” (James 3:2) — in the Greek, the very same root, πταίω. A psalm also says: “He will not allow your foot to be moved. He who keeps you will not slumber.” (Psalm 121:3) The one belaying does not doze off. So verse 24 is not a guarantee of a perfect record; it is the promise of a rope: your foot will leave the hold, but you will not fall all the way. This is no excuse for indulgence, and no reason to be afraid either: it rests on his power, not on your perfection. When you slip, confess it, get back on the rope, and climb on."]],["h","2. Contend: Only Those Already Held Can Contend Cleanly"],["p","“Jude, a servant of Jesus Christ, and brother of James, to those who are called, sanctified by God the Father, and kept for Jesus Christ:” (1:1) Toward James, Jude says “brother.” Toward Jesus, he says nothing of blood ties — only “servant,” δοῦλος (doulos) in the Greek: someone who belongs to a master. What does he call his readers? Called; beloved in God the Father (so the Chinese Union Version, where WEB has “sanctified”); kept for Jesus Christ. In all three, the one acting is not the reader. It is God. “Kept” is τετηρημένοις (tetērēmenois) in the Greek, a perfect passive: the keeping has already been done, and its effect continues to this day. Just like Guoliang’s hands, which were on the rope before Jianming ever slipped. Then the blessing, “Mercy to you and peace and love be multiplied” (1:2), puts mercy first."],["p","“Beloved, while I was very eager to write to you about our common salvation, I was constrained to write to you exhorting you to contend earnestly for the faith which was once for all delivered to the saints.” (1:3) A letter forced to change its subject. “Contend earnestly” is ἐπαγωνίζεσθαι (epagōnizesthai) in the Greek, used only here in the New Testament. Its root, ἀγών (agōn), is the arena, the wrestling ring: a wrestler throwing every ounce of strength into the contest for the crown. That is a different thing from quarrelling. What we contend for is the faith once delivered — not the opponent as a person, and not my face or the distinctives of my denomination. And Jude himself shows us how: in verse 9, Michael says only, “May the Lord rebuke you!”; in verse 22, those who doubt are first shown mercy. The “once” of “once for all delivered” is ἅπαξ (hapax) in the Greek: once, and for ever. The core of the gospel has been delivered complete; no one needs to add a new page of revelation."],["p","What forced him to change the subject? “For there are certain men who crept in secretly” (1:4). The Greek παρεισέδυσαν (pareisedysan) literally means slipped in from the side: they did not come through the front door, and they are already sitting at the table of the love feast. Jude does not draw up a list of names. He gives only two marks: “turning the grace of our God into indecency, and denying our only Master, God, and Lord, Jesus Christ” (1:4). Grace is turned into a licence to sin with an easy conscience. “Master” is δεσπότης (despotēs) in the Greek, set squarely against the δοῦλος of verse 1: the writer gladly calls himself a slave, while these men deny that Master — often by the way they live. Marks are not a list of names. Hold them up to yourself first: this week, who is arranging my calendar?"],["p","“Long ago written about for this condemnation” (1:4) — the Chinese Union Version renders it ‘ordained of old to this condemnation’ — is the phrase most easily read with fear. προγεγραμμένοι (progegrammenoi) literally means written beforehand, the same word as “were written before” in Rom 15:4: Scripture wrote down long ago where this road ends. What is written down is the end of the road. Your name is not written there. If your heart tightens, afraid that you are on that page, look at the two ends of this rope: at the start, you are kept for Jesus Christ (1:1); at the end, he is the One who is able to keep you from stumbling (1:24)."],["d",["The Chinese Union Version says some were ‘ordained of old’ to this condemnation (WEB: “long ago written about for this condemnation”). Does that mean some people are born destined for perdition? Could I be one of them?","The Greek προγεγραμμένοι means written beforehand; in the New Testament it is not a technical term for predestination. Most interpreters read it like this: the Old Testament examples and Enoch’s prophecy had long ago written down the end of this kind of person; and what Jude goes on to list in verses 5 to 16 are exactly those written examples. Some read it as predestination in eternity. These notes set that reading alongside, but take the reading “written down long ago”: what is written is the end of a road, not a register of names. Jude pronounces sentence on none of his readers, and neither may the pulpit or the small group. If this question keeps you awake at night, remember the beginning and end of the letter: you are kept for Jesus Christ, and he is the One who is able to keep you from stumbling. Bring this unease before the Lord, and bring it also to a pastor you trust."]],["d",["Does “once for all delivered” mean that every new interpretation, every new song and every new way of meeting is forbidden?","No. ἅπαξ means once and for ever. It says that the core of the gospel has been delivered complete into the hands of the saints: who Christ is, what he has accomplished for us, and how people are saved through faith in him. What Jude wants to stop is the dreamers of verse 8, who want to rewrite the apostles’ gospel with their strange dreams. That does not mean that every denominational distinctive, every detail of interpretation and every form of meeting is the same thing as the faith once delivered. “Once for all delivered” guards the content, not the tools; online meetings, new translations and new songs have not, in themselves, crept in secretly. The question to ask is: does it proclaim our only Master? Does it treat grace as the power that saves people from sin, or as a licence to sin with an easy conscience?"]],["h","3. Beware: Hold the Photographs Up to Yourself First, Then Look at the End of the Road"],["p","“Now I desire to remind you, though you already know this” (1:5). Jude sets out three photographs. The first: the Lord saved a people out of Egypt, and afterward those who did not believe fell in the wilderness (some ancient manuscripts read “Jesus” — see the issue page). This is a picture of people who had been saved, so hold it up to yourself first. The second: “Angels who didn’t keep their first domain, but deserted their own dwelling place, he has kept in everlasting bonds under darkness for the judgment of the great day.” (1:6) Interpreters read the identity of these angels in three ways, and the issue page sets them side by side; but what this verse itself says is clear. “First domain” — in the Chinese Union Version, “proper place” — is ἀρχή (archē) in the Greek: the post God assigned. Even when angels desert their posts, judgement is certain. That is all verse 6 means. This reminds us of what 321 says: pride is leaving our proper place and grasping power."],["p","The third is Sodom and Gomorrah. What the Chinese Union Version calls ‘unnatural lust’ is literally going after other flesh (WEB: “strange flesh”). Some read it as same-sex sexual acts, some as crossing the line between humans and angels, and some say both are included: crossing the boundaries God has set for sex. The boundaries God has set for sex — we hold to them, and we do not skip this verse. Yet when Ezekiel lists the sins of Sodom, the first is not sexual: “pride, fullness of bread, and prosperous ease was in her and in her daughters. She also didn’t strengthen the hand of the poor and needy.” (Ezekiel 16:49) This verse was never meant for mocking anyone. After Paul lists the sins in 1 Corinthians 6, his next sentence is: “Some of you were such, but you were washed.” (1 Corinthians 6:11) If you are struggling with sexual temptation right now, yet in your heart you want to follow the Lord, this sentence is written for you: behind the photograph there is a road home."],["p","“Yet in the same way, these also in their dreaming defile the flesh, despise authority, and slander celestial beings.” (1:8) “In the same way” — the photograph has become a mirror. “Authority” is mostly taken to mean the Lord’s authority, and “celestial beings” mostly to mean angels; this sentence cannot be used to shut down proper questions put to leaders. Then comes the quietest scene in the whole letter: “But Michael, the archangel, when contending with the devil and arguing about the body of Moses, dared not bring against him an abusive condemnation, but said, ‘May the Lord rebuke you!’” (1:9) The early church fathers said this account comes from the Assumption of Moses. What is inspired is the letter of Jude; quoting a tradition does not make that book Scripture too. The archangel did not pronounce sentence on God’s behalf; but these men “speak evil of whatever things they don’t know” (1:10)."],["p","Then come three roads: “they went in the way of Cain, and ran riotously in the error of Balaam for hire, and perished in Korah’s rebellion.” (1:11) One wounds a brother, one is greedy for money, one grabs a position; Korah was not content to be only a Levite, and wanted to seize the priesthood. Then come five pictures: hidden rocky reefs in the love feasts — with shepherds who feed only themselves tucked in the middle — then clouds without water, trees without fruit, wild waves, and last of all “wandering stars, for whom the blackness of darkness has been reserved forever” (1:13). Every one of them promises, and cannot deliver. “Reserved” is, once again, τηρέω (tēreō) in the Greek."],["p","The words of Enoch are found today in 1 Enoch; what Jude takes is the content of the saying: “Behold, the Lord came with ten thousands of his holy ones” (1:14). The Lord will surely come again, and the day is not ours to calculate. In verse 15 the Greek says “ungodly” four times over, and “all” four times over: not one thing will be left out. In verse 16, “complainers” is μεμψίμοιροι (mempsimoiroi) in the Greek, literally people grumbling against the share allotted to them. Once we have looked at the photographs, let us first ask ourselves: the share God has given me — have I complained about it in private?"],["d",["I am struggling with sexual temptation right now. When I read the verse about Sodom, can I still stay in the church?","Yes — and the church is exactly where you should be. The boundaries God has set for sex, of which verse 7 speaks, we hold to; that does not change with the times. But the same God also says through Paul: “Some of you were such, but you were washed. But you were sanctified. But you were justified in the name of the Lord Jesus, and in the Spirit of our God.” (1 Corinthians 6:11) Struggling is not a reason to be driven out; it is a reason to be accompanied. Being tempted is not in itself sin: the Lord Jesus too “has been in all points tempted like we are, yet without sin” (Hebrews 4:15). And Sodom’s sins also included pride and failing to help the poor and needy — this photograph is held up to everyone. Concretely, you can do this: find a pastor or an older believer of the same sex whom you trust and who can keep a confidence, tell them privately about your struggle, and pray together; if past harm or addiction is involved, ask them to go with you to seek professional help. If anyone humiliates you because of this, that is not what this letter means."]],["d",["I have questions about the church’s accounts and decisions. Does raising them count as “despise authority, and slander celestial beings”?","No. “Authority” is κυριότης in the Greek, mostly taken to mean the Lord’s authority, though some take it as heavenly powers; “celestial beings” is δόξας in the Greek, mostly taken to mean angels, glorious spiritual beings. This sentence is about the Lord and heavenly things, not about the office of some leader today; and in verse 12 the same letter condemns precisely shepherds who feed only themselves (this reminds us of Ezekiel 34:2). Raising questions in an orderly and respectful way is protecting the flock, not slander. Concretely, you can do this: first, with prayer, raise it privately with the responsible co-worker or with the board of elders and deacons; don’t make public accusations in a group chat, and don’t spread unverified information. If the normal channels are blocked, or people are being harmed, seek help from a trustworthy senior believer or organisation outside the church; where the law has been broken, deal with it according to the law."]],["h","4. Light from the Greek: “Keep”, “Contend”, and Feet That Do Not Stumble"],["p","Jude lifts his eyes: “But you, beloved, remember the words which have been spoken before by the apostles of our Lord Jesus Christ.” (1:17) He brings his readers back to the apostles’ teaching; he does not bring them to himself. Verse 19 is the last time these men appear: “These are those who cause divisions and are sensual, not having the Spirit.” (1:19) “Cause divisions” is ἀποδιορίζοντες (apodiorizontes) in the Greek: drawing lines within the community, sorting people into higher and lower. Then the camera turns round: “But you, beloved, keep building up yourselves on your most holy faith, praying in the Holy Spirit.” (1:20) More than a dozen verses describe the darkness; only two say what to do. Please take apart three Greek words with me."],["p","The first word: τηρέω (tēreō), keep. The Chinese Union Version translates it with four different words; in the Greek it is one word. Verse 1: we are kept. Verse 6: the angels did not keep their first domain; in the same verse, God has kept them in bonds. Verse 13: darkness has been reserved for the wandering stars. Verse 21: “Keep yourselves in God’s love, looking for the mercy of our Lord Jesus Christ to eternal life.” (1:21) In the whole letter, this is the only place where keeping is a command for the readers to carry out. What we keep is ourselves, staying in the place where God loves us — not the warmth of our own feelings. Building up, praying, looking for: all of them turn around this one command. “Praying in the Holy Spirit” has two readings: it includes praying in tongues, or it means all prayer that relies on the Holy Spirit and works together with him. We set the two readings side by side; we do not use tongues to rank people, nor do we look down on tongues. A climber has only one thing of his own to keep: not untying the knot at his waist. He is not the one holding the rope. The angels of verse 6 untied the knot; in the end they are still kept — only kept in chains."],["p","The second word: διακρίνω (diakrinō), contend. In verse 9, Michael “contending” with the devil is διακρινόμενος (diakrinomenos) in the Greek; in verse 22, where the Chinese Union Version reads ‘some who doubt’, the Greek is διακρινομένους (diakrinomenous) — the same word. (WEB renders it here as “making a distinction.”) In the archangel’s contest, what Jude wants us to learn is to leave judgement to the Lord. In the contest inside a believer’s heart, the first thing Jude wants the church to do is have mercy. Doubt is not apostasy. The Gospel records: “For even his brothers didn’t believe in him.” (John 7:5) Among those unbelieving younger brothers was Jude; the man who wrote verse 22 had himself been shown mercy. Yet we so often get these two kinds of contending the wrong way round."],["p","Then come two other kinds of people. The Chinese Union Version reads verse 23 as two further groups: ‘some, snatch them out of the fire and save them; on some have mercy with fear, hating even the garment stained by the flesh.’ (WEB, following a different Greek text, has two groups in verses 22–23 rather than three: “and some save, snatching them out of the fire with fear, hating even the clothing stained by the flesh.” (1:23)) “Snatching” is ἁρπάζω (harpazō) in the Greek: an urgent, forceful grab. This reminds us of the stick Zechariah saw: “a burning stick plucked out of the fire” (Zechariah 3:2). “With fear” means watching that you are not dragged down yourself. What is to be hated is the garment; toward the person, it is still mercy."],["p","The third word: ἀπταίστους (aptaistous), from stumbling. In verse 24, the word for keeping changes: φυλάξαι (phylaxai), from φυλάσσω (phylassō), the word for a sentry guarding a city gate. The subject of this sentence is not “you.” It is the One “who is able to keep them from stumbling” (1:24) — the participle δυναμένῳ, with the emphasis on his being able. (WEB reads “keep them”; the Chinese Union Version reads ‘keep you’.) Jianming’s foot left the hold, yet he did not plunge down. “From stumbling” does not mean never slipping again; it means that in the moment of the slip, a hand did not let go. Those who had been stained stand before him in the end faultless. The last sentence: “to God our Savior, who alone is wise, be glory and majesty, dominion and power, both now and forever. Amen.” (1:25) The Chinese Union Version reads ‘through Jesus Christ our Lord … before all time, and now, and for ever and ever’; WEB follows a text without those words. At the beginning of the letter, some deny our only Master; by its end, Jude leads his readers in offering praise to the only God."],["d",["Does “praying in the Holy Spirit” mean speaking in tongues? I don’t speak in tongues — does my prayer count as praying in the Holy Spirit?","The text does not limit it. One reading holds that it includes praying in tongues; Paul says, “For if I pray in another language, my spirit prays” (1 Corinthians 14:14). Others hold that it refers broadly to prayer that relies on the Holy Spirit and works together with him: “praying at all times in the Spirit” in Eph 6:18 uses exactly the same expression, and Rom 8:26 also says that the Spirit himself intercedes for us. These notes set both readings side by side: we do not define it as requiring tongues, and we do not look down on tongues. Jude’s real contrast is between verses 19 and 20: those men do not have the Spirit; but you pray in the Holy Spirit. The question is not whether I have a particular gift, but whether my prayer relies on my own eloquence or on the Holy Spirit. This week, before you pray each day, be quiet for one minute first and say: Holy Spirit, please teach me how to pray."]],["d",["A friend is caught up in gambling debts and a dangerous relationship. Does “snatching them out of the fire” mean I have to carry this alone?","No. The same sentence says “with fear” — a reminder to the rescuer that you too could be dragged down. Paul also says: “looking to yourself so that you also aren’t tempted” (Galatians 6:1). The one belaying must stand firm and be clipped in too. Concretely, you can do this. First, this week, pray with a co-worker or your group leader, and work out together who will go and how. Second, go and see your friend in twos: only listen — no lecturing, and no money. Third, look up referral resources in advance, such as debt counselling and gambling-addiction counselling; if there is a risk of violence or self-harm, help your friend contact a professional agency or an emergency helpline at once. Rescue is a group of kept people reaching out their hands together."]],["h","5. Several Distortions We Must Learn to Recognise"],["p","The first distortion is using verse 3 to back up flame wars online. ἐπαγωνίζεσθαι is straining every muscle for a prize, and what it strives for is the faith once delivered; the way Jude models is Michael refusing to slander and the mercy of verse 22. To defend the truth in a proud way is already to have lost."],["p","The second distortion is copying the marks out as a list of names, and pinning the label “crept in secretly” on some preacher or some group today. As soon as Jude has given the marks, verse 8 turns the mirror back on his readers. The marks are for holding up to ourselves; the list of names stays in God’s hands."],["p","The third distortion is using verse 8 to make church members keep quiet, as though asking about the accounts or about decisions were slander; or using verse 23 to tell people to keep away from those caught in sin. Those under judgement in verse 12 are precisely shepherds who feed themselves; and the verb running through verses 22–23 is still mercy (as the Chinese Union Version reads them)."],["p","The fourth distortion is telling someone with questions, “You probably aren’t born again”; or using verse 4 to pronounce sentence on people, so that sensitive brothers and sisters lie awake all night. What Scripture has written down is the end of the road; the first sentence and the last sentence of the letter are both about God keeping us."],["p","The fifth distortion is shouting 321’s slogans first and then using verse 6 and Korah as illustrations; or admiring Jude’s severity more and more the longer you preach. The text first finishes speaking of judgement and of keeping; only then does 321, at the end, recognise it. The glory goes to the God who keeps people, not to the man who wrote the letter."],["h","6. Two Real Questions from Chinese Contexts"],["p","The first question: in the extended-family group chat, an uncle — your mother’s cousin — forwards a video. Its title claims to expose a well-known pastor as a false teacher who has crept in secretly. Hundreds of thousands of people have watched it, and someone in the comments says we must contend for the faith. Should I forward it? Should I join in the condemnation? First remember verse 8: the marks are a mirror for those who read the letter. Then remember Michael: facing the devil himself, he dared not use slanderous words; still less do we need to hold court in the group chat on God’s behalf. So don’t forward it, don’t like it, and don’t start a battle in the comments. But not forwarding is not the same as pretending you never saw it: verse 12 does not allow us to cover for shepherds who feed only themselves either. If someone really has been harmed, if the accounts really are wrong, hand it over to the church or organisation responsible, through the proper channels; where sexual assault, violence or fraud is involved, report it to the police and go through the legal process. If the person who was harmed is right beside you, first listen to them carefully and protect them; do not tell them to keep quiet for the sake of the church’s reputation. Then privately send your uncle a word of greeting. What we contend for is the faith, not the view count."],["p","The second question: at the dinner table, a daughter in her second year at university says with her head down, “Mum, I don’t think I really believe any more.” Ah Ma, her grandmother, sitting beside her, puts down her chopsticks and says, “You’ve studied till your head’s gone bad. Tomorrow you’re coming to church with me to confess.” Rebuke very often comes from fear; but the first verb of verse 22 is mercy. What the Chinese Union Version calls ‘doubt’ is, in the Greek, contending within one’s heart. If she is still contending, it means she still cares. Mum can knock on her daughter’s door a little later and ask just one thing: where are you most stuck? No rush to answer it, and no string of videos sent her way. She can also say privately to Ah Ma: the man who wrote Jude once did not believe in his own elder brother either. If behind the questions lies a wound received in the church, be slower still: first stay with her, and where needed, look together for a trusted pastor or a professional."],["d",["A family member says, “I don’t think I really believe any more.” Sitting down to talk for the first time, how can I begin?","First remember that the first verb of verse 22 is mercy. Then set a very small goal for the conversation: not to persuade them tonight, but to let them know that their questions can be brought home. You can begin like this: thank you for being willing to tell me — that can’t have been easy to say. Then ask only: where are you most stuck? Is it a question, an experience, or a person? When they have finished, don’t argue back yet; you can say: I’d like to look for the answers together with you — can we talk again next week? If behind the doubts lies a wound received in the church, first grieve over that wound, and don’t defend anyone. Jude, who wrote this letter, once did not believe either; God did not give up on him."]],["h","7. Living Out 321 — the Two Ends of the Rope"],["p","Only after we have walked through the text do we recognise it with 321."],["p","Jesus is my role model: what these men deny is “our only Master, God, and Lord, Jesus Christ” (1:4) — and he is the very one we follow. He held to the truth and never gave way; when he was reviled, he did not revile in return; and to Peter, sinking, he reached out his hand and caught hold of him."],["p","The Bible is my standard: “remember the words which have been spoken before by the apostles of our Lord Jesus Christ” (1:17). The standard was delivered once for all. When you hear someone say he has had a dream or received a new revelation, first go back to what the apostles said."],["p","The Holy Spirit is my guide: verse 19 says those men are “not having the Spirit”; verse 20 says “praying in the Holy Spirit” (1:20). They rely on strange dreams and eloquence; we rely on the One who lives within."],["p","Let Jesus be King: our “only” Master (1:4). There is no second chair on the throne — not even one kept for myself. Letting him be King also means stepping down from the judge’s bench: Michael said only, “May the Lord rebuke you!” (1:9)."],["p","Let Jesus receive all the glory: in the Chinese Union Version, the last sentence of the whole letter reads ‘to him be glory, majesty, dominion and power, through Jesus Christ our Lord’ (1:25; WEB, following a different text, reads only “be glory and majesty, dominion and power”). The glory does not go to whoever contends loudest, nor to whoever sees most accurately. It goes to the One holding the rope."],["p","Establish God’s system: “keep building up yourselves on your most holy faith” (1:20). “Yourselves” is plural: a group of people building upward on the same foundation, whereas the divisions of verse 19 draw lines and pull apart. So in a small group there should be people who discern together the teaching they hear, people who can ask questions without fear, and people assigned to walk with those who are close to the fire."],["h","8. Four Hearts: Where on the Rope Is Each One?"],["p","The proud heart often stands at the foot of the wall commenting on whose footwork is wrong, its comments growing longer and longer — but really it is afraid of losing. Michael’s words are for you: even the archangel dared not pronounce sentence on God’s behalf. Korah is for you too: finding your own place too small is the beginning of leaving your proper place."],["p","The fearful heart is most afraid that it is the one who will stumble. Reading “long ago written about for this condemnation,” it lies awake all night; reading about the angels and Sodom, it feels it will be next. Look at the two ends of the rope: you are kept for Jesus Christ, and he is the One who is able to keep you from stumbling."],["p","The ashamed heart may once have fallen in the area of sex; may once have insulted people in a group chat, or forwarded videos it should not have forwarded; may be standing right beside the fire now. Remember: the verb in verse 23 is “snatching out,” and the word in verse 24 is “faultless.” Stained clothes can be taken off, and the Lord will give you new ones to put on."],["p","The wounded heart may once have been humiliated in the name of contending for the faith — its questions called proof of not being born again, its questions about leaders called slander. Those words were never what this letter meant. Jude’s first instruction is mercy. If those wounds still keep you from walking into a church, please find someone you trust to walk with you, and where needed seek professional help. You do not have to hang in mid-air alone."],["h","9. Things You Can Do This Week"],["p","For the five things below, please write down a time, a place and a name before the meeting ends."],["p","First, every morning read 1:20–21. When you reach “Keep yourselves in God’s love,” stop and say: today, first of all, I will stay in the place where you love me. In the evening, read 1:24, and hand over to him the places where you nearly slipped today."],["p","Second, the next time your finger is hovering over the send button, first ask three questions. Which part of the faith am I guarding? Is there a word in this message that Michael would not have dared to use? Am I contending for the faith, or for face? If you can answer all three, then press send."],["p","Third, think of a friend or family member who has recently said to you, “I’m not so sure any more.” This week, invite them for a cup of coffee, and ask just one thing: where are you most stuck?"],["p","Fourth, take a sheet of paper and write down one thing you resent about the share God has given you. Beside it write one line: Lord, this is the proper place you have given me; I am willing to keep it."],["p","Fifth, talk with your group leader: who in the small group is doubting, and who is close to the fire? Pair two people to walk with each of them, and if needed, find out in advance which counselling services nearby you can refer people to."],["p","Then let us say four sentences out loud together."],["p","I declare: I am called, beloved and kept; when my foot slips, God does not let go."],["p","I declare: I contend for the faith once delivered, not for my own face; judgement I leave to the Lord — I do not sit on the judge’s bench."],["p","I declare: on those who doubt I will have mercy; those close to the fire I will go, with my brothers and sisters, to snatch out."],["p","I declare: he who is able to keep me from stumbling will make me stand before his glory in great joy; to him be the glory."],["h","10. Closing Word"],["p","That evening Jianming came down from the wall, clipped the belay device onto his own harness, and said to his eldest son, on his first visit to the climbing gym: up you go — I’m down here. Halfway up, the boy’s legs were shaking. Jianming said: it’s all right if you slip; I won’t let go. He had been caught in mid-air himself, so he knew how to catch someone else. This is the order of Jude: those who have first been kept are the ones who go and show mercy, who go and rescue."],["p","The focus of this lesson is not Jude’s severity, nor how well we contend or how accurately we discern. The focus is on the One who at the beginning keeps us (1:1), in the middle tells us to stay in his love (1:21), and at the end is able to keep us from stumbling and to make us stand before his glory in great joy (1:24). Those who would not keep their proper place are in the end guarded by chains; those who stay in God’s love are guarded all the way by God’s hand. As you leave here, please love him more: in the second your foot slips, he is at the other end of the rope."],["p","Let us bow our heads together and pray. Father, thank you that before we ever slipped, your hand was already holding the rope. Teach us to contend earnestly for the faith, yet to slander no one, and to give judgement back to you. Make us stay in your love, building one another up, praying in the Holy Spirit. Give us gentle hearts to show mercy to the children who are contending in their hearts, and to go together to rescue those close to the fire. To you be glory, majesty, dominion and power, before all time, and now, and for ever and ever. In the name of the Lord Jesus Christ we pray. Amen."],["h","11. Small-Group Discussion: the Three Transformations"],["p","The small group is not a contest over who argues best, or who sees most accurately. It is a place for each person to say where they are on the rope, who around them is contending in their heart, and the one hand they will reach out this week. Group leaders, please lead the Three Transformations below in order."],["m","Leader’s note: the lesson’s main thread is the two ends of the rope: first we are kept, and only then do we contend for the faith; those who are held go to show mercy and to rescue. Around the table there may be people who are doubting, struggling sexually, or hurt by the church. Please read the leader’s reminder in Transformation Two first."],["m","Priority markers: ★★★ = top priority — when time is short, discuss at least this question in each Transformation; ★★ = second priority; ★ = discuss if time allows. The multiplication task marked [Must do] may not be skipped, but it can be completed at home."],["s","Transformation One | Internalise — until it becomes mindset (about 20 minutes)"],["m","Purpose: to be able to articulate three mindsets: contending is striving for the faith, not humiliating people; the word “keep” runs from verse 1 to verse 24, and in the end it is God who keeps us; “doubt” and “contend” are the same word, and the first verb is mercy."],["n","1. ★ Have you ever had a moment when your foot slipped, yet someone caught you? It may have been on a mountain path, or in a very hard season of life. Who caught you?"],["n","2. ★★★ What picture does “contend earnestly” bring to mind in the arena? What is it that we contend for? What way of contending does Jude model in verses 9 and 22? Give an example of a time you contended against the wrong thing."],["n","3. ★★ From verse 1 to verse 24, walk through the word “keep”: kept, did not keep, kept in bonds, reserved, keep yourselves, able to keep. Which stop makes you pause most? Why?"],["n","4. ★★ Michael contending with the devil, and some who doubt — in the Greek these are the same word. In what settings do you most often get these two kinds of contending the wrong way round?"],["m","Leader’s reminder: questions such as “Jesus” or “the Lord,” who the angels are, or 1 Enoch, point in one sentence to the issue pages of the notes; don’t debate them in the group. Don’t name any pastor, church, denomination, online speaker or member of the group."],["s","Transformation Two | Digest — until it becomes life (about 35 minutes · the lesson’s main thread)"],["m","Purpose: for each person to say where they are on the rope, and the small step they will take this week."],["t","[See] See yourself"],["n","5. ★★★ Which kind of person have you been most like lately: the one contending in the group chat, the one who looks at the photographs and sees others first, the one contending inside, or the one close to the fire? Name one specific thing."],["t","[Listen] Listen to God"],["n","6. ★★ Please read 1:20–21 and 1:24 slowly, twice. Which word made you stop: “But you,” “keep yourselves,” or “from stumbling”?"],["t","[Think] Think through the sticking point"],["n","7. ★★★ Where do you most often get stuck: afraid of losing, so you contend too fiercely; afraid of being condemned, so you dare not ask; or afraid of being seen through, so you don’t let anyone get close?"],["t","[Speak] Say it out loud"],["n","8. ★★ Say this to the group: “I am kept for Jesus Christ; the hand holding the rope is God’s.” The next person replies with just one line: “He is able to keep you from stumbling” — no advice, no analysis."],["t","[Do] Take one step"],["n","9. ★★★ Write down your small step for this week: which day, toward whom, doing what. If you yourself are close to the fire, this step can simply be telling one person you trust."],["m","Leader’s reminder: this Transformation may touch on doubts about the faith, sexual struggles, harm from a church or a spiritual leader, family members who have left the faith, and long-term hopelessness. Don’t press for details, don’t demand forgiveness, and don’t tell someone in tears, “You need to have faith.” Don’t deal with it in the group; care for the person individually after the meeting, and where needed help them seek professional help."],["s","Transformation Three | Transform — until it becomes daily living (about 25 minutes)"],["m","Purpose: to move this lesson into the calendar: one group chat, one meal, one list, one “2,” one friend."],["n","10. ★★ Name the place where you most often end up in arguments: which group chat, or which dinner table. This week, which part of the faith will you guard there? Which tone of voice will you delete?"],["n","11. ★★ This week, which friend or family member who is doubting will you invite for a meal? Say which day, where, and the one question you are preparing to ask: where are you most stuck?"],["n","12. ★ On our small group’s care list, who is doubting, and who is close to the fire? Descriptions are fine. This month, which two group members will walk with each of them? When a referral is needed, which co-worker will we ask first?"],["n","13. ★★★ This is the lesson’s 920 exercise: find your “2” — perhaps a young person who is contending inside. Say it right now: you may give a name, or just a description (for example, “my daughter”). Say which day this week and in what way you will share this lesson with them. If that person once hurt you, this week it is enough simply to pray for them."],["n","14. ★★★ [Must do] Multiplication task: explain this lesson to a friend outside the church in three sentences. First: when a climber’s foot slips and he doesn’t fall, it is because someone below has been holding the rope all along. Second: Jesus’ younger brother wrote a letter saying that people held by God stand firm for the truth without abusing anyone, and go to catch hold of those who are wavering. Third: I too am learning to be held first, and then to hold on to others. Say who this friend is and which day you will tell them, and next time report back on how they responded."],["m","Leader’s reminder: get specific — times, places, names. Don’t accept answers like “I’ll pay attention.” The 920 person may be referred to by description only; don’t press anyone to name someone who once hurt them. When doubts, sex, spiritual abuse or leaving the church come up, don’t press for details and don’t demand forgiveness; care for the person individually after the meeting, and where needed help them seek professional help."],["s","Closing (5 minutes)"],["p","Ask each person to say in one sentence: the one comment they will delete this week, and the one person they will invite."],["p","Then pray for one another in pairs: first for the person your partner named — ask the Lord to let them know their questions can be brought home; then for your partner — ask the Lord to draw back their hand whenever they want to pronounce sentence on God’s behalf; and finally pray together for someone who is close to the fire and did not come today — ask the Lord to send a group of people to catch hold of them, and to keep those who go."],["p","Finally, the group leader reads slowly, once: “Now to him who is able to keep them from stumbling, and to present you faultless before the presence of his glory in great joy,” (1:24) and the whole group continues together, reading verse 25."]]}}}</script>

<script>/* ===== 321 Jude Study Notes (English edition) ===== */
const D = JSON.parse(document.getElementById('DATA').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CH = D.ch, BLK = D.blk;
const VMAP = {};
Object.keys(BLK).forEach(c => BLK[c].forEach((b, i) => {
  b.ch = +c; b.i = i;
  b.ref = c + ':' + (b.a === b.z ? b.a : b.a + '–' + b.z);
  for (let v = b.a; v <= b.z; v++) VMAP[c + ':' + v] = b;
}));
const byCh = {}; Object.keys(BLK).forEach(c => byCh[+c] = BLK[c]);
const cuvOf = ref => { const [c, v] = ref.split(':'); const t = D.txt[c]; return t ? (t[+v - 1] || '') : ''; };
const blkCuv = b => { const t = D.txt[b.ch] || []; let h = '';
  for (let v = b.a; v <= b.z; v++) h += `<p><b>${v}</b>&nbsp; ${esc(t[v - 1] || '')}</p>`; return h; };
const KEY = 'r321.jud.v1-en';
const DAY = 864e5, GAPS = [0, 1, 3, 7, 16, 35, 75];

let S = load();
function load(){
  try {
    const o = JSON.parse(localStorage.getItem(KEY));
    if (o && o.v === 1){ o.lnote = o.lnote || {}; return o; }
  } catch(e){}
  return { v:1, last:1, steps:{}, notes:{}, lnote:{}, prac:{}, mem:{},
           set:{ fs:1, grk:1, dark:0, sc:0, role:'' }, seen:{} };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
S.set.sc = 0;                       // the English edition has no Chinese script switch

/* The English edition has no Traditional/Simplified conversion. These stubs keep any old call harmless. */
const SCMAP = null;
function toSC(s){ return s; }
function scWalk(n){}
function scApply(){}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1700); }
const meta = n => CH[n - 1];

const STEPS = [
  ['Information','Read this chapter’s card'], ['Revelation','Read the text and write down one thing you see'], ['Conviction','Memorize the chapter’s memory verse'],
  ['Implementation','Choose one practice for this week'], ['Evaluation','Day seven: did I do it?'], ['Correction','Go back and reread a verse'],
  ['Repetition','Pass the review three times'], ['Multiplication','Explain it to someone outside the group'],
];
const stepsOf = n => S.steps[n] || [];
function toggleStep(n, i){
  const a = stepsOf(n), k = a.indexOf(i);
  if (k >= 0) a.splice(k, 1); else a.push(i);
  S.steps[n] = a; save(); render();
}
const doneCh = () => CH.filter(c => stepsOf(c.n).length === 8).length;
const startedCh = () => CH.filter(c => stepsOf(c.n).length > 0).length;

function memAdd(n){ if (S.mem[n]) return false; S.mem[n] = { box:0, due:Date.now(), hit:0 }; save(); return true; }
function memGrade(n, ok){
  const r = S.mem[n]; if (!r) return;
  r.box = ok ? Math.min(GAPS.length - 1, r.box + 1) : 0;
  r.hit = (r.hit || 0) + (ok ? 1 : 0);
  r.due = Date.now() + (ok ? GAPS[r.box] : 0.4) * DAY;
  save();
}
const due = () => Object.keys(S.mem).filter(n => S.mem[n].due <= Date.now()).map(Number);
/* cloze for review: blank out about 30% of the words (words of four letters or more) */
function blank(t, seed){
  const parts = String(t).split(/(\s+)/), idx = [];
  parts.forEach((w, i) => { if (/[A-Za-z]{4,}/.test(w)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;
  while (idx.length && pick.size < n && guard++ < 999) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return parts.map((w, i) => {
    if (!pick.has(i)) return esc(w);
    const m = w.match(/^([^A-Za-z]*)([A-Za-z\u2019'-]*[A-Za-z])(.*)$/);
    return m ? esc(m[1]) + '<i>' + '_'.repeat(Math.max(3, m[2].length)) + '</i>' + esc(m[3]) : esc(w);
  }).join('');
}

/* ===== Terrain map ===== */
/* English labels are much longer than the Chinese ones, so the small map shows a shortened
   label and keeps the full wording in a tooltip. */
const tShort = s => {
  s = String(s || '');
  if (s.length <= 30) return s;
  const cut = s.slice(0, 30), k = cut.lastIndexOf(' ');
  return (k > 10 ? cut.slice(0, k) : cut).replace(/[\s,;:—]+$/, '') + '…';
};
function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = 1;
  const x = c => pad + (c - 0.5) / LAST * (W - pad * 2);   // c is the position within the chapter (integer = chapter center)
  const y = v => 10 + (100 - v) / 100 * (H0 - 26);
  let d = `M ${x(0.5)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(LAST + 0.5)} ${y(P.length ? P[P.length - 1][1] : 30)}`;

  // -- Label layout: two-dimensional collision avoidance with boxes; push outward when there is no room --
  const lab = P.filter(p => p[4]);
  const fs = lab.length > 6 ? 6.4 : 7.4;           // English labels are long: a smaller size than the Chinese edition
  const boxes = [], out = [];
  const hit = (a, b) => !(a.x1 < b.x0 - 1 || a.x0 > b.x1 + 1 || a.y1 < b.y0 - 1 || a.y0 > b.y1 + 1);
  // the dots and the "you are here" ring are obstacles too, so labels never sit on the line
  const obst = [];
  P.forEach(p => { const cx = x(p[0]), cy = y(p[1]), r = (p[4] ? 3.2 : 2.2) + 1.5;
    obst.push({ x0: cx - r, x1: cx + r, y0: cy - r, y1: cy + r }); });
  if (cur) { const cx = x(cur), cy = y(50);
    obst.push({ x0: cx - 7, x1: cx + 7, y0: cy - 7, y1: cy + 7 }); }
  obst.forEach(o => boxes.push(o));
  lab.slice().sort((a, b) => a[0] - b[0]).forEach(p => {
    const txt = tShort(p[3]);
    const w = txt.length * fs * 0.6;                       // monospace labels: about 0.6em per character
    const cx = Math.min(W - 1 - w / 2, Math.max(1 + w / 2, x(p[0])));
    const base = y(p[1]);
    const up = [-7, -16, -25, -34, -43], dn = [11, 20, 29, 38, 47];
    const cand = (p[4] === 'bot' ? dn.concat(up) : up.concat(dn));
    let yy = base + cand[0];
    for (const off of cand) {
      const t = base + off;
      const box = { x0: cx - w / 2, x1: cx + w / 2, y0: t - fs, y1: t + 2 };
      if (!boxes.some(b => hit(b, box))) { yy = t; boxes.push(box); break; }
      if (off === cand[cand.length - 1]) { yy = t; boxes.push(box); }
    }
    out.push({ p, cx, yy, txt });
  });
  const labs = out.map(o =>
    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle"><title>${esc(String(o.p[3] || ''))}</title>${esc(o.txt)}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // the viewBox grows to fit the actual content, so no label is clipped
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="Terrain map of Jude">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">Contend · Beware · Keep</p></div>`;
}

let OPENL = { 1:1, 2:0, 3:1, 4:0, 5:0, 6:1 };
function openV(ref){
  const v = VMAP[ref]; if (!v) return;
  const rr = v.ch + ':' + (v.a === v.z ? v.a : v.a + '–' + v.z);
  const L = (i, name, body, cls) => {
    const on = OPENL[i] && !(i === 2 && !S.set.grk) && !(i === 4 && !S.set.grk);
    return `<div class="layer"><div class="lh" onclick="tglL(${i},'${ref}')">
      <span class="n">${['','①','②','③','④','⑤','⑥'][i]}</span><span>${name}</span>
      <span class="caret">${on ? '▾' : '▸'}</span></div>
      ${on ? `<div class="lb ${cls || ''}">${body}</div>` : ''}</div>`;
  };
  let h = `<h4>Jude ${esc(rr)}</h4>
    <p class="xs muted" style="margin:0 0 10px">${v.star ? '★ Key passage &nbsp;·&nbsp; ' : ''}Chapter ${v.ch}</p>
    ${L(1, 'World English Bible', blkCuv(v))}
    ${S.set.grk && v.grk ? L(2, 'Greek', v.grk, 'grk') : ''}
    ${v.lit ? L(3, 'Literal rendering', tagParas(v.lit, 'x|' + v.ch + ':' + v.a + '|lit'), 'lit') : ''}
    ${S.set.grk && v.key ? L(4, 'Key words', v.key) : ''}
    ${v.gram ? L(5, 'Grammar', tagParas(v.gram, 'x|' + v.ch + ':' + v.a + '|gram')) : ''}
    ${v.exp ? L(6, 'Exposition', tagParas(v.exp, 'x|' + v.ch + ':' + v.a + '|exp')) : ''}`;
  const iss = (D.issues || []).filter(x => (x.ch || []).includes(v.ch));

  const prev = BLK[v.ch][v.i - 1], next = BLK[v.ch][v.i + 1];

    <button class="btn" onclick="go('course',${v.ch})">Whole chapter</button></div>`;
  sheet(h);
}

/* -- Lesson read-aloud: skip the book title, teleprompter and contents, and start with the body --
   Section headings, “Think deeper” and the Three Transformations are all introduced conversationally,
   so it sounds like a teacher speaking, not a screen reading out its layout. */
const DEEP_LEAD = [
  'Let’s think a little deeper here. Someone may ask: ',
  'Let me add one more word here. Perhaps someone is asking right now: ',
  'I know some of you will stop here and ask: ',
  'Let’s take this one step further. Someone asks: ',
  'Here is a question worth pausing over: ',
  'Perhaps you are wondering: ',
];
const DEEP_ANS = ['Here is my answer. ', 'This is how I see it. ', 'We can think of it this way. ', 'This is how I would answer. ',
  'Let me put it this way. ', 'The answer is right there in the text. '];
const NUMW = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve',
  'thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENSW = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
/* a number spoken as a word (used for "Part one", "Question fourteen") */
function numWord(n){
  n = parseInt(n, 10);
  if (!(n >= 0)) return String(n);
  if (n < 20) return NUMW[n];
  if (n < 100) return TENSW[Math.floor(n / 10)] + (n % 10 ? '-' + NUMW[n % 10] : '');
  return String(n);
}
/* split plain text into sentences (exactly the same rule as the tappable .mks sentences on screen, so the two line up) */
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));
const endDot = s => /[.!?…”’)]$/.test(String(s).trim()) ? String(s).trim() : String(s).trim() + '.';

/* Read-aloud units: one per sentence, each remembering which block and which sentence it is on screen
   { t:text to speak, i:block index, part:'t'|'a', j:sentence index (-1 = the whole block) }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* a whole block: the first sentence gets the spoken lead-in, the rest are read as they are, indexed like the screen */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // "1. A Letter with No Signature" -> "Part one. A Letter with No Signature."
        const m = String(t).match(/^(\d+)\.\s*(.*)$/);
        push(m ? `Part ${numWord(m[1])}. ${endDot(m[2])}` : endDot(t), i, 't', -1);
        break;
      }
      case 'd':                                     // “Think deeper”: a question and its answer
        push(DEEP_LEAD[di % DEEP_LEAD.length] + t[0], i, 'q', -1);
        block(t[1], i, 'a', DEEP_ANS[di % DEEP_ANS.length]);
        di++;
        break;
      case 's': {                                   // a Three Transformations heading (the minutes in parentheses are not read)
        const s = String(t).replace(/\s*\([^)]*\)/g, '').replace(/\s*\|\s*/g, ': ').trim();
        push(/^Closing/i.test(s) ? 'Let’s close.' : `Next comes ${endDot(s)}`, i, 't', 0);
        break;
      }
      case 't': {                                   // [See] [Listen] [Think] [Speak] [Do]
        const m = String(t).match(/^\[(.+?)\]\s*(.*)$/);
        push(m ? `This step is ‘${m[1]}’: ${endDot(m[2])}` : endDot(t), i, 't', 0);
        break;
      }
      case 'm':                                     // leader's guide / leader's note: already labelled in the text
        if (/^Priority markers/i.test(String(t))) break;   // the stars are marks on paper; reading them aloud means nothing
        block(t, i, 't');
        break;
      case 'n': {                                   // "1. ★★★ question" -> "Question one. question"
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /\[(?:Must do|Required)\]/.test(String(t));
        block(t, i, 't', `Question ${numWord(qi)}. ${must ? 'This one is a must-do. ' : ''}`, /^\d+\.\s*(★+)?\s*(\[(?:Must do|Required)\])?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* Merge units into the pieces fetched as one audio request: within a block, keep merging until a piece
   reaches about 180 characters. Too small and playback keeps waiting on the network; too large and it is
   slow to start. Each piece remembers which on-screen sentences it covers. */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 180 && last.t.length + u.t.length <= 600){
      last.t += (/\s$/.test(last.t) ? '' : ' ') + u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  segs.forEach(s => { s.t = sanitize(s.t); });
  return segs.filter(s => s.t);
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');
function lesTitle(n){
  const L = (D.lesson || {})[n];
  return L ? `Lesson ${n} · ${titleMain(L.title)}` : 'Lesson';
}
function lesSpeak(n){
  if (SPK.on) return stopSpeak();
  const segs = lesSegs(n);
  if (!segs.length) return toast('No teaching lesson for this chapter yet');
  playSegs(segs, lesTitle(n), n);
}
/* Download ahead: store the whole lesson's audio in IndexedDB so it can be played offline */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('No teaching lesson for this chapter yet');
  if (!S.set.human) return toast('You’re using the device voice; there’s nothing to download');
  const b = $('#lesDl' + n);
  const chunks = segs.map(s => s.t);
  let done = 0, fail = 0;
  const paint = () => { if (b) b.textContent = `⤓ Downloading ${done}/${chunks.length}`; };
  paint();
  const CONC = 6; let next = 0;
  await new Promise(res => {
    let running = 0;
    const pump = () => {
      if (!chunks.length) return res();
      while (running < CONC && next < chunks.length){
        running++;
        ttsFetch(chunks[next++]).catch(() => { fail++; }).then(() => {
          running--; done++; paint();
          if (done === chunks.length) res(); else pump();
        });
      }
    };
    pump();
  });
  if (b) b.textContent = fail ? '⤓ Download for offline' : '✓ Downloaded';
  toast(fail ? `${fail} ${fail === 1 ? 'piece' : 'pieces'} didn’t download; please try again` : 'The whole lesson’s audio is on this device; you can listen offline');
}
/* On entering a lesson page, check whether this lesson has already been downloaded */
function lesDlCheck(n){
  const b = $('#lesDl' + n);
  if (!b || !S.set.human) return;
  const segs = lesSegs(n); if (!segs.length) return;
  const keys = segs.map(s => voiceName() + '|' + rateAttr() + '|' + s.t);
  ttsCount(keys, got => {
    const el = $('#lesDl' + n); if (!el) return;
    el.textContent = got >= keys.length ? '✓ Downloaded'
      : got ? `⤓ Download for offline (${got}/${keys.length} saved)` : '⤓ Download for offline';
  });
}

/* ═══════════════════════════════════════════════════

   1. Natural voice (Azure TTS Worker + permanent IndexedDB cache)

/* -- Service endpoints -- */
const SVC = {
  xz:  'https://xiaozhi-proxy.spch321.workers.dev',
  tts: 'https://azure-tts.spch321.workers.dev',
  model: 'claude-sonnet-4-6',
};
const TTS_VOICES = {
  andrew: { name:'en-US-Andrew:DragonHDLatestNeural', label:'Andrew', desc:'US, male' },
  ava:    { name:'en-US-Ava:DragonHDLatestNeural',    label:'Ava',    desc:'US, female' },
  ryan:   { name:'en-GB-RyanNeural',                  label:'Ryan',   desc:'UK, male' },
  sonia:  { name:'en-GB-SoniaNeural',                 label:'Sonia',  desc:'UK, female' },
};
const TTS_SIL = { s:140, c:140, e:260 };

S.set.voice = TTS_VOICES[S.set.voice] ? S.set.voice : 'andrew';
S.set.rate  = S.set.rate  || 0;      // -3 to +3

/* ═══════ Language ═══════ */
/* The English edition has no Traditional/Simplified switching; the Me page shows no language card. */
const LANG_NOW = 'en';
function goLang(k){
  const F = {tc:'index.html', sc:'sc.html', en:'en.html'}; const f = F[k]; if (!f) return;

const TTS_DB = 'r321_tts-en';
function ttsDB(cb){
  try {
    if (!window.indexedDB) return cb(null);
    const r = indexedDB.open(TTS_DB, 1);
    r.onupgradeneeded = () => { try { if (!r.result.objectStoreNames.contains('a')) r.result.createObjectStore('a'); } catch(e){} };
    r.onsuccess = () => cb(r.result);
    r.onerror = () => cb(null);
  } catch(e){ cb(null); }
}
function ttsGet(k, cb){
  ttsDB(db => { if (!db) return cb(null);
    try { const q = db.transaction('a').objectStore('a').get(k);
      q.onsuccess = () => cb(q.result || null); q.onerror = () => cb(null);
    } catch(e){ cb(null); } });
}
function ttsPut(k, blob){
  ttsDB(db => { if (!db) return;
    try { db.transaction('a', 'readwrite').objectStore('a').put(blob, k); } catch(e){} });
}
function ttsCount(keys, cb){
  if (!keys.length) return cb(0);
  ttsDB(db => { if (!db) return cb(0);
    try {
      const st = db.transaction('a').objectStore('a');
      let n = 0, done = 0;
      keys.forEach(k => {
        const q = st.getKey ? st.getKey(k) : st.count(k);
        q.onsuccess = () => { if (q.result !== undefined && q.result !== 0) n++; if (++done === keys.length) cb(n); };
        q.onerror   = () => { if (++done === keys.length) cb(n); };
      });
    } catch(e){ cb(0); } });
}
async function ttsClear(){
  return new Promise(res => ttsDB(db => { if (!db) return res();
    try { const t = db.transaction('a', 'readwrite'); t.objectStore('a').clear(); t.oncomplete = () => res(); t.onerror = () => res(); }
    catch(e){ res(); } }));
}

const voiceName = () => (TTS_VOICES[S.set.voice] || TTS_VOICES.andrew).name;
const rateAttr  = () => (S.set.rate >= 0 ? '+' : '') + (S.set.rate * 5) + '%';

/* The English voices cannot pronounce Greek or Hebrew script.
   If a transliteration follows in parentheses, read only the transliteration; if there is none,
   skip the original word entirely, so each word is read once and never twice. */
const ORIG_CH  = '\\u0590-\\u05FF\\u0370-\\u03FF\\u1F00-\\u1FFF';
const ORIG_RUN = '[' + ORIG_CH + '][' + ORIG_CH + "\\s'\u2019\\-\u05be\u05f3\u05f4\u00b7]*";
const RE_ORIG_ROMAN = new RegExp(ORIG_RUN + "\\s*\\(\\s*([A-Za-z\u00c0-\u024f][A-Za-z\u00c0-\u024f'\u2019\\- ]*)\\s*\\)", 'g');
const RE_ORIG_RUN   = new RegExp(ORIG_RUN, 'g');

/* Pronunciation fixes: change only the text sent to the voice, never the text on screen.
   Add a row here whenever a word is read wrongly. */
const TTS_SAY = [
  [/\bLXX\b/g, 'Septuagint'],
  [/\be\.g\.,?\s*/g, 'for example, '],
  [/\bi\.e\.,?\s*/g, 'that is, '],
  [/\bcf\.\s*/g, 'compare '],
  [/\bvv\.\s*(?=\d)/g, 'verses '],
  [/\bv\.\s*(?=\d)/g, 'verse '],
  [/\bchs?\.\s*(?=\d)/g, 'chapter '],
];
/* SBL book abbreviations that appear before a reference, spoken in full */
const BOOKS_SAY = { Gen:'Genesis', Exod:'Exodus', Lev:'Leviticus', Num:'Numbers', Deut:'Deuteronomy',
  Josh:'Joshua', Judg:'Judges', Sam:'Samuel', Kgs:'Kings', Chr:'Chronicles', Neh:'Nehemiah', Ps:'Psalm',
  Pss:'Psalms', Prov:'Proverbs', Isa:'Isaiah', Jer:'Jeremiah', Ezek:'Ezekiel', Dan:'Daniel', Hab:'Habakkuk',
  Hag:'Haggai', Mal:'Malachi', Matt:'Matthew', Mk:'Mark', Lk:'Luke', Jn:'John', Rom:'Romans',
  Cor:'Corinthians', Gal:'Galatians', Eph:'Ephesians', Phil:'Philippians', Col:'Colossians',
  Thess:'Thessalonians', Tim:'Timothy', Tit:'Titus', Phlm:'Philemon', Heb:'Hebrews', Jas:'James',
  Pet:'Peter', Rev:'Revelation' };
const RE_BOOK = new RegExp('\\b(' + Object.keys(BOOKS_SAY).join('|') + ')\\.?\\s+(?=\\d)', 'g');

/* Clean up text before it is read aloud */
function sanitize(t){
  t = String(t || '').replace(/<[^>]+>/g, ' ');
  t = t.replace(/&nbsp;/g, ' ').replace(/&amp;/g, ' and ').replace(/&lt;|&gt;/g, ' ')
       .replace(/&quot;/g, '"').replace(/&#39;/g, '\u2019');
  // the original language is read once: the transliteration if there is one, otherwise nothing
  t = t.replace(RE_ORIG_ROMAN, ' $1 ').replace(RE_ORIG_RUN, '\u0000');
  t = t.replace(/\(\s*\u0000\s*\)/g, '\u0000');
  t = t.replace(/\s*\u0000\s*/g, ' ');
  t = t.replace(/\(\s*[,;]?\s*\)/g, ' ');
  // markdown and symbols
  t = t.replace(/\*\*/g, '').replace(/[\[\]]/g, '');
  t = t.replace(/^[ \t]*#{1,6}[ \t]*/gm, '').replace(/^[ \t]*>[ \t]?/gm, '');
  t = t.replace(/\s+·\s+/g, ', ');
  t = t.replace(/★|⚠|✓|❌|🟢|🟡|🔴|📋|📖|⚖|▸|▾|◆|💡|·/g, ' ');
  t = t.replace(/\s*\|\s*/g, ': ');
  // references spoken naturally: Heb 1:3 -> Hebrews 1 verse 3; 1:1–4 -> 1 verse 1 to 4
  t = t.replace(RE_BOOK, (m, b) => BOOKS_SAY[b] + ' ');
  t = t.replace(/\b(\d{1,3}):(\d{1,3})(?:\s*[\u2013\u2014-]{1,2}\s*(\d{1,3})(?::(\d{1,3}))?)?/g, (m, a, b, c, d) =>
    a + ' verse ' + b + (c ? (d ? ' to ' + c + ' verse ' + d : ' to ' + c) : ''));
  t = t.replace(/(\d)\s*[\u2013]\s*(\d)/g, '$1 to $2');
  t = t.replace(/\b321\b/g, 'three-two-one').replace(/\b920\b/g, 'nine-two-zero').replace(/\b235\b/g, 'two-three-five');
  TTS_SAY.forEach(r => { t = t.replace(r[0], r[1]); });
  t = t.replace(/\s+([,.!?;:])/g, '$1');
  return t.replace(/[ \t]{2,}/g, ' ').replace(/\s{2,}/g, ' ').trim();
}
/* Split for synthesis: break after . ! ? ; once a chunk reaches about 220 characters; never longer than 500 */
function ttsChunks(t){
  t = sanitize(t); if (!t) return [];
  const out = []; let buf = '';
  for (let i = 0; i < t.length; i++){
    const ch = t[i]; buf += ch;
    if ((/[.!?;]/.test(ch) && (i + 1 >= t.length || /\s/.test(t[i + 1])) || ch === '\n') && buf.length >= 220){
      out.push(buf.trim()); buf = '';
    }
  }
  if (buf.trim()) out.push(buf.trim());
  const fin = [];
  out.forEach(s => {
    while (s.length > 500){
      let k = s.lastIndexOf(' ', 500); if (k < 200) k = 500;
      fin.push(s.slice(0, k).trim()); s = s.slice(k).trim();
    }
    if (s) fin.push(s);
  });
  return fin.length ? fin : [t];
}

async function ttsFetch(piece){
  const key = voiceName() + '|' + rateAttr() + '|' + piece;
  const cached = await new Promise(r => ttsGet(key, r));
  if (cached) return cached;
  const res = await fetch(SVC.tts, { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ voice:voiceName(), rate:rateAttr(), sil:TTS_SIL.s, silc:TTS_SIL.c, sile:TTS_SIL.e, text:piece }) });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  ttsPut(key, blob);
  return blob;
}

let AUP = null, SPK = { on:false, pause:false, tok:0, list:[], i:0, title:'', prep:0, total:0 };
function audioPair(){
  if (!AUP){
    AUP = [0, 1].map(() => {
      const a = new Audio(); a.preload = 'auto'; a.loop = false;
      a.setAttribute('playsinline', '');
      a.addEventListener('play',  () => { mediaState('playing'); });
      a.addEventListener('pause', () => { if (!SPK.on) mediaState('paused'); });
      return a;
    });
  }
  return AUP;
}
const audioEl = () => audioPair()[0];
function mediaState(st){
  try { if (navigator.mediaSession) navigator.mediaSession.playbackState = st; } catch(e){}
}
function appIcon(){
  const l = document.querySelector('link[rel="apple-touch-icon"], link[rel="icon"]');
  return (l && l.getAttribute('href')) || '';
}
function mediaSetup(title){
  if (!navigator.mediaSession || !window.MediaMetadata) return;
  try {
    const ic = appIcon();
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title || 'Reading aloud',
      artist: '321 Jude Study Notes',
      album: 'Kingdom 321 Online Fellowship',
      artwork: ic ? [{ src: ic, sizes:'180x180', type:'image/png' }] : [],
    });
    navigator.mediaSession.setActionHandler('play',  () => { if (SPK.pause) togglePause(); });
    navigator.mediaSession.setActionHandler('pause', () => { if (!SPK.pause) togglePause(); });
    navigator.mediaSession.setActionHandler('stop',  () => stopSpeak());
    navigator.mediaSession.setActionHandler('previoustrack', () => spkStep(-1));
    navigator.mediaSession.setActionHandler('nexttrack',     () => spkStep(1));
    navigator.mediaSession.setActionHandler('seekbackward',  () => spkStep(-1));
    navigator.mediaSession.setActionHandler('seekforward',   () => spkStep(1));
  } catch(e){}
}
const PRE_START = 2;
const PRE_AHEAD = 8;
const SILENT_MP3 = 'data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA';

let PL = null;
function playSegs(segs, title, lesson){
  if (!segs.length) return;
  if (!S.set.human) return sayNative(segs.map(s => s.t).join('\n'));
  stopSpeak();
  const my = ++SPK.tok;
  SPK = { on:true, pause:false, tok:my, list:segs, i:0, title:title || 'Reading aloud', prep:0, total:segs.length };
  PL = { tok:my, segs, blobs:new Array(segs.length), pend:new Array(segs.length).fill(0),
         try:new Array(segs.length).fill(0),
         i:0, cur:0, lesson:lesson || 0, fail:0, running:0 };
  const els = audioPair();
  els.forEach(a => { try { a.pause(); a.removeAttribute('src'); a.load(); } catch(e){} });
  els.forEach(a => { try { a.src = SILENT_MP3; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch(e){} });
  setTimeout(() => els.forEach(a => { try { if (a !== els[0]) a.pause(); } catch(e){} }), 0);
  mediaSetup(SPK.title);
  drawBar();
  plPump();
  plWaitAndStart();
}
function plFetch(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (PL.blobs[k] || PL.pend[k]) return;
  PL.pend[k] = 1; PL.running++;
  ttsFetch(PL.segs[k].t).then(b => { if (PL && PL.tok === SPK.tok) PL.blobs[k] = b; },
                               () => { if (PL){ PL.fail++; PL.try[k] = (PL.try[k] || 0) + 1; } })
    .then(() => {
      if (!PL || PL.tok !== SPK.tok) return;
      PL.pend[k] = 0; PL.running--;
      SPK.prep = PL.blobs.filter(Boolean).length; drawBar(); plPump();
    });
}
function plPump(){
  if (!PL || PL.tok !== SPK.tok) return;
  const end = Math.min(PL.segs.length, Math.max(PRE_START, PL.i + 1 + PRE_AHEAD));
  for (let k = PL.i; k < end && PL.running < 4; k++){
    if ((PL.try[k] || 0) < 3) plFetch(k);
  }
}
function plWaitAndStart(){
  const my = SPK.tok;
  const tick = () => {
    if (!PL || PL.tok !== my || !SPK.on) return;
    const ready = PL.blobs[0] && (PL.blobs[1] || PL.segs.length < 2);
    if (ready) return plPlay(0);
    if (PL.fail >= 3 && !PL.blobs[0]){
      const txt = PL.segs.map(s => s.t).join('\n');
      stopSpeak(); toast('Can’t reach the natural voice; using the device voice'); return sayNative(txt);
    }
    setTimeout(tick, 120);
  };
  tick();
}
function plPlay(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (k >= PL.segs.length) return stopSpeak();
  const b = PL.blobs[k];
  if (!b){
    if ((PL.try[k] || 0) >= 3){
      PL.i = k; SPK.i = k; return plPlay(k + 1);
    }
    SPK.buffering = true; SPK.i = k; drawBar(); plPump();
    return setTimeout(() => plPlay(k), 150);
  }
  SPK.buffering = false;
  PL.i = k; SPK.i = k;
  const els = audioPair(), a = els[PL.cur];
  a.src = URL.createObjectURL(b);
