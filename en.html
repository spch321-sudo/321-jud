<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"Able to Keep You from Stumbling","sub":"Contend, Beware, Keep","lv":"A","arc":"Contend · Beware · Keep","sec":[["1:1--4","Contend Earnestly for the Faith Once for All Delivered to the Saints: Those Who Are Kept and Those Who Crept In"],["1:5--10","Shown as an Example: Three Warnings and Michael the Archangel"],["1:11--16","Woe to Them: Three Roads, Five Pictures and the Prophecy of Enoch"],["1:17--21","Keep Yourselves in God’s Love: Remember, Build Up, Pray, Look For"],["1:22--23","Snatching Them out of the Fire: Mercy for Those Who Doubt"],["1:24--25","Able to Keep You from Stumbling: The Doxology"]],"serm":{"pts":[["Contending Earnestly for the Faith","1:1--4","“contend earnestly for the faith which was once for all delivered to the saints” — the one who writes is kept first, and only then contends for the faith; what we contend for is the faith once for all delivered, not our own face; and we contend because certain men have crept in secretly, turning the grace of God into indecency."],["Seeing Clearly the Road Out of Our Proper Place","1:5--16","“shown as an example” — those who did not believe after the Exodus, the angels who did not keep their proper place, Sodom; Cain, Balaam, Korah; even the archangel said only, “May the Lord rebuke you!” The warnings are a mirror for ourselves first; then they show clearly where that road ends."],["Those Who Are Held Go to Rescue Others","1:17--25","“Keep yourselves in God’s love” — but you are to build up, pray, keep, and look for mercy; have compassion on those who doubt, and snatch others out of the fire; and in the end the One who keeps us is the only God, who is able to keep you from stumbling."]]},"q":"Half past eleven at night, and you are still typing under a video. The speaker has preached grace in a very strange way, and the more you watch, the angrier you get. Your reply already runs to eight hundred words, and its last line reads: “People like you are exactly the ones Jude says crept in secretly.” Your finger hovers over “Send.”\nOn the same phone there is a private message from two hours ago that you have not opened yet. It is from the university student in your small group who is always asking questions: “I don’t think I really believe any more. Can I talk to you?”\nThe question this chapter asks is this: the energy with which I contend for the faith — does it come from the security of being held by God, or from a heart afraid of losing, afraid of being looked down on? Whom will I answer first: that speaker, or that young man who is contending within his own heart? And in the end, whose hand is it that keeps me — and keeps him?","truth":"The best way to deal with error is not to live inside the error studying it, but to turn round and move into a place: “Keep yourselves in God’s love, looking for the mercy of our Lord Jesus Christ to eternal life.” (1:21) — building ourselves up on the faith, praying in the Holy Spirit, looking for mercy: all of it is so that we stay in that place.\nWe can keep that place because we were first those “kept for Jesus Christ” (1:1), and at the end the One “who is able to keep them from stumbling” (1:24; the Chinese Union Version reads “keep you”) stands guard at both ends. God’s hand is on the outside, and we settle in on the inside — that is the whole of keeping.","mv":{"t":"Now to him who is able to keep them from stumbling, and to present you faultless before the presence of his glory in great joy","r":"Jude 1:24"},"card":["Jude has only one chapter, and that one chapter is the whole road of Contend · Beware · Keep. First comes Contend (1:1–4): those who are called, loved and kept are to “contend earnestly for the faith which was once for all delivered to the saints” (1:3), because some people are already sitting at the table. Next comes Beware (1:5–16): see clearly where the road of leaving our proper place leads — and the warnings are a mirror for ourselves first. Last comes Keep (1:17–25): settle into God’s love, go and show mercy, go and rescue, held by the God who is able to keep you from stumbling. What kind of contending Jude wants, he demonstrates himself in the letter: in verse 9 the archangel says only, “May the Lord rebuke you!”, and in verse 22 the first thing done for those who doubt is to show mercy. The order cannot be reversed: it is not that we are kept once we have won the argument; it is that we are kept first, and only then can we contend cleanly.","On the surface this letter is full of “these men”; its real subject is God. Before a single warning, God has already called us, loved us in the Father (so the Chinese Union Version; the WEB reads “sanctified by God the Father”) and kept us for Jesus Christ (1:1); he multiplies mercy, peace and love to people (1:2); he delivered the faith “once for all” to the saints, and no one needs to add another page (1:3); he saved a people out of Egypt, and he also judged those who did not believe (1:5); he has kept in bonds those who did not keep their proper place (1:6), and even the archangel left the rebuking of the devil to him (1:9); he will come with ten thousands of his holy ones (1:14); and in the end he is able to keep, able to present people faultless before the presence of his glory (1:24). The whole letter begins in God’s hand, and it ends in God’s hand.","In verse 9, Michael “contending” with the devil is διακρινόμενος in the Greek; in verse 22, “some … who doubt” (so the Chinese Union Version; the WEB renders it “making a distinction”) is διακρινομένους — the same word. Jude uses one word to describe an archangel contending with the devil and a believer contending within his own heart: the first is handed over to the Lord for judgement; the second is to be shown mercy. This changes the way we hold our phones today. We often use our strength the wrong way round: at a stranger preaching online we hurl the abusive words even the archangel did not dare to use; to the young person in our small group who says, “I don’t think I really believe any more,” we coldly reply, “You need to read your Bible more.” Before you press “Send,” first ask: which kind of contending am I facing right now?","The most uncomfortable sentence in this chapter is “Yet in the same way, these also in their dreaming …” (1:8) — the three warnings before it suddenly turn round and face those reading the letter. I may never creep secretly into anyone’s church, yet while clearing the tables after the love feast I may be gossiping in private about the new coworker; I may often grumble about the place God has given me, complaining that my service is too small and too unseen (1:16); I may say I am guarding the faith while drawing a line that puts everyone who disagrees with me outside the circle (1:19). Jude’s warnings are a mirror first for those who read the letter, and only then for others.","“May the Lord rebuke you!” (1:9). What most needs to be remembered from the whole chapter is an action: drawing back the hand. Michael is an archangel, and the one before him is the devil; in standing and in the rights of the case he had every reason to pass sentence on the spot, yet he “dared not,” and handed judgement back to the Lord. This sentence turns upside down the way we imagine “contending for the faith”: those who guard the truth do not need to take the judge’s seat; the surer we are that we stand on the side of truth, the more we must hand the authority to condemn back to him. And because the hand has been drawn back, it is free — free, in verse 22, to have compassion on someone who doubts.","This week, open the place where you argue most often — a comment section, the family group chat, the church’s LINE group. The next time you want to reply to a message that makes you angry, do three things first: write in one sentence which part of the faith I am guarding, not which person; delete every insulting adjective; and finally, like Michael, hand judgement back, praying, “Lord, judgement is yours, not mine,” before deciding whether to send it. Then do the other thing: find that private message you have never opened — from someone who doubts, or who is close to the fire — and this week ask them out for a meal, only to listen, in no hurry to answer.","Final integration: Saturday morning, half past eight, a rehabilitation ward.\nGrandpa had a stroke three months ago, and today, for the first time, he is going to let go of his walking frame and walk. The therapist has fastened a wide gait belt round his waist, and the length of it at his back is gripped tightly in her hand.\nHis grandson stands by the door. He is the university student in the small group with the most questions; only last month he messaged his group leader: “I don’t think I really believe any more.” Grandpa was the first in the whole family to believe in the Lord, and his grandson does not know how to face him.\nFirst step: Grandpa’s right foot drags. Second step: his knee gives way, and his whole body pitches forward.\nThe grandson rushes over, but he is still too slow. Before he can touch him, Grandpa has stopped in mid-air — the therapist has caught the belt with one firm pull.\nGrandpa, out of breath, actually laughs. He says to his grandson, “Look — my legs gave way, but I didn’t fall. Someone didn’t let go.”\nSlowly he straightens up, and walks three more steps. The grandson does not go back to the door; he goes to Grandpa’s other side and gently supports him.\nOn the little table by the bed is a card that Grandpa has someone read to him every day:\n“Now to him who is able to keep them from stumbling, and to present you faultless before the presence of his glory in great joy” (1:24)\nAn overcomer is not someone whose legs never give way; an overcomer is someone whose belt has always been held in God’s hand.\nThat day, the grandfather who had been caught was learning to walk, and the grandson who doubts was learning to hold someone up; and the One who holds both their belts in his hand has never once let go."],"self":"The “self-centred life” this chapter exposes often wears the cloak of “defending the truth”: the louder I argue online, the more it turns out that I am afraid of losing, afraid of losing face; I measure others by the marks, yet refuse to hold the mirror to myself first; I gossip in private about the place God has given me and grumble constantly, wanting to grasp a place where I will be more noticed.\nThe self-centred life can also put on “spiritual” clothes: drawing a line that puts those with questions outside the circle, so that I look as if I am standing more firmly; or the reverse — the moment my heart tightens, I assume I am the one marked out for condemnation, forgetting that the very first sentence of this letter says I am one of those “kept for Jesus Christ” (1:1).","t321":{"k":"Jesus is my role model: the “only Master” (1:4) whom those men deny is the very One we follow, and Peter remembered clearly how he himself faced attack: “When he was cursed, he didn’t curse back. When he suffered, he didn’t threaten, but committed himself to him who judges righteously.” (1 Pet 2:23) He held to the truth and never gave ground, yet he never answered slander with slander. He stretched out his hand to those who doubted: to Thomas he said, “Reach here your finger” (John 20:27); for Peter as he sank, “Immediately Jesus stretched out his hand, took hold of him” (Matt 14:31); to Peter, who was about to fall, he said, “I prayed for you, that your faith wouldn’t fail” (Luke 22:32). And he gave account to the Father: “I kept them in your name” (John 17:12). What I learn is not Jude’s severity, but this Lord who both guards the faith and never lets go.","g":"Let Jesus be King: this chapter asks us to give up two positions. The first is the judgement seat: in verse 9 Michael “dared not bring against him an abusive condemnation,” and I do not sit there either to pronounce on God’s behalf who has “crept in secretly”; I teach only the marks, and hand the list of names to the Lord. The second is the place that does not belong to me: verse 6 first says one thing in full — even angels who left the place God assigned them cannot escape a certain judgement; and in verse 11 Korah thought the service of the Levites too small and wanted to seize the priesthood. Only when the text has said its piece does this remind us of what 321 says: “pride is leaving our proper place and grasping power.” The seat of “our only Master” (1:4) has room for One alone, and I may not slip into it either. You can check yourself: is my recent discontent for the Lord’s name, or for the share I was not given?","p":"Establish God’s system: in “keep building up yourselves on your most holy faith” (1:20), “yourselves” is plural, and the Greek pictures building upward on a foundation — a group of people building one another up; whereas “who cause divisions” in verse 19 draws lines and pulls apart. A community willing to be built up needs at least three arrangements. First, clearly stated principles of teaching and a process for inviting speakers, discerned in prayer by two or three coworkers together — not relying on one person’s eyesight, and never holding a public trial in the group chat. Second, channels through which people can ask questions in good order and with respect: decisions explained clearly, accounts open, and leaders glad to be held accountable. This is not a guard against any one person; it is so that neither shepherds nor flock have to live in suspicion — and the warning in verse 12 about those who “feed themselves” is spoken first to everyone who serves. Third, an accompaniment list: who is doubting, who is close to the fire, who is in deep — each has someone walking alongside them, with referral when needed. Kingdom 321 Online Fellowship is scattered across many countries, and online small groups can divide the work in the same way, so that behind every square on the screen someone is remembered."},"grp":["[1. Icebreaker] The last time you “got into an argument” online, in the family group chat or at the dinner table — what was it about? Looking back, were you more keen to win the point, or to save face? (It can be something very small, like which restaurant to choose.)","[2. Heart check] Jude writes that Michael “dared not bring against him an abusive condemnation, but said, ‘May the Lord rebuke you!’” (1:9). Name one person or setting you have recently very much wanted to pronounce judgement on for God — which post, which meeting, which family member? If you handed judgement back to the Lord, which sentence would disappear from what you said that day?","[3. Gospel] Read 1:1 and 1:24: we are those “kept for Jesus Christ,” and God is the One “who is able to keep them from stumbling.” If what keeps me is God’s hand, and not how many arguments I have won, how will that change my anxiety about my own faith? And how will it change the tone in which I speak to someone who doubts?","[4. Action] Verses 22–23 speak of three kinds of people: those who doubt, those close to the fire, and those in deep. Name one person who comes to mind (just a form of address is fine). On which day this week, and in what way, will you contact them — a meal, a phone call, going somewhere with them? If they are in deep, which coworker will you invite first to go with you?","[5. Intercession] Pray by name for three kinds of people: a young person with many questions in their heart who does not dare to voice them at church — ask the Lord to make them bolder to ask; a brother or sister worn out from arguing for the faith online, whose heart is growing harder and harder — ask the Lord to help them hand judgement back to him; and someone right at the edge of the fire — in addiction, debt or a dangerous relationship — ask the Lord to send a hand to take hold of them, and to keep the one who pulls them out as well."],"prac":{"main":"This week I will first settle into God’s love, and then contend for the faith: not taking the judgement seat, and not letting go of those who doubt.","items":["Toward God: each morning read 1:20–21; when you reach “Keep yourselves in God’s love,” stop and say to the Lord, “Today I will not first prove that I am right; first I will stay in the place where you love me.” In the evening read 1:24, and hand to him the places where you almost stumbled today.","Toward yourself: write down the most recent thing that made you angry enough to want to reply, forward it or name someone. Beside it write two lines: which part of the faith am I guarding? Is what I am discontented about really the share God has not given me? When you have finished, pray for yourself: “Lord, rebuke the pride in my heart.”","Toward others: take the initiative to contact someone who doubts and arrange a meal or a phone call. This time just listen, and ask only, “Where are you most stuck?” — in no hurry to answer, and without sending them a string of videos. At the end tell them: “You can keep coming to ask questions; we’ll look for the answers together.”","Toward daily living: in any argument this week, before sending, first delete every insulting adjective, and do not name any pastor, church or speaker in a public setting; anything that really needs dealing with, ask about privately, or hand to the coworker in the church who is responsible.","Toward the mission: in your small group or coworkers’ meeting, propose a “verses 22–23 accompaniment list”: who is doubting, who is close to the fire, who is in deep — arrange for two people to walk alongside each one together. For those in deep, look up beforehand the counselling or addiction-recovery resources you can refer them to, so that no one has to go into the fire alone."]},"safe":["① Starting with 321’s “pride is leaving our proper place and grasping power,” then using “didn’t keep their first domain” in 1:6 and Korah in 1:11 as illustrations, and saying, “These two verses prove 321’s principle.”","Verse 6 itself speaks of the certainty of God’s judgement — even angels who left the place God assigned them are kept in bonds for the judgement of the great day; verse 11 speaks of three downward roads and of “Woe to them!” Only when the meaning of the text has been fully preached may we say, “this reminds us of 321”; use the text as an illustration of a principle, and what the congregation remembers is a formula, not the God who judges and who keeps.","The test: after you have preached verse 6, does the congregation first remember God’s judgement and his keeping, or a 321 slogan?","② Using “contend earnestly” in 1:3 to endorse online flame wars, abuse in group chats, and humiliating people who hold different views: “Jude tells us to contend, so there is no need to be polite.”","ἐπαγωνίζεσθαι is striving hard for the prize in the arena, not quarrelling. What we contend for is the faith once for all delivered — not people, not face, not the distinctives of a denomination; and Jude himself shows the manner: in verse 9, no slander, judgement handed to the Lord; in verses 22–23, mercy and rescue (for where these notes stand on the whole letter, see “Contending for the faith without being contentious: what kind of contest is “contend earnestly”?”). Win an argument but lose the likeness of Christ, and that contest is already lost.","The test: after you have preached verse 3, does the congregation know better which faith they are to contend for and in what tone — or do they have more reason to go and abuse people?","③ Naming, from the pulpit, in a group chat or in a video, some pastor, church, denomination or online preacher of today, and saying that they are the men who “crept in secretly.”","Jude gives marks, not a list of names: turning grace into indecency and denying our only Master (1:4), feeding themselves (1:12), grumbling and flattery (1:16), causing divisions (1:19); and in verse 8, “these also in their dreaming” first turns the mirror on those reading the letter. Witch-hunts by name turn the church into a courtroom, and the pulpit into our own judgement seat (for where these notes stand on the whole letter, see “Discerning false teaching: does Jude give us marks, or a list of names?”).","The test: does the congregation take home a set of marks they can hold up to themselves first, or a list of names they can use to attack others?","④ When preaching Sodom in 1:7, making jokes about a particular group, sticking labels on them or using humiliating language; or the reverse — skipping the whole verse for fear of controversy, or saying, “The Bible’s sexual ethics are out of date.”","We hold to the Bible’s sexual ethics (Rom 1:26–27; 1 Cor 6:9–11), and we also set side by side the three readings of “strange flesh,” remembering that Sodom’s sin was not just one thing: “Behold, this was the iniquity of your sister Sodom: pride, fullness of bread, and prosperous ease was in her and in her daughters. She also didn’t strengthen the hand of the poor and needy.” (Ezek 16:49). When Paul has finished his list, he goes on: “Some of you were such, but you were washed.” (1 Cor 6:11) — the same passage must hold grace and repentance, and must hold the mirror to ourselves first.","The test: when a brother or sister who is struggling in the area of sexuality and wants to follow the Lord has heard this, do they feel caught and held, knowing the way home — or do they want to slip out of the church by the back door?","⑤ Using “despise authority, and slander celestial beings” in 1:8 to silence church members’ legitimate questions to church leaders: “If you ask about the accounts or the decisions, you are slandering those in high positions.”","“Authority” most likely refers to the Lord’s authority, and “celestial beings” (in the Chinese Union Version, “those in positions of honour”) most likely to angels, the glorious ones; and the people condemned in verse 12 are precisely “shepherds who without fear feed themselves” (this reminds us of Ezek 34:2; and 1 Pet 5:3, “not as lording it over those entrusted to you”). Questions raised in good order and with respect are not despising authority. Using this verse to protect leaders from accountability turns a letter that protects the flock into a letter that protects the shepherds; and conversely, using verse 12 to hint at a particular pastor in front of the congregation is another kind of slander.","The test: when a coworker with questions about some church decision has heard this, do they know better that they can raise them in good order and with respect, or are they more sure that they had better keep their mouth shut?","⑥ Building a whole angelology or end-times script out of verse 9 and verses 14–15, or saying, “Jude quotes them, so 1 Enoch and the Assumption of Moses must be Scripture too”; or the reverse: “Jude quotes non-canonical books, so this letter is unreliable.”","What is inspired is the letter of Jude, not the books it quotes; quoting one true sentence is not endorsing a whole book — Paul quoted Greek poets too (Acts 17:28; Titus 1:12). We neither build a separate theology out of non-canonical writings nor use this to belittle Jude (for where these notes stand on the whole letter, see “Scripture quoting non-canonical books: what does it mean that Jude cites the Assumption of Moses and 1 Enoch?”).","The test: after you have preached these two passages, does the congregation read Jude more confidently as the word of God, or start searching online for non-canonical books — or start doubting this letter?","⑦ Turning “rebuking the devil” into a performance: the whole church shouting loudly, commanding the devil, the louder the more spiritual — and calling it “spiritual warfare according to Jude.”","Verse 9 is exactly the counter-example: even the archangel, facing the devil, “dared not bring against him an abusive condemnation, but said, ‘May the Lord rebuke you!’” (this reminds us of Zech 3:2). Resisting the devil is a biblical command (Jas 4:7), and the spiritual world is real, yet the power lies not in volume but in the Lord; put the focus on the devil, and the congregation will fear the devil more than they trust Christ (for where these notes stand on the whole letter, see “Angels, the devil and spiritual warfare: how does Jude want us to see the unseen world?”).","The test: after hearing this, does the congregation rely more single-mindedly on the Lord who has already won, or become more curious, more afraid and more eager to perform?","⑧ Treating those in 1:22 who “doubt” (so the Chinese Union Version) as apostates, enemies or men who “crept in secretly”: “You have so many questions — that shows you were never born again.”","“Doubt” and Michael’s “contending” in verse 9 are the same Greek word (the WEB renders it in 1:22 as “making a distinction”): it is a heart in the middle of an inner argument, wavering — which is not the same as leaving; and the first verb is “have compassion,” not correction, still less expulsion. The Jude who wrote this sentence once did not believe in his own brother: “For even his brothers didn’t believe in him.” (John 7:5) (for where these notes stand on the whole letter, see “Should these debates shake anyone’s faith?”).","The test: when a young person with many doubts in their heart has heard this, do they dare more to bring their questions to the small group, or have they learned to keep quiet — or simply to leave?","⑨ Using “long ago written about for this condemnation” in 1:4 (in the Chinese Union Version, “ordained of old to this condemnation”) to pass sentence on people: “Some people are born predestined to perdition”; or letting sensitive members of the congregation go home with the fear, “Have I been condemned in advance?”","The Greek προγεγραμμένοι means “written beforehand”: the Old Testament and Enoch’s prophecy long ago wrote down where this road ends — what has been written and fixed is the end of the road, not the name of any particular person today. And the same letter opens and closes with those “kept for Jesus Christ” (1:1) and the One “who is able to keep them from stumbling” (1:24) (for where these notes stand on the whole letter, see “Kept by God and keeping ourselves: if God keeps me, why must I keep myself?”).","The test: when a brother who often doubts his salvation has heard this, is he more settled, kept by the Lord’s hand — or does he lie awake all night?","⑩ Defining “praying in the Holy Spirit” in 1:20 as “it only counts if you speak in tongues”; or the reverse: “Speaking in tongues is emotionalism, even heresy; praying in the Holy Spirit has nothing to do with tongues.”","These notes set two readings of this phrase side by side: it includes prayer in tongues (1 Cor 14:14–15), or it is all prayer guided by the Holy Spirit and done in partnership with him (Eph 6:18; Rom 8:26). Paul himself says, “Do all speak with various languages?” (1 Cor 12:30), and also, “don’t forbid speaking with other languages” (1 Cor 14:39). The point it lands on is a life of prayer that relies on the Holy Spirit, in contrast with “not having the Spirit” in verse 19.","The test: after hearing this, does the congregation want more to rely on the Holy Spirit in their everyday prayer, or start sorting people into two classes by whether or not they speak in tongues?","⑪ Using the setting to cancel the principle: “These were false teachers at first-century love feasts; there are no such people today, so it has nothing to do with us”; or transplanting the setting wholesale: “Every new song, every new form of meeting, every new translation has crept in secretly.”","The three questions for reading a letter must be followed all the way through. The setting: a band of itinerant people sat down at the love feasts of house churches and preached grace as a licence for indecency (for where these notes stand on the whole letter, see “Date and setting: when was Jude written, and who were the men who crept in?”). The principle: the core of the gospel was delivered “once for all” and needs no new revelation to complete it; grace is not a licence for indecency. Where it lands today: the pulpit, courses, small-group recommendations and online teaching. “Once for all delivered” guards the content, not the form or the tools of our meetings.","The test: after hearing this, does the congregation know that this letter lands today in their own pulpit, group chats and phones — or do they feel it is either too remote, or a weapon for opposing everything new?","⑫ Preaching the whole letter as a showcase for Jude’s severity and eloquence: “Look how satisfyingly Jude lays into them — we should learn to be just as merciless.”","Jude could plainly have written “the brother of Jesus,” yet he wrote “a servant of Jesus Christ” (1:1); he gives more than ten verses to describing the darkness, yet gives the last two entirely to praise (1:24–25). The focus is on the One “who is able to keep them from stumbling,” not on the writer’s severity; learn Jude’s tone without learning how he kneels, and a letter of praise gets preached as a letter of abuse.","The test: after hearing this, does the congregation admire Jude’s severity more, or love more the God who is able to keep people from stumbling?","⑬ Using “hating even the clothing stained by the flesh” in 1:23 to make people keep their distance from those caught in sin: “Don’t eat with him, or you’ll be contaminated.”","In the Chinese Union Version the main verb of this same sentence is “have mercy” (the WEB reads “some save … with fear”); what is hated is the clothing, not the person wearing it — this reminds us of Zech 3:3–4, where God himself has the filthy garments taken off Joshua and clothes him with rich clothing. “With fear” means fearing God and also being on guard about ourselves, not pushing people away; the Lord himself was talked about: “This man welcomes sinners, and eats with them.” (Luke 15:2).","The test: when someone who has just walked out of a period of sin and is sitting in the back row has heard this, do they feel that someone is willing to come close to them, or that they are being treated like a contagious disease?","⑭ Using “snatching them out of the fire” in 1:23 to encourage people to go in single-handed to rescue those in deep: “If you love him, you carry it alone — no need to find anyone else, no need for professionals.”","In the same sentence Jude says “with fear”: those who rescue can be dragged down too — “looking to yourself so that you also aren’t tempted” (Gal 6:1). Faced with addiction, violence, self-harm or a dangerous relationship, ask coworkers to walk alongside together, and refer those who need professional help; preach rescue as a hero drama, and rescuer and rescued will be burned together.","The test: after you have preached this verse, does the congregation know better whom to take with them and when to refer — or want more to rush into the fire alone to prove their love?","⑮ Using “the Lord came with ten thousands of his holy ones” in 1:14 and “In the last time there will be mockers” in 1:18 to calculate dates, or to say, “This is so-and-so today, this is such-and-such an event.”","In the New Testament “the last time” refers to the whole period between Christ’s first coming and his second (Heb 1:2); the Lord will surely come again, but “It isn’t for you to know times or seasons which the Father has set within his own authority.” (Acts 1:7) Turn prophecy into a timetable, and people swing between panic and disappointment, forgetting to stay in God’s love and wait.","The test: after hearing this, does the congregation look more quietly for the Lord’s mercy, or rush more to forward end-times calculations?","⑯ Because of the fear in 1:4 of “turning the grace of our God into indecency,” the pulpit no longer dares to preach grace, and instead tries to keep people by adding conditions, rules and threats: “Preach too much grace and everyone will run wild.”","What Jude opposes is “turning” grace into indecency, not grace itself; the same letter opens with “Mercy to you and peace and love be multiplied.” (1:2) and closes with looking for mercy to eternal life (1:21). The grace that saves is itself “instructing us to the intent that, denying ungodliness and worldly lusts, we would live soberly” (Titus 2:12); guarding against licence with legalism is only another way of denying our only Master.","The test: after hearing this, does the congregation receive grace more deeply and so become more willing to be holy, or feel that grace is dangerous and that they had better keep the rules by their own strength?"]}],"txt":{"1":["Jude, a servant of Jesus Christ, and brother of James, to those who are called, sanctified by God the Father, and kept for Jesus Christ:","Mercy to you and peace and love be multiplied.","Beloved, while I was very eager to write to you about our common salvation, I was constrained to write to you exhorting you to contend earnestly for the faith which was once for all delivered to the saints.","For there are certain men who crept in secretly, even those who were long ago written about for this condemnation: ungodly men, turning the grace of our God into indecency, and denying our only Master, God, and Lord, Jesus Christ.","Now I desire to remind you, though you already know this, that the Lord, having saved a people out of the land of Egypt, afterward destroyed those who didn’t believe.","Angels who didn’t keep their first domain, but deserted their own dwelling place, he has kept in everlasting bonds under darkness for the judgment of the great day.","Even as Sodom and Gomorrah and the cities around them, having in the same way as these given themselves over to sexual immorality and gone after strange flesh, are shown as an example, suffering the punishment of eternal fire.","Yet in the same way, these also in their dreaming defile the flesh, despise authority, and slander celestial beings.","But Michael, the archangel, when contending with the devil and arguing about the body of Moses, dared not bring against him an abusive condemnation, but said, “May the Lord rebuke you!”","But these speak evil of whatever things they don’t know. They are destroyed in these things that they understand naturally, like the creatures without reason.","Woe to them! For they went in the way of Cain, and ran riotously in the error of Balaam for hire, and perished in Korah’s rebellion.","These are hidden rocky reefs in your love feasts when they feast with you, shepherds who without fear feed themselves; clouds without water, carried along by winds; autumn trees without fruit, twice dead, plucked up by the roots;","wild waves of the sea, foaming out their own shame; wandering stars, for whom the blackness of darkness has been reserved forever.","About these also Enoch, the seventh from Adam, prophesied, saying, “Behold, the Lord came with ten thousands of his holy ones,","to execute judgment on all, and to convict all the ungodly of all their works of ungodliness which they have done in an ungodly way, and of all the hard things which ungodly sinners have spoken against him.”","These are murmurers and complainers, walking after their lusts—and their mouth speaks proud things—showing respect of persons to gain advantage.","But you, beloved, remember the words which have been spoken before by the apostles of our Lord Jesus Christ.","They said to you, “In the last time there will be mockers, walking after their own ungodly lusts.”","These are those who cause divisions and are sensual, not having the Spirit.","But you, beloved, keep building up yourselves on your most holy faith, praying in the Holy Spirit.","Keep yourselves in God’s love, looking for the mercy of our Lord Jesus Christ to eternal life.","On some have compassion, making a distinction,","and some save, snatching them out of the fire with fear, hating even the clothing stained by the flesh.","Now to him who is able to keep them from stumbling, and to present you faultless before the presence of his glory in great joy,","to God our Savior, who alone is wise, be glory and majesty, dominion and power, both now and forever. Amen."]},"blk":{"1":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·</p><p lang=\"grc\">ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη πληθυνθείη.</p>","lit":"<p>Jude, a slave of Jesus Christ, and brother of James, writing to those who are called, loved in God the Father and kept for Jesus Christ:</p><p>May mercy, peace and love be multiplied to you.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>Ἰησοῦ Χριστοῦ δοῦλος</td><td>Iēsou Christou doulos</td><td>a slave of Jesus Christ</td><td>No mention of blood ties, only of lordship</td></tr><tr><td>ἀδελφὸς δὲ Ἰακώβου</td><td>adelphos de Iakōbou</td><td>and brother of James</td><td>So readers know who he is: James of the Jerusalem church</td></tr><tr><td>ἐν θεῷ πατρὶ ἠγαπημένοις</td><td>en theō patri ēgapēmenois</td><td>loved in God the Father</td><td>◆ Perfect passive; RP reads “sanctified”</td></tr><tr><td>Ἰησοῦ Χριστῷ τετηρημένοις</td><td>Iēsou Christō tetērēmenois</td><td>kept for Jesus Christ</td><td>◆ Perfect passive; Track 1, first stop</td></tr><tr><td>κλητοῖς</td><td>klētois</td><td>called ones</td><td>Placed last: the head of the whole phrase</td></tr><tr><td>ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη</td><td>eleos hymin kai eirēnē kai agapē</td><td>mercy to you, and peace, and love</td><td>Three blessings; Track 3, first stop</td></tr><tr><td>πληθυνθείη</td><td>plēthyntheiē</td><td>may it be multiplied</td><td>Optative mood, rare in the New Testament</td></tr></table>","gram":"<p><strong>δοῦλος (doulos) and “brother.”</strong>Jude introduces himself with just two nouns: Ἰησοῦ Χριστοῦ δοῦλος (Iēsou Christou doulos), ἀδελφὸς δὲ Ἰακώβου (adelphos de Iakōbou). δοῦλος (doulos) is a slave — someone who belongs to a master and has no standing of his own. These notes take the view of church tradition and of most scholars: this Jude is the Lord Jesus’ brother by birth (Matt 13:55; Mark 6:3), and his elder brother James was the leader of the Jerusalem church (Acts 15:13; Gal 1:19). Toward James he uses ἀδελφός (adelphos); toward Jesus he does not — he uses only δοῦλος (doulos). James takes the same posture when he writes: “James, a servant of God and of the Lord Jesus Christ” (Jas 1:1). Neither brother plays the family card. The other views (“Judas the son of James” among the Twelve [Luke 6:16], or a pseudonymous work) are set out on the issue page “Author, recipients and canonical status: who is “Jude, brother of James”? How was this letter received into the canon?”; but the most natural reading of the introduction “brother of James” remains the first.</p><p><strong>All three words describing the readers are passive.</strong>τοῖς ἐν θεῷ πατρὶ ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς (tois en theō patri ēgapēmenois kai Iēsou Christō tetērēmenois klētois): two perfect passive participles, plus a verbal adjective. κλητοῖς (klētois) comes last; it is the head of the phrase, “the called,” and the two participles before it describe them. The perfect says that being loved and being kept have already happened, and the result still holds today. Not one of the three words is something the readers did themselves; the readers are people whom God has made. τετηρημένοις (tetērēmenois) is the first stop of the volume’s main track, τηρέω (tēreō); it will appear again in verses 6, 13 and 21, and in verse 24 it gives way to φυλάξαι (phylaxai) to close.</p><p><strong>Ἰησοῦ Χριστῷ (Iēsou Christō) has no preposition.</strong>This simple dative can be read two ways: (1) a dative of advantage, kept “for Jesus Christ” — reserved for the Lord until the day he comes again; the Chinese Union Version follows this reading; (2) an instrumental dative, kept “by Jesus Christ,” kept through him. The two readings arrive at the same place: the keeping is God’s work, and its destination is the Lord himself. These notes take (1) as primary, but (2) also fits the whole letter, because verses 24–25 say that the one who keeps us is “the only God,” and that it is “through our Lord Jesus Christ.”</p><blockquote><p>◆ Textual variant: SBLGNT, WH, Treg and NA28 read ἠγαπημένοις (ēgapēmenois), “loved,” and the Chinese Union Version, “loved in God the Father,” follows this reading; RP (the Byzantine majority manuscripts) reads ἡγιασμένοις (hēgiasmenois), “sanctified” (the reading WEB follows). “Loved in God the Father” is an unusual expression, and copyists are more likely to have changed it to “sanctified” after the familiar pattern of 1 Cor 1:2, “sanctified in Christ Jesus,” than the other way round; the earlier manuscripts also support “loved.” These notes follow SBLGNT and the Chinese Union Version.</p></blockquote><p><strong>πληθυνθείη (plēthyntheiē) is in the optative mood.</strong>The optative is uncommon in the New Testament; the greetings of 1 and 2 Peter use this same word (1 Pet 1:2; 2 Pet 1:2). Jude lists three things: ἔλεος (eleos), εἰρήνη (eirēnē), ἀγάπη (agapē). Paul’s greetings are usually “grace and peace”; Jude puts mercy first, and ἀγάπη (agapē) echoes the “loved” of verse 1. ἔλεος (eleos) is the first stop of Track 3, and it appears three more times, in verses 21, 22 and 23: those who received mercy later become those who give it.</p>","exp":"<p>[Background] John 7:3–5; Acts 1:14 (John Study Notes, Chapter 7; Acts Study Notes, Chapter 1)</p><p>“Jude, a servant of Jesus Christ, and brother of James” (Jude 1:1). Here is a man who could have written “the brother of Jesus.” That is the most dazzling title in the world, and he did not use a single word of it.</p><p>The Gospels do not polish his past. When the Lord was preaching in Galilee, his brothers urged him to go up to Judea and make a name for himself, and John coolly adds: “For even his brothers didn’t believe in him” (John 7:5). Earlier still, his relatives even went out to take hold of him, “for they said, ‘He is insane’” (Mark 3:21). It was the resurrection that changed this family. After the Lord rose, among those in the upper room who “with one accord continued steadfastly in prayer” were “his brothers” (Acts 1:14). Between unbelief and servanthood stands an elder brother who came back to life.</p><p>So the word “servant” is no mere politeness. A younger brother who grew up eating at the same table as Jesus, who watched this “carpenter” (Mark 6:3) at work, in whose family someone once said he was out of his mind — this brother later called him Master, and called himself a slave. This is the quietest act of selflessness in the whole New Testament. When we preach this verse, the focus is not on how humble Jude was, but on the Lord who can turn an unbelieving brother into a servant. Anyone sitting in church today whose family still does not believe can find hope here: God changes people, and he can change even the closest and most unyielding one.</p><p>Next Jude says who his readers are: “to those who are called, sanctified by God the Father, and kept for Jesus Christ” (Jude 1:1) — where WEB has “sanctified,” the Chinese Union Version, following the earlier manuscripts, reads “loved in God the Father.” In a moment this letter will speak of men who crept in secretly, of angels kept in bonds, of Sodom, of the blackness of darkness. But before a single warning, Jude first settles his readers in their place: you are called, you are loved, you are kept. All three are God’s doing. Anyone whose heart tightens on reading in verse 4 of those “long ago written about for this condemnation,” or whose heart goes cold on reading in verse 13 of “the blackness of darkness,” should come back to this verse: those who are “kept for Jesus Christ” (Jude 1:1). The assurance of the whole letter begins here and closes in verse 24 with “him who is able to keep them from stumbling”; the darkness in between is held between two acts of keeping.</p><p>“Mercy to you and peace and love be multiplied” (Jude 1:2). In a letter that calls people to contend earnestly for the faith, the first blessing is mercy. The order matters: only those who have first received mercy will not forget, when they contend, that they too stand by mercy. Nor does Jude ask for just a little; he asks that it “be multiplied.” In days of battle, God’s supply is not rationed.</p><p>321 speaks of selflessness: the Lord’s brother calls himself a servant. It also speaks of the “2” of 235, spiritual companions: behind the words “brother of James” are two brothers who once disbelieved together, and later served together.</p>"},{"a":3,"z":4,"star":3,"grk":"<p lang=\"grc\">Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.</p><p lang=\"grc\">παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.</p>","lit":"<p>Beloved, while I was making every effort to write to you about our common salvation, I found it necessary to write to you, urging you to fight hard for the faith that was once and for all handed over to the saints.</p><p>For certain people have slipped in quietly — people who long ago were written down for this judgement — ungodly people, who turn the grace of our God into licentiousness, and deny our only Master and Lord, Jesus Christ.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>Ἀγαπητοί</td><td>Agapētoi</td><td>beloved</td><td>Track 4; CUV adds “brothers”</td></tr><tr><td>πᾶσαν σπουδὴν ποιούμενος γράφειν</td><td>pasan spoudēn poioumenos graphein</td><td>making every effort to write</td><td>Present tense: the original plan</td></tr><tr><td>ἀνάγκην ἔσχον γράψαι</td><td>anankēn eschon grapsai</td><td>I found it necessary to write</td><td>Aorist: a letter forced to change its subject</td></tr><tr><td>ἐπαγωνίζεσθαι</td><td>epagōnizesthai</td><td>to fight hard for …</td><td>◆◆ Only here in the New Testament; a word from the arena</td></tr><tr><td>τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει</td><td>tē hapax paradotheisē tois hagiois pistei</td><td>for the faith once handed over to the saints</td><td>◆ ἅπαξ: once and for all</td></tr><tr><td>παρεισέδυσαν</td><td>pareisedysan</td><td>slipped in from the side</td><td>◆◆ Only here in the New Testament</td></tr><tr><td>οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα</td><td>hoi palai progegrammenoi eis touto to krima</td><td>long ago written down for this judgement</td><td>◆◆ An outcome written down long ago, not a sentence passed on persons</td></tr><tr><td>χάριτα μετατιθέντες εἰς ἀσέλγειαν</td><td>charita metatithentes eis aselgeian</td><td>turning grace into licentiousness</td><td>Grace preached as a licence</td></tr><tr><td>τὸν μόνον δεσπότην καὶ κύριον ἡμῶν</td><td>ton monon despotēn kai kyrion hēmōn</td><td>the only Master and our Lord</td><td>◆ One article governs both titles</td></tr></table>","gram":"<p><strong>A letter forced to change its subject.</strong>πᾶσαν σπουδὴν ποιούμενος γράφειν (pasan spoudēn poioumenos graphein) is a present participle with a present infinitive: Jude “was” putting all his energy into preparing a letter about “our common salvation”; ἀνάγκην ἔσχον γράψαι (anankēn eschon grapsai) switches to the aorist: at a certain moment he found he “had to” write a different one. ἀνάγκη (anankē) is compulsion, necessity. περὶ τῆς κοινῆς ἡμῶν σωτηρίας (peri tēs koinēs hēmōn sōtērias): κοινός (koinos) means “common” — a salvation shared by all, in which everyone has a part, with no “yours” and “mine.”</p><blockquote><p>◆ Textual variant: SBLGNT, WH, Treg and NA28 have ἡμῶν (hēmōn), “our common salvation,” which matches the Chinese Union Version, “the salvation we share”; RP lacks ἡμῶν (hēmōn) and reads simply “the common salvation.” The two readings mean almost the same thing; “common” already implies “our.” These notes follow SBLGNT.</p></blockquote><p><strong>ἐπαγωνίζεσθαι (epagōnizesthai) is a word from the arena.</strong>It occurs only here in the New Testament. Its root, ἀγών (agōn), is a contest, an arena, a wrestling ground; in Heb 12:1, “run with perseverance the race that is set before us,” the “race” is ἀγῶνα (agōna). The prefix ἐπί (epi) adds the sense of “giving everything for something.” This is the picture of an athlete straining for the prize — not a quarrel, and not name-calling. The related ἀγωνίζου (agōnizou) appears in “Fight the good fight of faith” (1 Tim 6:12); Paul also wants the Philippians to be “with one soul striving for the faith of the Good News” (Phil 1:27), where he uses another word from the sports ground, συναθλοῦντες (synathlountes).</p><p><strong>What the contest is for.</strong>The object of the infinitive is the dative τῇ (tē) … πίστει (pistei), “for the faith.” πίστις (pistis) here is not the act of believing but the content of what is believed; the Chinese Union Version renders it “the true way,” which is exactly right. ἅπαξ (hapax) means “once and for all,” the same word used in Heb 9:26–28 of Christ being offered “once”; παραδοθείσῃ (paradotheisē) is an aorist passive participle — the handing over is complete. παραδίδωμι (paradidōmi) is the word of tradition, of passing on; Paul uses it too: “I delivered to you first of all that which I also received” (1 Cor 15:3). It was entrusted to τοῖς ἁγίοις (tois hagiois), the community of the saints, not to the private keeping of any one leader.</p><p>“Once for all delivered” can be understood in two ways: (1) the core of the gospel has been delivered complete, and needs no new revelation to supplement it; (2) every doctrinal detail and every denominational tradition is frozen, and any new interpretation is a departure. These notes take (1), not (2): Jude is resisting the “dreamers” of verse 8, who wanted to supplement, and even rewrite, the apostles’ gospel with their visions; but that does not make every interpretation of ours today, or every denominational distinctive, equal to “the faith once delivered.” For this question see the issue page “What is “the faith which was once for all delivered to the saints”? How can “contending earnestly” live alongside love?”.</p><p><strong>Verse 4 opens with γάρ (gar)</strong>, explaining why he had to write. παρεισέδυσαν (pareisedysan) occurs only here in the New Testament: παρά (para), “alongside”; εἰς (eis), “into”; δύνω (dynō), “to sink, to slip in” — like squeezing through a gap in the fence into the sheepfold instead of using the gate. When Paul tells the Galatians about the men in Jerusalem, “the false brothers secretly brought in” (Gal 2:4), he uses a word of similar meaning, παρεισάκτους (pareisaktous). These were not persecutors outside; they were people already inside.</p><p><strong>οἱ πάλαι προγεγραμμένοι (hoi palai progegrammenoi) can be read two ways.</strong>προγράφω (prographō) literally means “to write beforehand”; it is the word in “whatever things were written before” (Rom 15:4); the Chinese Union Version renders it “ordained of old.” (1) <strong>An outcome written down long ago</strong>: πάλαι (palai), “long ago,” refers to the Old Testament examples and to Enoch’s prophecy, which had long since written down the end of people of this kind; what Jude goes on to list in verses 5–16 are exactly those “written” things. Most commentators read it this way. (2) <strong>Predestined to perdition</strong>: God in eternity predestined certain people to punishment. The difficulty with (2) is that elsewhere in the New Testament προγράφω (prographō) always means to write down or to portray publicly (Rom 15:4; Gal 3:1); it is not a technical term for predestination; and κρίμα (krima) is preceded by τοῦτο (touto), “this judgement,” referring to the judgement written down in what follows. These notes take (1): what has been written down is this road and its judgement, not the name of any person today.</p><p><strong>τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν (tēn tou theou hēmōn charita metatithentes eis aselgeian).</strong>χάριτα (charita) is an uncommon form of χάρις (charis). μετατίθημι (metatithēmi) means “to transfer, to change over”; Paul marvels that the Galatians are “deserting him who called you in the grace of Christ” (Gal 1:6), and “deserting” is this word. ἀσέλγεια (aselgeia) is unrestrained indulgence, often of a sexual kind. They changed what grace is for: from rescuing people out of sin into a licence that lets people sin with an easy mind.</p><p><strong>One article governs two nouns.</strong>τὸν μόνον δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν (ton monon despotēn kai kyrion hēmōn Iēsoun Christon): the article τὸν (ton) governs both δεσπότην (despotēn) and κύριον (kyrion). By the usual pattern of Greek (scholars call it the Granville Sharp rule: two singular common nouns referring to persons, governed by one article and joined by καί (kai), normally refer to the same person), “the only Master” and “our Lord” both refer to Jesus Christ. The Chinese Union Version expresses this apposition with a dash, “the only Master — our Lord Jesus Christ”; its marginal note, “or: and our,” reads “the only Master” as God the Father and “our Lord Jesus Christ” as another person.</p><blockquote><p>◆ Textual variant: SBLGNT, WH, Treg and NA28 read τὸν μόνον δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν (ton monon despotēn kai kyrion hēmōn Iēsoun Christon); RP adds θεόν (theon) after δεσπότην (despotēn), giving “the only Master, God, and our Lord Jesus Christ” (the reading WEB follows), which makes the two-person reading more obvious. θεόν (theon) is absent from the earlier manuscripts and may have been added by copyists to distinguish the Father from the Son. These notes follow SBLGNT and the main text of the Chinese Union Version: the only Master is Jesus Christ. δεσπότης (despotēs) is the master of slaves, standing directly opposite the δοῦλος (doulos) of verse 1: Jude calls himself a slave, while these men disown the Master. ἀρνούμενοι (arnoumenoi) is a present participle: “denying” is an ongoing pattern of life, most often a denial by deeds rather than necessarily by words (Titus 1:16).</p></blockquote>","exp":"<p>[2 Pet] 2 Pet 2:1–3 (2 Peter Study Notes, Chapter 2)</p><p>“Beloved, while I was very eager to write to you about our common salvation, I was constrained to write to you exhorting you to contend earnestly for the faith which was once for all delivered to the saints” (Jude 1:3). What Jude originally meant to write about was the richness of salvation, the share of grace we all have in common. Once he took up his pen, he found that someone had cut a hole in the fence of the sheepfold. He set aside the letter he wanted to write, and wrote the one he had to write.</p><p>This is a pastor’s most real situation. We want to preach the richness of grace, and sometimes we must first guard grace from being twisted. But notice: the letter that was never written did not disappear. “Our common salvation” is still the foundation of this urgent letter; what Jude is guarding is the very thing he had wanted to celebrate. Contending is not a different subject alongside salvation; it is so that salvation is not rewritten.</p><p>“Contend earnestly” is the most easily misused phrase in the whole letter. The Greek is a word from the arena: an athlete straining for the prize, a wrestler giving everything. It is not quarrelling, not winning arguments, and still less humiliating the other side. What the contest is for, Jude states plainly: “the faith which was once for all delivered to the saints” — not people, not our own face, and not the distinctives of our own denomination. How to contend, Jude himself models in the same letter: in verse 9 Michael uses no slanderous words, saying only “May the Lord rebuke you!”; in verses 20–21 we first keep ourselves in God’s love; in verses 22–23 we show mercy to those who doubt, and snatch people out of the fire. So this verse cannot be used to justify online flame wars, or to humiliate brothers and sisters who hold a different view. Defend the faith with pride, and before you have kept the faith you have already lost its likeness.</p><p>“Once for all delivered” also gives us a settledness. The faith is not a product that gets a new version every season; it needs no newer dream to supplement it. What God has spoken in Christ he has spoken completely; the apostles have handed it on; our part is to receive it, hold it fast and pass it on. This does not mean that no generation needs to think; it means we need not chase every “new revelation.” The gospel is enough.</p><p>“For there are certain men who crept in secretly” (Jude 1:4). They are not an enemy army besieging the city from outside; they are people already sitting at the table, sharing the love feasts (1:12). What Jude gives is marks, not a list of names: first, “turning the grace of our God into indecency” (Jude 1:4); second, denying “our only Master” (Jude 1:4) — in the Chinese Union Version, ‘the only Master — our Lord Jesus Christ’ (1:4). Pulpits and small groups today, too, should teach only the marks, and never name any pastor, church, denomination or online preacher. The marks shine on ourselves first: have I used “God will forgive me anyway” as a reason for indulgence? I call him Lord with my lips — but in my life, who is in charge?</p><p>Grace preached as a licence is the oldest misuse of all. Paul answered it long ago: “Shall we continue in sin, that grace may abound? May it never be!” (Rom 6:1–2). True grace rescues people out of sin; it does not let them live in sin more comfortably.</p><p>The Chinese Union Version’s phrase, ‘ordained of old to this condemnation’ (1:4), must be read precisely. The Greek says “written down long ago” — WEB: “long ago written about for this condemnation” (Jude 1:4). The Old Testament examples and Enoch’s prophecy had long since written down where this road ends, and Jude lists them one by one in verses 5–16. What has been written down is where this road leads, not the name of any person today. Jude passes sentence on no one, and neither may the pulpit. A brother or sister who reads this and panics — “Have I been condemned?” — should be brought back to the beginning and end of this letter: you are “kept for Jesus Christ” (Jude 1:1), and God is “him who is able to keep” you “from stumbling” (1:24). Those who are troubled by this question are, more often than not, exactly the people who care about the Lord.</p><p>321 says, “Let Jesus be King”: the Master is the “only” one; there is no room for a second, and no room for me. It also says, “Jesus is my role model”: the one these men deny by their lives is the very one we are to follow, step by step. And “the Bible is my standard”: the standard was delivered “once for all”; it is not endlessly being renewed.</p>"},{"a":5,"z":7,"star":3,"grk":"<p lang=\"grc\">Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ὑμᾶς ἅπαξ πάντα ὅτι Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,</p><p lang=\"grc\">ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·</p><p lang=\"grc\">ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον τρόπον τούτοις ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.</p>","lit":"<p>Though you once and for all knew everything, I still want to remind you: Jesus, having saved a people out of the land of Egypt, the second time destroyed those who did not believe.</p><p>And the angels who did not keep their own position of authority, but abandoned their own dwelling, he has kept in eternal chains under gloom for the judgement of the great day;</p><p>just as Sodom and Gomorrah and the cities around them, which in the same way as these committed sexual immorality and went after another kind of flesh, are set there as a specimen, undergoing the punishment of eternal fire.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι</td><td>Hypomnēsai de hymas boulomai</td><td>I want to remind you</td><td>A reminder, not new teaching</td></tr><tr><td>εἰδότας ὑμᾶς ἅπαξ πάντα</td><td>eidotas hymas hapax panta</td><td>you once knew everything</td><td>The second appearance of ἅπαξ</td></tr><tr><td>Ἰησοῦς</td><td>Iēsous</td><td>Jesus</td><td>◆◆ Variant: WH, Treg κύριος; RP ὁ κύριος = CUV “the Lord”</td></tr><tr><td>τὸ δεύτερον</td><td>to deuteron</td><td>the second time, afterward</td><td>Of a people who were saved, some later fell</td></tr><tr><td>τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν</td><td>tous mē tērēsantas tēn heautōn archēn</td><td>those who did not keep their own position</td><td>◆◆ Track 1, second stop</td></tr><tr><td>ἀπολιπόντας τὸ ἴδιον οἰκητήριον</td><td>apolipontas to idion oikētērion</td><td>abandoned their own dwelling</td><td>Crossing the boundary</td></tr><tr><td>δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν</td><td>desmois aidiois hypo zophon tetērēken</td><td>has kept in eternal chains under gloom</td><td>◆ Track 1, third stop: the reversal</td></tr><tr><td>ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας</td><td>apelthousai opisō sarkos heteras</td><td>went after other flesh</td><td>◆◆ Three readings set side by side</td></tr><tr><td>πρόκεινται δεῖγμα</td><td>prokeintai deigma</td><td>are set there as a specimen</td><td>Present tense: still on display</td></tr></table>","gram":"<p><strong>The second appearance of ἅπαξ (hapax).</strong>In verse 3 the faith was delivered “once” to the saints; in verse 5, εἰδότας ὑμᾶς ἅπαξ πάντα (eidotas hymas hapax panta), “you once and for all knew everything.” The faith was delivered once, and you received it once; so the verb Jude uses is Ὑπομνῆσαι (Hypomnēsai), “to remind,” not “to teach.” Some attach ἅπαξ (hapax) to what follows instead, pairing it with τὸ δεύτερον (to deuteron), “the second time, afterward”: the Lord “once” saved the people, and “the second time” destroyed those who did not believe. Both readings work; the word order of SBLGNT favours the first.</p><blockquote><p>◆ Textual variant (one of the most famous puzzles in New Testament textual criticism): SBLGNT and NA28 read Ἰησοῦς (Iēsous), “Jesus saved a people out of the land of Egypt”; WH and Treg read κύριος (kyrios); RP and the NIV read ὁ κύριος (ho kyrios), which the Chinese Union Version, “the Lord,” follows (as does WEB); a few manuscripts read θεός (theos). On the external evidence, “Jesus” has quite ancient and widespread manuscript support (for example A, B, 33); on the internal evidence, “Jesus saved the people out of Egypt” is the harder reading, and copyists are more likely to have changed it to the smoother “the Lord” — it is hard to imagine anyone changing “the Lord” to “Jesus.” If we read Ἰησοῦς (Iēsous), Jude is saying that the pre-existent Christ was already saving, and already judging, at the exodus; this reminds us of Paul’s words, “the rock was Christ” (1 Cor 10:4). If we read κύριος (kyrios), the reference can be either to God the Father or to Christ. These notes decide as follows: the Greek column follows SBLGNT, the pulpit follows the Chinese Union Version and says “the Lord,” and the matter is explained on the issue page “Who saved the people out of Egypt — “the Lord” or “Jesus”?”. Neither reading changes the point of this verse: the one who saves and the one who judges unbelief are the same Lord. In addition, SBLGNT reads ἅπαξ πάντα (hapax panta), “everything,” while RP reads τοῦτο (touto), “this”; the meaning is similar.</p></blockquote><p><strong>τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν (tous mē tērēsantas tēn heautōn archēn).</strong>ἀρχή (archē) can mean “beginning,” and it can also mean “position of authority, sphere of rule” (the “rule” of Eph 1:21; the ἀρχαὶ (archai) of Col 1:16); here it means the position and office God assigned to the angels. The Chinese Union Version renders it “their proper place,” which captures it vividly. ἀπολιπόντας τὸ ἴδιον οἰκητήριον (apolipontas to idion oikētērion): οἰκητήριον (oikētērion) is a dwelling; its only other New Testament occurrence is 2 Cor 5:2, of “our habitation which is from heaven”; ἴδιον (idion) means “belonging to oneself” — the portion God had given them. The two participles are one negative, one positive: they did not keep; instead they abandoned.</p><p><strong>τηρέω (tēreō) appears twice in the same verse, and the meaning is reversed.</strong>μὴ τηρήσαντας (mē tērēsantas) … τετήρηκεν (tetērēken): they would not “keep” their own position, so God has “kept” them in eternal chains. τετήρηκεν (tetērēken) is perfect: the keeping still holds today. The Chinese Union Version renders the two as “did not keep” and “held in custody,” so a Chinese reader cannot see that it is the same word; but the Greek is like a mirror: those who would not keep their proper place are kept by chains. ζόφον (zophon), “gloom,” will appear again in verse 13.</p><p><strong>Who are the angels of verse 6? Three readings set side by side.</strong>(1) The “sons of God” of Gen 6:1–4 were angels who had relations with human women. This was the common Jewish reading of the Second Temple period, told at length in 1 Enoch 6–10, and Jude’s readers knew it well; verse 7 says Sodom went after other flesh “in the same way as these,” setting the angels and Sodom side by side, both of them crossing the boundary of “flesh” — which supports this reading. The difficulty is that the Lord said the risen “are like God’s angels in heaven” (Matt 22:30), neither marrying nor being given in marriage. (2) The reference is to the original fall of Satan and some of the angels, unrelated to Genesis 6 (Rev 12:7–9). (3) The “sons of God” of Genesis 6 were the descendants of Seth, and verse 6 refers separately to the fall of angels; the difficulty is explaining why verse 7 says Sodom acted “in the same way as these.” These notes set the readings side by side and lean towards not ruling between them: the point of verse 6 is not the identity of the angels, but that even angels who did not keep their proper place could not escape judgement. We do not build a separate angelology out of this verse.</p><p><strong>σαρκὸς ἑτέρας (sarkos heteras): three readings.</strong>τούτοις (toutois), “these,” is masculine plural, and most naturally refers to the angels of verse 6 rather than to the feminine “cities.” The ἐκ (ek) of ἐκπορνεύσασαι (ekporneusasai) intensifies the verb; the Chinese Union Version has “gave themselves wholly to sexual immorality.” ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας (apelthousai opisō sarkos heteras) is literally “went after other flesh.” (1) It refers to same-sex sexual acts: the men of Sodom wanted to have sex with the guests staying in Lot’s house (Gen 19:4–5). (2) It refers to the crossing of the boundary between humans and angels: the two guests the men of Sodom pursued were in fact angels (Gen 19:1), the exact reverse of the angels of verse 6 crossing the boundary to pursue humans. (3) Both are included, and the point is the crossing of the boundary God has set. These notes judge that (3) best accommodates the text: ἑτέρας (heteras), “of another kind,” stresses the crossing of the boundary itself. At the same time these notes hold to the Bible’s sexual ethic (Rom 1:26–27; 1 Cor 6:9–11) and do not empty it of meaning because the reading is disputed; nor do we use it to shame anyone. This is a warning, and it shines on ourselves first.</p><p><strong>δεῖγμα (deigma) is a specimen, an exhibit.</strong>πρόκεινται (prokeintai) is present tense, “are set there”: when Jude wrote, the desolation around the Dead Sea (traditionally placed on its southern shore) was still there for people to see. δίκην ὑπέχουσαι (dikēn hypechousai) is “undergoing punishment.” The warning is not there so that people can mock Sodom; it is there so that those who see it look back at themselves.</p>","exp":"<p>[OT] Num 14:26–35 (Numbers Study Notes, Chapter 14)</p><p>[OT] Gen 6:1–4 (Genesis Study Notes, Chapter 6)</p><p>[OT] Gen 19:4–11 (Genesis Study Notes, Chapter 19)</p><p>[2 Pet] 2 Pet 2:4–6 (2 Peter Study Notes, Chapter 2)</p><p>“Now I desire to remind you, though you already know this” (Jude 1:5). Jude has nothing new to teach. Spiritual danger seldom comes from not knowing; mostly it comes from forgetting. So he gives three examples everyone has heard, like setting three old photographs back on the table.</p><p>The first photograph is the most unsettling: “the Lord, having saved a people out of the land of Egypt, afterward destroyed those who didn’t believe” (Jude 1:5). These people had crossed the Red Sea, eaten manna, seen the pillar of cloud and the pillar of fire; but at Kadesh they would not believe that God could bring them in. God said, “Your dead bodies shall fall in this wilderness” (Num 14:29). Chapter 14 of the Numbers Study Notes in this series spoke of the weeping of that night. Jude puts this example first, and his meaning is clear: the warning is aimed at a people who had been saved, so it must shine on ourselves first. This is not meant to manufacture the fear “Could I lose my salvation too?”; what this photograph is meant to stop is people who treat grace as an insurance policy and think they can go on in unbelief all the way. For the position of the whole letter see “Kept by God and keeping ourselves: if God keeps me, why must I keep myself?”. The Chinese Union Version (like WEB) reads “the Lord”; one ancient reading of the Greek is “Jesus.” Whichever reading we take, the one who saves and the one who judges are the same.</p><p>The second photograph is in heaven: “Angels who didn’t keep their first domain, but deserted their own dwelling place, he has kept in everlasting bonds under darkness for the judgment of the great day” (Jude 1:6). Jude does not say who these angels were or how they fell; he speaks of their end. Even creatures as exalted as angels, once they left the position God had assigned them, could not escape judgement. God’s judgement is certain, and no rank, however high, is exempt. The mirror in the Greek should be brought out: they would not “keep,” so they are “kept” by God. This one word, τηρέω (tēreō), will travel all the way to verse 21: “Keep yourselves in God’s love” (Jude 1:21). The same “keep”: on one side, chains; on the other, the love of God.</p><p>The third photograph is on earth: “Even as Sodom and Gomorrah and the cities around them, having in the same way as these given themselves over to sexual immorality and gone after strange flesh, are shown as an example, suffering the punishment of eternal fire” (Jude 1:7). This verse must be preached honestly. These notes hold to the Bible’s sexual ethic: Paul says it very clearly in Rom 1:26–27 and 1 Cor 6:9–11 — the boundaries God has set do not change with the times. At the same time we must set out that Sodom’s sin was not just one thing: “pride, fullness of bread, and prosperous ease was in her and in her daughters. She also didn’t strengthen the hand of the poor and needy” (Ezek 16:49). Pride, plenty, ease, a hand withheld from the poor, and lust that crossed the boundary — together these piled up into the sin of that city.</p><p>So when we preach this verse, we do not shame, we do not mock, we do not put labels on any group or individual; nor do we skip over it for fear of controversy. When Paul has finished that list of sins, he goes straight on: “Some of you were such, but you were washed” (1 Cor 6:11). The same passage that names sin also proclaims washing. A brother or sister who is struggling in the area of sexuality and wants to follow the Lord should, on hearing this verse, feel caught and held: this photograph points to where the road across the boundary ends, and it also points to the grace and the road of repentance already prepared for them. And for everyone else, Ezek 16:49 is a mirror held very close: pride, plenty, ease, a hand closed to the poor — which of these has nothing to do with us? Verse 8 will say at once, “in the same way, these also …” — the warning shines on ourselves first.</p><p>The three photographs have one thing in common: each crosses the boundary God has set. The people would not stay in trust; the angels would not stay in their proper place; Sodom would not stay within the limits God had set. At this point the meaning of the text is already complete: God’s judgement is certain, and neither a people who had been saved nor angels are exempt; the end of the road across the boundary is written down plainly.</p><p>This reminds us of what 321 says: “pride is leaving our proper place and grasping power.” ἀρχή (archē) is the “position God assigned”; to cross the boundary and grasp what is not ours is the very shape of pride. It also reminds us of the way out that 321 names: humility — returning to our proper place. Wherever God has placed us, be faithful there; that place is not a cage but the place where God loves us.</p>"},{"a":8,"z":10,"star":2,"grk":"<p lang=\"grc\">Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.</p><p lang=\"grc\">ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.</p><p lang=\"grc\">οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.</p>","lit":"<p>Yet in the same way these people too, in their dreaming, defile the flesh, reject lordship, and slander the glorious ones.</p><p>But Michael the archangel, when he was disputing with the devil and arguing about the body of Moses, did not dare to bring a slanderous judgement, but said only, “May the Lord rebuke you.”</p><p>But these people slander whatever they do not know; and whatever they understand by instinct, like irrational animals, in these very things they are being destroyed.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>Ὁμοίως μέντοι καὶ οὗτοι</td><td>Homoiōs mentoi kai houtoi</td><td>yet in the same way these too</td><td>The first οὗτοι: the warning is a mirror</td></tr><tr><td>ἐνυπνιαζόμενοι</td><td>enypniazomenoi</td><td>dreaming</td><td>Claiming revelation through dreams</td></tr><tr><td>σάρκα μὲν μιαίνουσιν</td><td>sarka men miainousin</td><td>defile the flesh</td><td>μέν … δέ … δέ: three things</td></tr><tr><td>κυριότητα δὲ ἀθετοῦσιν</td><td>kyriotēta de athetousin</td><td>reject lordship</td><td>◆ Mostly taken as the Lord’s authority</td></tr><tr><td>δόξας δὲ βλασφημοῦσιν</td><td>doxas de blasphēmousin</td><td>slander the glorious ones</td><td>◆ Mostly taken as angels</td></tr><tr><td>τῷ διαβόλῳ διακρινόμενος</td><td>tō diabolō diakrinomenos</td><td>disputing with the devil</td><td>◆◆ The same word as “doubt” in verse 22</td></tr><tr><td>οὐκ ἐτόλμησεν</td><td>ouk etolmēsen</td><td>did not dare</td><td>Even the archangel does not overstep his place</td></tr><tr><td>Ἐπιτιμήσαι σοι κύριος</td><td>Epitimēsai soi kyrios</td><td>may the Lord rebuke you</td><td>◆◆ Optative mood; Zech 3:2</td></tr><tr><td>τὰ ἄλογα ζῷα</td><td>ta aloga zōa</td><td>irrational animals</td><td>Nothing left but instinct</td></tr></table>","gram":"<p><strong>Jude’s method: examples, then “these people.”</strong>Verses 5–7 give three examples; verse 8, with Ὁμοίως μέντοι καὶ οὗτοι (Homoiōs mentoi kai houtoi), applies the examples to the people in front of him. This demonstrative pronoun οὗτος (houtos) comes up again and again in verses 5–19 (verses 8, 10, 12, 14, 16, 19): first an example from Scripture or tradition, then “these people are …,” then an explanation. Scholars often compare this way of writing with the pesher commentaries of the Qumran community: using the words of the Old Testament to shed light on the present situation. Once you recognise this rhythm, you can see that Jude is not hurling abuse; he is reading Scripture. Before every “these people” there is a passage of Scripture.</p><p><strong>ἐνυπνιαζόμενοι (enypniazomenoi), “dreaming.”</strong>The same verb appears in Peter’s quotation of Joel at Pentecost: “Your old men will dream dreams” (Acts 2:17). Dreams in themselves are not sin; these people most likely claimed to have received revelation through dreams, and used their dreams to go beyond, and rewrite, the faith once delivered. This reminds us of Moses’ warning: “you shall not listen to the words of that prophet, or to that dreamer of dreams” (Deut 13:3), and of the false prophets of Jeremiah’s day who cried, “I had a dream! I had a dream!” (Jer 23:25).</p><p><strong>μέν (men) … δέ (de) … δέ (de): three things.</strong>σάρκα (sarka), the flesh; κυριότητα (kyriotēta), lordship; δόξας (doxas), the glorious ones. κυριότης (kyriotēs) can be read two ways: (1) the authority of the Lord, κύριος (kyrios), corresponding to verse 4, “denying … our Lord Jesus Christ”; most commentators read it this way; (2) heavenly powers — the “dominion” of Eph 1:21 and Col 1:16 is the same word. δόξας (doxas) is mostly taken to mean angels, glorious spiritual beings; 2 Pet 2:10–11 likewise mentions “dignitaries” together with angels. These notes judge that these two words refer to the Lord and to heavenly things, not to the office or person of any church leader today.</p><p><strong>διακρινόμενος (diakrinomenos) is the same word as in verse 22.</strong>In the New Testament διακρίνω (diakrinō) can mean “to distinguish, to judge,” and also “to dispute” and “to doubt.” In verse 9 Michael “disputes” with the devil, διακρινόμενος (diakrinomenos); in verse 22, “some who doubt” is διακρινομένους (diakrinomenous) — the same word. An archangel disputing with the devil; a believer disputing within his own heart. The first is handed over to the Lord; the second is shown mercy. This is the second pearl of the letter. διελέγετο (dielegeto) is imperfect: the argument went on for some time.</p><p><strong>Sources and quotation.</strong>For Michael see Dan 10:13, 21; 12:1; Rev 12:7; for Moses’ burial see Deut 34:5–6. Michael’s dispute with the devil over Moses’ body is not recorded in the Old Testament. Clement of Alexandria, Origen and other early church fathers state that it comes from the Assumption of Moses; the surviving Latin fragment lacks its ending, so the wording cannot be checked. The views: (1) Jude recognised the book as canonical (a very small minority); (2) Jude cited a tradition familiar to his readers as an illustration; (3) this part of the tradition is true, but the book itself is not canonical. These notes take (2) and (3): what is inspired is the letter of Jude; quoting a passage of tradition does not mean endorsing the whole book, just as Paul quotes Greek poets (Acts 17:28; Titus 1:12). The pulpit does not build a separate angelology from this, nor does it think less of the letter of Jude because of it.</p><p><strong>οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας (ouk etolmēsen krisin epenenkein blasphēmias).</strong>κρίσιν βλασφημίας (krisin blasphēmias) can be read as “a slanderous judgement,” or as “a verdict condemning him for slander”; both readings make the same point: Michael did not dare to pass judgement himself. Ἐπιτιμήσαι (Epitimēsai) is an aorist optative, “may the Lord rebuke you,” handing the rebuke over to the Lord. These words are almost exactly those of Zech 3:2. In verse 10 two instances of ὅσα (hosa) are set against each other: ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν (hosa men ouk oidasin blasphēmousin), what they do not understand they slander; ὅσα δὲ φυσικῶς (hosa de physikōs) … ἐπίστανται (epistantai), what they understand by instinct — ἐν τούτοις φθείρονται (en toutois phtheirontai), in those very things they are being destroyed.</p>","exp":"<p>[2 Pet] 2 Pet 2:10–12 (2 Peter Study Notes, Chapter 2)</p><p>“Yet in the same way,
